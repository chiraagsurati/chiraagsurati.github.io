    const tctx = tile.getContext('2d');
    tctx.scale(dpr, dpr);
    const s = tileSize;

    switch(type){

      // Deep forest green nested wavy contour bands (topographic-map look).
      case 'contourLines': {
        tctx.fillStyle = '#0d3b2e';
        tctx.fillRect(0,0,s,s);
        const bands = [
          { c: '#1f5c46', w: 0.22 },
          { c: '#3f8a5f', w: 0.14 },
          { c: '#8fc98a', w: 0.07 },
        ];
        for(const band of bands){
          tctx.strokeStyle = band.c;
          tctx.lineWidth = s*band.w;
          tctx.lineCap = 'round';
          tctx.beginPath();
          tctx.moveTo(-s*0.2, s*0.15);
          tctx.bezierCurveTo(s*0.15, s*0.35, s*0.15, -s*0.05, s*0.5, s*0.15);
          tctx.bezierCurveTo(s*0.85, s*0.35, s*0.85, s*0.65, s*1.2, s*0.55);
          tctx.stroke();
          tctx.beginPath();
          tctx.moveTo(-s*0.2, s*0.75);
          tctx.bezierCurveTo(s*0.15, s*0.95, s*0.15, s*0.55, s*0.5, s*0.75);
          tctx.bezierCurveTo(s*0.85, s*0.95, s*0.85, s*1.25, s*1.2, s*1.15);
          tctx.stroke();
        }
        break;
      }

      // Deep blue base with pale swirling marble-like bands.
      case 'marbleSwirl': {
        tctx.fillStyle = '#123c63';
        tctx.fillRect(0,0,s,s);
        const swirls = [
          { c: 'rgba(255,255,255,0.55)', w: 0.16, off: 0 },
          { c: 'rgba(173,214,255,0.65)', w: 0.10, off: s*0.18 },
          { c: 'rgba(9,38,66,0.6)',      w: 0.08, off: -s*0.16 },
        ];
        for(const sw of swirls){
          tctx.strokeStyle = sw.c;
          tctx.lineWidth = s*sw.w;
          tctx.lineCap = 'round';
          tctx.beginPath();
          tctx.moveTo(-s*0.1, s*0.5+sw.off);
          tctx.bezierCurveTo(s*0.3, s*0.1+sw.off, s*0.4, s*0.9+sw.off, s*0.7, s*0.45+sw.off);
          tctx.bezierCurveTo(s*0.9, s*0.15+sw.off, s*1.1, s*0.6+sw.off, s*1.2, s*0.3+sw.off);
          tctx.stroke();
        }
        break;
      }

      // Warm diagonal bands: navy -> cream -> orange -> red, sunset style.
      case 'sunsetWave': {
        tctx.fillStyle = '#1c2b3a';
        tctx.fillRect(0,0,s,s);
        const stripes = [
          { c: '#f3e3c3', off: 0.18 },
          { c: '#e8933a', off: 0.42 },
          { c: '#c8432e', off: 0.66 },
        ];
        for(const st of stripes){
          tctx.strokeStyle = st.c;
          tctx.lineWidth = s*0.26;
          tctx.lineCap = 'round';
          const o = s*st.off;
          tctx.beginPath();
          tctx.moveTo(-s*0.3+o, s*1.3);
          tctx.lineTo(s*1.3+o, -s*0.3);
          tctx.moveTo(-s*1.3+o, s*1.3);
          tctx.lineTo(s*0.3+o, -s*0.3);
          tctx.stroke();
        }
        break;
      }

      // Deep crimson base with soft cream blob shapes.
      case 'crimsonBlob': {
        tctx.fillStyle = '#8f1330';
        tctx.fillRect(0,0,s,s);
        tctx.fillStyle = '#f7e9d8';
        const blob = (cx,cy,r) => {
          tctx.beginPath();
          tctx.ellipse(cx, cy, r, r*0.8, 0.4, 0, Math.PI*2);
          tctx.fill();
        };
        blob(s*0.28, s*0.3, s*0.22);
        blob(s*0.82, s*0.72, s*0.24);
        blob(-s*0.05, s*0.85, s*0.16);
        break;
      }

      // Golden yellow nested wavy topographic rings (paler two-tone yellow).
      case 'goldenTopo': {
        tctx.fillStyle = '#f2b93d';
        tctx.fillRect(0,0,s,s);
        tctx.strokeStyle = '#fbdd8a';
        tctx.lineCap = 'round';
        const rings = [0.4, 0.28, 0.16];
        for(const r of rings){
          tctx.lineWidth = s*0.08;
          tctx.beginPath();
          tctx.ellipse(s*0.5, s*0.5, s*r, s*r*0.75, 0.3, 0, Math.PI*2);
          tctx.stroke();
        }
        break;
      }

      // Steel-blue/grey diamond weave with fine crosshatch fabric texture.
      case 'denimWeave': {
        tctx.fillStyle = '#3a5f7d';
        tctx.fillRect(0,0,s,s);
        tctx.strokeStyle = 'rgba(214,224,232,0.85)';
        tctx.lineWidth = Math.max(1, s*0.05);
        tctx.beginPath();
        tctx.moveTo(s*0.5, -s*0.1); tctx.lineTo(s*1.1, s*0.5);
        tctx.moveTo(s*1.1, s*0.5); tctx.lineTo(s*0.5, s*1.1);
        tctx.moveTo(s*0.5, s*1.1); tctx.lineTo(-s*0.1, s*0.5);
        tctx.moveTo(-s*0.1, s*0.5); tctx.lineTo(s*0.5, -s*0.1);
        tctx.stroke();
        // fine woven texture lines inside each diamond half
        tctx.strokeStyle = 'rgba(255,255,255,0.18)';
        tctx.lineWidth = Math.max(1, s*0.015);
        for(let i=-2;i<=2;i++){
          tctx.beginPath();
          tctx.moveTo(0, s*0.5+i*s*0.12);
          tctx.lineTo(s, s*0.5+i*s*0.12);
          tctx.stroke();
        }
        break;
      }

      case 'solid':
      default:
        tctx.fillStyle = PIPE_COLOR;
        tctx.fillRect(0,0,s,s);
        break;
    }
    return tile;
  }

  // Index into ARROW_PATTERN_TYPES for a given level number. Shared by the
  // drawing code and by the "new pattern unlocked" popup check below, so
  // both always agree on exactly which level a pattern change lands on.
  // This WRAPS once the cycle completes (there are only 7 pattern types),
  // so it's only for picking which pattern to *display* - never use it to
  // count how many patterns have been unlocked (see getRawPatternTierCount
  // below for that).
  function getPatternTierIndex(level){
    return Math.floor((level - 1) / PATTERN_CHANGE_INTERVAL) % ARROW_PATTERN_TYPES.length;
  }

  // Uncapped, 1-indexed count of tiers reached by a given level - e.g.
  // level 1-5 -> 1, level 6-10 -> 2, ... level 36+ -> 8, 9, etc. Unlike
  // getPatternTierIndex this deliberately does NOT wrap, so it can be
  // safely clamped to ARROW_PATTERN_TYPES.length to get "how many patterns
  // are unlocked" without that count resetting back down every time the
  // display cycle wraps around to Solid again.
  function getRawPatternTierCount(level){
    return Math.floor((level - 1) / PATTERN_CHANGE_INTERVAL) + 1;
  }

  // Brings unlockedPatternTiers up to date with maxUnlockedLevel across all
  // three modes. Only ever raises it, never lowers - so a save file from
  // before this feature existed (or someone who's already cleared plenty
  // of levels) immediately gets the patterns they've effectively already
  // earned, rather than needing to "re-pass" levels they've already beaten.
  function syncUnlockedPatternTiers(){
    let maxCount = 1;
    for(const m of ['easy','medium','hard']){
      const lvl = (maxUnlockedLevel && maxUnlockedLevel[m]) || 1;
      const count = Math.min(ARROW_PATTERN_TYPES.length, getRawPatternTierCount(lvl));
      if(count > maxCount) maxCount = count;
    }
    if(maxCount > unlockedPatternTiers) unlockedPatternTiers = maxCount;
  }

  // Organic textures (swirls, contour lines, blobs) read better at a
  // larger tile size than simple geometric ones - each type picks its own
  // fraction of cellSize.
  const PATTERN_TILE_SCALE = {
    solid: 0.16,
    contourLines: 0.6,
    marbleSwirl: 0.6,
    sunsetWave: 0.34,
    crimsonBlob: 0.5,
    goldenTopo: 0.45,
    denimWeave: 0.32,
  };

  // Returns a fillStyle/strokeStyle-compatible value (flat color string or
  // CanvasPattern) representing the arrow's "at rest" look for the current
  // level. Cached per (pattern type, tile size) pair so it's cheap to call
  // every frame.
  function getArrowFillStyle(){
    const type = (selectedPatternType !== 'auto' && ARROW_PATTERN_TYPES.includes(selectedPatternType))
      ? selectedPatternType
      : ARROW_PATTERN_TYPES[getPatternTierIndex(currentLevel)];
    if(type === 'solid') return PIPE_COLOR;

    const scale = PATTERN_TILE_SCALE[type] || 0.3;
    const tileSize = Math.max(6, Math.round(cellSize * scale));
    const key = type + '_' + tileSize;
    let pattern = patternCache.get(key);
    if(!pattern){
      const tile = buildPatternTile(type, tileSize);
      pattern = ctx.createPattern(tile, 'repeat');
      patternCache.set(key, pattern);
    }
    return pattern;
  }

  // Draws a small sample arrow (shaft + head, same proportions/style as the
  // real in-game drawStrip) onto a standalone <canvas>, filled with the
  // given pattern type. Used by the Pattern menu so each option shows what
  // it actually looks like rather than just its name. Independent of
  // cellSize/patternCache - it works off the preview canvas's own pixel
  // size, since menu previews are a fixed small size regardless of board
  // zoom or cell size.
  function drawPatternPreviewIcon(type, canvas){
    const dpr = window.devicePixelRatio || 1;
    // canvas.width/height at this point are the plain nominal size from the
    // HTML (e.g. 120x46) - treat that as the intended CSS display size, then
    // size the real backing store up for a crisp result on high-DPI screens.
    const cw = canvas.width, ch = canvas.height;
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    canvas.width = Math.round(cw * dpr);
    canvas.height = Math.round(ch * dpr);
    const pctx = canvas.getContext('2d');
    pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    pctx.clearRect(0, 0, cw, ch);

    let fillStyle;
    if(type === 'solid'){
      fillStyle = PIPE_COLOR;
    } else {
      const scale = PATTERN_TILE_SCALE[type] || 0.3;
      const tileSize = Math.max(6, Math.round(40 * scale)); // nominal ~40px "cellSize" for preview purposes
      const tile = buildPatternTile(type, tileSize);
      fillStyle = pctx.createPattern(tile, 'repeat');
    }

    const midY = ch/2;
    const thickness = ch*0.4;
    const headLen = ch*0.85;
    const headW = ch*0.75;
    const tipX = cw - 6;
    const baseX = tipX - headLen;

    pctx.lineJoin = 'round';
    pctx.lineCap = 'round';
    pctx.strokeStyle = fillStyle;
    pctx.lineWidth = thickness;
    pctx.beginPath();
    pctx.moveTo(6, midY);
    pctx.lineTo(baseX, midY);
    pctx.stroke();

    pctx.fillStyle = fillStyle;
    pctx.beginPath();
    pctx.moveTo(tipX, midY);
    pctx.lineTo(baseX, midY - headW/2);
    pctx.lineTo(baseX, midY + headW/2);
    pctx.closePath();
    pctx.fill();
  }

  // draws a pipe strip through an arbitrary list of points, with the arrowhead
  // built from the direction of travel at the very front point
  function drawStrip(pts, headVec, color){
    const thickness = cellSize * 0.15;  // width of arrow (thickened so patterns/textures actually read)

    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.strokeStyle = color;
    ctx.lineWidth = thickness;

    const [ex,ey] = pts[pts.length-1];
    const tipX = ex;
    const tipY = ey;

    // Distance from the tip back to the arrowhead's base - kept the same
    // for every arrow so head size doesn't depend on path length.
    const headLen = cellSize*0.38;
    const baseX = ex - headVec.dx*headLen;
    const baseY = ey - headVec.dy*headLen;

    // Body/tail of the arrow: for multi-cell paths this runs through
    // every earlier cell up to the head. Single-cell paths have no
    // earlier cell to start from, so the tail instead starts at the back
    // edge of that one cell - either way there's always a visible line
    // leading into the arrowhead, never just a bare triangle floating on
    // its own.
    const bodyPts = pts.length >= 2
      ? pts.slice(0, pts.length-1)
      : [[ex - headVec.dx*cellSize*0.5, ey - headVec.dy*cellSize*0.5]];
    const shaftPts = bodyPts.concat([[baseX, baseY]]);
    ctx.beginPath();
    shaftPts.forEach(([x,y], i) => { if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); });
    ctx.stroke();

    const headW = cellSize*0.34;   // narrower relative to length -> sharper point
    const angle = Math.atan2(headVec.dy, headVec.dx);
    const perpX = -Math.sin(angle)*headW/2;
    const perpY =  Math.cos(angle)*headW/2;

    ctx.beginPath();
    ctx.moveTo(tipX, tipY);
    ctx.lineTo(baseX+perpX, baseY+perpY);
    ctx.lineTo(baseX-perpX, baseY-perpY);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
  }

  function drawPathShape(path, color){
    const pts = path.cells.map(([r,c]) => cellCenter(r,c));
    drawStrip(pts, DIRS[path.headDir], color || PIPE_COLOR);
  }

  // Full-board grid overlay (toggled by the Grid button). Lines run through
  // the center of each row/column - the exact rows/columns arrows travel
  // along - rather than around the boxy outline of the board cells, so the
  // grid reads as "this is the lane an arrow moves through" rather than
  // "this is a box drawn around it".
  function drawFullGrid(){
    ctx.save();
    ctx.strokeStyle = 'rgba(77,99,255,0.35)';
    ctx.lineWidth = Math.max(1, cellSize*0.02);
    const TOP_BAR = cellSize * 0.9;

    // One full-length line per arrow, drawn only along the axis the arrow
    // actually exits on: a left/right-facing head gets a horizontal line
    // through its row, an up/down-facing head gets a vertical line through
    // its column. This shows at a glance which way each arrow will travel,
    // instead of a full crosshair on every occupied row and column.
    pathsMap.forEach(path => {
      const [r, c] = path.cells[path.cells.length - 1]; // head cell
      if(path.headDir === 'left' || path.headDir === 'right'){
        const y = TOP_BAR + r*cellSize + cellSize/2;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(COLS*cellSize, y);
        ctx.stroke();
      } else {
        const x = c*cellSize + cellSize/2;
        ctx.beginPath();
        ctx.moveTo(x, TOP_BAR);
        ctx.lineTo(x, TOP_BAR + ROWS*cellSize);
        ctx.stroke();
      }
    });
    ctx.restore();
  }

  function easeInCubic(t){ return t*t*t; }

  // true if nothing else currently occupies the cells straight ahead of this
  // arrow's head, all the way to the edge of the board
  function isClear(path){
    const [r,c] = path.cells[path.cells.length-1];
    const d = DIRS[path.headDir];
    let rr = r+d.dy, cc = c+d.dx;
    while(rr>=0 && rr<ROWS && cc>=0 && cc<COLS){
      const occ = grid[rr][cc];
      if(occ !== -1 && occ !== path.id) return false;
      rr += d.dy; cc += d.dx;
    }
    return true;
  }

  // for a blocked arrow: how far (in px) it can nudge forward, straight out
  // of its head, before its tip touches whatever cell is in the way. Used
  // for the "wrong move" bump animation - counts clear cells ahead, then
  // adds half a cell so the tip lands right on the blocker's near edge
  // rather than stopping short or overlapping into it.
  function computeBumpDistance(path){
    const [r,c] = path.cells[path.cells.length-1];
    const d = DIRS[path.headDir];
    let rr = r+d.dy, cc = c+d.dx;
    let clearCells = 0;
    while(rr>=0 && rr<ROWS && cc>=0 && cc<COLS){
      const occ = grid[rr][cc];
      if(occ !== -1 && occ !== path.id) break; // found the blocker
      clearCells++;
      rr += d.dy; cc += d.dx;
    }
    return (clearCells + 0.5) * cellSize;
  }

  function draw(now){
    ctx.clearRect(0,0,boardW,boardH);
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--board-bg').trim();
    ctx.fillRect(0,0,boardW,boardH);
    drawDotGrid();
    if(showGrid) drawFullGrid();

    const bumpingIds = new Set(bumping.map(item => item.id));
    const restFillStyle = getArrowFillStyle();
    pathsMap.forEach(p => {
      if(bumpingIds.has(p.id)) return; // drawn by the bump animation below instead
      const color = flashing.has(p.id) ? RED : restFillStyle;
      drawPathShape(p, color);
    });

    leaving = leaving.filter(item => {
      const elapsed = now - item.startTime;
      const t = Math.min(1, elapsed / item.duration);
      const shift = item.total_extra_travel * easeInCubic(t);
      const headVec = DIRS[item.path.headDir];
      const newPts = item.cum.map(s => pointAtArclength(item.pts, item.cum, s + shift, headVec));
      drawStrip(newPts, headVec, BLUE);
      return t < 1;
    });

    // Wrong-move feedback: the tapped arrow nudges forward along its own
    // path until its tip touches whatever's blocking it, then springs back
    // to its original slot - staying red the whole time (and after).
    bumping = bumping.filter(item => {
      const elapsed = now - item.startTime;
      const t = Math.min(1, elapsed / item.duration);
      const shift = item.maxDist * Math.sin(Math.PI * t); // 0 -> maxDist -> 0
      const headVec = DIRS[item.path.headDir];
      const newPts = item.cum.map(s => pointAtArclength(item.pts, item.cum, s + shift, headVec));
      drawStrip(newPts, headVec, RED);
      return t < 1;
    });

    if(leaving.length > 0 || bumping.length > 0){
      requestAnimationFrame(draw);
    } else {
      animFrameQueued = false;
    }

  }

  function requestDraw(){
    if(!animFrameQueued){
      animFrameQueued = true;
      requestAnimationFrame(draw);
    }
  }

  // Confetti celebration: two cannons fire from the bottom-left and
  // bottom-right corners of the screen, arcing pieces up and inward. Used
  // on the level-complete popup. Runs on its own full-screen canvas so it
  // sits above everything (including the popup) without disturbing the
  // board/canvas rendering underneath.
  function launchConfetti(){
    const dpr = window.devicePixelRatio || 1;
    const W = window.innerWidth, H = window.innerHeight;

    const canvas = document.createElement('canvas');
    canvas.style.cssText = `
        position:fixed;
        top:0;
        right:0;
        bottom:0;
        left:0;
        pointer-events:none;
        z-index:10000;
    `;
    canvas.width = W*dpr;
    canvas.height = H*dpr;
    canvas.style.width = W+'px';
    canvas.style.height = H+'px';
    document.body.appendChild(canvas);

    const cctx = canvas.getContext('2d');
    cctx.setTransform(dpr,0,0,dpr,0,0);

    const COLORS = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#c77dff','#ff9f1c','#ff5da2'];
    const particles = [];

    // side: -1 = cannon on the left edge firing rightward/up,
    //        1 = cannon on the right edge firing leftward/up
    function spawnBurst(side){
      const x = side < 0 ? -10 : W+10;
      const count = 34;
      for(let i=0;i<count;i++){
        const spread = (Math.random()*0.55 + 0.12); // 0.12..0.67 rad off straight-up
        const angle = -Math.PI/2 + side*-1*spread; // tilt inward, toward center
        const speed = 9 + Math.random()*8;
        particles.push({
          x, y: H*0.85,
          vx: Math.cos(angle)*speed,
          vy: Math.sin(angle)*speed,
          size: 5 + Math.random()*6,
          color: COLORS[Math.floor(Math.random()*COLORS.length)],
          rot: Math.random()*Math.PI*2,
          vr: (Math.random()-0.5)*0.35,
          shape: Math.random() < 0.5 ? 'rect' : 'circle',
          life: 0,
          maxLife: 85 + Math.random()*45
        });
      }
    }

    spawnBurst(-1);
    spawnBurst(1);
    const secondBurstTimer = setTimeout(() => { spawnBurst(-1); spawnBurst(1); }, 260);

    const gravity = 0.22;
    const drag = 0.995;
    let raf;

    function frame(){
      cctx.clearRect(0,0,W,H);
      for(let i=particles.length-1;i>=0;i--){
        const p = particles[i];
        p.vy += gravity;
        p.vx *= drag;
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vr;
        p.life++;
        const alpha = Math.max(0, 1 - p.life/p.maxLife);
        cctx.save();
        cctx.translate(p.x,p.y);
        cctx.rotate(p.rot);
        cctx.globalAlpha = alpha;
        cctx.fillStyle = p.color;
        if(p.shape === 'rect'){
          cctx.fillRect(-p.size/2, -p.size/3, p.size, p.size*0.6);
        } else {
          cctx.beginPath();
          cctx.arc(0,0,p.size/2,0,Math.PI*2);
          cctx.fill();
        }
        cctx.restore();
        if(p.life > p.maxLife || p.y > H+60) particles.splice(i,1);
      }
      if(particles.length > 0){
        raf = requestAnimationFrame(frame);
      } else {
        canvas.remove();
      }
    }
    raf = requestAnimationFrame(frame);

    return function stopConfetti(){
      clearTimeout(secondBurstTimer);
      cancelAnimationFrame(raf);
      canvas.remove();
    };
  }

  // autoCloseMs is optional - when set, the popup dismisses itself (and
  // fires callback) after that many ms even if the player never taps it.
  // Tapping still dismisses it early, either way callback only ever runs
  // once thanks to the dismissed flag.
  function showPopup(title, message, callback, celebrate, autoCloseMs){

    const old = document.getElementById("gamePopup");
    if(old) old.remove();

    const popup = document.createElement("div");

    popup.id = "gamePopup";

    popup.style.cssText = `
        position:fixed;
        top:0;
        right:0;
        bottom:0;
        left:0;
        background:rgba(0,0,0,.45);
        display:flex;
        justify-content:center;
        align-items:center;
        z-index:10001;
        cursor:pointer;
    `;

    popup.innerHTML = `
        <div style="
            background:white;
            border-radius:16px;
            padding:20px 26px;
            text-align:center;
            box-shadow:0 15px 40px rgba(0,0,0,.25);
            min-width:200px;
            max-width:80vw;
        ">
            <div style="
                font-size:22px;
                font-weight:bold;
                color:#2c2f4a;
                ${message ? 'margin-bottom:10px;' : ''}
            ">
                ${title}
            </div>

            ${message ? `
            <div style="
                font-size:15px;
                color:#666;
            ">
                ${message}
            </div>
            ` : ''}
        </div>
    `;

    let stopConfetti = null;
    if(celebrate){
        try {
            stopConfetti = launchConfetti();
        } catch(err){
            // Never let a confetti failure (e.g. a device-specific canvas
            // quirk) prevent the popup itself from showing.
            console.error('launchConfetti failed:', err);
            stopConfetti = null;
        }
    }

    let dismissed = false;
    function dismiss(){
        if(dismissed) return;
        dismissed = true;

        if(stopConfetti) stopConfetti();

        popup.remove();

        if(callback)
            callback();
    }

    popup.addEventListener("click", dismiss);

    if(autoCloseMs){
        setTimeout(() => {
            // Skip if already dismissed by a tap, or removed some other way
            // (e.g. the hardware back button handler clears #gamePopup
            // directly) - isConnected covers both without double-firing.
            if(!dismissed && popup.isConnected) dismiss();
        }, autoCloseMs);
    }

    document.body.appendChild(popup);

}

    // Called right before a level starts (after currentLevel has already
    // been updated to the level about to be played). Shows a "new pattern
    // unlocked" popup - and only calls onDone() once it's dismissed, so
    // the pattern change is announced before the player ever sees it on
    // the board - but only while there are still genuinely new patterns
    // left to unlock. Once every pattern is unlocked, the display still
    // cycles through them (via getPatternTierIndex, which wraps), but this
    // stops announcing anything since nothing new is being earned anymore.
    function maybeAnnouncePatternUnlock(previousLevel, onDone){
        const prevCount = Math.min(ARROW_PATTERN_TYPES.length, getRawPatternTierCount(previousLevel));
        const newCount = Math.min(ARROW_PATTERN_TYPES.length, getRawPatternTierCount(currentLevel));
        if(newCount <= prevCount || previousLevel < 1){
            onDone();
            return;
        }
        unlockedPatternTiers = Math.max(unlockedPatternTiers, newCount);
        saveProgress();
        showPopup(
            "New Arrow Pattern Unlock!",
            "",
            onDone,
            true, // celebrate: fire confetti, matches the Level Pass popup
            2500  // auto-dismiss after 2.5s so it doesn't block starting the level
        );
    }

    // Game Over gets its own popup (rather than reusing showPopup) because
    // it needs an extra tappable button - "Watch Ad for +1 Life" - alongside
    // the existing "tap anywhere to retry" behavior. Tapping the button
    // itself must NOT also trigger the backdrop's retry handler, hence the
    // stopPropagation() below.
    function showGameOverPopup(retryCallback){

    const old = document.getElementById("gamePopup");
    if(old) old.remove();

    const popup = document.createElement("div");
    popup.id = "gamePopup";

    popup.style.cssText = `
        position:fixed;
        top:0;
        right:0;
        bottom:0;
        left:0;
        background:rgba(0,0,0,.45);
        display:flex;
        justify-content:center;
        align-items:center;
        z-index:9999;
        cursor:pointer;
    `;

    popup.innerHTML = `
        <div style="
            background:white;
            border-radius:18px;
            padding:28px 36px;
            text-align:center;
            box-shadow:0 15px 40px rgba(0,0,0,.25);
            min-width:260px;
        ">
            <div style="
                font-size:30px;
                font-weight:bold;
                color:#2c2f4a;
                margin-bottom:14px;
            ">
                Game Over
            </div>

            <div style="
                font-size:17px;
                color:#666;
                margin-bottom:18px;
            ">
                Touch anywhere to retry this level
            </div>

            <!-- "Watch Ad for +1 Life" temporarily disabled until the real
                 ad SDK is wired in (see loadBannerAds/showRewardedAd below).
                 Re-enable this button once ads are added. -->
            <!--
            <button id="watchAdLifeBtn" style="
                background:#4d63ff;
                border:none;
                border-radius:12px;
                color:#fff;
                font-size:15px;
                font-weight:700;
                padding:12px 20px;
                width:100%;
                cursor:pointer;
                box-shadow:0 4px 10px rgba(77,99,255,.35);
            ">🎬 Watch Ad for +1 Life</button>
            -->
        </div>
    `;

    popup.addEventListener("click", () => {
        popup.remove();
        if(retryCallback) retryCallback();
    });

    document.body.appendChild(popup);

    // Watch-ad-for-extra-life flow disabled for now (no ad SDK yet).
    // Re-enable alongside the button markup above once ads are added.
    /*
    const watchAdBtn = popup.querySelector("#watchAdLifeBtn");
    watchAdBtn.addEventListener("click", (e) => {
        e.stopPropagation(); // don't also fire the backdrop's retry handler

        watchAdBtn.disabled = true;
        watchAdBtn.textContent = "Loading ad...";

        showRewardedAd(
            () => {
                // Reward granted: resume play on the same board with 1
                // life instead of restarting the level.
                popup.remove();
                lives = 1;
                updateLives();
                gameStarted = true;
                requestDraw();
                saveGameState();
            },
            () => {
                // No ad available - let the player retry the normal way
                // instead of leaving them stuck on a dead button.
                watchAdBtn.disabled = false;
                watchAdBtn.textContent = "No ad available - tap to retry";
            }
        );
    });
    */

}

    function checkLevelComplete(){

        if(pathsMap.size > 0) return;

        // Fire immediately, still inside the tap's call stack, so the
        // browser still counts this as triggered by a user gesture -
        // waiting until the requestAnimationFrame loop below resolves can
        // be too late and gets the play() call silently blocked.
        playSound(levelPassSound);

        const wait = () => {

            if(leaving.length > 0){

                requestAnimationFrame(wait);
                return;

            }

            showPopup(
                "Level Pass",
                "Starting next level",
                () => {
                          const previousLevel = currentLevel;
                          currentLevel++;
                          if(currentLevel > maxUnlockedLevel[gameMode]){
                              maxUnlockedLevel[gameMode] = currentLevel;
                              saveProgress();
                          }
                          gameStarted = true;
                          clearGameState();
                          maybeAnnouncePatternUnlock(previousLevel, startNewGame);
                      },
                true, // celebrate: fire confetti from left & right
                1000  // auto-dismiss after 1s so it doesn't require a tap
            );

        };

        requestAnimationFrame(wait);

    }
  // tapping an arrow: if the way ahead is clear it slides out head-first, tail
  // following the same bent path (like a snake, drawn in blue while leaving);
  // if blocked, it turns red and stays red until it's eventually cleared
  function handleTap(clientX, clientY){

    if(performance.now() < inputBlockedUntil) return;

    const rect = canvas.getBoundingClientRect();
    // rect reflects the current CSS zoom transform (its width/height are
    // boardW/boardH scaled by boardZoom), so convert back to the canvas's
    // own unscaled coordinate space before dividing by cellSize.
    const x = (clientX - rect.left) * (boardW / rect.width);
    const y = (clientY - rect.top) * (boardH / rect.height);
    const TOP_BAR = cellSize * 0.9;

        const col = Math.floor(x / cellSize);
        const row = Math.floor((y - TOP_BAR) / cellSize);

        if (
            row < 0 ||
            row >= ROWS ||
            col < 0 ||
            col >= COLS
        ) return;

    const id = grid[row][col];
    if(id === -1 || id == null) return;
    const path = pathsMap.get(id);
    if(!path) return;

    if(!isClear(path)){
      playSound(errorSound);
    lives--;
  updateLives();
    flashing.add(id);

    // "wrong move" feedback: nudge the arrow forward until its tip touches
    // whatever's blocking it, then spring it back to its original slot.
    // Replace any in-flight bump for this same arrow rather than stacking.
    bumping = bumping.filter(item => item.id !== id);
    const bumpPts = path.cells.map(([r,c]) => cellCenter(r,c));
    bumping.push({
      id,
      path,
      pts: bumpPts,
      cum: buildArcLength(bumpPts),
      maxDist: computeBumpDistance(path),
      duration: 260,
      startTime: performance.now()
    });

    if(lives <= 0){
        playSound(gameOverSound);
        requestDraw();
        clearGameState();

        setTimeout(()=>{

            showGameOverPopup(() => {
                gameStarted = true;
                startNewGame();
            });

        },400);

        return;
    }

    saveGameState();
    requestDraw();

    return;
}

    progressMade = true;
    pathsMap.delete(id);
    flashing.delete(id);
    bumping = bumping.filter(item => item.id !== id);
    for(const [r,c] of path.cells) grid[r][c] = -1;

    playSound(arrowSound);

    const pts = path.cells.map(([r,c]) => cellCenter(r,c));
    const cum = buildArcLength(pts);
    const total = cum[cum.length-1];
    const margin = (COLS+ROWS) * cellSize;                 // guarantees it clears the board
    const total_extra_travel = total + margin;
    const duration = Math.max(220, total_extra_travel / SPEED);

    leaving.push({
      id,
      path,
      pts,
      cum,
      total_extra_travel,
      duration,
      startTime: performance.now()
  });

  requestDraw();

  saveGameState();

  maybeReshuffleHardMode();
  updateShuffleWarning();
  checkLevelComplete();
  }

  // ---------------------------------------------------------------
  // Zoom & pan
  //
  // #boardFrame is scaled/translated with a CSS transform (transform-origin
  // top-left) inside the fixed-size, overflow:hidden #boardViewport. Because
  // the canvas's actual on-screen box (canvas.getBoundingClientRect()) already
  // reflects that CSS transform, handleTap() only needs to divide by the
  // current on-screen/natural width ratio to recover the correct board cell -
  // no separate coordinate math is needed there.
  // ---------------------------------------------------------------

  function applyBoardTransform(){
    boardFrame.style.transform = `translate(${boardPanX}px, ${boardPanY}px) scale(${boardZoom})`;
    const pct = Math.round(boardZoom*100);
    const resetBtn = document.getElementById('zoomResetBtn');
    if(resetBtn) resetBtn.textContent = pct + '%';
    const outBtn = document.getElementById('zoomOutBtn');
    const inBtn = document.getElementById('zoomInBtn');
    if(outBtn) outBtn.style.opacity = boardZoom <= MIN_ZOOM ? '.4' : '.88';
    if(inBtn) inBtn.style.opacity = boardZoom >= MAX_ZOOM ? '.4' : '.88';
  }

  function clampPan(){
    const vw = boardViewport.clientWidth, vh = boardViewport.clientHeight;
    const fw = vw * boardZoom, fh = vh * boardZoom;
    const minX = Math.min(0, vw - fw);
    const minY = Math.min(0, vh - fh);
    boardPanX = Math.max(minX, Math.min(0, boardPanX));
    boardPanY = Math.max(minY, Math.min(0, boardPanY));
  }

  // Zooms to `newZoom`, keeping the point under (anchorX, anchorY) - given in
  // #boardViewport-relative screen coordinates - visually stationary. Falls
  // back to the viewport center when no anchor is given (button taps).
  function setZoom(newZoom, anchorX, anchorY){
    newZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, newZoom));
    if(anchorX == null || anchorY == null){
      anchorX = boardViewport.clientWidth/2;
      anchorY = boardViewport.clientHeight/2;
    }
    const ux = (anchorX - boardPanX)/boardZoom;
    const uy = (anchorY - boardPanY)/boardZoom;
    boardZoom = newZoom;
    boardPanX = anchorX - boardZoom*ux;
    boardPanY = anchorY - boardZoom*uy;
    clampPan();
    applyBoardTransform();
  }

  function resetZoomPan(){
    boardZoom = 1;
    boardPanX = 0;
    boardPanY = 0;
    applyBoardTransform();
  }

  function viewportRelative(clientX, clientY){
    const r = boardViewport.getBoundingClientRect();
    return {x: clientX - r.left, y: clientY - r.top};
  }

  document.getElementById('zoomInBtn').onclick = () => setZoom(boardZoom + 0.4);
  document.getElementById('zoomOutBtn').onclick = () => setZoom(boardZoom - 0.4);
  document.getElementById('zoomResetBtn').onclick = () => resetZoomPan();

  const gridToggleBtn = document.getElementById('gridToggleBtn');
  function updateGridToggleBtn(){
    gridToggleBtn.classList.toggle('active', showGrid);
  }
  try{
    showGrid = localStorage.getItem(GRID_PREF_KEY) === '1';
  }catch(e){}
  updateGridToggleBtn();
  gridToggleBtn.onclick = () => {
    showGrid = !showGrid;
    updateGridToggleBtn();
    try{ localStorage.setItem(GRID_PREF_KEY, showGrid ? '1' : '0'); }catch(e){}
    requestDraw();
  };

  boardViewport.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rel = viewportRelative(e.clientX, e.clientY);
    setZoom(boardZoom - e.deltaY*0.0015, rel.x, rel.y);
  }, {passive:false});

  // Unified pointer handling: one finger with no movement = tap (select an
  // arrow); one finger dragged while zoomed in = pan; two fingers = pinch to
  // zoom. Separating tap from pan/pinch this way is what prevents accidental
  // mis-taps while the player is repositioning a zoomed-in view.
  const activePointers = new Map();
  let singleStart = null;   // {x,y,time,moved}
  let pinchStartDist = 0, pinchStartZoom = 1;
  const TAP_MOVE_THRESHOLD = 6;

  function onPointerDown(e){
    if(e.target.closest && e.target.closest('.zoomControls')) return; // let button handle it
    activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

    if(activePointers.size === 1){
      singleStart = {x:e.clientX, y:e.clientY, time: performance.now(), moved:false};
    } else if(activePointers.size === 2){
      singleStart = null;
      const pts = [...activePointers.values()];
      pinchStartDist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      pinchStartZoom = boardZoom;
      boardFrame.classList.add('no-transition');
    }
  }

  function onPointerMove(e){
    const prev = activePointers.get(e.pointerId);
    if(!prev) return;
    activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

    if(activePointers.size === 2){
      const pts = [...activePointers.values()];
      const dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      if(pinchStartDist > 0){
        const midX = (pts[0].x+pts[1].x)/2, midY = (pts[0].y+pts[1].y)/2;
        const rel = viewportRelative(midX, midY);
        setZoom(pinchStartZoom * (dist/pinchStartDist), rel.x, rel.y);
      }
      return;
    }

    if(activePointers.size === 1 && singleStart){
      const dx = e.clientX - singleStart.x, dy = e.clientY - singleStart.y;
      if(Math.hypot(dx,dy) > TAP_MOVE_THRESHOLD) singleStart.moved = true;
      if(boardZoom > MIN_ZOOM && singleStart.moved){
        boardFrame.classList.add('no-transition');
        boardPanX += (e.clientX - prev.x);
        boardPanY += (e.clientY - prev.y);
        clampPan();
        applyBoardTransform();
      }
    }
  }

  function onPointerUp(e){
    const wasCleanTap = activePointers.size === 1 && singleStart && !singleStart.moved;
    const tapX = e.clientX, tapY = e.clientY;
    const tapTime = singleStart ? singleStart.time : 0;
    activePointers.delete(e.pointerId);

    if(activePointers.size === 0){
      boardFrame.classList.remove('no-transition');
      if(wasCleanTap && (performance.now() - tapTime) < 600){
        handleTap(tapX, tapY);
      }
      singleStart = null;
      pinchStartDist = 0;
    } else if(activePointers.size === 1){
      // lifted one finger out of a pinch - don't let the remaining finger
      // register as a fresh tap when it's eventually lifted too
      pinchStartDist = 0;
      const [id, pt] = [...activePointers.entries()][0];
      singleStart = {x: pt.x, y: pt.y, time: performance.now(), moved:true};
    }
  }

  boardViewport.addEventListener('pointerdown', onPointerDown);
  boardViewport.addEventListener('pointermove', onPointerMove);
  boardViewport.addEventListener('pointerup', onPointerUp);
  boardViewport.addEventListener('pointercancel', onPointerUp);

  function layoutCanvas(){
    const dpr = window.devicePixelRatio || 1;
    const adBannerSpace = 2 * 50; // matches --ad-banner-height reserved at top and bottom
    const availW = window.innerWidth * 0.90;
    // Subtract the banner space directly (not inside the 0.72 ratio) so the
    // board shrinks by exactly the pixels the banners take up, leaving the
    // zoomControls row (+, -, 100%, grid toggle) below the board still on
    // screen instead of getting pushed off the bottom.
    const availH = window.innerHeight * 0.72 - adBannerSpace;
    cellSize = Math.floor(Math.min(availW/COLS, availH/ROWS));
    boardW = cellSize*COLS;
    const TOP_BAR = cellSize * 0.9;

    boardH = cellSize * ROWS + TOP_BAR;

    canvas.style.width = boardW+'px';
    canvas.style.height = boardH+'px';
    document.getElementById("topBar").style.width = boardW + "px";
    canvas.width = boardW*dpr;
    canvas.height = boardH*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);

    // boardFrame's natural (unscaled) outer size includes its own 10px
    // padding on each side; size the clipping viewport to match exactly so
    // zoom=1/pan=0 shows the whole board with no clipping.
    boardViewport.style.width = (boardW + 20) + 'px';
    boardViewport.style.height = (boardH + 20) + 'px';

    clampPan();
    applyBoardTransform();

    draw(performance.now());
  }

  // =====================================================================
  // AD INTEGRATION PLACEHOLDERS
  // Real ad SDK code (AdMob, Unity Ads, etc.) will be merged in here later.
  // Everything below is written so that dropping in the real calls only
  // means editing the bodies of these functions - nothing else in the game
  // needs to change.
  // =====================================================================

  // Banner ads: called once on startup. #adBannerTop / #adBannerBottom are
  // plain fixed-position <div>s reserved for this (see CSS, and the
  // adBannerSpace adjustment in layoutCanvas). Two common integration
  // shapes:
  //   1. SDK renders into the DOM -> put its markup/iframe inside these divs.
  //   2. SDK renders its own native view on top of the WebView (typical for
  //      Cordova plugins like admob-plus) -> leave these divs empty (or
  //      hide them) and just call the SDK's own "show banner at top/bottom"
  //      API here; the divs still reserve the layout space so the game
  //      board doesn't sit underneath the native banner.
  function loadBannerAds(){
    console.log('[ads] loadBannerAds() placeholder - wire up real ad SDK here');
  }

  // Rewarded ad: called when the player taps "Watch Ad for +1 Life" on the
  // Game Over popup. onReward() must ONLY be called once the ad SDK
  // confirms the ad was watched to completion (e.g. AdMob's
  // onUserEarnedReward callback) - never on a failed load or a skipped ad.
  // onUnavailable() should be called if no ad could be shown at all (not
  // loaded / network error), so the UI can fall back gracefully.
  function showRewardedAd(onReward, onUnavailable){
    console.log('[ads] showRewardedAd() placeholder - wire up real ad SDK here');
    // TEMPORARY until the real SDK is merged in: auto-grants the reward
    // immediately so the rest of the extra-life flow can be tested end to
    // end. Delete this line once a real onReward()/onUnavailable() call is
    // wired to the ad SDK's callbacks.
    onReward();
  }

        loadProgress();
        syncUnlockedPatternTiers();

        const hasSave = loadGameState();
        if(hasSave){
            gameStarted = true;
        } else {
            gameStarted = false;
            currentLevel = maxUnlockedLevel[gameMode];
            applyLevelConfig();
        }
        updateLives();
        updateLevelLabel();
        updateShuffleWarning();

        window.addEventListener('resize', layoutCanvas);
        layoutCanvas();
        loadBannerAds();

      // Establish the base history entry as "menu" so the very first back
      // press (when nothing has been pushed on top of it) falls through to
      // the browser/device's normal back behavior instead of doing anything
      // unexpected inside the page.
      history.replaceState({screen:"menu"}, "");

      // Device/browser back button handling: while playing, back should
      // return to the menu rather than exiting the page. hideMenu() pushes
      // a 'game' history entry when gameplay starts, so a back press here
      // pops back to the 'menu' state we just registered above and this
      // fires with that state - show the menu instead of letting the page
      // navigate away. (Handles forward-navigation back into a 'game'
      // state too, for completeness, though that's rarely reachable from
      // a device back gesture.)
      window.addEventListener('popstate', (e) => {
          const screen = e.state && e.state.screen;
          if(screen === 'game'){
              inGameHistoryState = true;
              hideMenuWithoutHistoryPush();
              layoutCanvas();
          } else {
              inGameHistoryState = false;
              showMenu();
          }
      });

      // ---------------------------------------------------------------
      // Hardware back button inside a native WebView wrapper (Cordova /
      // Capacitor / a custom Android or iOS bridge).
      //
      // IMPORTANT: none of this is reachable from a plain desktop/mobile
      // browser tab - that case is already fully handled above via
      // history.pushState/popstate. This section only matters once the
      // page is packaged inside a native app shell, because those shells
      // do NOT translate the hardware/software back button into normal
      // browser history navigation. Cordova fires its own 'backbutton'
      // DOM event, and Capacitor fires its own 'backButton' plugin event -
      // and critically, if nothing listens for either, their default
      // unhandled behavior is to close/exit the app immediately, which is
      // exactly the "back exits the game" symptom being reported here.
      // Simply registering a listener is what suppresses that default
      // exit-on-back behavior and lets us decide what happens instead.
      // ---------------------------------------------------------------
      function handleHardwareBack(){
          // Debug aid: connect the device via USB, open chrome://inspect on
          // a desktop Chrome, and inspect this WebView while the APK is
          // running. If you never see this log line when pressing back, the
          // event isn't reaching the page at all - that's a native/manifest
          // issue (see the predictive-back-gesture note), not something in
          // this file.
          console.log('[backbutton] handleHardwareBack fired, menuVisible=' +
              (document.getElementById('menuScreen').style.display !== 'none') +
              ' gameStarted=' + gameStarted);

          // Any dismissible popup on top (level select, mode select, bug
          // report, the life-lost/level-complete popup) should close first.
          const gamePopup = document.getElementById('gamePopup');
          const levelPopup = document.getElementById('levelPopup');
          const modePopup = document.getElementById('modePopup');
          const reportPopup = document.getElementById('reportPopup');
          if(gamePopup){ gamePopup.remove(); return; }
          if(levelPopup){ levelPopup.remove(); return; }
          if(modePopup){ modePopup.remove(); return; }
          if(reportPopup){ reportPopup.remove(); return; }

          const menuVisible = document.getElementById('menuScreen').style.display !== 'none';
          if(!menuVisible){
              // currently playing -> first back press opens the menu (same
              // screen the in-game ☰ button opens)
              showMenu();
          } else {
              // the menu is already showing - whether it's the true
              // top-level menu, or a pause overlay back-pressed into from
              // an in-progress game - a second consecutive back press here
              // is a genuine "exit" request, so defer to the same exit
              // logic the Exit button already uses (Cordova/Capacitor/
              // native bridge aware).
              document.getElementById('exitBtn').click();
          }
      }

      // Cordova: registering a 'backbutton' listener overrides its default
      // exit-the-app behavior - but Cordova only honors that override if the
      // listener is attached AFTER 'deviceready' has fired. Attaching it
      // immediately on page load (before the native bridge finishes
      // initializing) is a documented race condition where the override
      // silently fails to bind and the hardware key falls through to the
      // default "close the app" behavior - which is exactly the symptom of
      // back not working while Exit (a direct, later, user-triggered call)
      // does work.
      let backButtonBound = false;
      document.addEventListener('deviceready', () => {
          console.log('[backbutton] deviceready fired, binding backbutton listener');
          document.addEventListener('backbutton', (e) => {
              if(e && e.preventDefault) e.preventDefault();
              handleHardwareBack();
          }, false);
          backButtonBound = true;
      }, false);

      // Diagnostic only: if deviceready hasn't fired within 5s of load, the
      // native Cordova bridge either isn't present or is failing to
      // initialize (e.g. cordova.js 404'd in this particular build), which
      // means the 'backbutton' listener above never gets attached and the
      // OS's default/legacy back handling takes over instead of this page's
      // JS. Check chrome://inspect for this warning.
      setTimeout(() => {
          if(!backButtonBound){
              console.warn('[backbutton] deviceready never fired - the Cordova ' +
                  'backbutton listener was never attached. This is a native ' +
                  'project issue (missing/broken cordova.js bridge), not something ' +
                  'fixable in index.html.');
          }
      }, 5000);

      // Capacitor: same idea via the App plugin's backButton event.
      if(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App &&
         typeof window.Capacitor.Plugins.App.addListener === 'function'){
          window.Capacitor.Plugins.App.addListener('backButton', () => handleHardwareBack());
      }

      // Fallback for WebView wrappers/plugins that deliver the hardware back
      // key as a plain keydown (legacy Android back keyCode 4) instead of -
      // or in addition to - Cordova's custom 'backbutton' event. Harmless to
      // have both: handleHardwareBack() itself is idempotent per press since
      // each press only ever fires one of these events.
      document.addEventListener('keydown', (e) => {
          if(e.keyCode === 4){
              e.preventDefault();
              handleHardwareBack();
          }
      }, false);

      // Always show the menu on launch, but showMenu() itself decides
      // whether the Resume button appears (only when gameStarted is true
      // AND progressMade is true, i.e. there's an actual saved game with
      // at least one arrow already cleared - a fresh, untouched board
      // just shows New Game instead).
      showMenu();
})();
</script>
