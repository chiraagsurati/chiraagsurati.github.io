      }

      function getNextReminderTime(hour, minute) {
          const now = new Date();
          const next = new Date(now);
          next.setHours(hour, minute, 0, 0);
          if (next <= now) {
              next.setDate(next.getDate() + 1);
          }
          return next;
      }

      let browserReminderTimeouts = [];

      function scheduleBrowserReminder(reminder) {
          const next = getNextReminderTime(reminder.hour, reminder.minute);
          const delay = next.getTime() - Date.now();
          const timeoutId = setTimeout(() => {
              try {
                  new Notification(reminder.title, { body: reminder.text, tag: 'arrow-reminder-' + reminder.id, renotify: true });
              } catch (err) {
                  console.warn('Browser reminder failed:', err);
              }
              scheduleReminderNotifications(); // rebuild all 3 with fresh text/progress before re-arming
          }, delay);
          browserReminderTimeouts.push(timeoutId);
      }

      // All plugin interaction below is wrapped defensively - this exact
      // feature previously caused the app to auto-exit / fail to open at
      // all on some devices, so nothing here is allowed to throw back out
      // to a caller. Every callback (hasPermission/requestPermission/
      // cancel/schedule) gets its own try/catch as well as the outer
      // function, since an exception thrown from *inside* an async
      // plugin callback would otherwise escape uncaught - a try/catch
      // wrapped only around the initial call wouldn't see it.
      // TEMPORARILY DISABLED (see conversation history) - this plugin has
      // now been the prime suspect behind "app auto-exits / runs too
      // slow on some devices" TWICE: once on old Android 11 devices, and
      // again on newer devices (Nothing Phone, OnePlus 12) right after
      // being re-enabled. Root cause isn't confirmed yet (needs an actual
      // adb logcat capture from an affected device to pin down), so
      // rather than leave config.xml/JS/native project inconsistent with
      // each other again like last time, this single flag is now the
      // ONE place controlling whether notifications run at all. To
      // re-enable: flip this to true AND uncomment the matching
      // <plugin>/<uses-permission> lines in config.xml AND run
      // `cordova plugin add cordova-plugin-local-notification@^1.2.3`
      // (or platform remove/re-add) so the native project actually
      // matches. To fully remove instead: also run
      // `cordova plugin remove cordova-plugin-local-notification`.
      const NOTIFICATIONS_ENABLED = false;

      function scheduleReminderNotifications() {
          if(!NOTIFICATIONS_ENABLED) return;
          try{
              const reminderNotifications = buildReminderNotifications();
              const hasLocalNotification = window.cordova && window.cordova.plugins &&
                  window.cordova.plugins.notification && window.cordova.plugins.notification.local;

              if (hasLocalNotification) {
                  const local = window.cordova.plugins.notification.local;

                  const doSchedule = () => {
                      try{
                          const ids = reminderNotifications.map(item => item.id);
                          local.cancel(ids, () => {
                              try{
                                  local.schedule(reminderNotifications.map((item) => ({
                                      id: item.id,
                                      title: item.title,
                                      text: item.text,
                                      trigger: { every: { hour: item.hour, minute: item.minute } },
                                      foreground: true
                                  })));
                                  console.log('Scheduled Cordova reminder notifications for morning, evening, and night.');
                              }catch(e){
                                  console.warn('[reminders] schedule() failed, skipping:', e);
                              }
                          });
                      }catch(e){
                          console.warn('[reminders] cancel()/doSchedule failed, skipping:', e);
                      }
                  };

                  // Android 13+ (API 33+) requires the app to hold the runtime
                  // POST_NOTIFICATIONS permission or scheduled notifications are
                  // silently swallowed by the OS - they schedule without error
                  // but never actually appear. hasPermission/requestPermission
                  // are provided by cordova-plugin-local-notification itself;
                  // on older Android versions (no runtime prompt needed) they
                  // just report granted immediately, so this is safe everywhere.
                  try{
                      local.hasPermission((granted) => {
                          try{
                              if (granted) {
                                  doSchedule();
                              } else {
                                  local.requestPermission((accepted) => {
                                      try{
                                          if (accepted) {
                                              doSchedule();
                                          } else {
                                              console.warn('Notification permission denied by user; reminders will not appear.');
                                          }
                                      }catch(e){
                                          console.warn('[reminders] requestPermission callback failed, skipping:', e);
                                      }
                                  });
                              }
                          }catch(e){
                              console.warn('[reminders] hasPermission callback failed, skipping:', e);
                          }
                      });
                  }catch(e){
                      // hasPermission itself threw synchronously (e.g. plugin
                      // bridge not actually ready despite deviceready having
                      // fired) - swallow it rather than let it propagate and
                      // take the app down with it.
                      console.warn('[reminders] hasPermission() call failed, skipping notification setup:', e);
                  }
                  return;
              }

              if (window.Notification && typeof window.Notification.requestPermission === 'function') {
                  browserReminderTimeouts.forEach(id => clearTimeout(id));
                  browserReminderTimeouts = [];
                  if (Notification.permission === 'granted') {
                      reminderNotifications.forEach(scheduleBrowserReminder);
                  } else if (Notification.permission !== 'denied') {
                      Notification.requestPermission().then((permission) => {
                          try{
                              if (permission === 'granted') {
                                  reminderNotifications.forEach(scheduleBrowserReminder);
                              } else {
                                  console.warn('Notification permission denied; reminders will not appear in browser.');
                              }
                          }catch(e){
                              console.warn('[reminders] requestPermission().then failed, skipping:', e);
                          }
                      }).catch((e) => console.warn('[reminders] requestPermission() rejected, skipping:', e));
                  } else {
                      console.warn('Notification permission denied; reminders will not appear in browser.');
                  }
                  return;
              }

              console.warn('Reminder notifications are not available in this environment.');
          }catch(e){
              // Outermost safety net - whatever went wrong, the game itself
              // must keep running regardless.
              console.warn('[reminders] scheduleReminderNotifications() failed entirely, skipping:', e);
          }
      }

      // NOTE: the 'backbutton' listener itself is already registered in the
      // earlier deviceready block above. Registering it a second time here
      // caused every hardware back press to fire handleHardwareBack() twice
      // in a row - the first call opened the menu, and the second call (run
      // immediately after, seeing the menu now visible) treated it as a
      // repeat press and exited the app. This block now only schedules
      // reminder notifications on deviceready.
      document.addEventListener('deviceready', () => {
          // Deferred rather than called immediately here: this exact call
          // previously caused the app to auto-exit / fail to open on some
          // devices, most likely from racing the plugin bridge (or the
          // rest of startup - board generation, layoutCanvas, banner ads)
          // right as 'deviceready' fires. scheduleReminderNotifications()
          // is now fully wrapped in try/catch internally (see its
          // definition above) so it can no longer throw, and this delay
          // additionally makes sure it only ever runs after the game
          // itself has already finished starting up and is on screen -
          // a few seconds' delay on when reminders get (re)armed is
          // invisible to the player, but starting the game reliably isn't
          // negotiable.
          setTimeout(scheduleReminderNotifications, 5000);

          // Re-arm with fresh copy every time the player leaves or returns
          // to the app, not just once at launch - this is what lets the
          // "X levels to your next pattern" message reflect their actual
          // current progress instead of going stale after install day.
          document.addEventListener('pause', scheduleReminderNotifications, false);
          document.addEventListener('resume', scheduleReminderNotifications, false);

          // Guarantee the latest game state is actually on disk before the
          // OS can suspend/kill the app - scheduleSave() debounces writes
          // by up to 400ms during rapid play, so without this, progress
          // from taps in that last 400ms could be lost if the player
          // backgrounds the app (or it gets killed) right after tapping.
          document.addEventListener('pause', flushPendingSave, false);

          // Check for a newer published version - once at launch, and again
          // whenever the player returns to the app (throttled internally
          // so it won't hit the hosted JSON more than once per 6h).
          checkForUpdate();
          document.addEventListener('resume', checkForUpdate, false);
      }, false);

      if (!window.cordova) {
          setTimeout(scheduleReminderNotifications, 5000);
          checkForUpdate();
      }

      // Universal safety net alongside the Cordova 'pause' listener above -
      // covers the plain-browser case and any other path (tab switch, app
      // switcher, OS killing the page) that fires visibilitychange/pagehide
      // without necessarily firing Cordova's 'pause' event. Cheap no-op if
      // there's nothing pending.
      document.addEventListener('visibilitychange', () => {
          if(document.visibilityState === 'hidden') flushPendingSave();
      }, false);
      window.addEventListener('pagehide', flushPendingSave, false);

      // Always show the menu on launch, but showMenu() itself decides
      // whether the Resume button appears (only when gameStarted is true
      // AND progressMade is true, i.e. there's an actual saved game with
      // at least one arrow already cleared - a fresh, untouched board
      // just shows New Game instead).
      updateStreakAndMaybeToast();
      playBadgeBootEntrance(); // coin badge was already set earlier in boot (loadCoins/updateCoinBadge above); this plays both entrances together
      showMenu();
})();
</script>
</body>
</html>
