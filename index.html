<script>
(function(){
  const canvas = document.getElementById('board');

      // ---- Config (tweak freely later) ----
    let COLS = 10;
    let ROWS = 15;
    let gameMode = "medium";
    const MODES = {
        easy: {
            rows: 8,
            cols: 6
        },
        medium: {
            rows: 12,
            cols: 8
        },
        hard: {
            rows: 18,
            cols: 12
        }
    };
  const PIPE_COLOR = '#2c2f4a';
  let MAX_STEPS = 13;            // hard cap on how many cells one path can cover (scales with level)
  let MIN_ARROW_LENGTH = 15;      // min cells per path (scales with level)
  let lives = 3;
  let gameStarted = false;
  let progressMade = false; // true once at least one arrow has actually been cleared this level
  let currentLevel = 1;
  // Tracks whether we've pushed an extra 'game' entry onto the browser history
  // stack on top of the base 'menu' entry, so the device/browser back button
  // returns to the menu instead of exiting the page while playing.
  let inGameHistoryState = false;
  // Zoom/pan state for the board (lets players zoom in to see crowded
  // arrows clearly and avoid mis-tapping the wrong pipe).
  let boardZoom = 1, boardPanX = 0, boardPanY = 0;
  const MIN_ZOOM = 1, MAX_ZOOM = 2.6;
  let maxUnlockedLevel = { easy: 1, medium: 1, hard: 1 };

  // ---- persistence ----
  const PROGRESS_KEY = 'arrowPuzzleProgress';
  const SAVE_KEY = 'arrowPuzzleSave';

  function loadProgress(){
    try{
      const raw = localStorage.getItem(PROGRESS_KEY);
      if(raw){
        const data = JSON.parse(raw);
        const saved = data.maxUnlockedLevel;
        if(saved && typeof saved === 'object'){
          // current per-mode format
          maxUnlockedLevel = {
            easy: saved.easy || 1,
            medium: saved.medium || 1,
            hard: saved.hard || 1
          };
        } else if(typeof saved === 'number'){
          // migrate old single shared-number saves: apply it to every mode
          // so nobody's existing progress just vanishes
          maxUnlockedLevel = { easy: saved, medium: saved, hard: saved };
        }
      }
    }catch(e){}
  }

  function saveProgress(){
    try{
      localStorage.setItem(PROGRESS_KEY, JSON.stringify({maxUnlockedLevel}));
    }catch(e){}
  }

  function saveGameState(){
    try{
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        mode: gameMode,
        level: currentLevel,
        lives,
        rows: ROWS,
        cols: COLS,
        grid,
        paths: Array.from(pathsMap.values()),
        progressMade
      }));
    }catch(e){}
  }

  function loadGameState(){
    try{
      const raw = localStorage.getItem(SAVE_KEY);
      if(!raw) return false;
      const data = JSON.parse(raw);
      if(!data || !data.grid || !data.paths) return false;
      gameMode = data.mode || gameMode;
      currentLevel = data.level || 1;
      lives = data.lives || 3;
      ROWS = data.rows;
      COLS = data.cols;
      grid = data.grid;
      pathsMap = new Map(data.paths.map(p => [p.id, p]));
      progressMade = !!data.progressMade;
      return true;
    }catch(e){ return false; }
  }

  function clearGameState(){
    try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  }

  const DIRS = {
    right: {dx:1, dy:0},
    down:  {dx:0, dy:1},
    left:  {dx:-1,dy:0},
    up:    {dx:0, dy:-1},
  };
  const DIR_NAMES = Object.keys(DIRS);
  const OPPOSITE = {right:'left', left:'right', up:'down', down:'up'};

  // ---- Deterministic per-level randomness ----
  // Every level (identified by mode+level number) must always generate the
  // exact same board, every single time it's played - whether that's
  // replaying it back-to-back or coming back to it after 10 other levels.
  // So instead of the raw Math.random(), all generation code below draws
  // from `rng()`, a seeded PRNG that gets reseeded from (mode, level)
  // right before a layout is built. Same seed in -> same board out, always.

  // simple string hash -> 32-bit seed (cyrb53-lite)
  function hashSeed(str){
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for(let i=0;i<str.length;i++){
      const ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1>>>16), 2246822507) ^ Math.imul(h2 ^ (h2>>>13), 3266489909);
    return (h1 >>> 0);
  }

  // mulberry32: small, fast, deterministic PRNG
  function mulberry32(seed){
    let a = seed >>> 0;
    return function(){
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  let rng = Math.random; // replaced by seedLevelRng() before every generation

  function seedLevelRng(mode, level){
    rng = mulberry32(hashSeed(mode + ':' + level));
  }

    // ---- Level difficulty scaling ----
    function getLevelConfig(mode, level){
      const base = MODES[mode];
      const growth = Math.min(Math.floor((level - 1) / 4), 4);
      const maxSteps = Math.min(12, 7 + Math.floor((level - 1) / 4));
      // minArrowLength must stay comfortably below maxSteps, or the
      // generator can never produce a path that satisfies it (which was
      // forcing boards — especially large ones like Hard — to fall back
      // to plain single-direction straight lines).
      const minArrowLength = Math.max(4, Math.min(maxSteps - 2, Math.floor(rng() * 3) + 7));
      return {
        rows: base.rows + growth,
        cols: base.cols + Math.floor(growth * 0.5),
        minArrowLength,
        maxSteps
      };
    }

    function applyLevelConfig(){
      seedLevelRng(gameMode, currentLevel);
      const cfg = getLevelConfig(gameMode, currentLevel);
      ROWS = cfg.rows;
      COLS = cfg.cols;
      MIN_ARROW_LENGTH = cfg.minArrowLength;
      MAX_STEPS = cfg.maxSteps;
    }

    function setMode(mode){
      gameMode = mode;
      applyLevelConfig();
  }


         function updateMenuStatus(){
            const modeLabel = gameMode.charAt(0).toUpperCase() + gameMode.slice(1);
            document.getElementById("levelBtn").textContent = "🏆 Level : " + currentLevel;
            document.getElementById("modeBtn").textContent = "🎮 Mode : " + modeLabel;
      }

         function showMenu(){

            document.getElementById("menuScreen").style.display = "flex";

            document.getElementById("resumeBtn").style.display =
                (gameStarted && progressMade) ? "block" : "none";

            updateMenuStatus();

      }

        function hideMenu(){

            document.getElementById("menuScreen").style.display="none";

            // Give the device/browser back button something to return from:
            // pressing back while playing should reopen the menu, not exit
            // the page. Only push once per "session" of play so repeated
            // pause/resume cycles don't stack up multiple history entries.
            if(!inGameHistoryState){
                history.pushState({screen:"game"}, "");
                inGameHistoryState = true;
            }

        }

        // Same as hideMenu(), but used when we're already reacting to a
        // history navigation (e.g. a 'forward' button restoring the 'game'
        // state) - so it must NOT push another history entry itself.
        function hideMenuWithoutHistoryPush(){
            document.getElementById("menuScreen").style.display="none";
        }

        document.getElementById("resumeBtn").onclick=()=>{

      hideMenu();

      layoutCanvas();

        };

       function startNewGame() {

              applyLevelConfig();
              lives = 3;
              updateLives();
              updateLevelLabel();
              leaving = [];
              flashing = new Map();
              progressMade = false;
              const layout = buildLayout();
              grid = layout.grid;
              pathsMap = new Map(
                  layout.paths.map(p => [p.id, p])
              );
              resetZoomPan();
              layoutCanvas();
              saveGameState();
              hideMenu();
          }

        document.getElementById("newBtn").onclick = () => {

              currentLevel = maxUnlockedLevel[gameMode];
              gameStarted = true;
              startNewGame();
          };
        function updateLives(){
           document.getElementById("lives").textContent =
             "❤ ".repeat(lives).trim();
        }

        function updateLevelLabel(){
            document.getElementById("levelLabel").textContent = "LEVEL " + currentLevel;
        }

        document.getElementById("levelBtn").onclick = () => {

            const old = document.getElementById("levelPopup");
            if(old) old.remove();

            const popup = document.createElement("div");
            popup.id = "levelPopup";

            popup.style.cssText = `
                position:fixed;
                inset:0;
                background:rgba(0,0,0,.45);
                display:flex;
                justify-content:center;
                align-items:center;
                z-index:99999;
            `;

            let buttonsHtml = '';
            for(let lvl = 1; lvl <= maxUnlockedLevel[gameMode]; lvl++){
                buttonsHtml += `<button class="levelSelect" data-level="${lvl}">${lvl}</button>`;
            }

            popup.innerHTML = `
                <div style="
                    background:white;
                    padding:15px;
                    border-radius:18px;
                    width:220px;
                    max-height:70vh;
                    overflow-y:auto;
                    text-align:center;
                    box-shadow:0 15px 40px rgba(0,0,0,.25);
                ">
                    <div style="
                        font-size:15px;
                        font-weight:bold;
                        color:#2c2f4a;
                        margin-bottom:12px;
                    ">
                        Select Level (${gameMode.charAt(0).toUpperCase() + gameMode.slice(1)})
                    </div>
                    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;">
                        ${buttonsHtml}
                    </div>
                </div>
            `;

            document.body.appendChild(popup);
            popup.querySelectorAll(".levelSelect").forEach(btn=>{
                btn.style.cssText = `
                    padding:10px 0;
                    font-size:13px;
                    font-weight:bold;
                    border:none;
                    border-radius:10px;
                    background:#2c2f4a;
                    color:white;
                    cursor:pointer;
                `;
                btn.onclick = () => {

            });
            popup.onclick = (e) => {

            };
        };

       document.getElementById("modeBtn").onclick = () => {

        const old = document.getElementById("modePopup");
        if(old) old.remove();

        const popup = document.createElement("div");
        popup.id = "modePopup";

    popup.style.cssText = `
        position:fixed;
        inset:0;

        justify-content:center;

        z-index:99999;
    `;

    popup.innerHTML = `
        <div style="
            background:white;

        ">

            <div style="

            ">

            </div>

            <button class="modeSelect" data-mode="medium">Medium</button>

        </div>
    `;

    document.body.appendChild(popup);
    popup.querySelectorAll(".modeSelect").forEach(btn=>{
        btn.style.cssText=`

        `;
        btn.onclick=()=>{
           setMode(btn.dataset.mode);
            currentLevel = maxUnlockedLevel[btn.dataset.mode];
            updateMenuStatus();
            popup.remove();
        };
    });
    popup.onclick=(e)=>{
        if(e.target===popup)
            popup.remove();
    };
};

        document.getElementById("muteBtn").onclick=()=>{
            alert("Coming Soon");
        };
        document.getElementById("exitBtn").onclick = () => {
            const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

            // Desktop browsers: do nothing.
            if (!isMobile) {
                console.log("Exit is available only on mobile.");
                return;
            }

            // Cordova / PhoneGap wrapped app.
            if (window.cordova && navigator.app) {
                navigator.app.exitApp();
                return;
            }

            // Capacitor wrapped app.
            if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
                window.Capacitor.Plugins.App.exitApp();
                return;
            }

            // Custom Android WebView JS bridge, e.g.
            // webView.addJavascriptInterface(new Object(){ @JavascriptInterface public void exitApp(){...} }, "AndroidApp");
            if (window.AndroidApp && typeof window.AndroidApp.exitApp === 'function') {
                window.AndroidApp.exitApp();
                return;
            }

            // Custom iOS WKWebView message handler, e.g.
            // window.webkit.messageHandlers.exitApp.postMessage(null)
            if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.exitApp) {
                window.webkit.messageHandlers.exitApp.postMessage(null);
                return;
            }

            // Plain mobile browser fallback: only works if this tab/window
            // was opened via script (window.open); most browsers block
            // scripts from closing a tab the user opened directly.
            window.close();
        };
        document.getElementById("menuBtn").onclick = () => {

            showMenu();

        };

  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(rng()*(i+1));
      [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr;
  }

  function directionBetween(r0,c0,r1,c1){
    const dr = r1-r0, dc = c1-c0;
    for(const name of DIR_NAMES){
      const d = DIRS[name];
      if(d.dx===dc && d.dy===dr) return name;
    }
    return null;
  }

  // flips which end of a path is the head, without changing which cells it covers
  function flipPath(path){
    const cells = path.cells.slice().reverse();
    let headDir;
    if(cells.length >= 2){
      const [r0,c0] = cells[cells.length-2];
      const [r1,c1] = cells[cells.length-1];
      headDir = directionBetween(r0,c0,r1,c1);
    } else {
      headDir = OPPOSITE[path.headDir];
    }
    return {id: path.id, cells, headDir};
  }

  function edgeMatches(r,c,dir){
    if(dir==='up') return r===0;
    if(dir==='down') return r===ROWS-1;
    if(dir==='left') return c===0;
    if(dir==='right') return c===COLS-1;
    return false;
  }

  // ---- raw generation: partition the grid into bent, non-overlapping pipe paths ----
  // Cells are started in order of "most constrained first" (fewest free
  // neighbors) rather than pure random order. This means tight corners get
  // absorbed into a real, visible path while there's still room to grow,
  // instead of being left over at the end as tiny near-invisible 1-cell stubs.
  //
  // SOLVABILITY IS BUILT IN, NOT CHECKED AFTERWARDS:
  // a path's own body never blocks its own exit (see hasClearExit, which
  // ignores the path's own cells), so whether a given end of a path has a
  // clear line off the board depends ONLY on paths already committed to the
  // grid before it - never on anything placed later. So as each new path is
  // grown, we require that at least one of its two ends (head or tail)
  // already has a clear exit through everything placed so far, and commit
  // it using that end as the head. That guarantees the whole board is fully
  // clearable, in the reverse of build order, no matter what gets placed
  // around it afterwards - by construction, not by luck. On large/tight
  // boards (e.g. late Hard levels) this is what keeps generation from
  // repeatedly failing and dropping to the plain straight-line fallback.
  function rawGenerate(){
    const grid = Array.from({length: ROWS}, () => Array(COLS).fill(-1));
    const paths = [];

    function freeNeighborCount(r,c){
      let cnt = 0;
      for(const name of DIR_NAMES){
        const d = DIRS[name];
        const nr = r+d.dy, nc = c+d.dx;
        if(nr<0||nr>=ROWS||nc<0||nc>=COLS) continue;
        if(grid[nr][nc] === -1) cnt++;
      }
      return cnt;
    }

    function pickStartCell(){
      let bestCount = Infinity, bestCandidates = [];
      for(let r=0;r<ROWS;r++){
        for(let c=0;c<COLS;c++){
          if(grid[r][c] !== -1) continue;
          const cnt = freeNeighborCount(r,c);
          if(cnt < bestCount){ bestCount = cnt; bestCandidates = [[r,c]]; }
          else if(cnt === bestCount){ bestCandidates.push([r,c]); }
        }
      }
      if(bestCandidates.length === 0) return null;
      return bestCandidates[Math.floor(rng()*bestCandidates.length)];
    }

    // grow one candidate shape from (sr,sc) without touching the shared grid,
    // so a shape that doesn't pan out can be thrown away and retried with no
    // cleanup - only cells vs already-FINISHED paths are checked against grid.
    function growCandidate(sr, sc){
      const cells = [[sr,sc]];
      const occupied = new Set([sr+','+sc]);
      let lastDir = null;

      function touchesSelf(nr, nc, r, c){
        for(const name of DIR_NAMES){
          const d = DIRS[name];
          const ar = nr+d.dy, ac = nc+d.dx;
          if(ar===r && ac===c) continue; // the connecting cell we just came from - always fine
          if(occupied.has(ar+','+ac)) return true;
        }
        return false;
      }

      while(cells.length < MAX_STEPS){
        const [r,c] = cells[cells.length-1];

        const candidates = [];
        for(const name of DIR_NAMES){
          const d = DIRS[name];
          const nr = r+d.dy, nc = c+d.dx;
          if(nr<0||nr>=ROWS||nc<0||nc>=COLS) continue;
          if(grid[nr][nc] !== -1) continue;               // occupied by an earlier, finished path
          if(occupied.has(nr+','+nc)) continue;            // occupied by this same path
          if(lastDir && name === OPPOSITE[lastDir]) continue; // never backtrack
          if(touchesSelf(nr, nc, r, c)) continue;          // head/body must never touch itself
          let w = 3;                    // favour turning over continuing straight
          if(lastDir === name) w = 1;
          candidates.push({name, d, nr, nc, w});
        }
        if(candidates.length === 0) break;
          // ---------- Minimum arrow length ----------
          // MIN_ARROW_LENGTH scales with level (see getLevelConfig / applyLevelConfig)

          // Don't allow the generator to stop until the minimum length is reached.
          if (cells.length >= MIN_ARROW_LENGTH) {

              const stopChance = 0.10 + (cells.length - MIN_ARROW_LENGTH) * 0.045;

              if (rng() < stopChance)
                  break;
          }

        const totalW = candidates.reduce((s,x)=>s+x.w,0);
        let r2 = rng()*totalW;
        let pick = candidates[0];
        for(const cand of candidates){ if(r2 < cand.w){ pick = cand; break; } r2 -= cand.w; }

        cells.push([pick.nr, pick.nc]);
        occupied.add(pick.nr+','+pick.nc);
        lastDir = pick.name;
      }

      return {cells, lastDir};
    }

    // true if a straight line off the board from this end is clear of every
    // path already committed to the grid (a path's own cells never count)
    function hasClearExit(cells, dir){
      const [r,c] = cells[cells.length-1];
      const d = DIRS[dir];
      let rr=r+d.dy, cc=c+d.dx;
      while(rr>=0 && rr<ROWS && cc>=0 && cc<COLS){
        if(grid[rr][cc] !== -1) return false;
        rr+=d.dy; cc+=d.dx;
      }
      return true;
    }

    let start;
    while((start = pickStartCell())){
      const [sr,sc] = start;
      let best = null;

      for(let attempt=0; attempt<40 && !best; attempt++){
        const {cells, lastDir} = growCandidate(sr, sc);

        if(cells.length >= 2){
          const [r0,c0] = cells[cells.length-2];
          const [r1,c1] = cells[cells.length-1];
          const tailEndDir = lastDir || directionBetween(r0,c0,r1,c1);
          if(tailEndDir && hasClearExit(cells, tailEndDir)){
            best = {cells, headDir: tailEndDir};
            break;
          }
          const flippedCells = cells.slice().reverse();
          const [fr0,fc0] = flippedCells[flippedCells.length-2];
          const [fr1,fc1] = flippedCells[flippedCells.length-1];
          const headEndDir = directionBetween(fr0,fc0,fr1,fc1);
          if(headEndDir && hasClearExit(flippedCells, headEndDir)){
            best = {cells: flippedCells, headDir: headEndDir};
            break;
          }
        } else {
          // single-cell stub: any of the 4 directions can serve as its head
          for(const name of shuffle(DIR_NAMES.slice())){
            if(hasClearExit(cells, name)){
              best = {cells, headDir: name};
              break;
            }
          }
        }
      }

      // extremely rare corner case: even after retries neither end is clear -
      // keep the last grown shape as-is rather than looping forever here;
      // mergeStubs / the outer solvability check will catch anything left over
      if(!best){
        const {cells, lastDir} = growCandidate(sr, sc);
        best = {cells, headDir: lastDir || DIR_NAMES[Math.floor(rng()*DIR_NAMES.length)]};
      }

      const pathId = paths.length;
      for(const [cr,cc] of best.cells) grid[cr][cc] = pathId;
      paths.push({id: pathId, cells: best.cells, headDir: best.headDir});
    }

    return {grid, paths};
  }

  // a chain is valid if every step is a single orthogonal move, no cell repeats,
  // and no cell is edge-adjacent to another cell of the chain except its immediate neighbour
  function isValidChain(cells){
    for(let i=1;i<cells.length;i++){
      const [r0,c0] = cells[i-1], [r1,c1] = cells[i];
      const dr = Math.abs(r1-r0), dc = Math.abs(c1-c0);
      if(!((dr===1&&dc===0)||(dr===0&&dc===1))) return false;
    }
    const seen = new Set(cells.map(([r,c]) => r+','+c));
    if(seen.size !== cells.length) return false;
    for(let i=0;i<cells.length;i++){
      const [r,c] = cells[i];
      for(const name of DIR_NAMES){
        const d = DIRS[name];
        const ar = r+d.dy, ac = c+d.dx;
        const idx = cells.findIndex(([rr,cc]) => rr===ar && cc===ac);
        if(idx === -1) continue;
        if(idx !== i-1 && idx !== i+1) return false;
      }
    }
    return true;
  }

  // try to graft a too-short stub path onto an adjacent path's head or tail,
  // so nearly every cell ends up part of a proper, clearly-visible arrow
  function tryMergeStub(grid, byId, stub){
    for(const attachEnd of [0, stub.cells.length-1]){
      const [ar,ac] = stub.cells[attachEnd];
      for(const name of DIR_NAMES){
        const d = DIRS[name];
        const nr = ar+d.dy, nc = ac+d.dx;
        if(nr<0||nr>=ROWS||nc<0||nc>=COLS) continue;
        const neighborId = grid[nr][nc];
        if(neighborId === -1 || neighborId === stub.id) continue;
        const neighborPath = byId.get(neighborId);
        if(!neighborPath) continue;

        const tail = neighborPath.cells[0];
        const head = neighborPath.cells[neighborPath.cells.length-1];

        if(tail[0]===nr && tail[1]===nc){
          // attach at the neighbour's tail — headDir is unaffected
          const newCells = attachEnd === 0
            ? stub.cells.slice().reverse().concat(neighborPath.cells)
            : stub.cells.slice().concat(neighborPath.cells);
          if(newCells.length > MAX_STEPS + 4) continue;
          if(!isValidChain(newCells)) continue;

          for(const [cr,cc] of stub.cells) grid[cr][cc] = neighborPath.id;
          neighborPath.cells = newCells;
          byId.delete(stub.id);
          return true;

        } else if(head[0]===nr && head[1]===nc){
          // attach at the neighbour's head — recompute headDir
          const extension = attachEnd === 0 ? stub.cells : stub.cells.slice().reverse();
          const newCells = neighborPath.cells.concat(extension);
          if(newCells.length > MAX_STEPS + 4) continue;
          if(!isValidChain(newCells)) continue;

          const [r0,c0] = newCells[newCells.length-2];
          const [r1,c1] = newCells[newCells.length-1];
          const newHeadDir = directionBetween(r0,c0,r1,c1);
          if(!newHeadDir) continue;

          for(const [cr,cc] of stub.cells) grid[cr][cc] = neighborPath.id;
          neighborPath.cells = newCells;
          neighborPath.headDir = newHeadDir;
          byId.delete(stub.id);
          return true;
        }
      }
    }
    return false;
  }

  // graft as many too-short stubs as possible onto neighbouring paths
  function mergeStubs(grid, paths){
    const byId = new Map(paths.map(p => [p.id, p]));
    let changed = true, iter = 0;
    while(changed && iter < 500){
      changed = false; iter++;
      const stubs = [...byId.values()].filter(p => p.cells.length < MIN_ARROW_LENGTH);
      for(const stub of stubs){
        if(!byId.has(stub.id)) continue;
        if(tryMergeStub(grid, byId, stub)) changed = true;
      }
    }
    return [...byId.values()];
  }

  // RULE: two arrows sharing a row/column can never point straight at one
  // another head-to-head, no matter how far apart they are
  function findConflicts(paths){
    const conflicts = [];
    const byRow = new Map(), byCol = new Map();
    for(const p of paths){
      const [r,c] = p.cells[p.cells.length-1];
      if(p.headDir === 'left' || p.headDir === 'right'){
        if(!byRow.has(r)) byRow.set(r, []);
        byRow.get(r).push({p, c});
      }
      if(p.headDir === 'up' || p.headDir === 'down'){
        if(!byCol.has(c)) byCol.set(c, []);
        byCol.get(c).push({p, r});
      }
    }
    for(const [, arr] of byRow){
      for(let i=0;i<arr.length;i++) for(let j=i+1;j<arr.length;j++){
        const A = arr[i], B = arr[j];
        let leftOne=null, rightOne=null;
        if(A.p.headDir==='right' && B.p.headDir==='left'){ rightOne=A; leftOne=B; }
        else if(A.p.headDir==='left' && B.p.headDir==='right'){ rightOne=B; leftOne=A; }
        else continue;
        if(rightOne.c < leftOne.c) conflicts.push([rightOne.p.id, leftOne.p.id]);
      }
    }
    for(const [, arr] of byCol){
      for(let i=0;i<arr.length;i++) for(let j=i+1;j<arr.length;j++){
        const A = arr[i], B = arr[j];
        let topOne=null, bottomOne=null;
        if(A.p.headDir==='down' && B.p.headDir==='up'){ topOne=A; bottomOne=B; }
        else if(A.p.headDir==='up' && B.p.headDir==='down'){ topOne=B; bottomOne=A; }
        else continue;
        if(topOne.r < bottomOne.r) conflicts.push([topOne.p.id, bottomOne.p.id]);
      }
    }
    return conflicts;
  }

  // resolve "face to face" conflicts by flipping one arrow of each pair, one at a time
  function resolveConflicts(paths, protectedId){
    const byId = new Map(paths.map(p => [p.id, p]));
    const flipCounts = new Map();
    for(let iter=0; iter<2000; iter++){
      const conflicts = findConflicts([...byId.values()]);
      if(conflicts.length === 0) return {paths: [...byId.values()], ok: true};
      const [a,b] = conflicts[0];
      const pa = byId.get(a), pb = byId.get(b);
      let flipId;
      if(a === protectedId) flipId = b;
      else if(b === protectedId) flipId = a;
      else {
        const ca = flipCounts.get(a) || 0, cb = flipCounts.get(b) || 0;
        if(ca !== cb) flipId = ca < cb ? a : b;
        else flipId = pa.cells.length <= pb.cells.length ? a : b; // flip the shorter one: less likely to cascade
      }
      byId.set(flipId, flipPath(byId.get(flipId)));
      flipCounts.set(flipId, (flipCounts.get(flipId)||0) + 1);
    }
    return {paths: [...byId.values()], ok: false};
  }

  // ensure at least one arrow already has a clear, unobstructed path off the board
  function findClearCandidate(paths){
    for(const p of paths){
      const [r,c] = p.cells[p.cells.length-1];
      if(edgeMatches(r,c,p.headDir)) return p.id;
    }
    for(let i=0;i<paths.length;i++){
      const flipped = flipPath(paths[i]);
      const [r,c] = flipped.cells[flipped.cells.length-1];
      if(edgeMatches(r,c,flipped.headDir)){
        paths[i] = flipped;
        return flipped.id;
      }
    }
    return null;
  }

// guaranteed-instant, always-solvable layout used only as a last resort if
// random generation can't find a valid board quickly (can happen on very
// large, highly-constrained boards at high levels)
function buildFallbackLayout(){
    const grid = Array.from({length: ROWS}, () => Array(COLS).fill(-1));
    const paths = [];
    for(let r=0; r<ROWS; r++){
        const cells = [];
        // each row is only ever occupied by its own path, so nothing else
        // can block it regardless of direction - alternate so the board
        // doesn't degenerate into every single arrow pointing the same way
        const headDir = (r % 2 === 0) ? 'right' : 'left';
        if(headDir === 'right'){
            for(let c=0; c<COLS; c++){ cells.push([r,c]); grid[r][c] = r; }
        } else {
            for(let c=COLS-1; c>=0; c--){ cells.push([r,c]); grid[r][c] = r; }
        }
        paths.push({id: r, cells, headDir});
    }
    return {grid, paths, clearId: 0};
}

function buildLayout(){

    let attempts = 0;
    const MAX_ATTEMPTS = 2000; // give the real generator much more room before giving up

    while(true){

        attempts++;

        if(attempts > MAX_ATTEMPTS){
            return buildFallbackLayout();
        }

        const {grid, paths: rawPaths} = rawGenerate();
        const paths = mergeStubs(grid, rawPaths);

        // as a light safety net, avoid layouts that still have near-invisible
        // stub arrows if we can help it — but don't loop forever over rare,
        // highly-constrained boards.
        if(attempts < 25){
            const hasStub = paths.some(p => p.cells.length < MIN_ARROW_LENGTH);
            if(hasStub) continue;
        }

        const clearId = findClearCandidate(paths);
        if(clearId===null) continue;

        const resolved = resolveConflicts(paths, clearId);
        if(!resolved.ok) continue;

        // simulate the whole puzzle
        const simGrid = grid.map(r=>r.slice());
        const remaining = new Map();

        for(const p of resolved.paths)
            remaining.set(p.id, structuredClone(p));

        let removed = 0;

        while(true){

            let found = false;

            for(const [id,p] of remaining){

                const [r,c] = p.cells[p.cells.length-1];
                const d = DIRS[p.headDir];

                let rr=r+d.dy;
                let cc=c+d.dx;

                let clear=true;

                while(rr>=0 && rr<ROWS && cc>=0 && cc<COLS){

                    if(simGrid[rr][cc]!=-1){
                        clear=false;
                        break;
                    }

                    rr+=d.dy;
                    cc+=d.dx;
                }

                if(clear){

                    found=true;

                    for(const [cr,cc] of p.cells)
                        simGrid[cr][cc]=-1;

                    remaining.delete(id);
                    removed++;

                    break;
                }
            }

            if(!found) break;
        }

        // ALL arrows removable?
        if(removed===resolved.paths.length){

            return{
                grid,
                paths:resolved.paths,
                clearId
            };

        }

    }

}

  // ---- Runtime state ----
    let grid = [];
    let pathsMap = new Map();
    let cellSize = 0, boardW = 0, boardH = 0;

    let leaving = [];
    let flashing = new Map();//red flashing arrows
   let animFrameQueued = false;

  const SPEED = 0.62;             // px per ms travelled along the path while exiting
  const FLASH_DURATION = 380;     // ms
  const RED = '#e0435a';

  function cellCenter(r,c){
    const TOP_BAR = cellSize * 0.9;

    return [
        c*cellSize + cellSize/2,
        TOP_BAR + r*cellSize + cellSize/2
    ];
}

  function drawDotGrid(){

      ctx.fillStyle = "#e53935";
      ctx.font = `bold ${cellSize*0.55}px Arial`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      let hearts = "";

      for(let i=0;i<lives;i++)
          hearts += "❤ ";

    const rDot = Math.max(1, cellSize*0.045);

    ctx.fillStyle = 'rgba(44,47,74,0.25)';
    for(let r=0; r<=ROWS; r++){
      for(let c=0; c<=COLS; c++){
        ctx.beginPath();
        const TOP_BAR = cellSize * 0.9;

              ctx.arc(
                  c*cellSize,
                  TOP_BAR + r*cellSize,
                  rDot,
                  0,
                  Math.PI*2
              );
        ctx.fill();
      }
    }
  }

  // cumulative arc-length along a path's cell centers, for continuous "slide along the path" motion
  function buildArcLength(pts){
    const cum = [0];
    for(let i=1;i<pts.length;i++){
      const [x0,y0] = pts[i-1], [x1,y1] = pts[i];
      cum.push(cum[i-1] + Math.hypot(x1-x0, y1-y0));
    }
    return cum;
  }

  // position at arc-length s along the polyline; beyond the last point it keeps
  // going straight in headDir, exactly like a snake that has left the pipe
  function pointAtArclength(pts, cum, s, headVec){
    const total = cum[cum.length-1];
    if(s <= 0) return pts[0];
    if(s > total){
      const [hx,hy] = pts[pts.length-1];
      const extra = s - total;
      return [hx + headVec.dx*extra, hy + headVec.dy*extra];
    }
    for(let i=1;i<cum.length;i++){
      if(s <= cum[i] || i === cum.length-1){
        const segLen = (cum[i]-cum[i-1]) || 1e-6;
        const t = (s - cum[i-1]) / segLen;
        const [x0,y0] = pts[i-1], [x1,y1] = pts[i];
        return [x0+(x1-x0)*t, y0+(y1-y0)*t];
      }
    }
    return pts[pts.length-1];
  }

  function lerpColor(hexA, hexB, t){
    const a = parseInt(hexA.slice(1),16), b = parseInt(hexB.slice(1),16);
    const ar=(a>>16)&255, ag=(a>>8)&255, ab=a&255;
    const br=(b>>16)&255, bg=(b>>8)&255, bb=b&255;
    const r = Math.round(ar+(br-ar)*t), g = Math.round(ag+(bg-ag)*t), bl = Math.round(ab+(bb-ab)*t);
    return '#' + ((1<<24)+(r<<16)+(g<<8)+bl).toString(16).slice(1);
  }

  // draws a pipe strip through an arbitrary list of points, with the arrowhead
  // built from the direction of travel at the very front point
  function drawStrip(pts, headVec, color){
    const thickness = cellSize * 0.08;  // width of arrow

    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.strokeStyle = color;
    ctx.lineWidth = thickness;

    ctx.beginPath();
    pts.forEach(([x,y], i) => { if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); });
    ctx.stroke();

    const [ex,ey] = pts[pts.length-1];
    const tipX = ex + headVec.dx*cellSize*0.22;
    const tipY = ey + headVec.dy*cellSize*0.22;
    ctx.beginPath();
    ctx.moveTo(ex,ey);
    ctx.lineTo(tipX,tipY);
    ctx.stroke();

    const headLen = cellSize*0.30;
    const headW = cellSize*0.40;   // width reduced 50% from original 0.40
    const angle = Math.atan2(headVec.dy, headVec.dx);
    const baseX = tipX - Math.cos(angle)*headLen;
    const baseY = tipY - Math.sin(angle)*headLen;
    const perpX = -Math.sin(angle)*headW/2;
    const perpY =  Math.cos(angle)*headW/2;

    ctx.beginPath();
    ctx.moveTo(tipX, tipY);
    ctx.lineTo(baseX+perpX, baseY+perpY);
    ctx.lineTo(baseX-perpX, baseY-perpY);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
  }

  function drawPathShape(path, color){
    const pts = path.cells.map(([r,c]) => cellCenter(r,c));
    drawStrip(pts, DIRS[path.headDir], color || PIPE_COLOR);
  }

  function easeInCubic(t){ return t*t*t; }

  // true if nothing else currently occupies the cells straight ahead of this
  // arrow's head, all the way to the edge of the board
  function isClear(path){
    const [r,c] = path.cells[path.cells.length-1];
    const d = DIRS[path.headDir];
    let rr = r+d.dy, cc = c+d.dx;
    while(rr>=0 && rr<ROWS && cc>=0 && cc<COLS){
      const occ = grid[rr][cc];
      if(occ !== -1 && occ !== path.id) return false;
      rr += d.dy; cc += d.dx;
    }
    return true;
  }

  function draw(now){
    ctx.clearRect(0,0,boardW,boardH);
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--board-bg').trim();
    ctx.fillRect(0,0,boardW,boardH);
    drawDotGrid();

    pathsMap.forEach(p => {
      let color = PIPE_COLOR;
      const flash = flashing.get(p.id);
      if(flash !== undefined){
        const t = (now - flash) / FLASH_DURATION;
        if(t >= 1){
          flashing.delete(p.id);
        } else {
          color = lerpColor(RED, PIPE_COLOR, Math.min(1,t));
        }
      }
      drawPathShape(p, color);
    });

    leaving = leaving.filter(item => {
      const elapsed = now - item.startTime;
      const t = Math.min(1, elapsed / item.duration);
      const shift = item.total_extra_travel * easeInCubic(t);
      const headVec = DIRS[item.path.headDir];
      const newPts = item.cum.map(s => pointAtArclength(item.pts, item.cum, s + shift, headVec));
      drawStrip(newPts, headVec, PIPE_COLOR);
      return t < 1;
    });

    if(leaving.length > 0 || flashing.size > 0){
      requestAnimationFrame(draw);
    } else {
      animFrameQueued = false;
    }
  }

  function requestDraw(){
    if(!animFrameQueued){

      requestAnimationFrame(draw);

  }

  // tapping an arrow: if the way ahead is clear it slides out head-first, tail

    const margin = (COLS+ROWS) * cellSize;                 // guarantees it clears the board
    const total_extra_travel = total + margin;
    const duration = Math.max(220, total_extra_travel / SPEED);

    leaving.push({
      id,
      path,
      pts,
      cum,
      total_extra_travel,
      duration,
      startTime: performance.now()
  });

  requestDraw();

  saveGameState();

  checkLevelComplete();
  }

  // ---------------------------------------------------------------
  // Zoom & pan
  //
  // #boardFrame is scaled/translated with a CSS transform (transform-origin
  // top-left) inside the fixed-size, overflow:hidden #boardViewport. Because
  // the canvas's actual on-screen box (canvas.getBoundingClientRect()) already
  // reflects that CSS transform, handleTap() only needs to divide by the
  // current on-screen/natural width ratio to recover the correct board cell -
  // no separate coordinate math is needed there.
  // ---------------------------------------------------------------

  function applyBoardTransform(){
    boardFrame.style.transform = `translate(${boardPanX}px, ${boardPanY}px) scale(${boardZoom})`;
    const pct = Math.round(boardZoom*100);
    const resetBtn = document.getElementById('zoomResetBtn');
    if(resetBtn) resetBtn.textContent = pct + '%';
    const outBtn = document.getElementById('zoomOutBtn');
    const inBtn = document.getElementById('zoomInBtn');
    if(outBtn) outBtn.style.opacity = boardZoom <= MIN_ZOOM ? '.4' : '.88';
    if(inBtn) inBtn.style.opacity = boardZoom >= MAX_ZOOM ? '.4' : '.88';
  }

  function clampPan(){
    const vw = boardViewport.clientWidth, vh = boardViewport.clientHeight;
    const fw = vw * boardZoom, fh = vh * boardZoom;
    const minX = Math.min(0, vw - fw);
    const minY = Math.min(0, vh - fh);
    boardPanX = Math.max(minX, Math.min(0, boardPanX));
    boardPanY = Math.max(minY, Math.min(0, boardPanY));
  }

  // Zooms to `newZoom`, keeping the point under (anchorX, anchorY) - given in
  // #boardViewport-relative screen coordinates - visually stationary. Falls
  // back to the viewport center when no anchor is given (button taps).
  function setZoom(newZoom, anchorX, anchorY){
    newZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, newZoom));
    if(anchorX == null || anchorY == null){
      anchorX = boardViewport.clientWidth/2;
      anchorY = boardViewport.clientHeight/2;
    }
    const ux = (anchorX - boardPanX)/boardZoom;
    const uy = (anchorY - boardPanY)/boardZoom;
    boardZoom = newZoom;
    boardPanX = anchorX - boardZoom*ux;
    boardPanY = anchorY - boardZoom*uy;
    clampPan();
    applyBoardTransform();
  }

  function resetZoomPan(){
    boardZoom = 1;
    boardPanX = 0;
    boardPanY = 0;
    applyBoardTransform();
  }

  function viewportRelative(clientX, clientY){
    const r = boardViewport.getBoundingClientRect();
    return {x: clientX - r.left, y: clientY - r.top};
  }

  document.getElementById('zoomInBtn').onclick = () => setZoom(boardZoom + 0.4);
  document.getElementById('zoomOutBtn').onclick = () => setZoom(boardZoom - 0.4);
  document.getElementById('zoomResetBtn').onclick = () => resetZoomPan();

  boardViewport.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rel = viewportRelative(e.clientX, e.clientY);
    setZoom(boardZoom - e.deltaY*0.0015, rel.x, rel.y);
  }, {passive:false});

  // Unified pointer handling: one finger with no movement = tap (select an
  // arrow); one finger dragged while zoomed in = pan; two fingers = pinch to
  // zoom. Separating tap from pan/pinch this way is what prevents accidental
  // mis-taps while the player is repositioning a zoomed-in view.
  const activePointers = new Map();
  let singleStart = null;   // {x,y,time,moved}
  let pinchStartDist = 0, pinchStartZoom = 1;
  const TAP_MOVE_THRESHOLD = 6;

  function onPointerDown(e){
    if(e.target.closest && e.target.closest('.zoomControls')) return; // let button handle it
    boardViewport.setPointerCapture && boardViewport.setPointerCapture(e.pointerId);
    activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

    if(activePointers.size === 1){
      singleStart = {x:e.clientX, y:e.clientY, time: performance.now(), moved:false};
    } else if(activePointers.size === 2){
      singleStart = null;
      const pts = [...activePointers.values()];
      pinchStartDist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      pinchStartZoom = boardZoom;
      boardFrame.classList.add('no-transition');
    }
  }

  function onPointerMove(e){
    const prev = activePointers.get(e.pointerId);
    if(!prev) return;
    activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

    if(activePointers.size === 2){
      const pts = [...activePointers.values()];
      const dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      if(pinchStartDist > 0){
        const midX = (pts[0].x+pts[1].x)/2, midY = (pts[0].y+pts[1].y)/2;
        const rel = viewportRelative(midX, midY);
        setZoom(pinchStartZoom * (dist/pinchStartDist), rel.x, rel.y);
      }
      return;
    }

    if(activePointers.size === 1 && singleStart){
      const dx = e.clientX - singleStart.x, dy = e.clientY - singleStart.y;
      if(Math.hypot(dx,dy) > TAP_MOVE_THRESHOLD) singleStart.moved = true;
      if(boardZoom > MIN_ZOOM && singleStart.moved){
        boardFrame.classList.add('no-transition');
        boardPanX += (e.clientX - prev.x);
        boardPanY += (e.clientY - prev.y);
        clampPan();
        applyBoardTransform();
      }
    }
  }

  function onPointerUp(e){
    const wasCleanTap = activePointers.size === 1 && singleStart && !singleStart.moved;
    const tapX = e.clientX, tapY = e.clientY;
    const tapTime = singleStart ? singleStart.time : 0;
    activePointers.delete(e.pointerId);

    if(activePointers.size === 0){
      boardFrame.classList.remove('no-transition');
      if(wasCleanTap && (performance.now() - tapTime) < 600){
        handleTap(tapX, tapY);
      }
      singleStart = null;
      pinchStartDist = 0;
    } else if(activePointers.size === 1){
      // lifted one finger out of a pinch - don't let the remaining finger
      // register as a fresh tap when it's eventually lifted too
      pinchStartDist = 0;
      const [id, pt] = [...activePointers.entries()][0];
      singleStart = {x: pt.x, y: pt.y, time: performance.now(), moved:true};
    }
  }

  boardViewport.addEventListener('pointerdown', onPointerDown);
  boardViewport.addEventListener('pointermove', onPointerMove);
  boardViewport.addEventListener('pointerup', onPointerUp);
  boardViewport.addEventListener('pointercancel', onPointerUp);

  function layoutCanvas(){
    const dpr = window.devicePixelRatio || 1;
    const availW = window.innerWidth * 0.90;
    const availH = window.innerHeight * 0.72;
    cellSize = Math.floor(Math.min(availW/COLS, availH/ROWS));
    boardW = cellSize*COLS;
    const TOP_BAR = cellSize * 0.9;

    boardH = cellSize * ROWS + TOP_BAR;

    canvas.style.width = boardW+'px';
    canvas.style.height = boardH+'px';
    document.getElementById("topBar").style.width = boardW + "px";
    canvas.width = boardW*dpr;
    canvas.height = boardH*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);

    // boardFrame's natural (unscaled) outer size includes its own 10px
    // padding on each side; size the clipping viewport to match exactly so
    // zoom=1/pan=0 shows the whole board with no clipping.
    boardViewport.style.width = (boardW + 20) + 'px';
    boardViewport.style.height = (boardH + 20) + 'px';

    clampPan();
    applyBoardTransform();

    draw(performance.now());
  }

        loadProgress();

        const hasSave = loadGameState();
        if(hasSave){
            gameStarted = true;
        } else {
            gameStarted = false;
            currentLevel = maxUnlockedLevel[gameMode];
            applyLevelConfig();
        }
        updateLives();
        updateLevelLabel();

        window.addEventListener('resize', layoutCanvas);
        layoutCanvas();

      // Establish the base history entry as "menu" so the very first back
      // press (when nothing has been pushed on top of it) falls through to
      // the browser/device's normal back behavior instead of doing anything
      // unexpected inside the page.
      history.replaceState({screen:"menu"}, "");

      // Device/browser back button handling: while playing, back should
      // return to the menu rather than exiting the page. hideMenu() pushes
      // a 'game' history entry when gameplay starts, so a back press here
      // pops back to the 'menu' state we just registered above and this
      // fires with that state - show the menu instead of letting the page
      // navigate away. (Handles forward-navigation back into a 'game'
      // state too, for completeness, though that's rarely reachable from
      // a device back gesture.)
      window.addEventListener('popstate', (e) => {
          const screen = e.state && e.state.screen;
          if(screen === 'game'){
              inGameHistoryState = true;
              hideMenuWithoutHistoryPush();
              layoutCanvas();
          } else {
              inGameHistoryState = false;
              showMenu();
          }
      });

      // Always show the menu on launch, but showMenu() itself decides
      // whether the Resume button appears (only when gameStarted is true
      // AND progressMade is true, i.e. there's an actual saved game with
      // at least one arrow already cleared - a fresh, untouched board
      // just shows New Game instead).
      showMenu();
})();
</script>
</body>
