<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
 <!-- Game icon -->
    <link rel="icon" type="image/png" href="icon.png">
<title>Arrow</title>
<style>
/* ===========================
   MAIN MENU
=========================== */
#menuScreen{
    position:fixed;
    top:0;
    right:0;
    bottom:0;
    left:0;
    background:#d9d8e2;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}
.menu-box{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
}
.menu-box h1{
    margin:0 0 26px;
    color:#2c2f4a;
    font-size:32px;
    font-weight:900;
    letter-spacing:5px;
}
.menu-box button{
    background:#ffffff;
    border:none;
    border-radius:16px;

    color:#2c2f4a;

    font-size:22px;
    font-weight:700;

    cursor:pointer;

    padding:14px 34px;
    min-width:220px;

    box-shadow:0 4px 10px rgba(44,47,74,0.15);
    transition:.15s;

}
.menu-box button:hover{
    background:#4d63ff;
    color:#ffffff;
    box-shadow:0 6px 14px rgba(77,99,255,0.35);
    transform:translateY(-2px);

}
.menu-box button:active{
    transform:translateY(0);
    box-shadow:0 2px 6px rgba(44,47,74,0.2);
}
  :root{
    --bg:#d9d8e2;
    --board-bg:#dedde6;
    --pipe:#2c2f4a;
    --dot: rgba(44,47,74,0.28);
    --ad-banner-height: 50px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background: var(--bg);
    overflow:hidden;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    touch-action: none;
  }
  /* ===========================
     AD BANNER SLOTS (placeholders)
     Fixed-position strips sized for a standard 320x50 banner ad.
     Real ad SDK code will be merged in here later - see the
     loadBannerAds() JS function further down for the integration
     point. If the eventual SDK manages its own native overlay view
     instead of DOM content, the inner placeholder text can simply be
     left empty; the div still reserves the on-screen space for it.
  =========================== */
  .adBanner{
    position:fixed;
    left:0; right:0;
    height:var(--ad-banner-height);
    z-index:500;
    user-select:none;
  }
  #adBannerTop{ top:0; }
  #adBannerBottom{ bottom:0; }
  #wrap{
    width:100%; min-height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px;
    overflow-y:auto;
    padding:calc(var(--ad-banner-height) + 10px) 0;
  }
  #title{
    color:#2c2f4a;
    letter-spacing: 10px;
    font-weight:800;
    font-size: 26px;
    user-select:none;
  }
#boardViewport{
    position:relative;
    overflow:hidden;

    touch-action:none;
}
#boardFrame{
    position:relative;
    padding:10px;
    border-radius:18px;

    box-shadow:
        0 0 0 1px rgba(0,0,0,.03) inset,
        0 16px 36px rgba(30,25,60,.18);

    transition: transform .12s ease-out;
    will-change: transform;
}
#boardFrame.no-transition{
    transition: none;
}
  #board{
    display:block;
    border-radius: 10px;
  }
.zoomControls{
    display:flex;
    flex-direction:row;
    justify-content:center;
    align-items:center;

    z-index:50;
}
.zoomBtn{
    width:24px;
    height:24px;
    border:none;
    border-radius:7px;
    background:#2c2f4a;
    color:#fff;
    font-size:13px;
    font-weight:bold;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.25);
    opacity:.88;
    user-select:none;
    transition:.15s;
}
.zoomBtn:active{
    transform:scale(.92);
}
#zoomResetBtn{
    width:auto;
    padding:0 8px;
    font-size:9px;
    letter-spacing:.3px;
}
.zoomBtn.active{
    background:#4d63ff;
    box-shadow:0 2px 8px rgba(77,99,255,.45);
}
#topBar{
    width:fit-content;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    margin:0 auto 12px;
}

#lives{

    color:#e53935;

    font-size:20px;

    font-weight:bold;

    letter-spacing:3px;

}

#levelLabel{
    position:absolute;
    left:10px;
    top:50%;
    transform:translateY(-50%);

    color:#2c2f4a;
    font-size:13px;
    font-weight:800;
    letter-spacing:1px;
    white-space:nowrap;
}

#shuffleWarning{
    /* Absolutely positioned (relative to #topBar, which is
       position:relative) so toggling this on/off never affects layout -
       it sits in the gap between the hearts and the board without ever
       pushing the board down or shifting its fixed position. */
    position:absolute;
    left:0;
    right:0;
    top:100%;
    margin-top:6px;

    text-align:center;
    color:#c9740b;
    font-size:13px;
    font-weight:700;
    letter-spacing:0.3px;
    pointer-events:none;
    display:none; /* toggled on via JS only in Hard mode, once 3 or fewer arrows remain before the next reshuffle */
}

#menuBtn{
    position:absolute;
    top:50%;
    right:10px;
    transform:translateY(-50%);

    width:30px;
    height:30px;

    border:none;
    border-radius:8px;

    background:#2c2f4a;
    color:#fff;

    font-size:15px;
    font-weight:bold;

    display:flex;
    justify-content:center;
    align-items:center;

    cursor:pointer;

    z-index:100;

    box-shadow:0 2px 8px rgba(0,0,0,.25);

    transition:.15s;
}
#menuBtn:hover{
    transform:translateY(-50%) scale(1.05);
}
#menuBtn:active{
    transform:translateY(-50%) scale(.95);
}
@keyframes loadingSpin{
    to{ transform:rotate(360deg); }
}

<body>
<!-- Required for Cordova: this is what wires up window.cordova, navigator.app,
     and the native 'backbutton' event. Without this tag none of the back/exit
     handling further down in this file can ever fire - Android's default
     back-button behavior (instantly closing the app) takes over instead.
     Cordova generates this file automatically at build time into
     platforms/android/app/src/main/assets/www/cordova.js, so this relative
     path just needs to match where index.html itself ends up in that build. -->
<script src="cordova.js"></script>
<div id="adBannerTop" class="adBanner"></div>
<div id="adBannerBottom" class="adBanner"></div>
<div id="wrap">
  <div id="topBar">
    <div id="levelLabel">LEVEL 1</div>
    <div id="lives">
        ❤ ❤ ❤
    </div>
    <button id="menuBtn">☰</button>
    <div id="shuffleWarning"></div>
</div>
  <div id="boardViewport">
    <div id="boardFrame">
          <canvas id="board"></canvas>
    </div>
  </div>
  <div class="zoomControls">
    <button id="zoomInBtn" class="zoomBtn" title="Zoom in">+</button>
    <button id="zoomOutBtn" class="zoomBtn" title="Zoom out">−</button>
    <button id="zoomResetBtn" class="zoomBtn" title="Reset zoom">100%</button>
    <button id="gridToggleBtn" class="zoomBtn" title="Show arrow path grid">▦</button>
  </div>

  </div>
</div>

 <div id="menuScreen">
    <div class="menu-box">

        <h1>ARROW PUZZLE</h1>

        <button id="resumeBtn">▶ Resume</button>

        <button id="newBtn"> New Game</button>

        <button id="levelBtn">🏆 Level</button>

        <button id="modeBtn">Mode</button>

        <button id="patternBtn">Pattern</button>

        <button id="muteBtn">🔊 Sound</button>

        <!-- Report Bug temporarily disabled - see the matching commented-out
             handler below for reportBugBtn -->
        <!-- <button id="reportBugBtn">🐞 Report Bug</button> -->

        <button id="exitBtn">❌ Exit</button>
     </div>
</div>


<script>
(function(){
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const boardViewport = document.getElementById('boardViewport');
  const boardFrame = document.getElementById('boardFrame');

  // ---- Sound effects ----
  const ARROW_VOLUME = 0.2;      // 0.0 (silent) - 1.0 (full volume)
  const LEVEL_PASS_VOLUME = 0.5;
  const arrowSound = new Audio('Arrow.mp3');
  const levelPassSound = new Audio('LevelPass.mp3');

  const errorSound = new Audio('Error.mp3');
  const gameOverSound = new Audio('GameOver.mp3');
  errorSound.volume = 0.3;
  gameOverSound.volume = 0.5;

  arrowSound.volume = ARROW_VOLUME;
  levelPassSound.volume = LEVEL_PASS_VOLUME;

    arrowSound.preload = 'auto';
    levelPassSound.preload = 'auto';
    errorSound.preload = 'auto';
    gameOverSound.preload = 'auto';

    arrowSound.load();
    levelPassSound.load();
    errorSound.load();
    gameOverSound.load();

  // Log load failures early (bad path/missing file/unsupported format) -
  // these show up in chrome://inspect when debugging the Cordova WebView.
  [arrowSound, levelPassSound, errorSound, gameOverSound].forEach(s => {
    s.addEventListener('error', () => {
      console.warn('Failed to load sound:', s.src, s.error);
    });
  });

  // Mobile WebViews (Cordova/Capacitor included) commonly refuse the very
  // first programmatic .play() call unless it happens inside a "real" user
  // gesture - and even then some WebView versions are stricter than desktop
  // browsers about what counts. The standard fix is to "unlock" each
  // <audio> element with a silent play+pause during the first touch the
  // user makes anywhere on the page; every .play() call after that unlock
  // is then allowed to go through normally.
  let audioUnlocked = false;
  function unlockAudio(){
    if(audioUnlocked) return;
    audioUnlocked = true;
    [arrowSound, levelPassSound].forEach(s => {
      const p = s.play();
      if(p && p.catch){
        p.then(() => { s.pause(); s.currentTime = 0; })
         .catch(err => console.warn('Audio unlock failed:', s.src, err));
      }
    });
    document.removeEventListener('touchstart', unlockAudio);
    document.removeEventListener('pointerdown', unlockAudio);
  }
  document.addEventListener('touchstart', unlockAudio, {once:true});
  document.addEventListener('pointerdown', unlockAudio, {once:true});

  function playSound(sound){
    // rewind so rapid repeats (e.g. clearing several arrows quickly) don't
    // get cut off by a still-playing previous instance
    try{
      sound.currentTime = 0;
      sound.play().catch(err => console.warn('Sound blocked/failed:', sound.src, err));
    }catch(e){ console.warn('Sound error:', sound.src, e); }
  }

      // ---- Config (tweak freely later) ----
    let COLS = 10;
    let ROWS = 15;
    let gameMode = "medium";
    const MODES = {
        easy: {
            rows: 8,
            cols: 6
        },
        medium: {
            rows: 12,
            cols: 8
        },
        hard: {
            rows: 14,
            cols: 10
        }
    };
  const PIPE_COLOR = '#2c2f4a';
  let MAX_STEPS = 13;            // hard cap on how many cells one path can cover (scales with level)
  let MIN_ARROW_LENGTH = 15;      // min cells per path (scales with level)
  let lives = 3;
  // While a Hard mode reshuffle is computing (can take a noticeable moment
  // on a big board) the main thread is blocked, so the OS/browser queues
  // up any taps that happen during that freeze and delivers them the
  // instant it's free again - by which point the board has changed under
  // the player's finger. handleTap() ignores anything that arrives before
  // this timestamp so those stray queued taps can't land on the wrong,
  // just-reshuffled arrow and cost a life.
  let inputBlockedUntil = 0;
  let gameStarted = false;
  let progressMade = false; // true once at least one arrow has actually been cleared this level
  let currentLevel = 1;
  // Tracks whether we've pushed an extra 'game' entry onto the browser history
  // stack on top of the base 'menu' entry, so the device/browser back button
  // returns to the menu instead of exiting the page while playing.
  let inGameHistoryState = false;
  // Zoom/pan state for the board (lets players zoom in to see crowded
  // arrows clearly and avoid mis-tapping the wrong pipe).
  let boardZoom = 1, boardPanX = 0, boardPanY = 0;
  const MIN_ZOOM = 1, MAX_ZOOM = 2.6;
  let maxUnlockedLevel = { easy: 1, medium: 1, hard: 1 };
  // Arrow texture pattern selection. 'auto' follows the level-based tier
  // (existing behaviour); any other value pins the board to that specific
  // pattern regardless of level, until the player switches back to Auto
  // Select. unlockedPatternTiers is how many ARROW_PATTERN_TYPES entries
  // (from the start) are available to pick in the Pattern menu - it only
  // ever grows, tracking the furthest tier reached in any mode.
  let selectedPatternType = 'auto';
  let unlockedPatternTiers = 1;
  // Whether the arrow-path grid overlay is on (toggled via the Grid button
  // beside the zoom controls); remembered across sessions like the mute
  // preference.
  let showGrid = false;

  // ---- persistence ----
  const PROGRESS_KEY = 'arrowPuzzleProgress';
  const SAVE_KEY = 'arrowPuzzleSave';
  const GRID_PREF_KEY = 'arrowPuzzleShowGrid';

  function loadProgress(){
    try{
      const raw = localStorage.getItem(PROGRESS_KEY);
      if(raw){
        const data = JSON.parse(raw);
        const saved = data.maxUnlockedLevel;
        if(saved && typeof saved === 'object'){
          // current per-mode format
          maxUnlockedLevel = {
            easy: saved.easy || 1,
            medium: saved.medium || 1,
            hard: saved.hard || 1
          };
        } else if(typeof saved === 'number'){
          // migrate old single shared-number saves: apply it to every mode
          // so nobody's existing progress just vanishes
          maxUnlockedLevel = { easy: saved, medium: saved, hard: saved };
        }
        if(typeof data.selectedPatternType === 'string'){
          selectedPatternType = data.selectedPatternType;
        }
        if(typeof data.unlockedPatternTiers === 'number'){
          unlockedPatternTiers = data.unlockedPatternTiers;
        }
      }
    }catch(e){}
  }

  function saveProgress(){
    try{
      localStorage.setItem(PROGRESS_KEY, JSON.stringify({maxUnlockedLevel, selectedPatternType, unlockedPatternTiers}));
    }catch(e){}
  }

  function saveGameState(){
    try{
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        mode: gameMode,
        level: currentLevel,
        lives,
        rows: ROWS,
        cols: COLS,
        grid,
        paths: Array.from(pathsMap.values()),
        progressMade,
        levelArrowTotal,
        hardShuffleFlags
      }));
    }catch(e){}
  }

  function loadGameState(){
    try{
      const raw = localStorage.getItem(SAVE_KEY);
      if(!raw) return false;
      const data = JSON.parse(raw);
      if(!data || !data.grid || !data.paths) return false;
      gameMode = data.mode || gameMode;
      currentLevel = data.level || 1;
      lives = data.lives || 3;
      ROWS = data.rows;
      COLS = data.cols;
      grid = data.grid;
      pathsMap = new Map(data.paths.map(p => [p.id, p]));
      progressMade = !!data.progressMade;
      // Older saves won't have these two fields. Falling back to the
      // current remaining count (with both checkpoints already marked
      // "done") means a resumed legacy save just skips reshuffling for
      // the rest of that level, rather than risking a checkpoint firing
      // on a total it was never measured against.
      if(typeof data.levelArrowTotal === 'number' && data.hardShuffleFlags){
          levelArrowTotal = data.levelArrowTotal;
          hardShuffleFlags = data.hardShuffleFlags;
      } else {
          levelArrowTotal = pathsMap.size;
          hardShuffleFlags = { at20: true, at60: true };
      }
      return true;
    }catch(e){ return false; }
  }

  function clearGameState(){
    try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  }

  const DIRS = {
    right: {dx:1, dy:0},
    down:  {dx:0, dy:1},
    left:  {dx:-1,dy:0},
    up:    {dx:0, dy:-1},
  };
  const DIR_NAMES = Object.keys(DIRS);
  const OPPOSITE = {right:'left', left:'right', up:'down', down:'up'};

  // ---- Deterministic per-level randomness ----
  // Every level (identified by mode+level number) must always generate the
  // exact same board, every single time it's played - whether that's
  // replaying it back-to-back or coming back to it after 10 other levels.
  // So instead of the raw Math.random(), all generation code below draws
  // from `rng()`, a seeded PRNG that gets reseeded from (mode, level)
  // right before a layout is built. Same seed in -> same board out, always.

  // simple string hash -> 32-bit seed (cyrb53-lite)
  function hashSeed(str){
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for(let i=0;i<str.length;i++){
      const ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1>>>16), 2246822507) ^ Math.imul(h2 ^ (h2>>>13), 3266489909);
    return (h1 >>> 0);
  }

  // mulberry32: small, fast, deterministic PRNG
  function mulberry32(seed){
    let a = seed >>> 0;
    return function(){
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  let rng = Math.random; // replaced by seedLevelRng() before every generation

  function seedLevelRng(mode, level){
    rng = mulberry32(hashSeed(mode + ':' + level));
  }

    // ---- Level difficulty scaling ----
    function getLevelConfig(mode, level){
      const base = MODES[mode];
      // Board size (rows/cols) only grows with level in Hard mode. Easy and
      // Medium keep the same fixed grid forever - Easy in particular is for
      // children, so it should never quietly get harder by growing the board.
      const growth = mode === 'hard' ? Math.min(Math.floor((level - 1) / 4), 4) : 0;
      // Raised from the original (baseline 7/cap 12, floor 4/random-base 7)
      // so the smallest arrows the generator aims for are meaningfully
      // longer - tested empirically (see buildLayout's best-of-N search
      // below) to keep generation fast and stub arrows rare at this level.
      // Pushing this further starts fighting the generator: boards can't
      // always be perfectly tiled by long paths, so being too aggressive
      // here actually produces MORE small leftover arrows, not fewer.
      const maxSteps = Math.min(18, 10 + Math.floor((level - 1) / 4));
      const minArrowLength = Math.max(8, Math.min(maxSteps - 2, Math.floor(rng() * 3) + 10));
      return {
        rows: base.rows + growth,
        cols: base.cols + Math.floor(growth * 0.5),
        minArrowLength,
        maxSteps
      };
    }

    function applyLevelConfig(){
      seedLevelRng(gameMode, currentLevel);
      const cfg = getLevelConfig(gameMode, currentLevel);
      ROWS = cfg.rows;
      COLS = cfg.cols;
      MIN_ARROW_LENGTH = cfg.minArrowLength;
      MAX_STEPS = cfg.maxSteps;
    }

    function setMode(mode){
      gameMode = mode;
      applyLevelConfig();
  }


         function updateMenuStatus(){
            const modeLabel = gameMode.charAt(0).toUpperCase() + gameMode.slice(1);
            document.getElementById("levelBtn").textContent = "🏆 Level : " + currentLevel;
            document.getElementById("modeBtn").textContent = "Mode : " + modeLabel;
            const patternLabel = selectedPatternType === 'auto'
                ? 'Auto'
                : (PATTERN_DISPLAY_NAMES[selectedPatternType] || selectedPatternType);
            document.getElementById("patternBtn").textContent = "Pattern : " + patternLabel;
      }

         function showMenu(){

            document.getElementById("menuScreen").style.display = "flex";

            document.getElementById("resumeBtn").style.display =
                (gameStarted && progressMade) ? "block" : "none";

            updateMenuStatus();

      }

        function hideMenu(){

            document.getElementById("menuScreen").style.display="none";

            // Give the device/browser back button something to return from:
            // pressing back while playing should reopen the menu, not exit
            // the page. Only push once per "session" of play so repeated
            // pause/resume cycles don't stack up multiple history entries.
            if(!inGameHistoryState){
                history.pushState({screen:"game"}, "");
                inGameHistoryState = true;
            }

        }

        // Same as hideMenu(), but used when we're already reacting to a
        // history navigation (e.g. a 'forward' button restoring the 'game'
        // state) - so it must NOT push another history entry itself.
        function hideMenuWithoutHistoryPush(){
            document.getElementById("menuScreen").style.display="none";
        }

        document.getElementById("resumeBtn").onclick=()=>{

      hideMenu();

      layoutCanvas();

      // Covers the case where the level was actually already fully
      // cleared (last arrow tapped) before the app was closed/backgrounded,
      // so the save was written with zero arrows left but the "Level Pass"
      // flow never got to run. Safe no-op otherwise - checkLevelComplete()
      // returns immediately if any arrows remain.
      checkLevelComplete();

        };

       // Board generation for Hard mode can take up to ~1-2s (see buildLayout),
       // which would otherwise just look like a freeze. Showing this overlay
       // first, then deferring the actual work a tick later, guarantees the
       // browser paints the overlay before the heavy synchronous work starts
       // (a synchronous DOM update alone isn't guaranteed to paint before
       // more synchronous JS runs in the same tick).
       function showLoadingOverlay(){
           const old = document.getElementById("loadingOverlay");
           if(old) old.remove();

           const overlay = document.createElement("div");
           overlay.id = "loadingOverlay";
           overlay.style.cssText = `
               position:fixed;
               top:0; right:0; bottom:0; left:0;
               background:rgba(0,0,0,.45);
               display:flex;
               justify-content:center;
               align-items:center;
               z-index:100000;
           `;
           overlay.innerHTML = `
               <div style="
                   background:white;
                   padding:28px 34px;
                   border-radius:18px;
                   text-align:center;
                   box-shadow:0 15px 40px rgba(0,0,0,.25);
               ">
                   <div style="
                       width:36px;
                       height:36px;
                       border:4px solid #dfe3ee;
                       border-top-color:#2c2f4a;
                       border-radius:50%;
                       margin:0 auto 14px;
                       animation:loadingSpin 0.8s linear infinite;
                   "></div>
                   <div style="
                       font-size:15px;
                       font-weight:bold;
                       color:#2c2f4a;
                   ">
                       Loading your game…
                   </div>
               </div>
           `;
           document.body.appendChild(overlay);
       }

       function hideLoadingOverlay(){
           const el = document.getElementById("loadingOverlay");
           if(el) el.remove();
       }

       function startNewGame() {
              // Hard mode's generation is the slow case (see buildLayout) -
              // show a loading overlay and let the browser paint it before
              // doing the heavy synchronous work. Easy/Medium are near-
              // instant, so skip the overlay there entirely rather than
              // have it flash on and off for a few milliseconds.
              if(gameMode === 'hard'){
                  showLoadingOverlay();
                  setTimeout(() => {
                      startNewGameNow();
                      hideLoadingOverlay();
                  }, 30);
              } else {
                  startNewGameNow();
              }
          }

       function startNewGameNow() {

              applyLevelConfig();
              lives = 3;
              updateLives();
              updateLevelLabel();
              leaving = [];
              bumping = [];
              flashing = new Set();
              progressMade = false;
              const layout = buildLayout();
              grid = layout.grid;
              pathsMap = new Map(
                  layout.paths.map(p => [p.id, p])
              );
              levelArrowTotal = pathsMap.size;
              hardShuffleFlags = { at20: false, at60: false };
              updateShuffleWarning();
              // Grid line overlay is per-game only - start every new game
              // with it off, regardless of whether it was left on before.
              showGrid = false;
              if(typeof updateGridToggleBtn === 'function') updateGridToggleBtn();
              try{ localStorage.setItem(GRID_PREF_KEY, '0'); }catch(e){}
              resetZoomPan();
              layoutCanvas();

  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(rng()*(i+1));
      [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr;
  }

  function directionBetween(r0,c0,r1,c1){
    const dr = r1-r0, dc = c1-c0;
    for(const name of DIR_NAMES){
      const d = DIRS[name];
      if(d.dx===dc && d.dy===dr) return name;
    }
    return null;
  }

  // flips which end of a path is the head, without changing which cells it covers
  function flipPath(path){
    const cells = path.cells.slice().reverse();
    let headDir;
    if(cells.length >= 2){
      const [r0,c0] = cells[cells.length-2];
      const [r1,c1] = cells[cells.length-1];
      headDir = directionBetween(r0,c0,r1,c1);
    } else {
      headDir = OPPOSITE[path.headDir];
    }
    return {id: path.id, cells, headDir};
  }

  function edgeMatches(r,c,dir){
    if(dir==='up') return r===0;
    if(dir==='down') return r===ROWS-1;
    if(dir==='left') return c===0;
    if(dir==='right') return c===COLS-1;
    return false;
  }

  // ---- raw generation: partition the grid into bent, non-overlapping pipe paths ----
  // Cells are started in order of "most constrained first" (fewest free
  // neighbors) rather than pure random order. This means tight corners get
  // absorbed into a real, visible path while there's still room to grow,
  // instead of being left over at the end as tiny near-invisible 1-cell stubs.
  //
  // SOLVABILITY IS BUILT IN, NOT CHECKED AFTERWARDS:
  // a path's own body never blocks its own exit (see hasClearExit, which
  // ignores the path's own cells), so whether a given end of a path has a
  // clear line off the board depends ONLY on paths already committed to the
  // grid before it - never on anything placed later. So as each new path is
  // grown, we require that at least one of its two ends (head or tail)
  // already has a clear exit through everything placed so far, and commit
  // it using that end as the head. That guarantees the whole board is fully
  // clearable, in the reverse of build order, no matter what gets placed
  // around it afterwards - by construction, not by luck. On large/tight
  // boards (e.g. late Hard levels) this is what keeps generation from
  // repeatedly failing and dropping to the plain straight-line fallback.
  function rawGenerate(){
    const grid = Array.from({length: ROWS}, () => Array(COLS).fill(-1));
    const paths = [];

    function freeNeighborCount(r,c){
      let cnt = 0;
      for(const name of DIR_NAMES){
        const d = DIRS[name];
        const nr = r+d.dy, nc = c+d.dx;
        if(nr<0||nr>=ROWS||nc<0||nc>=COLS) continue;
        if(grid[nr][nc] === -1) cnt++;
      }
      return cnt;
    }

    function pickStartCell(){
      let bestCount = Infinity, bestCandidates = [];
      for(let r=0;r<ROWS;r++){
        for(let c=0;c<COLS;c++){
          if(grid[r][c] !== -1) continue;
          const cnt = freeNeighborCount(r,c);
          if(cnt < bestCount){ bestCount = cnt; bestCandidates = [[r,c]]; }
          else if(cnt === bestCount){ bestCandidates.push([r,c]); }
        }
      }
      if(bestCandidates.length === 0) return null;
      return bestCandidates[Math.floor(rng()*bestCandidates.length)];
    }

    // grow one candidate shape from (sr,sc) without touching the shared grid,
    // so a shape that doesn't pan out can be thrown away and retried with no
    // cleanup - only cells vs already-FINISHED paths are checked against grid.
    function growCandidate(sr, sc){
      const cells = [[sr,sc]];
      const occupied = new Set([sr+','+sc]);
      let lastDir = null;

      function touchesSelf(nr, nc, r, c){
        for(const name of DIR_NAMES){
          const d = DIRS[name];
          const ar = nr+d.dy, ac = nc+d.dx;
          if(ar===r && ac===c) continue; // the connecting cell we just came from - always fine
          if(occupied.has(ar+','+ac)) return true;
        }
        return false;
      }

      // How many of (r,c)'s orthogonal neighbours are still free, given a
      // hypothetical extra set of cells this path is about to occupy. Used
      // to spot moves that would wall a free cell in on every side.
      function freeNeighborCount(r, c, hypotheticalOccupied){
        let count = 0;
        for(const name of DIR_NAMES){
          const d = DIRS[name];
          const ar = r+d.dy, ac = c+d.dx;
          if(ar<0||ar>=ROWS||ac<0||ac>=COLS) continue;
          if(grid[ar][ac] !== -1) continue;
          if(hypotheticalOccupied.has(ar+','+ac)) continue;
          count++;
        }
        return count;
      }

      while(cells.length < MAX_STEPS){
        const [r,c] = cells[cells.length-1];

        const candidates = [];
        for(const name of DIR_NAMES){
          const d = DIRS[name];
          const nr = r+d.dy, nc = c+d.dx;
          if(nr<0||nr>=ROWS||nc<0||nc>=COLS) continue;
          if(grid[nr][nc] !== -1) continue;               // occupied by an earlier, finished path
          if(occupied.has(nr+','+nc)) continue;            // occupied by this same path
          if(lastDir && name === OPPOSITE[lastDir]) continue; // never backtrack
          if(touchesSelf(nr, nc, r, c)) continue;          // head/body must never touch itself
          let w = 3;                    // favour turning over continuing straight
          if(lastDir === name) w = 1;

          // Penalize moves that would wall off a neighbouring free cell with
          // no free neighbours of its own left - that cell would become an
          // isolated 1-cell island no path can ever reach, which is exactly
          // what turns into an unmergeable stub arrow later. Not an outright
          // ban (a rare board might have no other option), just a strong
          // discouragement so the generator routes around holes instead of
          // creating them.
          const hypothetical = new Set(occupied);
          hypothetical.add(nr+','+nc);
          for(const name2 of DIR_NAMES){
            const d2 = DIRS[name2];
            const ar = nr+d2.dy, ac = nc+d2.dx;
            if(ar<0||ar>=ROWS||ac<0||ac>=COLS) continue;
            if(grid[ar][ac] !== -1) continue;
            if(hypothetical.has(ar+','+ac)) continue;
            if(freeNeighborCount(ar, ac, hypothetical) === 0){
              w *= 0.08;
              break;
            }
          }

          candidates.push({name, d, nr, nc, w});
        }
        if(candidates.length === 0) break;
          // ---------- Minimum arrow length ----------
          // MIN_ARROW_LENGTH scales with level (see getLevelConfig / applyLevelConfig)

          // Don't allow the generator to stop until the minimum length is reached.
          if (cells.length >= MIN_ARROW_LENGTH) {

              // Lower base chance (and gentler growth) than before, so arrows
              // don't all bunch up right at MIN_ARROW_LENGTH - most paths
              // now grow noticeably past the minimum before stopping, which
              // keeps a single board from being dominated by short arrows.
              const stopChance = 0.05 + (cells.length - MIN_ARROW_LENGTH) * 0.03;

              if (rng() < stopChance)
                  break;
          }

        const totalW = candidates.reduce((s,x)=>s+x.w,0);
        let r2 = rng()*totalW;
        let pick = candidates[0];
        for(const cand of candidates){ if(r2 < cand.w){ pick = cand; break; } r2 -= cand.w; }

        cells.push([pick.nr, pick.nc]);
        occupied.add(pick.nr+','+pick.nc);
        lastDir = pick.name;
      }

      return {cells, lastDir};
    }

    // true if a straight line off the board from this end is clear of every
    // path already committed to the grid (a path's own cells never count)
    function hasClearExit(cells, dir){
      const [r,c] = cells[cells.length-1];
      const d = DIRS[dir];
      let rr=r+d.dy, cc=c+d.dx;
      while(rr>=0 && rr<ROWS && cc>=0 && cc<COLS){
        if(grid[rr][cc] !== -1) return false;
        rr+=d.dy; cc+=d.dx;
      }
      return true;
    }

    let start;
    while((start = pickStartCell())){
      const [sr,sc] = start;
      let best = null;

      for(let attempt=0; attempt<40 && !best; attempt++){
        const {cells, lastDir} = growCandidate(sr, sc);

        if(cells.length >= 2){
          const [r0,c0] = cells[cells.length-2];
          const [r1,c1] = cells[cells.length-1];
          const tailEndDir = lastDir || directionBetween(r0,c0,r1,c1);
          if(tailEndDir && hasClearExit(cells, tailEndDir)){
            best = {cells, headDir: tailEndDir};
            break;
          }
          const flippedCells = cells.slice().reverse();
          const [fr0,fc0] = flippedCells[flippedCells.length-2];
          const [fr1,fc1] = flippedCells[flippedCells.length-1];
          const headEndDir = directionBetween(fr0,fc0,fr1,fc1);
          if(headEndDir && hasClearExit(flippedCells, headEndDir)){
            best = {cells: flippedCells, headDir: headEndDir};
            break;
          }
        } else {
          // single-cell stub: any of the 4 directions can serve as its head
          for(const name of shuffle(DIR_NAMES.slice())){

  function isValidChain(cells){

      const [r0,c0] = cells[i-1], [r1,c1] = cells[i];
      const dr = Math.abs(r1-r0), dc = Math.abs(c1-c0);
      if(!((dr===1&&dc===0)||(dr===0&&dc===1))) return false;
    }
    const seen = new Set(cells.map(([r,c]) => r+','+c));
    if(seen.size !== cells.length) return false;
    for(let i=0;i<cells.length;i++){
      const [r,c] = cells[i];
      for(const name of DIR_NAMES){
        const d = DIRS[name];
        const ar = r+d.dy, ac = c+d.dx;
        const idx = cells.findIndex(([rr,cc]) => rr===ar && cc===ac);

    for(const attachEnd of [0, stub.cells.length-1]){
      const [ar,ac] = stub.cells[attachEnd];
      for(const name of DIR_NAMES){
        const d = DIRS[name];

        if(nr<0||nr>=ROWS||nc<0||nc>=COLS) continue;
        const neighborId = grid[nr][nc];
        if(neighborId === -1 || neighborId === stub.id) continue;
        const neighborPath = byId.get(neighborId);
        if(!neighborPath) continue;

        const tail = neighborPath.cells[0];
        const head = neighborPath.cells[neighborPath.cells.length-1];

        // Check the HEAD first. When the neighbour is itself a single-cell
        // stub, its tail and head are the same cell, so attaching there
        // always moves what becomes the new head end and headDir MUST be
        // recomputed. Checking tail first (the old order) mistook that
        // case for a tail-only attach and left the stale headDir in
        // place, which is what produced a misplaced/misaligned arrowhead
        // on some boards (e.g. Hard level 2).
        if(head[0]===nr && head[1]===nc){

          const extension = attachEnd === 0 ? stub.cells : stub.cells.slice().reverse();
          const newCells = neighborPath.cells.concat(extension);
          if(newCells.length > MAX_STEPS + 4) continue;
          if(!isValidChain(newCells)) continue;

          const [r0,c0] = newCells[newCells.length-2];
          const [r1,c1] = newCells[newCells.length-1];
          const newHeadDir = directionBetween(r0,c0,r1,c1);
          if(!newHeadDir) continue;

          for(const [cr,cc] of stub.cells) grid[cr][cc] = neighborPath.id;
          neighborPath.cells = newCells;
          neighborPath.headDir = newHeadDir;
          byId.delete(stub.id);
          return true;

        } else if(tail[0]===nr && tail[1]===nc){

          const newCells = attachEnd === 0
            ? stub.cells.slice().reverse().concat(neighborPath.cells)
            : stub.cells.slice().concat(neighborPath.cells);
          if(newCells.length > MAX_STEPS + 4) continue;
          if(!isValidChain(newCells)) continue;

          for(const [cr,cc] of stub.cells) grid[cr][cc] = neighborPath.id;
          neighborPath.cells = newCells;
          byId.delete(stub.id);
          return true;
        }

  // graft as many too-short stubs as possible onto neighbouring paths
  function mergeStubs(grid, paths){

      for(const stub of stubs){

      if(a === protectedId) flipId = b;
      else if(b === protectedId) flipId = a;

      byId.set(flipId, flipPath(byId.get(flipId)));

    for(let i=0;i<paths.length;i++){
      const flipped = flipPath(paths[i]);
      const [r,c] = flipped.cells[flipped.cells.length-1];

function buildFallbackLayout(){

    for(let r=0; r<ROWS; r++){

        // can block it regardless of direction - alternate so the board
        // doesn't degenerate into every single arrow pointing the same way
        const headDir = (r % 2 === 0) ? 'right' : 'left';

        } else {
            for(let c=COLS-1; c>=0; c--){ cells.push([r,c]); grid[r][c] = r; }
        }
        paths.push({id: r, cells, headDir});
    }
    return {grid, paths, clearId: 0};
