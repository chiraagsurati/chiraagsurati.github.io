<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
 <!-- Game icon -->
    <link rel="icon" type="image/png" href="icon.png">
<title>Arrow</title>
<style>
/* ===========================
   MAIN MENU
=========================== */
#menuScreen{
    position:fixed;
    top:0;
    right:0;
    bottom:0;
    left:0;
    background:#d9d8e2;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}
.menu-box{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
}
.menu-box h1{
    margin:0 0 26px;
    color:#2c2f4a;
    font-size:32px;
    font-weight:900;
    letter-spacing:5px;
}
.menu-box button{
    background:#ffffff;
    border:none;
    border-radius:16px;

    color:#2c2f4a;

    font-size:22px;
    font-weight:700;

    cursor:pointer;

    padding:14px 34px;
    min-width:264px;

    box-shadow:0 4px 10px rgba(44,47,74,0.15);
    transition:.15s;

}
.menu-box button:hover{
    background:#4d63ff;
    color:#ffffff;
    box-shadow:0 6px 14px rgba(77,99,255,0.35);
    transform:translateY(-2px);

}
.menu-box button:active{
    transform:translateY(0);
    box-shadow:0 2px 6px rgba(44,47,74,0.2);
}
  :root{
    --bg:#d9d8e2;
    --board-bg:#dedde6;
    --pipe:#2c2f4a;
    --dot: rgba(44,47,74,0.28);
    --ad-banner-height: 50px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background: var(--bg);
    overflow:hidden;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    touch-action: none;
  }
  /* ===========================
     AD BANNER SLOTS (placeholders)
     Fixed-position strips sized for a standard 320x50 banner ad.
     Real ad SDK code will be merged in here later - see the
     loadBannerAds() JS function further down for the integration
     point. If the eventual SDK manages its own native overlay view
     instead of DOM content, the inner placeholder text can simply be
     left empty; the div still reserves the on-screen space for it.
  =========================== */
  .adBanner{
    position:fixed;
    left:0; right:0;
    height:var(--ad-banner-height);
    z-index:500;
    user-select:none;
  }
  #adBannerTop{ top:0; }
  #adBannerBottom{ bottom:0; }
  #wrap{
    width:100%; min-height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px;
    overflow-y:auto;
    padding:calc(var(--ad-banner-height) + 10px) 0;
  }
  #title{
    color:#2c2f4a;
    letter-spacing: 10px;
    font-weight:800;
    font-size: 26px;
    user-select:none;
  }
#boardViewport{
    position:relative;
    overflow:hidden;
    border-radius:18px;
    touch-action:none;
}
#boardFrame{
    position:relative;
    padding:10px;
    border-radius:18px;
    background:var(--board-bg);
    box-shadow:
        0 0 0 1px rgba(0,0,0,.03) inset,
        0 16px 36px rgba(30,25,60,.18);
    transform-origin: 0 0;
    transition: transform .12s ease-out;
    will-change: transform;
}
#boardFrame.no-transition{
    transition: none;
}
  #board{
    display:block;
    border-radius: 10px;
  }
.zoomControls{
    display:flex;
    flex-direction:row;
    justify-content:center;
    align-items:center;
    gap:8px;
    z-index:50;
}
.zoomBtn{
    width:24px;
    height:24px;
    border:none;
    border-radius:7px;
    background:#2c2f4a;
    color:#fff;
    font-size:13px;
    font-weight:bold;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.25);
    opacity:.88;
    user-select:none;
    transition:.15s;
}
.zoomBtn:active{
    transform:scale(.92);
}
#zoomResetBtn{
    width:auto;
    padding:0 8px;
    font-size:9px;
    letter-spacing:.3px;
}
.zoomBtn.active{
    background:#4d63ff;
    box-shadow:0 2px 8px rgba(77,99,255,.45);
}
#topBar{
    width:fit-content;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    margin:0 auto 12px;
}

#lives{

    color:#e53935;

    font-size:20px;

    font-weight:bold;

    letter-spacing:3px;

}

#levelLabel{
    position:absolute;
    left:10px;
    top:50%;
    transform:translateY(-50%);

    color:#2c2f4a;
    font-size:13px;
    font-weight:800;
    letter-spacing:1px;
    white-space:nowrap;
}

#shuffleCountPopup{
    /* Centered over #boardViewport (not #boardFrame, so it's unaffected
       by board zoom/pan). Hidden by default; JS adds .show plus a fresh
       number each time and the CSS animation handles the pop-in/fade-out
       and hiding itself again afterwards - no display toggling needed. */
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:84px;
    height:84px;
    border-radius:50%;
    background:rgba(44,47,74,0.55);
    color:#fff;
    font-size:38px;
    font-weight:800;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    opacity:0;
    z-index:5;
}
#shuffleCountPopup.show{
    animation: shuffleCountPop 0.7s ease-out forwards;
}
@keyframes shuffleCountPop{
    0%   { opacity:0;   transform:translate(-50%,-50%) scale(0.6); }
    15%  { opacity:1;   transform:translate(-50%,-50%) scale(1.08); }
    30%  { opacity:1;   transform:translate(-50%,-50%) scale(1); }
    75%  { opacity:1;   transform:translate(-50%,-50%) scale(1); }
    100% { opacity:0;   transform:translate(-50%,-50%) scale(0.9); }
}

#menuBtn{
    position:absolute;
    top:50%;
    right:10px;
    transform:translateY(-50%);

    width:30px;
    height:30px;

    border:none;
    border-radius:8px;

    background:#2c2f4a;
    color:#fff;

    font-size:15px;
    font-weight:bold;

    display:flex;
    justify-content:center;
    align-items:center;

    cursor:pointer;

    z-index:100;

    box-shadow:0 2px 8px rgba(0,0,0,.25);

    transition:.15s;
}
#menuBtn:hover{
    transform:translateY(-50%) scale(1.05);
}
#menuBtn:active{
    transform:translateY(-50%) scale(.95);
}
@keyframes loadingSpin{
    to{ transform:rotate(360deg); }
}
@keyframes loadingArrowPop{
    0%{ opacity:0; transform:scale(0.3) rotate(var(--rot)); }
    30%{ opacity:1; transform:scale(1.15) rotate(var(--rot)); }
    45%,70%{ opacity:1; transform:scale(1) rotate(var(--rot)); }
    100%{ opacity:0; transform:scale(0.4) rotate(var(--rot)); }
}
</style>
</head>
<body>
<!-- Required for Cordova: this is what wires up window.cordova, navigator.app,
     and the native 'backbutton' event. Without this tag none of the back/exit
     handling further down in this file can ever fire - Android's default
     back-button behavior (instantly closing the app) takes over instead.
     Cordova generates this file automatically at build time into
     platforms/android/app/src/main/assets/www/cordova.js, so this relative
     path just needs to match where index.html itself ends up in that build. -->
<script src="cordova.js"></script>
<div id="adBannerTop" class="adBanner"></div>
<div id="adBannerBottom" class="adBanner"></div>
<div id="wrap">
  <div id="topBar">
    <div id="levelLabel">LEVEL 1</div>
    <div id="lives">
        ❤ ❤ ❤
    </div>
    <button id="menuBtn">☰</button>
</div>
  <div id="boardViewport">
    <div id="boardFrame">
          <canvas id="board"></canvas>
    </div>
    <!-- Shuffle countdown: a big translucent number that pops up centered
         over the board and fades out on its own, replacing the old
         top-bar "Shuffle in N" text. Lives outside #boardFrame (which is
         what zoom/pan transforms) so it always stays dead-center of the
         visible board regardless of zoom/pan state. -->
    <div id="shuffleCountPopup"></div>
  </div>
  <div class="zoomControls">
    <button id="zoomInBtn" class="zoomBtn" title="Zoom in">+</button>
    <button id="zoomOutBtn" class="zoomBtn" title="Zoom out">−</button>
    <button id="zoomResetBtn" class="zoomBtn" title="Reset zoom">100%</button>
    <button id="gridToggleBtn" class="zoomBtn" title="Show arrow path grid">▦</button>
  </div>

  </div>
</div>

 <div id="menuScreen">
    <div class="menu-box">

        <h1>ARROW PUZZLE</h1>

        <button id="resumeBtn">▶ Resume</button>

        <button id="newBtn"> New Game</button>

        <button id="levelBtn">🏆 Level</button>

        <button id="modeBtn">Mode</button>

        <button id="patternBtn">Pattern</button>

        <button id="muteBtn">🔊 Sound</button>

        <!-- Report Bug temporarily disabled - see the matching commented-out
             handler below for reportBugBtn -->
        <!-- <button id="reportBugBtn">🐞 Report Bug</button> -->

        <button id="exitBtn">❌ Exit</button>
     </div>
</div>


<script>
(function(){
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const boardViewport = document.getElementById('boardViewport');
  const boardFrame = document.getElementById('boardFrame');

  // ---- Sound effects ----
  const ARROW_VOLUME = 0.2;      // 0.0 (silent) - 1.0 (full volume)
  const LEVEL_PASS_VOLUME = 0.5;
  const arrowSound = new Audio('Arrow.mp3');
  const levelPassSound = new Audio('LevelPass.mp3');

  const errorSound = new Audio('Error.mp3');
  const gameOverSound = new Audio('GameOver.mp3');
  errorSound.volume = 0.3;
  gameOverSound.volume = 0.5;

  arrowSound.volume = ARROW_VOLUME;
  levelPassSound.volume = LEVEL_PASS_VOLUME;

    arrowSound.preload = 'auto';
    levelPassSound.preload = 'auto';
    errorSound.preload = 'auto';
    gameOverSound.preload = 'auto';

    arrowSound.load();
    levelPassSound.load();
    errorSound.load();
    gameOverSound.load();

  // Log load failures early (bad path/missing file/unsupported format) -
  // these show up in chrome://inspect when debugging the Cordova WebView.
  [arrowSound, levelPassSound, errorSound, gameOverSound].forEach(s => {
    s.addEventListener('error', () => {
      console.warn('Failed to load sound:', s.src, s.error);
    });
  });

  // Mobile WebViews (Cordova/Capacitor included) commonly refuse the very
  // first programmatic .play() call unless it happens inside a "real" user
  // gesture - and even then some WebView versions are stricter than desktop
  // browsers about what counts. The standard fix is to "unlock" each
  // <audio> element with a silent play+pause during the first touch the
  // user makes anywhere on the page; every .play() call after that unlock
  // is then allowed to go through normally.
  let audioUnlocked = false;
  function unlockAudio(){
    if(audioUnlocked) return;
    audioUnlocked = true;
    [arrowSound, levelPassSound].forEach(s => {
      const p = s.play();
      if(p && p.catch){
        p.then(() => { s.pause(); s.currentTime = 0; })
         .catch(err => console.warn('Audio unlock failed:', s.src, err));
      }
    });
    document.removeEventListener('touchstart', unlockAudio);
    document.removeEventListener('pointerdown', unlockAudio);
  }
  document.addEventListener('touchstart', unlockAudio, {once:true});
  document.addEventListener('pointerdown', unlockAudio, {once:true});

  function playSound(sound){
    // rewind so rapid repeats (e.g. clearing several arrows quickly) don't
    // get cut off by a still-playing previous instance
    try{
      sound.currentTime = 0;
      sound.play().catch(err => console.warn('Sound blocked/failed:', sound.src, err));
    }catch(e){ console.warn('Sound error:', sound.src, e); }
  }

      // ---- Config (tweak freely later) ----
    let COLS = 10;
    let ROWS = 15;
    let gameMode = "medium";
    const MODES = {
        easy: {
            rows: 8,
            cols: 6
        },
        medium: {
            rows: 12,
            cols: 8
        },
        hard: {
            rows: 14,
            cols: 10
        }
    };
  const PIPE_COLOR = '#2c2f4a';
  let MAX_STEPS = 13;            // hard cap on how many cells one path can cover (scales with level)
  let MIN_ARROW_LENGTH = 15;      // min cells per path (scales with level)
  let lives = 3;
  // While a mode checkpoint reshuffle is computing (can take a noticeable moment
  // on a big board) the main thread is blocked, so the OS/browser queues
  // up any taps that happen during that freeze and delivers them the
  // instant it's free again - by which point the board has changed under
  // the player's finger. handleTap() ignores anything that arrives before
  // this timestamp so those stray queued taps can't land on the wrong,
  // just-reshuffled arrow and cost a life.
  let inputBlockedUntil = 0;
  let gameStarted = false;
  let progressMade = false; // true once at least one arrow has actually been cleared this level
  let currentLevel = 1;
  // Timestamp (performance.now()) the current level actually became
  // playable - set in startNewGameNow(). Used to compute elapsed time on
  // level clear for the personal-best tracker below. Not persisted across
  // an app restart mid-level, so resuming after fully closing the app
  // simply skips the time comparison for that one clear (levelStartTime
  // stays null) rather than showing a bogus/inflated time.
  let levelStartTime = null;
  // Tracks whether we've pushed an extra 'game' entry onto the browser history
  // stack on top of the base 'menu' entry, so the device/browser back button
  // returns to the menu instead of exiting the page while playing.
  let inGameHistoryState = false;
  // Zoom/pan state for the board (lets players zoom in to see crowded
  // arrows clearly and avoid mis-tapping the wrong pipe).
  let boardZoom = 1, boardPanX = 0, boardPanY = 0;
  const MIN_ZOOM = 1, MAX_ZOOM = 2.6;
  let maxUnlockedLevel = { easy: 1, medium: 1, hard: 1 };
  // Arrow texture pattern selection. 'auto' follows the level-based tier
  // (existing behaviour); any other value pins the board to that specific
  // pattern regardless of level, until the player switches back to Auto
  // Select. unlockedPatternTiers is how many ARROW_PATTERN_TYPES entries
  // (from the start) are available to pick in the Pattern menu - it only
  // ever grows, tracking the furthest tier reached in any mode.
  let selectedPatternType = 'auto';
  let unlockedPatternTiers = 1;
  // Whether the arrow-path grid overlay is on (toggled via the Grid button
  // beside the zoom controls); remembered across sessions like the mute
  // preference.
  let showGrid = false;
  // Total number of level-clear events (all modes, replays included) since
  // this counter was introduced - drives the review-prompt timing below.
  let totalLevelsCleared = 0;

  // ---- persistence ----
  const PROGRESS_KEY = 'arrowPuzzleProgress';
  const SAVE_KEY = 'arrowPuzzleSave';
  const GRID_PREF_KEY = 'arrowPuzzleShowGrid';
  const REVIEW_KEY = 'arrowPuzzleReviewPrompt';

  // ---- Daily play streak ----
  const STREAK_KEY = 'arrowPuzzleStreak';

  function getLocalDateString(d){
    // Local calendar date (not UTC), so the streak lines up with whatever
    // day it actually is for the player, not wherever the server clock is.
    const yr = d.getFullYear();
    const mo = String(d.getMonth() + 1).padStart(2, '0');
    const dy = String(d.getDate()).padStart(2, '0');
    return `${yr}-${mo}-${dy}`;
  }

  // Called once per app boot. Bumps the streak if the player was last here
  // yesterday, resets to 1 if they skipped a day (or this is day one),
  // and leaves it alone if they've already been counted today. Shows a
  // small toast on 2+ day streaks - a fresh streak of 1 isn't worth
  // celebrating yet.
  function updateStreakAndMaybeToast(){
    let state = { count: 0, lastPlayedDate: null };
    try{
        const raw = localStorage.getItem(STREAK_KEY);
        if(raw) state = JSON.parse(raw);
    }catch(e){}

    const today = getLocalDateString(new Date());
    if(state.lastPlayedDate === today) return; // already counted today

    const yesterday = getLocalDateString(new Date(Date.now() - 86400000));
    state.count = (state.lastPlayedDate === yesterday) ? (state.count || 0) + 1 : 1;
    state.lastPlayedDate = today;

    try{ localStorage.setItem(STREAK_KEY, JSON.stringify(state)); }catch(e){}

    if(state.count >= 2) showStreakToast(state.count);
  }

  function showStreakToast(count){
    const old = document.getElementById("streakToast");
    if(old) old.remove();

    const toast = document.createElement("div");
    toast.id = "streakToast";
    toast.style.cssText = `
        position:fixed;
        top:16px;
        left:50%;
        transform:translateX(-50%) translateY(-20px);
        background:#2c2f4a;
        color:#fff;
        padding:10px 18px;
        border-radius:30px;
        font-size:14px;
        font-weight:700;
        box-shadow:0 8px 20px rgba(0,0,0,.25);
        z-index:999999;
        opacity:0;
        transition:opacity .35s ease, transform .35s ease;
        pointer-events:none;
    `;
    toast.textContent = `🔥 ${count} day streak!`;
    document.body.appendChild(toast);

    requestAnimationFrame(() => {
        toast.style.opacity = '1';
        toast.style.transform = 'translateX(-50%) translateY(0)';
    });

    setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(-50%) translateY(-20px)';
        setTimeout(() => toast.remove(), 400);
    }, 2600);
  }


  // ---- Personal-best level times ----
  const BEST_TIMES_KEY = 'arrowPuzzleBestTimes';
  // { "easy:1": 12345, "hard:7": 98765, ... } - elapsed ms from when a
  // level became playable to when its last arrow cleared.
  let bestTimes = {};

  function loadBestTimes(){
    try{
      const raw = localStorage.getItem(BEST_TIMES_KEY);
      if(raw) bestTimes = JSON.parse(raw) || {};
    }catch(e){ bestTimes = {}; }
  }

  function saveBestTimes(){
    try{ localStorage.setItem(BEST_TIMES_KEY, JSON.stringify(bestTimes)); }catch(e){}
  }

  function getBestTimeKey(mode, level){
    return mode + ':' + level;
  }

  // ms -> "12.4s" under a minute, "1:05" for a minute or more.
  function formatElapsedTime(ms){
    const totalSeconds = ms / 1000;
    if(totalSeconds < 60) return totalSeconds.toFixed(1) + 's';
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = Math.round(totalSeconds % 60);
    return minutes + ':' + String(seconds).padStart(2, '0');
  }

  // Records the just-finished level's time if levelStartTime is available,
  // updates the best if it's an improvement, and returns a small HTML
  // snippet to show under "Starting next level..." - or '' if there's
  // nothing to show (e.g. app was restarted mid-level so there's no
  // reliable start timestamp for this particular clear).
  function recordLevelTimeAndGetHtml(mode, level){
    if(levelStartTime == null) return '';

    const elapsed = performance.now() - levelStartTime;
    levelStartTime = null;
    if(elapsed <= 0 || !isFinite(elapsed)) return '';

    const key = getBestTimeKey(mode, level);
    const prevBest = bestTimes[key];
    const isNewBest = prevBest == null || elapsed < prevBest;
    if(isNewBest){
        bestTimes[key] = elapsed;
        saveBestTimes();
    }

    const timeStr = formatElapsedTime(elapsed);
    const bestStr = formatElapsedTime(isNewBest ? elapsed : prevBest);

    return `<div style="font-size:12px; font-weight:normal; opacity:0.85; margin-top:6px;">
        ⏱ ${timeStr}${isNewBest
            ? ' <span style="color:#ffb020; font-weight:700;">New Best!</span>'
            : ` (Best: ${bestStr})`}
    </div>`;
  }

  const PLAY_STORE_URL = 'https://play.google.com/store/apps/details?id=com.chiraagsurati.arrowpuzzle';

  // How many levels after the trigger point before asking again if the
  // player taps "Maybe Later" instead of rating or declining outright.
  const REVIEW_SNOOZE_LEVELS = 10;

  // { nextPromptAtLevel, dismissedForever } - persisted so the target level
  // and the "never ask again" choice survive app restarts. Populated by
  // initReviewPromptState() once totalLevelsCleared is known at boot.
  let reviewPromptState = null;

  function loadReviewPromptState(){
    try{
      const raw = localStorage.getItem(REVIEW_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return null;
  }

  function saveReviewPromptState(){
    try{ localStorage.setItem(REVIEW_KEY, JSON.stringify(reviewPromptState)); }catch(e){}
  }

  // Decides WHEN to first ask for a rating. Existing players (anyone who
  // already had save data before this feature shipped) get asked sooner -
  // after 5-10 more levels - since they've already proven they like the
  // game. Brand new installs get asked later, after 10-20 levels, so the
  // prompt doesn't interrupt someone still deciding if they enjoy it.
  // Runs at most once per install: after the first run it just loads the
  // previously-decided state back from storage.
  function initReviewPromptState(){
    const existing = loadReviewPromptState();
    if(existing){
      reviewPromptState = existing;
      return;
    }

    const alreadyHasProgress = ['easy','medium','hard'].some(m => (maxUnlockedLevel[m] || 1) > 1)
        || localStorage.getItem(SAVE_KEY);

    const randomBetween = (min, max) => min + Math.floor(Math.random() * (max - min + 1));
    const levelsFromNow = alreadyHasProgress ? randomBetween(5, 10) : randomBetween(10, 20);

    reviewPromptState = {
        nextPromptAtLevel: totalLevelsCleared + levelsFromNow,
        dismissedForever: false
    };
    saveReviewPromptState();
  }

  // Opens the Play Store listing. https:// links are already covered by
  // this app's <allow-intent> whitelist in config.xml, so this hands off
  // to the Play Store app (or browser) externally rather than navigating
  // the game's own WebView away from the game.
  function openPlayStoreForReview(){
    window.location.href = PLAY_STORE_URL;
  }

  // ---- "New version available" checker ----
  // Cordova apps have no built-in way to learn a new version was published
  // - unlike a native app using Play's In-App Update API, there's no
  // signal from the OS. This works around that with a tiny version.json
  // file hosted externally (e.g. on GitHub Pages/raw.githubusercontent.com)
  // that gets bumped by hand alongside each Play Store release. The app
  // just polls it and compares against its own baked-in version.
  //
  // IMPORTANT: bump APP_VERSION here to match config.xml's version="..."
  // on every release, and update the hosted JSON's "latestVersion" to the
  // same value AFTER the new build is live on Play Store (not before -
  // otherwise players get nagged to update before the update even exists
  // on the Store yet).
  const APP_VERSION = '2.0.4';

  // Replace with wherever you actually host this file - e.g. a raw GitHub
  // URL to a version.json committed in your own repo:
  //   https://raw.githubusercontent.com/<you>/<repo>/main/version.json
  // File contents should look like:
  //   { "latestVersion": "2.0.5", "message": "New patterns and fixes!" }
  const VERSION_CHECK_URL = 'https://raw.githubusercontent.com/chiraagsurati/arrow-puzzle-meta/main/version.json';

  const UPDATE_NOTIFIED_KEY = 'arrowPuzzleUpdateNotifiedVersion';
  const UPDATE_CHECK_COOLDOWN_KEY = 'arrowPuzzleUpdateCheckLast';
  const UPDATE_CHECK_COOLDOWN_MS = 6 * 60 * 60 * 1000; // don't hit the JSON more than once per 6h

  // Simple numeric "x.y.z" comparison - returns true if `a` is newer than `b`.
  function isVersionNewer(a, b){
    const pa = String(a).split('.').map(n => parseInt(n, 10) || 0);
    const pb = String(b).split('.').map(n => parseInt(n, 10) || 0);
    const len = Math.max(pa.length, pb.length);
    for(let i = 0; i < len; i++){
      const va = pa[i] || 0, vb = pb[i] || 0;
      if(va > vb) return true;
      if(va < vb) return false;
    }
    return false;
  }

  function maybeShowAnnouncement(data, updatePopupShown){

  function checkForUpdate(){
    const now = Date.now();

    fetch(VERSION_CHECK_URL, { cache: 'no-store' })
        .then(res => res.json())
        .then(data => {
            localStorage.setItem(UPDATE_CHECK_COOLDOWN_KEY, String(now));
            if(!data) return;

            let updatePopupShown = false;
            if(typeof data.latestVersion === 'string' && isVersionNewer(data.latestVersion, APP_VERSION)){
                showUpdateAvailablePopup(data.message);
                updatePopupShown = true;

                // Only fire the tray notification once per newly-seen version,
                // not every single time the popup happens to show again.
                const alreadyNotified = localStorage.getItem(UPDATE_NOTIFIED_KEY);
                if(alreadyNotified !== data.latestVersion){
                    fireUpdateSystemNotification(data.latestVersion, data.message);
                    localStorage.setItem(UPDATE_NOTIFIED_KEY, data.latestVersion);
                }
            }

            maybeShowAnnouncement(data, updatePopupShown);
        })
        .catch(err => {
            console.warn('[update check] failed:', err);
        });
  }

  function loadGameState(){

      // on a total it was never measured against.
      if(typeof data.levelArrowTotal === 'number' && typeof data.shuffleCheckpointIndex === 'number'){
          levelArrowTotal = data.levelArrowTotal;

      } else if(typeof data.levelArrowTotal === 'number' && data.hardShuffleFlags && gameMode === 'hard') {
          // Compatibility for older Hard-mode saves that stored two boolean
          // flags instead of the next checkpoint index.
          levelArrowTotal = data.levelArrowTotal;
          shuffleCheckpointIndex = data.hardShuffleFlags.at60 ? 2 : (data.hardShuffleFlags.at20 ? 1 : 0);
      } else {
          levelArrowTotal = pathsMap.size;

  const DIRS = {
    right: {dx:1, dy:0},
    down:  {dx:0, dy:1},
    left:  {dx:-1,dy:0},
    up:    {dx:0, dy:-1},
  };
  const DIR_NAMES = Object.keys(DIRS);
  const OPPOSITE = {right:'left', left:'right', up:'down', down:'up'};

  // ---- Deterministic per-level randomness ----
  // Every level (identified by mode+level number) must always generate the
  // exact same board, every single time it's played - whether that's
  // replaying it back-to-back or coming back to it after 10 other levels.
  // So instead of the raw Math.random(), all generation code below draws
  // from `rng()`, a seeded PRNG that gets reseeded from (mode, level)
  // right before a layout is built. Same seed in -> same board out, always.

  // simple string hash -> 32-bit seed (cyrb53-lite)
  function hashSeed(str){
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for(let i=0;i<str.length;i++){
      const ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1>>>16), 2246822507) ^ Math.imul(h2 ^ (h2>>>13), 3266489909);
    return (h1 >>> 0);
  }

  // mulberry32: small, fast, deterministic PRNG
  function mulberry32(seed){
    let a = seed >>> 0;
    return function(){
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  let rng = Math.random; // replaced by seedLevelRng() before every generation

  function seedLevelRng(mode, level){
    rng = mulberry32(hashSeed(mode + ':' + level));
  }

    // ---- Level difficulty scaling ----
    function getLevelConfig(mode, level){
      const base = MODES[mode];
      // Board size (rows/cols) only grows with level in Hard mode. Easy and
      // Medium keep the same fixed grid forever - Easy in particular is for
      // children, so it should never quietly get harder by growing the board.
      const growth = mode === 'hard' ? Math.min(Math.floor((level - 1) / 4), 4) : 0;
      // Raised from the original (baseline 7/cap 12, floor 4/random-base 7)
      // so the smallest arrows the generator aims for are meaningfully
      // longer - tested empirically (see buildLayout's best-of-N search
      // below) to keep generation fast and stub arrows rare at this level.
      // Pushing this further starts fighting the generator: boards can't
      // always be perfectly tiled by long paths, so being too aggressive
      // here actually produces MORE small leftover arrows, not fewer (this
      // was tested directly: tripling this value not only made generation
      // ~5x slower on Hard, it *still* left several 1-cell stub arrows on
      // the board, because those come from isolated leftover cells during
      // generation - a separate problem from this target, fixed instead in
      // growCandidate's isolation-avoidance weighting and buildLayout's
      // best-of-N search below).
      const maxSteps = Math.min(18, 10 + Math.floor((level - 1) / 4));
      const minArrowLength = Math.max(8, Math.min(maxSteps - 2, Math.floor(rng() * 3) + 10));
      return {
        rows: base.rows + growth,
        cols: base.cols + Math.floor(growth * 0.5),
        minArrowLength,
        maxSteps
      };
    }

    function applyLevelConfig(){
      seedLevelRng(gameMode, currentLevel);
      const cfg = getLevelConfig(gameMode, currentLevel);
      ROWS = cfg.rows;
      COLS = cfg.cols;
      MIN_ARROW_LENGTH = cfg.minArrowLength;
      MAX_STEPS = cfg.maxSteps;
    }

    function setMode(mode){
      gameMode = mode;
      applyLevelConfig();
  }

        const SHUFFLE_WARNING_THRESHOLD = 3;
        function updateShuffleWarning(){

            if(nextThreshold == null || levelArrowTotal <= 0){
                el.classList.remove('show');
                return;
            }
            const neededCleared = Math.ceil(nextThreshold * levelArrowTotal);
            const clearedSoFar = levelArrowTotal - pathsMap.size;
            const remaining = Math.max(0, neededCleared - clearedSoFar);
            if(remaining > SHUFFLE_WARNING_THRESHOLD || remaining <= 0){
                el.classList.remove('show');
                return;
            }
            el.textContent = remaining;
            // Restart the pop/fade animation every call (even for a repeat
            // number) by removing the class, forcing a reflow, then adding
            // it back - otherwise the browser would just no-op on an
            // already-applied animation class and the popup wouldn't
            // re-appear for the next countdown tick.
            el.classList.remove('show');
            void el.offsetWidth;
            el.classList.add('show');
        }

  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(rng()*(i+1));
      [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr;
  }

  function directionBetween(r0,c0,r1,c1){
    const dr = r1-r0, dc = c1-c0;
    for(const name of DIR_NAMES){
      const d = DIRS[name];
      if(d.dx===dc && d.dy===dr) return name;
    }
    return null;
  }

  // flips which end of a path is the head, without changing which cells it covers
  function flipPath(path){
    const cells = path.cells.slice().reverse();
    let headDir;
    if(cells.length >= 2){
      const [r0,c0] = cells[cells.length-2];
      const [r1,c1] = cells[cells.length-1];
      headDir = directionBetween(r0,c0,r1,c1);
    } else {
      headDir = OPPOSITE[path.headDir];
    }
    return {id: path.id, cells, headDir};
  }

  function edgeMatches(r,c,dir){
    if(dir==='up') return r===0;
    if(dir==='down') return r===ROWS-1;
    if(dir==='left') return c===0;
    if(dir==='right') return c===COLS-1;
    return false;
  }

  // ---- raw generation: partition the grid into bent, non-overlapping pipe paths ----
  // Cells are started in order of "most constrained first" (fewest free
  // neighbors) rather than pure random order. This means tight corners get
  // absorbed into a real, visible path while there's still room to grow,
  // instead of being left over at the end as tiny near-invisible 1-cell stubs.
  //
  // SOLVABILITY IS BUILT IN, NOT CHECKED AFTERWARDS:
  // a path's own body never blocks its own exit (see hasClearExit, which
  // ignores the path's own cells), so whether a given end of a path has a
  // clear line off the board depends ONLY on paths already committed to the
  // grid before it - never on anything placed later. So as each new path is
  // grown, we require that at least one of its two ends (head or tail)
  // already has a clear exit through everything placed so far, and commit
  // it using that end as the head. That guarantees the whole board is fully
  // clearable, in the reverse of build order, no matter what gets placed
  // around it afterwards - by construction, not by luck. On large/tight
  // boards (e.g. late Hard levels) this is what keeps generation from
  // repeatedly failing and dropping to the plain straight-line fallback.
  function rawGenerate(){
    const grid = Array.from({length: ROWS}, () => Array(COLS).fill(-1));
    const paths = [];

    function freeNeighborCount(r,c){
      let cnt = 0;
      for(const name of DIR_NAMES){
        const d = DIRS[name];
        const nr = r+d.dy, nc = c+d.dx;
        if(nr<0||nr>=ROWS||nc<0||nc>=COLS) continue;
        if(grid[nr][nc] === -1) cnt++;
      }
      return cnt;
    }

    function pickStartCell(){
      let bestCount = Infinity, bestCandidates = [];
      for(let r=0;r<ROWS;r++){
        for(let c=0;c<COLS;c++){
          if(grid[r][c] !== -1) continue;
          const cnt = freeNeighborCount(r,c);
          if(cnt < bestCount){ bestCount = cnt; bestCandidates = [[r,c]]; }
          else if(cnt === bestCount){ bestCandidates.push([r,c]); }
        }
      }
      if(bestCandidates.length === 0) return null;
      return bestCandidates[Math.floor(rng()*bestCandidates.length)];
    }

    // grow one candidate shape from (sr,sc) without touching the shared grid,
    // so a shape that doesn't pan out can be thrown away and retried with no
    // cleanup - only cells vs already-FINISHED paths are checked against grid.
    function growCandidate(sr, sc){
      const cells = [[sr,sc]];
      const occupied = new Set([sr+','+sc]);
      let lastDir = null;

      function touchesSelf(nr, nc, r, c){
        for(const name of DIR_NAMES){
          const d = DIRS[name];
          const ar = nr+d.dy, ac = nc+d.dx;
          if(ar===r && ac===c) continue; // the connecting cell we just came from - always fine
          if(occupied.has(ar+','+ac)) return true;
        }
        return false;
      }

      // How many of (r,c)'s orthogonal neighbours are still free, given a
      // hypothetical extra set of cells this path is about to occupy. Used
      // to spot moves that would wall a free cell in on every side.
      function freeNeighborCount(r, c, hypotheticalOccupied){
        let count = 0;
        for(const name of DIR_NAMES){
          const d = DIRS[name];
          const ar = r+d.dy, ac = c+d.dx;
          if(ar<0||ar>=ROWS||ac<0||ac>=COLS) continue;
          if(grid[ar][ac] !== -1) continue;
          if(hypotheticalOccupied.has(ar+','+ac)) continue;
          count++;
        }
        return count;
      }

      while(cells.length < MAX_STEPS){
        const [r,c] = cells[cells.length-1];

        const candidates = [];
        for(const name of DIR_NAMES){
          const d = DIRS[name];
          const nr = r+d.dy, nc = c+d.dx;
          if(nr<0||nr>=ROWS||nc<0||nc>=COLS) continue;
          if(grid[nr][nc] !== -1) continue;               // occupied by an earlier, finished path
          if(occupied.has(nr+','+nc)) continue;            // occupied by this same path
          if(lastDir && name === OPPOSITE[lastDir]) continue; // never backtrack
          if(touchesSelf(nr, nc, r, c)) continue;          // head/body must never touch itself
          let w = 3;                    // favour turning over continuing straight
          if(lastDir === name) w = 1;

          // Penalize moves that would wall off a neighbouring free cell with
          // no free neighbours of its own left - that cell would become an
          // isolated 1-cell island no path can ever reach, which is exactly
          // what turns into an unmergeable stub arrow later. Not an outright
          // ban (a rare board might have no other option), just a strong
          // discouragement so the generator routes around holes instead of
          // creating them.
          const hypothetical = new Set(occupied);
          hypothetical.add(nr+','+nc);
          for(const name2 of DIR_NAMES){
            const d2 = DIRS[name2];
            const ar = nr+d2.dy, ac = nc+d2.dx;
            if(ar<0||ar>=ROWS||ac<0||ac>=COLS) continue;
            if(grid[ar][ac] !== -1) continue;
            if(hypothetical.has(ar+','+ac)) continue;
            if(freeNeighborCount(ar, ac, hypothetical) === 0){
              w *= 0.03;
              break;
            }
          }

          candidates.push({name, d, nr, nc, w});
        }
        if(candidates.length === 0) break;
          // ---------- Minimum arrow length ----------
          // MIN_ARROW_LENGTH scales with level (see getLevelConfig / applyLevelConfig)

          // Don't allow the generator to stop until the minimum length is reached.
          if (cells.length >= MIN_ARROW_LENGTH) {

              // Lower base chance (and gentler growth) than before, so arrows
              // don't all bunch up right at MIN_ARROW_LENGTH - most paths
              // now grow noticeably past the minimum before stopping, which
              // keeps a single board from being dominated by short arrows.
              const stopChance = 0.05 + (cells.length - MIN_ARROW_LENGTH) * 0.03;

              if (rng() < stopChance)
                  break;
          }

        const totalW = candidates.reduce((s,x)=>s+x.w,0);
        let r2 = rng()*totalW;
        let pick = candidates[0];
        for(const cand of candidates){ if(r2 < cand.w){ pick = cand; break; } r2 -= cand.w; }

        cells.push([pick.nr, pick.nc]);
        occupied.add(pick.nr+','+pick.nc);
        lastDir = pick.name;
      }

      return {cells, lastDir};
    }

    // true if a straight line off the board from this end is clear of every
    // path already committed to the grid (a path's own cells never count)
    function hasClearExit(cells, dir){
      const [r,c] = cells[cells.length-1];
      const d = DIRS[dir];
      let rr=r+d.dy, cc=c+d.dx;
      while(rr>=0 && rr<ROWS && cc>=0 && cc<COLS){
        if(grid[rr][cc] !== -1) return false;
        rr+=d.dy; cc+=d.dx;
      }
      return true;
    }

    let start;
    while((start = pickStartCell())){
      const [sr,sc] = start;
      let best = null;

      for(let attempt=0; attempt<40 && !best; attempt++){
        const {cells, lastDir} = growCandidate(sr, sc);

        if(cells.length >= 2){
          const [r0,c0] = cells[cells.length-2];
          const [r1,c1] = cells[cells.length-1];
          const tailEndDir = lastDir || directionBetween(r0,c0,r1,c1);
          if(tailEndDir && hasClearExit(cells, tailEndDir)){
            best = {cells, headDir: tailEndDir};
            break;
          }
          const flippedCells = cells.slice().reverse();
          const [fr0,fc0] = flippedCells[flippedCells.length-2];
          const [fr1,fc1] = flippedCells[flippedCells.length-1];
          const headEndDir = directionBetween(fr0,fc0,fr1,fc1);
          if(headEndDir && hasClearExit(flippedCells, headEndDir)){
            best = {cells: flippedCells, headDir: headEndDir};
            break;
          }
        } else {
          // single-cell stub: any of the 4 directions can serve as its head
          for(const name of shuffle(DIR_NAMES.slice())){
            if(hasClearExit(cells, name)){
              best = {cells, headDir: name};
              break;
            }
          }
        }
      }

      // extremely rare corner case: even after retries neither end is clear -
      // keep the last grown shape as-is rather than looping forever here;
      // mergeStubs / the outer solvability check will catch anything left over
      if(!best){
        const {cells, lastDir} = growCandidate(sr, sc);
        best = {cells, headDir: lastDir || DIR_NAMES[Math.floor(rng()*DIR_NAMES.length)]};
      }

      const pathId = paths.length;
      for(const [cr,cc] of best.cells) grid[cr][cc] = pathId;
      paths.push({id: pathId, cells: best.cells, headDir: best.headDir});
    }

    return {grid, paths};
  }

  // a chain is valid if every step is a single orthogonal move, no cell repeats,
  // and no cell is edge-adjacent to another cell of the chain except its immediate neighbour
  function isValidChain(cells){
    for(let i=1;i<cells.length;i++){
      const [r0,c0] = cells[i-1], [r1,c1] = cells[i];
      const dr = Math.abs(r1-r0), dc = Math.abs(c1-c0);
      if(!((dr===1&&dc===0)||(dr===0&&dc===1))) return false;
    }
    const seen = new Set(cells.map(([r,c]) => r+','+c));
    if(seen.size !== cells.length) return false;
    for(let i=0;i<cells.length;i++){
      const [r,c] = cells[i];
      for(const name of DIR_NAMES){
        const d = DIRS[name];
        const ar = r+d.dy, ac = c+d.dx;
        const idx = cells.findIndex(([rr,cc]) => rr===ar && cc===ac);
        if(idx === -1) continue;
        if(idx !== i-1 && idx !== i+1) return false;
      }
    }
    return true;
  }

  // try to graft a too-short stub path onto an adjacent path's head or tail,
  // so nearly every cell ends up part of a proper, clearly-visible arrow
  function tryMergeStub(grid, byId, stub){
    for(const attachEnd of [0, stub.cells.length-1]){
      const [ar,ac] = stub.cells[attachEnd];
      for(const name of DIR_NAMES){
        const d = DIRS[name];
        const nr = ar+d.dy, nc = ac+d.dx;
        if(nr<0||nr>=ROWS||nc<0||nc>=COLS) continue;
        const neighborId = grid[nr][nc];
        if(neighborId === -1 || neighborId === stub.id) continue;
        const neighborPath = byId.get(neighborId);
        if(!neighborPath) continue;

        const tail = neighborPath.cells[0];
        const head = neighborPath.cells[neighborPath.cells.length-1];

        // Check the HEAD first. When the neighbour is itself a single-cell
        // stub, its tail and head are the same cell, so attaching there
        // always moves what becomes the new head end and headDir MUST be
        // recomputed. Checking tail first (the old order) mistook that
        // case for a tail-only attach and left the stale headDir in
        // place, which is what produced a misplaced/misaligned arrowhead
        // on some boards (e.g. Hard level 2).
        if(head[0]===nr && head[1]===nc){
          // attach at the neighbour's head — recompute headDir
          const extension = attachEnd === 0 ? stub.cells : stub.cells.slice().reverse();
          const newCells = neighborPath.cells.concat(extension);
          if(newCells.length > MAX_STEPS + 4) continue;
          if(!isValidChain(newCells)) continue;

          const [r0,c0] = newCells[newCells.length-2];
          const [r1,c1] = newCells[newCells.length-1];
          const newHeadDir = directionBetween(r0,c0,r1,c1);
          if(!newHeadDir) continue;

          for(const [cr,cc] of stub.cells) grid[cr][cc] = neighborPath.id;
          neighborPath.cells = newCells;
          neighborPath.headDir = newHeadDir;
          byId.delete(stub.id);
          return true;

        } else if(tail[0]===nr && tail[1]===nc){
          // attach at the neighbour's tail — headDir is unaffected
          const newCells = attachEnd === 0
            ? stub.cells.slice().reverse().concat(neighborPath.cells)
            : stub.cells.slice().concat(neighborPath.cells);
          if(newCells.length > MAX_STEPS + 4) continue;
          if(!isValidChain(newCells)) continue;

          for(const [cr,cc] of stub.cells) grid[cr][cc] = neighborPath.id;
          neighborPath.cells = newCells;
          byId.delete(stub.id);
          return true;
        }
      }
    }
    return false;
  }

  // graft as many too-short stubs as possible onto neighbouring paths
  function mergeStubs(grid, paths){
    const byId = new Map(paths.map(p => [p.id, p]));
    let changed = true, iter = 0;
    while(changed && iter < 500){
      changed = false; iter++;
      const stubs = [...byId.values()].filter(p => p.cells.length < MIN_ARROW_LENGTH);
      for(const stub of stubs){
        if(!byId.has(stub.id)) continue;
        if(tryMergeStub(grid, byId, stub)) changed = true;
      }
    }
    return [...byId.values()];
  }

  // RULE: two arrows sharing a row/column can never point straight at one
  // another head-to-head, no matter how far apart they are
  function findConflicts(paths){
    const conflicts = [];
    const byRow = new Map(), byCol = new Map();
    for(const p of paths){
      const [r,c] = p.cells[p.cells.length-1];
      if(p.headDir === 'left' || p.headDir === 'right'){
        if(!byRow.has(r)) byRow.set(r, []);
        byRow.get(r).push({p, c});
      }
      if(p.headDir === 'up' || p.headDir === 'down'){
        if(!byCol.has(c)) byCol.set(c, []);
        byCol.get(c).push({p, r});
      }
    }
    for(const [, arr] of byRow){
      for(let i=0;i<arr.length;i++) for(let j=i+1;j<arr.length;j++){
        const A = arr[i], B = arr[j];
        let leftOne=null, rightOne=null;
        if(A.p.headDir==='right' && B.p.headDir==='left'){ rightOne=A; leftOne=B; }
        else if(A.p.headDir==='left' && B.p.headDir==='right'){ rightOne=B; leftOne=A; }
        else continue;
        if(rightOne.c < leftOne.c) conflicts.push([rightOne.p.id, leftOne.p.id]);
      }
    }
    for(const [, arr] of byCol){
      for(let i=0;i<arr.length;i++) for(let j=i+1;j<arr.length;j++){
        const A = arr[i], B = arr[j];
        let topOne=null, bottomOne=null;
        if(A.p.headDir==='down' && B.p.headDir==='up'){ topOne=A; bottomOne=B; }
        else if(A.p.headDir==='up' && B.p.headDir==='down'){ topOne=B; bottomOne=A; }
        else continue;
        if(topOne.r < bottomOne.r) conflicts.push([topOne.p.id, bottomOne.p.id]);
      }
    }
    return conflicts;
  }

  // resolve "face to face" conflicts by flipping one arrow of each pair, one at a time
  function resolveConflicts(paths, protectedId){
    const byId = new Map(paths.map(p => [p.id, p]));
    const flipCounts = new Map();
    for(let iter=0; iter<2000; iter++){
      const conflicts = findConflicts([...byId.values()]);
      if(conflicts.length === 0) return {paths: [...byId.values()], ok: true};
      const [a,b] = conflicts[0];
      const pa = byId.get(a), pb = byId.get(b);
      let flipId;
      if(a === protectedId) flipId = b;
      else if(b === protectedId) flipId = a;
      else {
        const ca = flipCounts.get(a) || 0, cb = flipCounts.get(b) || 0;
        if(ca !== cb) flipId = ca < cb ? a : b;
        else flipId = pa.cells.length <= pb.cells.length ? a : b; // flip the shorter one: less likely to cascade
      }
      byId.set(flipId, flipPath(byId.get(flipId)));
      flipCounts.set(flipId, (flipCounts.get(flipId)||0) + 1);
    }
    return {paths: [...byId.values()], ok: false};
  }

  // ensure at least one arrow already has a clear, unobstructed path off the board
  function findClearCandidate(paths){
    for(const p of paths){
      const [r,c] = p.cells[p.cells.length-1];
      if(edgeMatches(r,c,p.headDir)) return p.id;
    }
    for(let i=0;i<paths.length;i++){
      const flipped = flipPath(paths[i]);
      const [r,c] = flipped.cells[flipped.cells.length-1];
      if(edgeMatches(r,c,flipped.headDir)){
        paths[i] = flipped;
        return flipped.id;
      }
    }
    return null;
  }

// guaranteed-instant, always-solvable layout used only as a last resort if
// random generation can't find a valid board quickly (can happen on very
// large, highly-constrained boards at high levels)
function buildFallbackLayout(){
    const grid = Array.from({length: ROWS}, () => Array(COLS).fill(-1));
    const paths = [];
    for(let r=0; r<ROWS; r++){
        const cells = [];
        // each row is only ever occupied by its own path, so nothing else
        // can block it regardless of direction - alternate so the board
        // doesn't degenerate into every single arrow pointing the same way
        const headDir = (r % 2 === 0) ? 'right' : 'left';
        if(headDir === 'right'){
            for(let c=0; c<COLS; c++){ cells.push([r,c]); grid[r][c] = r; }
        } else {
            for(let c=COLS-1; c>=0; c--){ cells.push([r,c]); grid[r][c] = r; }
        }
        paths.push({id: r, cells, headDir});
    }
    return {grid, paths, clearId: 0};
}

// fast=true trims the search budget down - used for mid-game checkpoint
// reshuffles, which (unlike a fresh level) run synchronously on the main
// thread in the middle of a tap, on top of an already-large Hard board.
// The full budget could take ~1.5-2s there, freezing input long enough
// that a player's next tap lands on the wrong (post-shuffle) arrow.
// Trimmed too aggressively, though, this budget runs out before finding
// ANY solvable candidate far too often, silently falling back to the
// boring straight-parallel-rows layout (buildFallbackLayout) instead -
// these numbers are tuned to keep that fallback about as rare as it
// already was at full budget (~1%), while still roughly halving worst-case
// time versus the non-fast path.
function buildLayout(fast){

    let attempts = 0;
    const MAX_ATTEMPTS = fast ? 150 : 250; // bounded so a bad board can never hang the game

    // The random-walk generator can't guarantee every cell lands in a path
    // >= MIN_ARROW_LENGTH - some short "stub" arrows are inherent to filling
    // a grid this way, and simply raising MIN_ARROW_LENGTH further only
    // makes full-board tiling harder (producing MORE stubs, not fewer).
    // What actually matters to a player is not having several tiny (1-3
    // cell) arrows cluttering one board. So instead of accepting the first
    // solvable layout found, keep searching (bounded, so this can't hang)
    // and remember whichever solvable layout has the fewest tiny stubs,
    // stopping early once we find one that's already good.
    let best = null;
    let bestTinyCount = Infinity;
    let validCandidates = 0;
    const MAX_VALID_CANDIDATES = fast ? 3 : 8; // full (expensive) candidates to compare at most
    const GOOD_ENOUGH_TINY = 2;     // ~"1-2 small arrows" - stop searching once this good

    while(true){

        attempts++;

        if(attempts > MAX_ATTEMPTS){
            return best || buildFallbackLayout();
        }

        const {grid, paths: rawPaths} = rawGenerate();
        const paths = mergeStubs(grid, rawPaths);

        const tinyCount = paths.filter(p => p.cells.length <= 3).length;

        // Cheap pre-filter: once we already have a confirmed solvable
        // candidate, skip the expensive validation pipeline (conflict
        // resolution + full solvability simulation) for boards that are
        // already no better than it on tiny-stub count.
        if(best && tinyCount >= bestTinyCount) continue;

        const clearId = findClearCandidate(paths);
        if(clearId===null) continue;

        const resolved = resolveConflicts(paths, clearId);
        if(!resolved.ok) continue;

        // simulate the whole puzzle
        const simGrid = grid.map(r=>r.slice());
        const remaining = new Map();

        for(const p of resolved.paths)
            remaining.set(p.id, structuredClone(p));

        let removed = 0;

        while(true){

            let found = false;

            for(const [id,p] of remaining){

                const [r,c] = p.cells[p.cells.length-1];
                const d = DIRS[p.headDir];

                let rr=r+d.dy;
                let cc=c+d.dx;

                let clear=true;

                while(rr>=0 && rr<ROWS && cc>=0 && cc<COLS){

                    if(simGrid[rr][cc]!=-1){
                        clear=false;
                        break;
                    }

                    rr+=d.dy;
                    cc+=d.dx;
                }

                if(clear){

                    found=true;

                    for(const [cr,cc] of p.cells)
                        simGrid[cr][cc]=-1;

                    remaining.delete(id);
                    removed++;

                    break;
                }
            }

            if(!found) break;
        }

        // ALL arrows removable?
        if(removed===resolved.paths.length){

            validCandidates++;

            if(tinyCount < bestTinyCount){
                bestTinyCount = tinyCount;
                best = { grid, paths: resolved.paths, clearId };
            }

            // Larger boards (more paths) get a proportionally larger
            // allowance - holding a 40-arrow Hard board to the same
            // absolute "2 tiny arrows" bar as a 10-arrow Easy board isn't
            // achievable and would just burn the whole attempt budget.
            const goodEnough = Math.max(GOOD_ENOUGH_TINY, Math.ceil(resolved.paths.length * 0.1));
            if(bestTinyCount <= goodEnough || validCandidates >= MAX_VALID_CANDIDATES){
                return best;
            }

        }

    }

}

  // ---- Runtime state ----
    let grid = [];
    let pathsMap = new Map();
    let cellSize = 0, boardW = 0, boardH = 0;

    let leaving = [];
    let bumping = []; // arrows currently animating a "wrong move" bump: nudge forward until they touch whatever's blocking them, then spring back
    // Checkpoint reshuffle transition: the old arrows spin/shrink/fade out,
    // then the new layout spins/grows/fades in, instead of an instant cut.
    // null when no reshuffle animation is in progress.
    let shuffleAnim = null;
    let flashing = new Set();//ids of arrows mistouched this game - stay red until cleared
   let animFrameQueued = false;

    // Mode-specific shuffle timing. Edit these numbers later if you want to
    // tune when shuffles happen:
    //   easy: []          means no mid-level shuffle.
    //   medium: [0.50]   means shuffle after 50% of starting arrows clear.
    //   hard: [0.40,0.70] means shuffle after 40%, then again after 70%.
    // Use fractions from 0 to 1, and keep each mode's list in increasing
    // order. Example: [0.25, 0.60, 0.85] would shuffle three times.
    const SHUFFLE_CHECKPOINTS_BY_MODE = {
        easy: [],
        medium: [0.50],
        hard: [0.40, 0.70]
    };

    // levelArrowTotal is the arrow count the level started with. Fractions
    // are measured against this fixed total, not the ever-shrinking current
    // count. shuffleCheckpointIndex points to the next checkpoint to fire.
    let levelArrowTotal = 0;
    let shuffleCheckpointIndex = 0;

    function getShuffleCheckpointsForMode(mode){
        return SHUFFLE_CHECKPOINTS_BY_MODE[mode] || [];
    }

    function getNextShuffleThreshold(){
        const checkpoints = getShuffleCheckpointsForMode(gameMode);
        return checkpoints[shuffleCheckpointIndex] ?? null;
    }

    // Fisher-Yates using the level's seeded rng() (not Math.random()) so a
    // reshuffle is deterministic given the level's seed, same as the rest
    // of the generator.
    function seededShuffle(arr){
        for(let i = arr.length - 1; i > 0; i--){
            const j = Math.floor(rng() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // Mode checkpoint reshuffle: builds a brand new fully-solvable
    // layout for the current level's grid/step settings, then keeps only
    // as many of its arrows as are currently remaining on the board - no
    // arrows are added. A subset of a solvable layout (cleared in the same
    // relative order as the full layout) is always itself solvable, since
    // removing pieces only removes obstacles, so trimming down to the
    // remaining count can never turn a solvable board unsolvable.
    function reshuffleRemainingArrows(showNotice = true){
        const remainingCount = pathsMap.size;
        if(remainingCount === 0) return;
        const previousLengths = [...pathsMap.values()]
            .map(p => p.cells.length)
            .sort((a, b) => b - a);

        // Regenerating a layout across the WHOLE board (300+ cells on a big
        // Hard board) just to keep a random handful of its arrows afterward
        // is far more work than necessary once most of the level is
        // already cleared - that's most of why this could still take
        // noticeably long. Instead, scope generation to a much smaller
        // sub-region sized for roughly `remainingCount` arrows: cells
        // outside that sub-region are simply left empty in the new grid,
        // exactly like already-cleared cells already are, so this is
        // visually indistinguishable from the old full-board approach.
        const origRows = ROWS, origCols = COLS;

        const avgLen = (MIN_ARROW_LENGTH + MAX_STEPS) / 2;
        const neededCells = Math.min(origRows * origCols, Math.ceil(remainingCount * avgLen * 1.4));
        // keep it roughly square-ish and matched to the board's own
        // proportions, so it tiles about as easily as the real board does
        const aspect = origCols / origRows;
        let subRows = Math.max(MIN_ARROW_LENGTH + 2, Math.round(Math.sqrt(neededCells / aspect)));
        let subCols = Math.max(MIN_ARROW_LENGTH + 2, Math.round(Math.sqrt(neededCells * aspect)));
        subRows = Math.min(subRows, origRows);
        subCols = Math.min(subCols, origCols);

        ROWS = subRows;
        COLS = subCols;
        let layout;
        try{
            layout = buildLayout(true); // fast: this runs synchronously mid-tap, see buildLayout's comment
        } finally {
            ROWS = origRows;
            COLS = origCols;
        }

        // Place the sub-region's paths at a random offset within the real
        // board instead of always anchoring them to the top-left corner.
        const rowOffset = Math.floor(rng() * (origRows - subRows + 1));
        const colOffset = Math.floor(rng() * (origCols - subCols + 1));
        for(const p of layout.paths){
            p.cells = p.cells.map(([r,c]) => [r + rowOffset, c + colOffset]);
        }

        const shuffled = seededShuffle(layout.paths.slice());
        // Best-effort fallback for the rare case the fresh layout has fewer
        // total arrows than we need to keep - just keep them all rather
        // than fail; this only ever gives the player fewer arrows to clear,
        // never more.
        const kept = shuffled
            .slice(0, Math.min(remainingCount, shuffled.length))
            .sort((a, b) => b.cells.length - a.cells.length)
            .map((p, i) => {
                const maxLen = previousLengths[i] || p.cells.length;
                if(p.cells.length <= maxLen) return p;
                // Trim from the tail so the arrow keeps the same head and
                // exit direction; this only removes blockers, preserving
                // the solvability guarantee from the generated layout.
                return {...p, cells: p.cells.slice(p.cells.length - maxLen)};
            });

        const newGrid = Array.from({length: ROWS}, () => Array(COLS).fill(-1));
        const newPathsMap = new Map();
        for(const p of kept){
            newPathsMap.set(p.id, p);
            for(const [r,c] of p.cells) newGrid[r][c] = p.id;
        }

        // Old ids no longer necessarily correspond to anything on the new
        // board - drop any stale "wrong move" state tied to them. Arrows
        // already mid-flight in `leaving` are self-contained (they carry
        // their own points/timing) so they're left alone to finish.
        const oldPaths = [...pathsMap.values()];
        flashing = new Set();
        bumping = [];

        // Animate the transition (old arrows spin/shrink away, new ones
        // spin/grow in) instead of an instant cut - grid/pathsMap only
        // actually get swapped once the animation finishes, in
        // drawShuffleAnim(). The board keeps showing (and, gameplay-wise,
        // still IS) the old layout for the animation's duration.
        shuffleAnim = {
            oldPaths,
            newGrid,
            newPathsMap,
            startTime: performance.now(),
            duration: 550
        };

        // buildLayout() above just ran synchronously and could have taken
        // a noticeable moment on a big Hard board - anything the player
        // tapped during that freeze is still sitting in the event queue
        // and would otherwise fire against this brand-new layout the
        // instant this function returns. Swallow taps for a short window
        // (covering both that queued-event risk and the shuffle animation
        // itself) so a stray touch can't cost a life on an arrow that
        // wasn't there when they actually tapped.
        inputBlockedUntil = performance.now() + shuffleAnim.duration + 400;

        // Show this shortly after the reshuffle starts. The just-cleared
        // arrow keeps animating on top of the shuffle in draw(), so the
        // notice can appear quickly while the arrow still flies away behind
        // it.
        if(showNotice){
            setTimeout(() => {

                    null,
                    false, // no confetti - this is a warning, not a celebration
                    500    // auto-dismiss quickly so it never blocks play

        // drawShuffleAnim() finalizes the swap, so saving now would

    // Fractions are measured against levelArrowTotal (the level's starting
    // count), not the shrinking current count, so checkpoint percentages
    // always refer to the same fixed target. If a single clear jumps past
    // multiple checkpoints on a very short level, mark all passed
    // checkpoints but only reshuffle once.
    function maybeReshuffleForMode(showNotice = true){
        if(pathsMap.size === 0) return; // level just completed
        if(levelArrowTotal <= 0) return;

        const checkpoints = getShuffleCheckpointsForMode(gameMode);
        if(shuffleCheckpointIndex >= checkpoints.length) return;

        const clearedFraction = (levelArrowTotal - pathsMap.size) / levelArrowTotal;
        if(clearedFraction < checkpoints[shuffleCheckpointIndex]) return;

        while(shuffleCheckpointIndex < checkpoints.length &&
              clearedFraction >= checkpoints[shuffleCheckpointIndex]){

        }

  const SPEED = 1.24;             // px per ms travelled along the path while exiting (2x speed)
  const RED = '#e0435a';
  const BLUE = '#4d63ff';         // color for an arrow while it's sliding off after a correct clear

  function cellCenter(r,c){
    const TOP_BAR = cellSize * 0.9;

    return [
        c*cellSize + cellSize/2,
        TOP_BAR + r*cellSize + cellSize/2
    ];
}

  function drawDotGrid(){

    const rDot = Math.max(1, cellSize*0.045);

    ctx.fillStyle = 'rgba(44,47,74,0.25)';
    // Dots sit at cell centers (same coordinates cellCenter() uses for
    // drawing arrows) so the background texture lines up with the paths
    // the arrows actually travel along. Drawn across every cell, not just
    // ones that currently hold an arrow - so once an arrow is cleared,
    // the dots reappear along the line it used to occupy instead of
    // leaving a blank gap.
    for(let r=0; r<ROWS; r++){
      for(let c=0; c<COLS; c++){
        const [cx, cy] = cellCenter(r,c);
        ctx.beginPath();
        ctx.arc(cx, cy, rDot, 0, Math.PI*2);
        ctx.fill();
      }
    }
  }

  // cumulative arc-length along a path's cell centers, for continuous "slide along the path" motion
  function buildArcLength(pts){
    const cum = [0];
    for(let i=1;i<pts.length;i++){
      const [x0,y0] = pts[i-1], [x1,y1] = pts[i];
      cum.push(cum[i-1] + Math.hypot(x1-x0, y1-y0));
    }
    return cum;
  }

  // position at arc-length s along the polyline; beyond the last point it keeps
  // going straight in headDir, exactly like a snake that has left the pipe
  function pointAtArclength(pts, cum, s, headVec){
    const total = cum[cum.length-1];
    if(s <= 0) return pts[0];
    if(s > total){
      const [hx,hy] = pts[pts.length-1];
      const extra = s - total;
      return [hx + headVec.dx*extra, hy + headVec.dy*extra];
    }
    for(let i=1;i<cum.length;i++){
      if(s <= cum[i] || i === cum.length-1){
        const segLen = (cum[i]-cum[i-1]) || 1e-6;
        const t = (s - cum[i-1]) / segLen;
        const [x0,y0] = pts[i-1], [x1,y1] = pts[i];
        return [x0+(x1-x0)*t, y0+(y1-y0)*t];
      }
    }
    return pts[pts.length-1];
  }

  function lerpColor(hexA, hexB, t){
    const a = parseInt(hexA.slice(1),16), b = parseInt(hexB.slice(1),16);
    const ar=(a>>16)&255, ag=(a>>8)&255, ab=a&255;
    const br=(b>>16)&255, bg=(b>>8)&255, bb=b&255;
    const r = Math.round(ar+(br-ar)*t), g = Math.round(ag+(bg-ag)*t), bl = Math.round(ab+(bb-ab)*t);
    return '#' + ((1<<24)+(r<<16)+(g<<8)+bl).toString(16).slice(1);
  }

  // ===== HOW TO ADD A NEW ARROW PATTERN (checklist for future changes) =====
  // Adding a pattern takes 4 edits, all in this file:
  //   1. Add its type key (short camelCase string) to ARROW_PATTERN_TYPES
  //      below. Position in the array = unlock order (earlier = unlocks
  //      sooner), so insert it wherever you want it to unlock relative to

  //   2. Add a `type: 'Display Name'` entry to PATTERN_DISPLAY_NAMES -

  const ARROW_PATTERN_TYPES = ['solid','plainRed','plainBlue','plainGreen','plainOrange','plainPurple','contourLines','marbleSwirl','sunsetWave','crimsonBlob','goldenTopo','denimWeave','lavaCrack','mintDots','royalChevron','iceCrystal','copperRust','jungleLeaf','cosmicStar','candyStripe','graphitePlaid','coralReef','emeraldScale','sunflowerField','stormCloud','autumnLeaf','neonGrid','desertSand','wineBerry','arcticAurora','terracottaTile'];

  function lightenColor(hex, amt){ return lerpColor(hex, '#ffffff', amt); }

  // Perceived brightness (0=black..255=white) of a hex color, used to decide
  // how hard a color needs to be darkened to stay clearly visible against

  function relativeLuminance(hex){
    const n = parseInt(hex.slice(1), 16);

  function buildPatternTile(type, tileSize){
    const tile = document.createElement('canvas');
    const dpr = window.devicePixelRatio || 1;
    tile.width = Math.max(2, Math.round(tileSize*dpr));
    tile.height = Math.max(2, Math.round(tileSize*dpr));

    tctx.scale(dpr, dpr);

      case 'contourLines': {
        tctx.fillStyle = '#0d3b2e';
        tctx.fillRect(0,0,s,s);

          { c: '#1f5c46', w: 0.22 },
          { c: '#3f8a5f', w: 0.14 },
          { c: '#8fc98a', w: 0.07 },

          tctx.strokeStyle = band.c;
          tctx.lineWidth = s*band.w;

          tctx.beginPath();
          tctx.moveTo(-s*0.2, s*0.15);
          tctx.bezierCurveTo(s*0.15, s*0.35, s*0.15, -s*0.05, s*0.5, s*0.15);

          tctx.bezierCurveTo(s*0.15, s*0.95, s*0.15, s*0.55, s*0.5, s*0.75);

          tctx.bezierCurveTo(s*0.3, s*0.1+sw.off, s*0.4, s*0.9+sw.off, s*0.7, s*0.45+sw.off);
