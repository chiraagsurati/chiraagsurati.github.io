<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
 <!-- Game icon -->
    <link rel="icon" type="image/png" href="icon.png">
<title>Arrow</title>
<style>
/* ===========================
   MAIN MENU
=========================== */
#menuScreen{
    position:fixed;
    top:0;
    right:0;
    bottom:0;
    left:0;
    background:#d9d8e2;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    align-items:center;
    /* overflow-y stays as a safety net only - on any realistic device the
       clamp()'d sizing below keeps everything shorter than the viewport,
       so this should never actually need to scroll. */
    overflow-y:auto;
    /* Scales with viewport height instead of a fixed 24px, so short
       screens don't lose fitting-room to padding that a tall screen
       doesn't need. */
    padding:clamp(70px, 3vh, 24px) 0;
    box-sizing:border-box;
    z-index:9999;
}
.menu-box{
    /* Grid (not flex) so every button's column track auto-sizes to the
       widest button's content (Daily Challenge) and justify-items:stretch
       (grid's default) then stretches every OTHER button to match that
       same width - no JS/hardcoded px needed, and it stays correct even
       if button labels change later. h1 lives outside .menu-box (see
       markup) specifically so its own (wider) title text doesn't get
       counted into this sizing. */
    display:inline-grid;
    justify-items:stretch;
    justify-content:center;
    /* Scales down on short screens so all buttons + title fit without
       scrolling; caps at the original 18px on normal/tall screens. */
    gap:clamp(6px, 1.8vh, 18px);
}
h1{
    margin:0 0 clamp(10px, 3vh, 26px);
    color:#2c2f4a;
    font-size:clamp(22px, 5vh, 32px);
    font-weight:900;
    letter-spacing:5px;
    text-align:center;
}
.menu-box button{
    background:#ffffff;
    border:none;
    border-radius:15.36px; /* 12.8px * 1.2 */

    color:#2c2f4a;

    /* Scales with viewport height (capped 20% larger than before) so all
       buttons shrink together on shorter screens rather than overflowing
       and forcing the menu to scroll. */
    font-size:clamp(15.6px, 2.88vh, 21.12px);
    font-weight:700;

    cursor:pointer;

    /* Padding scales with the same 20% increase as the font size. */
    padding:clamp(7.2px, 1.68vh, 13.44px) 32.64px;
    /* No explicit width - justify-items:stretch on the parent grid makes
       every button fill the grid column, which is auto-sized to the
       widest button (Daily Challenge) - see .menu-box comment above. */
    box-sizing:border-box;

    box-shadow:0 4px 10px rgba(44,47,74,0.15);
    transition:.15s;

}
.menu-box button:hover{
    background:#4d63ff;
    color:#ffffff;
    box-shadow:0 6px 14px rgba(77,99,255,0.35);
    transform:translateY(-2px);

}
.menu-box button:active{
    transform:translateY(0);
    box-shadow:0 2px 6px rgba(44,47,74,0.2);
}
#appVersion{
    position:fixed;
    bottom:12px;
    left:50%;
    transform:translateX(-50%);
    color:rgba(44,47,74,0.55);
    font-size:11px;
    font-weight:700;
    text-align:center;
    pointer-events:none;
}
#coinBadge{
    position:fixed;
    top:14px;
    right:14px;
    background:#fff7e0;
    color:#8a6a12;
    font-size:13px;
    font-weight:800;
    padding:5px 10px;
    border-radius:16px;
    box-shadow:0 2px 6px rgba(44,47,74,0.18);
    z-index:20;
    cursor:pointer;
}
#streakBadge{
    position:fixed;
    top:14px;
    left:14px;
    background:#fff0e8;
    color:#a8451c;
    font-size:13px;
    font-weight:800;
    padding:5px 10px;
    border-radius:16px;
    box-shadow:0 2px 6px rgba(44,47,74,0.18);
    z-index:20;
    cursor:pointer;
    display:none;
}
  :root{
    --bg:#d9d8e2;
    --board-bg:#dedde6;
    --pipe:#2c2f4a;
    --dot: rgba(44,47,74,0.28);
    --ad-banner-height: 50px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background: var(--bg);
    overflow:hidden;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    touch-action: none;
  }
  /* ===========================
     AD BANNER SLOTS (placeholders)
     Fixed-position strips sized for a standard 320x50 banner ad.
     Real ad SDK code will be merged in here later - see the
     loadBannerAds() JS function further down for the integration
     point. If the eventual SDK manages its own native overlay view
     instead of DOM content, the inner placeholder text can simply be
     left empty; the div still reserves the on-screen space for it.
  =========================== */
  .adBanner{
    position:fixed;
    left:0; right:0;
    height:var(--ad-banner-height);
    z-index:500;
    user-select:none;
  }
  #adBannerTop{ top:0; }
  #adBannerBottom{ bottom:0; }
  #wrap{
    width:100%; min-height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px;
    overflow-y:auto;
    padding:calc(var(--ad-banner-height) + 10px) 0;
  }
  #title{
    color:#2c2f4a;
    letter-spacing: 10px;
    font-weight:800;
    font-size: 26px;
    user-select:none;
  }
#boardViewport{
    position:relative;
    overflow:hidden;
    border-radius:18px;
    touch-action:none;
    isolation:isolate;
}
#boardFrame{
    position:relative;
    padding:10px;
    border-radius:18px;
    background:var(--board-bg);
    box-shadow:
        0 0 0 1px rgba(0,0,0,.03) inset,
        0 16px 36px rgba(30,25,60,.18);
    transform-origin: 0 0;
    transition: transform .12s ease-out;
    will-change: transform;
}
#boardFrame.no-transition{
    transition: none;
}
  #board{
    display:block;
    border-radius: 10px;
  }
.zoomControls{
    display:flex;
    flex-direction:row;
    justify-content:center;
    align-items:center;
    gap:8px;
    z-index:50;
}
.zoomBtn{
    width:28.8px;    /* 24px * 1.2 */
    height:28.8px;   /* 24px * 1.2 */
    border:none;
    border-radius:8.4px; /* 7px * 1.2 */
    background:#2c2f4a;
    color:#fff;
    font-size:15.6px; /* 13px * 1.2 */
    font-weight:bold;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.25);
    opacity:.88;
    user-select:none;
    transition:.15s;
}
.zoomBtn:active{
    transform:scale(.92);
}
.zoomBtn.active{
    background:#4d63ff;
    box-shadow:0 2px 8px rgba(77,99,255,.45);
}
#hardShuffleToggleBtn{
    width:auto;
    min-width:86.4px;  /* 72px * 1.2 */
    padding:0 9.6px;   /* 8px * 1.2 */
    gap:6px;           /* 5px * 1.2 */
    font-size:10.8px;  /* 9px * 1.2 */
    letter-spacing:.2px;
}
#hardShuffleToggleBtn .switchKnob{
    width:24px;    /* 20px * 1.2 */
    height:14.4px; /* 12px * 1.2 */
    border-radius:999px;
    background:rgba(255,255,255,.35);
    position:relative;
    flex:0 0 auto;
}
#hardShuffleToggleBtn .switchKnob::after{
    content:"";
    position:absolute;
    top:2.4px;    /* 2px * 1.2 */
    left:2.4px;   /* 2px * 1.2 */
    width:9.6px;  /* 8px * 1.2 */
    height:9.6px; /* 8px * 1.2 */
    border-radius:50%;
    background:#fff;
    transition:.15s;
}
#hardShuffleToggleBtn.active .switchKnob::after{
    transform:translateX(9.6px); /* 8px * 1.2 */
}
#hardShuffleToggleBtn:disabled{
    opacity:.45;
    cursor:not-allowed;
    transform:none;
}
#topBar{
    width:fit-content;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    margin:0 auto 12px;
}

#lives{

    color:#e53935;

    font-size:20px;

    font-weight:bold;

    letter-spacing:3px;

}
#topBar.daily #lives{
    transform:translateY(6px);
}

#levelLabel{
    position:absolute;
    left:10px;
    top:50%;
    transform:translateY(-50%);

    color:#2c2f4a;
    font-size:13px;
    font-weight:800;
    letter-spacing:1px;
    white-space:nowrap;
}

#shuffleCountPopup{
    /* Centered over #boardViewport (not #boardFrame, so it's unaffected
       by board zoom/pan). Hidden by default; JS adds .show plus a fresh
       number each time and the CSS animation handles the pop-in/fade-out
       and hiding itself again afterwards - no display toggling needed. */
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:84px;
    height:84px;
    border-radius:50%;
    background:rgba(44,47,74,0.55);
    color:#fff;
    font-size:38px;
    font-weight:800;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    opacity:0;
    z-index:20;
}
#shuffleCountPopup.show{
    animation: shuffleCountPop 0.7s ease-out forwards;
}
@keyframes shuffleCountPop{
    0%   { opacity:0;   transform:translate(-50%,-50%) scale(0.6); }
    15%  { opacity:1;   transform:translate(-50%,-50%) scale(1.08); }
    30%  { opacity:1;   transform:translate(-50%,-50%) scale(1); }
    75%  { opacity:1;   transform:translate(-50%,-50%) scale(1); }
    100% { opacity:0;   transform:translate(-50%,-50%) scale(0.9); }
}

#menuBtn{
    position:absolute;
    top:50%;
    right:10px;
    transform:translateY(-50%);

    width:36px;
    height:36px;

    border:none;
    border-radius:9.6px;

    background:#2c2f4a;
    color:#fff;

    font-size:18px;
    font-weight:bold;

    display:flex;
    justify-content:center;
    align-items:center;

    cursor:pointer;

    z-index:100;

    box-shadow:0 2px 8px rgba(0,0,0,.25);

    transition:.15s;
}
#menuBtn:hover{
    transform:translateY(-50%) scale(1.05);
}
#menuBtn:active{
    transform:translateY(-50%) scale(.95);
}
@keyframes loadingSpin{
    to{ transform:rotate(360deg); }
}
@keyframes loadingArrowPop{
    0%{ opacity:0; transform:scale(0.3) rotate(var(--rot)); }
    30%{ opacity:1; transform:scale(1.15) rotate(var(--rot)); }
    45%,70%{ opacity:1; transform:scale(1) rotate(var(--rot)); }
    100%{ opacity:0; transform:scale(0.4) rotate(var(--rot)); }
}
</style>

<body>
<!-- Required for Cordova: this is what wires up window.cordova, navigator.app,
     and the native 'backbutton' event. Without this tag none of the back/exit
     handling further down in this file can ever fire - Android's default
     back-button behavior (instantly closing the app) takes over instead.
     Cordova generates this file automatically at build time into
     platforms/android/app/src/main/assets/www/cordova.js, so this relative
     path just needs to match where index.html itself ends up in that build. -->
<script src="cordova.js"></script>
<div id="adBannerTop" class="adBanner"></div>
<div id="adBannerBottom" class="adBanner"></div>
<div id="wrap">
  <div id="topBar">
    <div id="levelLabel">LEVEL 1</div>
    <div id="lives">
        ❤ ❤ ❤
    </div>
    <button id="menuBtn">☰</button>
</div>
  <div id="boardViewport">
    <div id="boardFrame">
          <canvas id="board"></canvas>
    </div>
    <!-- Shuffle countdown: a big translucent number that pops up centered
         over the board and fades out on its own, replacing the old
         top-bar "Shuffle in N" text. Lives outside #boardFrame (which is
         what zoom/pan transforms) so it always stays dead-center of the
         visible board regardless of zoom/pan state. -->
    <div id="shuffleCountPopup"></div>
  </div>
  <div class="zoomControls">
    <button id="zoomInBtn" class="zoomBtn" title="Zoom in">+</button>
    <button id="zoomOutBtn" class="zoomBtn" title="Zoom out">−</button>
    <button id="gridToggleBtn" class="zoomBtn" title="Show arrow path grid">▦</button>
    <button id="hardShuffleToggleBtn" class="zoomBtn" title="Hard mode shuffle on/off">
      <span class="switchKnob" aria-hidden="true"></span>
      <span class="switchLabel">Shuffle</span>
    </button>
  </div>

  </div>
</div>

 <div id="menuScreen">
    <h1>ARROW PUZZLE</h1>
    <div class="menu-box">

        <div id="coinBadge">🪙 0</div>
        <div id="streakBadge">🔥 0</div>

        <button id="resumeBtn">▶ Resume</button>

        <button id="newBtn"> New Game</button>

        <button id="levelBtn">🏆 Level</button>

        <button id="modeBtn">Mode</button>

        <button id="patternBtn">Pattern</button>

        <button id="dailyBtn">📅 Daily Challenge</button>

        <button id="themeBtn" style="display:none;">🎨 Board Themes</button>

        <button id="muteBtn">🔊 Sound</button>

        <button id="reportBugBtn">🐞 Report Bug</button>

        <button id="exitBtn">❌ Exit</button>
     </div>
     <div id="appVersion"></div>
</div>


<script>
(function(){
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const boardViewport = document.getElementById('boardViewport');
  const boardFrame = document.getElementById('boardFrame');

  // ---- Bug reporting ----
  // Browsers/WebViews have no API to send an SMS silently in the
  // background - Android only allows that for an app's *default* SMS
  // handler, and Play Store policy blocks regular apps from requesting
  // that permission just to self-report errors. The closest thing that
  // actually works everywhere (including inside the Cordova WebView) is
  // the "sms:" URI scheme, which opens the device's own Messages app
  // with the number and message pre-filled. It still needs one tap on
  // "Send" from whoever is holding the device - there's no way around
  // that - but everything else (catching the error, gathering device
  // info, composing the text) happens automatically.
  const BUG_REPORT_NUMBER = '+919737968082';
  let _lastAutoBugReportTime = 0;
  const AUTO_BUG_REPORT_COOLDOWN_MS = 30000; // avoid opening Messages repeatedly for rapid/looping errors

  function _bugReportToast(text){
    try{
      let t = document.createElement('div');
      t.textContent = text;
      t.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);' +
        'max-width:88vw;background:#2c2f4a;color:#fff;padding:10px 16px;border-radius:10px;' +
        'font:14px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.3);' +
        'z-index:99999;text-align:center;';
      document.body.appendChild(t);
      setTimeout(() => { try{ t.remove(); }catch(e){} }, 4000);
    }catch(e){}
  }

  // Builds the report text and opens it in the native SMS composer.
  // errorMessage/errorStack come from a caught crash; both are optional
  // (the manual "Report Bug" menu button calls this with just a note).
  function reportBug(errorMessage, errorStack, note){
    try{
      let lvl = 'unknown', mode = 'unknown', ver = 'unknown';
      try{ lvl = currentLevel; }catch(e){}
      try{ mode = gameMode; }catch(e){}
      try{ ver = APP_VERSION; }catch(e){}

      let mem = 'n/a', cores = 'n/a', screenInfo = 'n/a';
      try{ if(typeof navigator.deviceMemory === 'number') mem = navigator.deviceMemory + 'GB'; }catch(e){}
      try{ if(typeof navigator.hardwareConcurrency === 'number') cores = navigator.hardwareConcurrency; }catch(e){}
      try{ screenInfo = screen.width + 'x' + screen.height + ' @' + (window.devicePixelRatio || 1) + 'x'; }catch(e){}

      let ua = 'unknown';
      try{ ua = (navigator.userAgent || 'unknown').slice(0, 200); }catch(e){}
      let lang = 'n/a', online = 'n/a';
      try{ lang = navigator.language || 'n/a'; }catch(e){}
      try{ online = navigator.onLine ? 'yes' : 'no'; }catch(e){}

      const stack = (errorStack || '').toString().slice(0, 300);
      const now = new Date().toISOString();

      const lines = [
        '🐞 Arrow Puzzle Bug Report',
        'App v' + ver + ' | Level ' + lvl + ' (' + mode + ')',
        'Error: ' + (errorMessage || 'Manual report (no JS error caught)'),
        stack ? ('Stack: ' + stack) : null,
        note ? ('Note: ' + note) : null,
        'Device: ' + ua,
        'Screen: ' + screenInfo + ' | Mem: ' + mem + ' | Cores: ' + cores,
        'Lang: ' + lang + ' | Online: ' + online,
        'Time: ' + now
      ].filter(Boolean);

      const body = lines.join('\n');
      let isIOS = false;
      try{ isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent || ''); }catch(e){}
      const url = isIOS
        ? ('sms:' + BUG_REPORT_NUMBER + '&body=' + encodeURIComponent(body))
        : ('sms:' + BUG_REPORT_NUMBER + '?body=' + encodeURIComponent(body));

      window.location.href = url;
    }catch(e){
      console.warn('[reportBug] failed to open SMS composer:', e);
    }
  }

  // ---- Abnormal-termination detection (ANR / OOM force-close) ----
  // The 'error'/'unhandledrejection' listeners below only catch genuine JS
  // exceptions - they CANNOT catch the app being killed from outside by the
  // OS (an Android "App Not Responding" force-close after a long frozen
  // main thread, or a low-memory kill). In both cases the whole process is
  // torn down before any JS gets a chance to run, so no listener ever fires
  // and no report gets sent, even though the player just saw the app vanish.
  //
  // The fix real crash reporters use for exactly this case is a heartbeat:
  // while actively playing, periodically stamp "still alive" into
  // localStorage (which survives a process kill, unlike anything in memory).
  // Whenever we cleanly leave gameplay (menu/back/exit/backgrounded) we clear
  // that stamp first. So on the NEXT launch, if the stamp is still sitting
  // there marked active, that's proof the previous session ended without
  // ever reaching one of those clean-exit points - i.e. it was killed
  // externally. We can't catch it in the moment, but we can detect it after
  // the fact and offer to send a (slightly delayed) report for it.
  const SESSION_HEARTBEAT_KEY = 'arrowPuzzleSessionHeartbeat';
  const HEARTBEAT_INTERVAL_MS = 4000;
  let _heartbeatTimer = null;

  function _writeSessionHeartbeat(active){
    try{
      if(active){
        localStorage.setItem(SESSION_HEARTBEAT_KEY, JSON.stringify({
          active: true,
          level: currentLevel,
          mode: gameMode,
          ts: Date.now()
        }));
      } else {
        localStorage.removeItem(SESSION_HEARTBEAT_KEY);
      }
    }catch(e){}
  }

  // Call when gameplay becomes visible (menu hidden) - starts stamping
  // "still alive" every HEARTBEAT_INTERVAL_MS until stopSessionHeartbeat()
  // is called.
  function startSessionHeartbeat(){
    _writeSessionHeartbeat(true);
    if(_heartbeatTimer) clearInterval(_heartbeatTimer);
    _heartbeatTimer = setInterval(() => _writeSessionHeartbeat(true), HEARTBEAT_INTERVAL_MS);
  }

  // Call whenever gameplay is left in any KNOWN, clean way (menu opened,
  // backgrounded, app exited) so that path is never mistaken for a crash.
  function stopSessionHeartbeat(){
    if(_heartbeatTimer){ clearInterval(_heartbeatTimer); _heartbeatTimer = null; }
    _writeSessionHeartbeat(false);
  }

  // Run once at boot, before anything else touches the heartbeat flag.
  function checkForAbnormalPreviousSession(){
    try{
      const raw = localStorage.getItem(SESSION_HEARTBEAT_KEY);
      if(!raw) return;
      localStorage.removeItem(SESSION_HEARTBEAT_KEY); // never ask twice about the same session
      const data = JSON.parse(raw);
      if(!data || !data.active) return;
      const ageSec = Math.max(0, Math.round((Date.now() - (data.ts || 0)) / 1000));
      const send = window.confirm(
        'The app seems to have closed unexpectedly last time (Level ' + data.level +
        ', ' + data.mode + ' mode). Send a report about last session?'
      );
      if(send){
        reportBug(null, null,
          'Previous session ended abnormally (no clean exit/pause detected) - ' +
          'Level ' + data.level + ' (' + data.mode + '), last heartbeat ~' + ageSec + 's before termination.'
        );
      }
    }catch(e){}
  }

  // Normal backgrounding (home button, app-switch, screen lock) fires this
  // with JS still alive, so it's indistinguishable from a deliberate pause -
  // treat it as clean. Only a kill that skips this event entirely (ANR/OOM)
  // will be flagged as abnormal on the next launch.
  document.addEventListener('visibilitychange', function(){
    try{
      if(document.hidden){
        stopSessionHeartbeat();
      } else if(gameStarted && document.getElementById('menuScreen').style.display === 'none'){
        // Coming back to the foreground mid-play - resume the heartbeat.
        startSessionHeartbeat();
      }
    }catch(e){}
  });

  // Catches genuine crashes (uncaught exceptions / unhandled promise
  // rejections) - not the many small try/catch warnings already logged
  // elsewhere in this file for non-fatal things like a sound failing to
  // load, which don't need a report.
  window.addEventListener('error', function(evt){
    try{
      const now = Date.now();
      if(now - _lastAutoBugReportTime < AUTO_BUG_REPORT_COOLDOWN_MS) return;
      _lastAutoBugReportTime = now;
      _bugReportToast('⚠️ Something went wrong - opening a bug report to send.');
      reportBug(evt && (evt.message || (evt.error && evt.error.message)), evt && evt.error && evt.error.stack);
    }catch(e){}
  });
  window.addEventListener('unhandledrejection', function(evt){
    try{
      const now = Date.now();
      if(now - _lastAutoBugReportTime < AUTO_BUG_REPORT_COOLDOWN_MS) return;
      _lastAutoBugReportTime = now;
      const reason = evt && evt.reason;
      const msg = (reason && reason.message) ? reason.message : String(reason);
      const stack = (reason && reason.stack) ? reason.stack : '';
      _bugReportToast('⚠️ Something went wrong - opening a bug report to send.');
      reportBug(msg, stack);
    }catch(e){}
  });

  // ---- Sound effects ----
  const ARROW_VOLUME = 0.2;      // 0.0 (silent) - 1.0 (full volume)
  const LEVEL_PASS_VOLUME = 0.5;
  const arrowSound = new Audio('Arrow.mp3');
  const levelPassSound = new Audio('LevelPass.mp3');

  const errorSound = new Audio('Error.mp3');
  const gameOverSound = new Audio('GameOver.mp3');
  errorSound.volume = 0.3;
  gameOverSound.volume = 0.5;

  arrowSound.volume = ARROW_VOLUME;
  levelPassSound.volume = LEVEL_PASS_VOLUME;

    arrowSound.preload = 'none';
    levelPassSound.preload = 'none';
    errorSound.preload = 'none';
    gameOverSound.preload = 'none';

    arrowSound.load();
    levelPassSound.load();
    errorSound.load();
    gameOverSound.load();

  // Log load failures early (bad path/missing file/unsupported format) -
  // these show up in chrome://inspect when debugging the Cordova WebView.
  [arrowSound, levelPassSound, errorSound, gameOverSound].forEach(s => {
    s.addEventListener('error', () => {
      console.warn('Failed to load sound:', s.src, s.error);
    });
  });

  // Mobile WebViews (Cordova/Capacitor included) commonly refuse the very
  // first programmatic .play() call unless it happens inside a "real" user
  // gesture - and even then some WebView versions are stricter than desktop
  // browsers about what counts. The standard fix is to "unlock" each

      // window.webkit.messageHandlers.exitApp.postMessage(null)
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.exitApp) {
          window.webkit.messageHandlers.exitApp.postMessage(null);
          return;
      }

      // No native wrapper detected: we're running as a plain web page
      // (desktop or mobile browser tab). Modern browsers deliberately
      // block scripts from closing a tab the user opened themselves -
      // this is a security restriction, not a bug, and no website can
      // override it. window.close() only succeeds on a tab/window
      // that was itself opened by a script (window.open).
      //
      // The reassign-opener trick below (window.open('', '_self') then
      // window.close()) makes the browser treat this tab as
      // script-opened, which does let some mobile browsers close it.
      // It still won't work everywhere, so we always follow up with a
      // visible message rather than silently doing nothing.
      try {
          window.open('', '_self');
          window.close();
      } catch (err) {
          // ignore - handled by the fallback message below
      }

      setTimeout(() => {
          if (!document.hidden) {
              showPopup(
                  "Exit",
                  "Your browser doesn't allow this page to close its own tab. Please close the tab manually to exit.",
                  null
              );
          }
      }, 150);
  }

  // previously-decided state back from storage.
  function initReviewPromptState(){
    const existing = loadReviewPromptState();
    if(existing){

  // ---- "New version available" checker ----
  // Cordova apps have no built-in way to learn a new version was published
  // - unlike a native app using Play's In-App Update API, there's no
  // signal from the OS. This works around that with a tiny version.json
  // file hosted externally (e.g. on GitHub Pages/raw.githubusercontent.com)
  // that gets bumped by hand alongside each Play Store release. The app
  // just polls it and compares against its own baked-in version.
  //
  // IMPORTANT: bump APP_VERSION here to match config.xml's version="..."
  // on every release, and update the hosted JSON's "latestVersion" to the
  // same value AFTER the new build is live on Play Store (not before -

  const APP_VERSION = '2.3.0';

  // Returns the player's current LOCAL calendar date as "YYYY-MM-DD" (not
  // UTC) so "once a day" lines up with when the player's day actually
  // rolls over on their device, not with a fixed UTC midnight.
  function localDateString(d){
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return `${yyyy}-${mm}-${dd}`;
  }

  // Simple numeric "x.y.z" comparison - returns true if `a` is newer than `b`.
  function isVersionNewer(a, b){
    const pa = String(a).split('.').map(n => parseInt(n, 10) || 0);
    const pb = String(b).split('.').map(n => parseInt(n, 10) || 0);
    const len = Math.max(pa.length, pb.length);
    for(let i = 0; i < len; i++){
      const va = pa[i] || 0, vb = pb[i] || 0;
      if(va > vb) return true;
      if(va < vb) return false;
    }
    return false;
  }

  function maybeShowWhatsNew(retriesLeft){
    if(retriesLeft === undefined) retriesLeft = 6; // ~3s of backoff, then give up until next launch
    const seen = getSeenWhatsNewIds();
    const next = WHATS_NEW_ITEMS.find(item => !seen.includes(item.id));
    if(!next) return;
    // Don't stack on top of another full-screen popup that's already up
    // (update-available, hosted announcement, or a gameplay popup) -
    // just wait a moment and try again on the next check instead of
    // showing two overlays at once.

      if(retriesLeft > 0) setTimeout(() => maybeShowWhatsNew(retriesLeft - 1), 500);

  function maybeShowAnnouncement(data, updatePopupShown){
    if(updatePopupShown) return;
    if(!data || !data.announcement || typeof data.announcement.id !== 'string') return;
    if(!data.announcement.text) return;

    const seenId = localStorage.getItem(ANNOUNCEMENT_SEEN_KEY);
    if(seenId === data.announcement.id) return;

  function checkForUpdate(){
    const today = localDateString(new Date());
    const lastCheckDay = localStorage.getItem(UPDATE_CHECK_COOLDOWN_KEY);
    if(lastCheckDay === today) return; // already checked once today - skip

    fetch(VERSION_CHECK_URL, { cache: 'no-store' })
        .then(res => res.json())
        .then(data => {
            localStorage.setItem(UPDATE_CHECK_COOLDOWN_KEY, today);
            if(!data) return;

            let updatePopupShown = false;
            if(typeof data.latestVersion === 'string' && isVersionNewer(data.latestVersion, APP_VERSION)){
                showUpdateAvailablePopup(data.message);
                updatePopupShown = true;

                // Only fire the tray notification once per newly-seen version,
                // not every single time the popup happens to show again.
                const alreadyNotified = localStorage.getItem(UPDATE_NOTIFIED_KEY);
                if(alreadyNotified !== data.latestVersion){
                    fireUpdateSystemNotification(data.latestVersion, data.message);
                    localStorage.setItem(UPDATE_NOTIFIED_KEY, data.latestVersion);
                }
            }

            maybeShowAnnouncement(data, updatePopupShown);
        })
        .catch(err => {
            console.warn('[update check] failed:', err);
        });
  }

  // Old APKs could leave a broken Level-25 board in localStorage. Since
  // localStorage survives an APK update, simply replacing buildFallbackLayout()
  // is NOT enough: the fixed APK may never call the generator at all because
  // it resumes that already-generated board. Reject old/malformed boards here
  // and force the current generator to create a fresh board.
  function isPathologicallyStraightBoard(data){
      try{
          const rows = Number(data.rows);
          const cols = Number(data.cols);
          const paths = Array.isArray(data.paths) ? data.paths : [];
          if(!rows || !cols || !paths.length) return false;

          // Detect the old broken fallback exactly: one full-width horizontal
          // path per row, alternating directions. This is deliberately strict
          // so legitimate hand-generated/random boards are not discarded.
          if(paths.length !== rows) return false;

          for(let r = 0; r < rows; r++){
              const p = paths[r];
              if(!p || p.cells.length !== cols) return false;

              for(let i = 0; i < cols; i++){
                  const cell = p.cells[i];
                  if(!Array.isArray(cell) || cell[0] !== r) return false;
                  const expectedCol = (r % 2 === 0) ? i : (cols - 1 - i);
                  if(cell[1] !== expectedCol) return false;
              }

              const expectedDir = (r % 2 === 0) ? 'right' : 'left';
              if(p.headDir !== expectedDir) return false;
          }
          return true;
      }catch(e){
          return false;
      }
  }

  function loadGameState(){
    try{
      const raw = localStorage.getItem(SAVE_KEY);
      if(!raw) return false;

      const data = JSON.parse(raw);
      if(!data || !data.grid || !data.paths) return false;

      // IMPORTANT: APK updates do not clear WebView localStorage.
      // Reject saves created before the current board-generator version.
      // This is what prevents a broken Level-25 board from surviving an
      // update and being shown again even though the generator is fixed.
      if(data.saveSchemaVersion !== SAVE_SCHEMA_VERSION ||
         data.boardGeneratorVersion !== BOARD_GENERATOR_VERSION ||
         isPathologicallyStraightBoard(data)){
          localStorage.removeItem(SAVE_KEY);
          return false;
      }

      gameMode = data.mode || gameMode;
      activeBoardMode = gameMode;
      currentLevel = data.level || 1;
      lives = data.lives || 3;
      dailyChallengeActive = !!data.dailyActive;
      dailyChallengeDate = data.dailyDate || null;
      ROWS = data.rows;
      COLS = data.cols;
      grid = data.grid;
      pathsMap = new Map(data.paths.map(p => [p.id, p]));
      progressMade = !!data.progressMade;

      if(typeof data.levelArrowTotal === 'number' && typeof data.shuffleCheckpointIndex === 'number'){
          levelArrowTotal = data.levelArrowTotal;
          shuffleCheckpointIndex = data.shuffleCheckpointIndex;
      } else {
          levelArrowTotal = pathsMap.size;
          shuffleCheckpointIndex = getShuffleCheckpointsForMode(gameMode).length;
      }

      return true;
    }catch(e){
      try{ localStorage.removeItem(SAVE_KEY); }catch(_){}
      return false;
    }
  }

  function clearGameState(){

  // Snapshots the currently-live board (grid/pathsMap/etc.) into
  // modeBoardCache under whichever mode it actually belongs to
  // (activeBoardMode), so it can be restored later instead of lost.
  // No-op for Daily Challenge boards or when no real board is loaded yet.
  function saveActiveModeBoardToCache(){
      if(dailyChallengeActive || activeBoardMode === null) return;
      modeBoardCache[activeBoardMode] = {
          level: currentLevel,
          lives: lives,
          rows: ROWS,
          cols: COLS,
          minArrowLength: MIN_ARROW_LENGTH,
          maxSteps: MAX_STEPS,
          grid: grid,
          paths: Array.from(pathsMap.values()),
          progressMade: progressMade,
          levelArrowTotal: levelArrowTotal,
          shuffleCheckpointIndex: shuffleCheckpointIndex

  }

  // Restores a previously-cached board for `mode` into the live globals, as
  // if it had never been left. Returns false (no-op) if that mode has no
  // cached board - e.g. it's never been played this session, or its board
  // was already fully cleared and the cache entry consumed.
  function restoreModeBoardFromCache(mode){
      const cached = modeBoardCache[mode];
      if(!cached) return false;
      gameMode = mode;
      activeBoardMode = mode;
      currentLevel = cached.level;
      lives = cached.lives;
      ROWS = cached.rows;
      COLS = cached.cols;
      MIN_ARROW_LENGTH = cached.minArrowLength;
      MAX_STEPS = cached.maxSteps;
      grid = cached.grid;
      pathsMap = new Map(cached.paths.map(p => [p.id, p]));
      progressMade = cached.progressMade;
      levelArrowTotal = cached.levelArrowTotal;
      shuffleCheckpointIndex = cached.shuffleCheckpointIndex;
      // Same reset as a fresh level start (startNewGameNow()) - any tap
      // animation mid-flight from whatever was on screen before switching
      // modes shouldn't carry over onto this restored board.
      leaving = [];
      bumping = [];
      flashing = new Set();
      return true;

  const DIRS = {
    right: {dx:1, dy:0},
    down:  {dx:0, dy:1},
    left:  {dx:-1,dy:0},
    up:    {dx:0, dy:-1},
  };
  const DIR_NAMES = Object.keys(DIRS);
  const OPPOSITE = {right:'left', left:'right', up:'down', down:'up'};

  // ---- Deterministic per-level randomness ----
  // Every level (identified by mode+level number) must always generate the
  // exact same board, every single time it's played - whether that's
  // replaying it back-to-back or coming back to it after 10 other levels.
  // So instead of the raw Math.random(), all generation code below draws
  // from `rng()`, a seeded PRNG that gets reseeded from (mode, level)
  // right before a layout is built. Same seed in -> same board out, always.

  // simple string hash -> 32-bit seed (cyrb53-lite)
  function hashSeed(str){
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for(let i=0;i<str.length;i++){
      const ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1>>>16), 2246822507) ^ Math.imul(h2 ^ (h2>>>13), 3266489909);
    return (h1 >>> 0);
  }

  // mulberry32: small, fast, deterministic PRNG
  function mulberry32(seed){
    let a = seed >>> 0;
    return function(){
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  let rng = Math.random; // replaced by seedLevelRng() before every generation

  function seedLevelRng(mode, level){
    rng = mulberry32(hashSeed(mode + ':' + level));
  }

    // ---- Level difficulty scaling ----
    function getLevelConfig(mode, level){
      const base = MODES[mode];
      // Board size (rows/cols) is fixed for every mode, including Hard -
      // it no longer grows with level. Hard boards used to grow up to 6
      // rows / 3 cols bigger by level 25, but bigger boards made the
      // generator's solvability search fail far more often within its
      // search budget, which triggered the guaranteed-solvable-but-ugly
      // buildFallbackLayout() (arrows only ever pointing left/right) much
      // more frequently on high Hard levels. Keeping the board fixed-size
      // removes that failure mode entirely rather than just reducing it.
      // Raised from the original (baseline 7/cap 12, floor 4/random-base 7)
      // so the smallest arrows the generator aims for are meaningfully
      // longer - tested empirically (see buildLayout's best-of-N search
      // below) to keep generation fast and stub arrows rare at this level.
      // Pushing this further starts fighting the generator: boards can't
      // always be perfectly tiled by long paths, so being too aggressive
      // here actually produces MORE small leftover arrows, not fewer (this
      // was tested directly: tripling this value not only made generation
      // ~5x slower on Hard, it *still* left several 1-cell stub arrows on
      // the board, because those come from isolated leftover cells during
      // generation - a separate problem from this target, fixed instead in
      // growCandidate's isolation-avoidance weighting and buildLayout's
      // best-of-N search below). This bump (18->22 cap, 10-12->11-14
      // target range) is deliberately modest for the same reason - it
      // makes the deep end of Hard mode noticeably tougher and more
      // winding without repeating that mistake.
      const maxSteps = Math.min(ARROW_MAX_LENGTH_CAP, ARROW_MAX_LENGTH_BASE + Math.floor((level - 1) / 4));
      const minArrowLength = Math.max(ARROW_MIN_LENGTH_FLOOR, Math.min(maxSteps - 2, Math.floor(rng() * ARROW_MIN_LENGTH_RANDOM_SPAN) + ARROW_MIN_LENGTH_RANDOM_BASE));
      return {
        rows: base.rows,
        cols: base.cols,
        minArrowLength,
        maxSteps
      };
    }

    function applyLevelConfig(){
      if(dailyChallengeActive && dailyChallengeDate){
        const cfg = getDailyLevelConfig(dailyChallengeDate); // seeds rng() itself
        ROWS = cfg.rows;
        COLS = cfg.cols;
        MIN_ARROW_LENGTH = cfg.minArrowLength;
        MAX_STEPS = cfg.maxSteps;
        return;
      }
      seedLevelRng(gameMode, currentLevel);
      const cfg = getLevelConfig(gameMode, currentLevel);
      ROWS = cfg.rows;
      COLS = cfg.cols;
      MIN_ARROW_LENGTH = cfg.minArrowLength;
      MAX_STEPS = cfg.maxSteps;
    }

      gameMode = mode;

       function isBrokenGeneratedLayout(layout){
           try{
               if(!layout || !Array.isArray(layout.paths)) return true;
               const rows = ROWS, cols = COLS, paths = layout.paths;
               if(paths.length !== rows) return false;
               for(let r = 0; r < rows; r++){
                   const p = paths[r];
                   if(!p || p.cells.length !== cols) return false;
                   for(let i = 0; i < cols; i++){
                       const cell = p.cells[i];
                       const expectedCol = (r % 2 === 0) ? i : (cols - 1 - i);
                       if(!cell || cell[0] !== r || cell[1] !== expectedCol) return false;
                   }
                   if(p.headDir !== ((r % 2 === 0) ? 'right' : 'left')) return false;
               }
               return true;
           }catch(e){

           }

                  // just set by applyLevelConfig() above from the same

                  // re-assert them defensively from the cached copy.
                  ROWS = cached.rows;
                  COLS = cached.cols;

  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(rng()*(i+1));
      [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr;
  }

  function directionBetween(r0,c0,r1,c1){
    const dr = r1-r0, dc = c1-c0;
    for(const name of DIR_NAMES){
      const d = DIRS[name];
      if(d.dx===dc && d.dy===dr) return name;
    }
    return null;
  }

  // flips which end of a path is the head, without changing which cells it covers
  function flipPath(path){
    const cells = path.cells.slice().reverse();
    let headDir;
    if(cells.length >= 2){
      const [r0,c0] = cells[cells.length-2];
      const [r1,c1] = cells[cells.length-1];
      headDir = directionBetween(r0,c0,r1,c1);
    } else {
      headDir = OPPOSITE[path.headDir];
    }
    return {id: path.id, cells, headDir};
  }

  function edgeMatches(r,c,dir){
    if(dir==='up') return r===0;
    if(dir==='down') return r===ROWS-1;
    if(dir==='left') return c===0;
    if(dir==='right') return c===COLS-1;
    return false;
  }

  // ---- raw generation: partition the grid into bent, non-overlapping pipe paths ----
  // Cells are started in order of "most constrained first" (fewest free
  // neighbors) rather than pure random order. This means tight corners get
  // absorbed into a real, visible path while there's still room to grow,
  // instead of being left over at the end as tiny near-invisible 1-cell stubs.
  //
  // SOLVABILITY IS BUILT IN, NOT CHECKED AFTERWARDS:
  // a path's own body never blocks its own exit (see hasClearExit, which
  // ignores the path's own cells), so whether a given end of a path has a
  // clear line off the board depends ONLY on paths already committed to the
  // grid before it - never on anything placed later. So as each new path is
  // grown, we require that at least one of its two ends (head or tail)
  // already has a clear exit through everything placed so far, and commit
  // it using that end as the head. That guarantees the whole board is fully
  // clearable, in the reverse of build order, no matter what gets placed
  // around it afterwards - by construction, not by luck. On large/tight
  // boards (e.g. late Hard levels) this is what keeps generation from
  // repeatedly failing and dropping to the plain straight-line fallback.
  function rawGenerate(){
    const grid = Array.from({length: ROWS}, () => Array(COLS).fill(-1));
    const paths = [];

    function freeNeighborCount(r,c){
      let cnt = 0;
      for(const name of DIR_NAMES){
        const d = DIRS[name];
        const nr = r+d.dy, nc = c+d.dx;
        if(nr<0||nr>=ROWS||nc<0||nc>=COLS) continue;
        if(grid[nr][nc] === -1) cnt++;
      }
      return cnt;
    }

    function pickStartCell(){
      let bestCount = Infinity, bestCandidates = [];
      for(let r=0;r<ROWS;r++){
        for(let c=0;c<COLS;c++){
          if(grid[r][c] !== -1) continue;
          const cnt = freeNeighborCount(r,c);
          if(cnt < bestCount){ bestCount = cnt; bestCandidates = [[r,c]]; }
          else if(cnt === bestCount){ bestCandidates.push([r,c]); }
        }
      }
      if(bestCandidates.length === 0) return null;
      return bestCandidates[Math.floor(rng()*bestCandidates.length)];
    }

    // grow one candidate shape from (sr,sc) without touching the shared grid,
    // so a shape that doesn't pan out can be thrown away and retried with no
    // cleanup - only cells vs already-FINISHED paths are checked against grid.
    function growCandidate(sr, sc){
      const cells = [[sr,sc]];
      const occupied = new Set([sr+','+sc]);
      let lastDir = null;

      function touchesSelf(nr, nc, r, c){
        for(const name of DIR_NAMES){
          const d = DIRS[name];
          const ar = nr+d.dy, ac = nc+d.dx;
          if(ar===r && ac===c) continue; // the connecting cell we just came from - always fine
          if(occupied.has(ar+','+ac)) return true;
        }
        return false;
      }

      // How many of (r,c)'s orthogonal neighbours are still free, given a
      // hypothetical extra set of cells this path is about to occupy. Used
      // to spot moves that would wall a free cell in on every side.
      function freeNeighborCount(r, c, hypotheticalOccupied){
        let count = 0;
        for(const name of DIR_NAMES){
          const d = DIRS[name];
          const ar = r+d.dy, ac = c+d.dx;
          if(ar<0||ar>=ROWS||ac<0||ac>=COLS) continue;
          if(grid[ar][ac] !== -1) continue;
          if(hypotheticalOccupied.has(ar+','+ac)) continue;
          count++;
        }
        return count;
      }

      while(cells.length < MAX_STEPS){
        const [r,c] = cells[cells.length-1];

        const candidates = [];
        for(const name of DIR_NAMES){
          const d = DIRS[name];
          const nr = r+d.dy, nc = c+d.dx;
          if(nr<0||nr>=ROWS||nc<0||nc>=COLS) continue;
          if(grid[nr][nc] !== -1) continue;               // occupied by an earlier, finished path
          if(occupied.has(nr+','+nc)) continue;            // occupied by this same path
          if(lastDir && name === OPPOSITE[lastDir]) continue; // never backtrack
          if(touchesSelf(nr, nc, r, c)) continue;          // head/body must never touch itself
          // Hard mode (and Daily Challenge, which is built on Hard's
          // sizing) gets extra turn bias for noticeably more winding,
          // harder-to-trace paths - Easy/Medium keep their original,
          // already-tuned straightness untouched. This only shapes path
          // *geometry*, not whether a solvable exit exists (guaranteed
          // separately - see buildLayout/resolveConflicts), so it makes
          // boards trickier to read without ever risking a dead board.
          let w = (gameMode === 'hard') ? 5 : 3; // favour turning over continuing straight
          if(lastDir === name) w = 1;

          // Penalize moves that would wall off a neighbouring free cell with
          // no free neighbours of its own left - that cell would become an
          // isolated 1-cell island no path can ever reach, which is exactly
          // what turns into an unmergeable stub arrow later. Not an outright
          // ban (a rare board might have no other option), just a strong
          // discouragement so the generator routes around holes instead of
          // creating them.
          const hypothetical = new Set(occupied);
          hypothetical.add(nr+','+nc);
          for(const name2 of DIR_NAMES){
            const d2 = DIRS[name2];
            const ar = nr+d2.dy, ac = nc+d2.dx;
            if(ar<0||ar>=ROWS||ac<0||ac>=COLS) continue;
            if(grid[ar][ac] !== -1) continue;
            if(hypothetical.has(ar+','+ac)) continue;
            if(freeNeighborCount(ar, ac, hypothetical) === 0){
              w *= 0.03;
              break;
            }
          }

          candidates.push({name, d, nr, nc, w});
        }
        if(candidates.length === 0) break;
          // ---------- Minimum arrow length ----------
          // MIN_ARROW_LENGTH scales with level (see getLevelConfig / applyLevelConfig)

          // Don't allow the generator to stop until the minimum length is reached.
          if (cells.length >= MIN_ARROW_LENGTH) {

              // Lower base chance (and gentler growth) than before, so arrows
              // don't all bunch up right at MIN_ARROW_LENGTH - most paths
              // now grow noticeably past the minimum before stopping, which
              // keeps a single board from being dominated by short arrows.
              const stopChance = 0.05 + (cells.length - MIN_ARROW_LENGTH) * 0.03;

              if (rng() < stopChance)
                  break;
          }

        const totalW = candidates.reduce((s,x)=>s+x.w,0);
        let r2 = rng()*totalW;
        let pick = candidates[0];
        for(const cand of candidates){ if(r2 < cand.w){ pick = cand; break; } r2 -= cand.w; }

        cells.push([pick.nr, pick.nc]);
        occupied.add(pick.nr+','+pick.nc);
        lastDir = pick.name;
      }

      return {cells, lastDir};
    }

    // true if a straight line off the board from this end is clear of every
    // path already committed to the grid (a path's own cells never count)
    function hasClearExit(cells, dir){
      const [r,c] = cells[cells.length-1];
      const d = DIRS[dir];
      let rr=r+d.dy, cc=c+d.dx;
      while(rr>=0 && rr<ROWS && cc>=0 && cc<COLS){
        if(grid[rr][cc] !== -1) return false;
        rr+=d.dy; cc+=d.dx;
      }
      return true;
    }

    let start;
    while((start = pickStartCell())){
      const [sr,sc] = start;
      let best = null;

      for(let attempt=0; attempt<40 && !best; attempt++){
        const {cells, lastDir} = growCandidate(sr, sc);

        if(cells.length >= 2){
          const [r0,c0] = cells[cells.length-2];
          const [r1,c1] = cells[cells.length-1];
          const tailEndDir = lastDir || directionBetween(r0,c0,r1,c1);
          if(tailEndDir && hasClearExit(cells, tailEndDir)){
            best = {cells, headDir: tailEndDir};
            break;
          }
          const flippedCells = cells.slice().reverse();
          const [fr0,fc0] = flippedCells[flippedCells.length-2];
          const [fr1,fc1] = flippedCells[flippedCells.length-1];
          const headEndDir = directionBetween(fr0,fc0,fr1,fc1);
          if(headEndDir && hasClearExit(flippedCells, headEndDir)){
            best = {cells: flippedCells, headDir: headEndDir};
            break;
          }
        } else {
          // single-cell stub: any of the 4 directions can serve as its head
          for(const name of shuffle(DIR_NAMES.slice())){
            if(hasClearExit(cells, name)){
              best = {cells, headDir: name};
              break;
            }
          }
        }
      }

      // extremely rare corner case: even after retries neither end is clear -
      // keep the last grown shape as-is rather than looping forever here;
      // mergeStubs / the outer solvability check will catch anything left over
      if(!best){
        const {cells, lastDir} = growCandidate(sr, sc);
        best = {cells, headDir: lastDir || DIR_NAMES[Math.floor(rng()*DIR_NAMES.length)]};
      }

      const pathId = paths.length;
      for(const [cr,cc] of best.cells) grid[cr][cc] = pathId;
      paths.push({id: pathId, cells: best.cells, headDir: best.headDir});
    }

    return {grid, paths};
  }

  // a chain is valid if every step is a single orthogonal move, no cell repeats,
  // and no cell is edge-adjacent to another cell of the chain except its immediate neighbour
  function isValidChain(cells){
    for(let i=1;i<cells.length;i++){
      const [r0,c0] = cells[i-1], [r1,c1] = cells[i];
      const dr = Math.abs(r1-r0), dc = Math.abs(c1-c0);
      if(!((dr===1&&dc===0)||(dr===0&&dc===1))) return false;
    }
    const seen = new Set(cells.map(([r,c]) => r+','+c));
    if(seen.size !== cells.length) return false;
    for(let i=0;i<cells.length;i++){
      const [r,c] = cells[i];
      for(const name of DIR_NAMES){
        const d = DIRS[name];
        const ar = r+d.dy, ac = c+d.dx;
        const idx = cells.findIndex(([rr,cc]) => rr===ar && cc===ac);
        if(idx === -1) continue;
        if(idx !== i-1 && idx !== i+1) return false;
      }
    }
    return true;
  }

  // try to graft a too-short stub path onto an adjacent path's head or tail,
  // so nearly every cell ends up part of a proper, clearly-visible arrow
  function tryMergeStub(grid, byId, stub){
    for(const attachEnd of [0, stub.cells.length-1]){
      const [ar,ac] = stub.cells[attachEnd];
      for(const name of DIR_NAMES){
        const d = DIRS[name];
        const nr = ar+d.dy, nc = ac+d.dx;
        if(nr<0||nr>=ROWS||nc<0||nc>=COLS) continue;
        const neighborId = grid[nr][nc];
        if(neighborId === -1 || neighborId === stub.id) continue;
        const neighborPath = byId.get(neighborId);
        if(!neighborPath) continue;

        const tail = neighborPath.cells[0];
        const head = neighborPath.cells[neighborPath.cells.length-1];

        // Check the HEAD first. When the neighbour is itself a single-cell
        // stub, its tail and head are the same cell, so attaching there
        // always moves what becomes the new head end and headDir MUST be
        // recomputed. Checking tail first (the old order) mistook that
        // case for a tail-only attach and left the stale headDir in
        // place, which is what produced a misplaced/misaligned arrowhead
        // on some boards (e.g. Hard level 2).
        if(head[0]===nr && head[1]===nc){
          // attach at the neighbour's head — recompute headDir
          const extension = attachEnd === 0 ? stub.cells : stub.cells.slice().reverse();
          const newCells = neighborPath.cells.concat(extension);
          if(newCells.length > MAX_STEPS + 4) continue;
          if(!isValidChain(newCells)) continue;

          const [r0,c0] = newCells[newCells.length-2];
          const [r1,c1] = newCells[newCells.length-1];
          const newHeadDir = directionBetween(r0,c0,r1,c1);
          if(!newHeadDir) continue;

          for(const [cr,cc] of stub.cells) grid[cr][cc] = neighborPath.id;
          neighborPath.cells = newCells;
          neighborPath.headDir = newHeadDir;
          byId.delete(stub.id);
          return true;

        } else if(tail[0]===nr && tail[1]===nc){
          // attach at the neighbour's tail — headDir is unaffected
          const newCells = attachEnd === 0
            ? stub.cells.slice().reverse().concat(neighborPath.cells)
            : stub.cells.slice().concat(neighborPath.cells);
          if(newCells.length > MAX_STEPS + 4) continue;
          if(!isValidChain(newCells)) continue;

          for(const [cr,cc] of stub.cells) grid[cr][cc] = neighborPath.id;
          neighborPath.cells = newCells;
          byId.delete(stub.id);
          return true;
        }
      }
    }
    return false;
  }

  // graft as many too-short stubs as possible onto neighbouring paths
  function mergeStubs(grid, paths){
    const byId = new Map(paths.map(p => [p.id, p]));
    let changed = true, iter = 0;
    while(changed && iter < 500){
      changed = false; iter++;
      const stubs = [...byId.values()].filter(p => p.cells.length < MIN_ARROW_LENGTH);
      for(const stub of stubs){
        if(!byId.has(stub.id)) continue;
        if(tryMergeStub(grid, byId, stub)) changed = true;
      }
    }
    return [...byId.values()];
  }

  // RULE: two arrows sharing a row/column can never point straight at one
  // another head-to-head, no matter how far apart they are
  function findConflicts(paths){
    const conflicts = [];
    const byRow = new Map(), byCol = new Map();
    for(const p of paths){
      const [r,c] = p.cells[p.cells.length-1];
      if(p.headDir === 'left' || p.headDir === 'right'){
        if(!byRow.has(r)) byRow.set(r, []);
        byRow.get(r).push({p, c});
      }
      if(p.headDir === 'up' || p.headDir === 'down'){
        if(!byCol.has(c)) byCol.set(c, []);
        byCol.get(c).push({p, r});
      }
    }
    for(const [, arr] of byRow){
      for(let i=0;i<arr.length;i++) for(let j=i+1;j<arr.length;j++){
        const A = arr[i], B = arr[j];
        let leftOne=null, rightOne=null;
        if(A.p.headDir==='right' && B.p.headDir==='left'){ rightOne=A; leftOne=B; }
        else if(A.p.headDir==='left' && B.p.headDir==='right'){ rightOne=B; leftOne=A; }
        else continue;
        if(rightOne.c < leftOne.c) conflicts.push([rightOne.p.id, leftOne.p.id]);
      }
    }
    for(const [, arr] of byCol){
      for(let i=0;i<arr.length;i++) for(let j=i+1;j<arr.length;j++){
        const A = arr[i], B = arr[j];
        let topOne=null, bottomOne=null;
        if(A.p.headDir==='down' && B.p.headDir==='up'){ topOne=A; bottomOne=B; }
        else if(A.p.headDir==='up' && B.p.headDir==='down'){ topOne=B; bottomOne=A; }
        else continue;
        if(topOne.r < bottomOne.r) conflicts.push([topOne.p.id, bottomOne.p.id]);
      }
    }
    return conflicts;
  }

  // resolve "face to face" conflicts by flipping one arrow of each pair, one at a time
  function resolveConflicts(paths, protectedId){
    const byId = new Map(paths.map(p => [p.id, p]));
    const flipCounts = new Map();
    for(let iter=0; iter<2000; iter++){
      const conflicts = findConflicts([...byId.values()]);
      if(conflicts.length === 0) return {paths: [...byId.values()], ok: true};
      const [a,b] = conflicts[0];
      const pa = byId.get(a), pb = byId.get(b);
      let flipId;
      if(a === protectedId) flipId = b;
      else if(b === protectedId) flipId = a;
      else {
        const ca = flipCounts.get(a) || 0, cb = flipCounts.get(b) || 0;
        if(ca !== cb) flipId = ca < cb ? a : b;
        else flipId = pa.cells.length <= pb.cells.length ? a : b; // flip the shorter one: less likely to cascade
      }
      byId.set(flipId, flipPath(byId.get(flipId)));
      flipCounts.set(flipId, (flipCounts.get(flipId)||0) + 1);
    }
    return {paths: [...byId.values()], ok: false};
  }

  // ensure at least one arrow already has a clear, unobstructed path off the board
  function findClearCandidate(paths){
    for(const p of paths){
      const [r,c] = p.cells[p.cells.length-1];
      if(edgeMatches(r,c,p.headDir)) return p.id;
    }
    for(let i=0;i<paths.length;i++){
      const flipped = flipPath(paths[i]);
      const [r,c] = flipped.cells[flipped.cells.length-1];
      if(edgeMatches(r,c,flipped.headDir)){
        paths[i] = flipped;
        return flipped.id;
      }
    }
    return null;
  }

// guaranteed-instant, always-solvable layout used only as a last resort if
// random generation can't find a valid board quickly (can happen on very
// large, highly-constrained boards at high levels)
function buildFallbackLayout(){
    // Last-resort layout. This must NEVER look like the old repeated
    // straight/U-row fallback.  Use randomized 3-row serpentine bands,
    // with the board split into left/right zones.  Every arrow touches a
    // real outer edge and contains multiple turns, while each zone is
    // completely independent, so the layout is still guaranteed solvable.
    const grid = Array.from({length: ROWS}, () => Array(COLS).fill(-1));
    const paths = [];
    let pathId = 0;
    let clearId = 0;

    function addPath(cells, headDir){
        const id = pathId++;
        for(const [r,c] of cells) grid[r][c] = id;
        paths.push({id, cells, headDir});
        if(paths.length === 1) clearId = id;
    }

    function makeThreeRowSnake(r0, r1, c0, c1, exitSide, flip){
        const h = r1 - r0 + 1;
        const w = c1 - c0 + 1;
        if(h < 3 || w < 2) return null;

        const rows = [];
        for(let r=r0; r<=r1; r++) rows.push(r);
        if(flip) rows.reverse();

        const cells = [];
        const goRightFirst = exitSide === 'right' ? (rows.length % 2 === 1) : (rows.length % 2 === 0);
        for(let i=0; i<rows.length; i++){
            const r = rows[i];
            const forward = (i % 2 === 0) ? goRightFirst : !goRightFirst;
            if(forward){
                for(let c=c0; c<=c1; c++) cells.push([r,c]);
            }else{
                for(let c=c1; c>=c0; c--) cells.push([r,c]);
            }
        }

        const [lr, lc] = cells[cells.length - 1];
        let headDir = null;
        if(lr === r0 && lc === c0) headDir = 'left';
        else if(lr === r0 && lc === c1) headDir = 'right';
        else if(lr === r1 && lc === c0) headDir = 'left';
        else if(lr === r1 && lc === c1) headDir = 'right';

        // A horizontal exit only works when the zone itself touches the
        // corresponding board edge. For our left/right split that is true.
        if(headDir !== exitSide) return null;
        return {cells, headDir};
    }

    // Build 3-row bands. Randomize the band height between 3 and 4 rows,
    // and vary the left/right split slightly. This makes emergency boards
    // visibly different from one another instead of producing a repeated
    // template. The RNG is the same seeded level RNG used everywhere else.
    let r = 0;
    let firstBand = true;
    while(r < ROWS){
        let remaining = ROWS - r;
        let bandH = remaining >= 4 && rng() < 0.35 ? 4 : 3;
        if(remaining < 3) bandH = remaining;
        if(bandH < 3) break;

        const baseSplit = Math.floor(COLS / 2);
        const splitShift = (COLS >= 8 && rng() < 0.5) ? (rng() < 0.5 ? -1 : 1) : 0;
        const split = Math.max(3, Math.min(COLS - 3, baseSplit + splitShift));

        // Randomize which side's snake starts in which orientation.  Both
        // zones still terminate at their own outer board edge.
        const leftFlip = rng() < 0.5;
        const rightFlip = rng() < 0.5;

        const left = makeThreeRowSnake(r, r + bandH - 1, 0, split - 1, 'left', leftFlip);
        const right = makeThreeRowSnake(r, r + bandH - 1, split, COLS - 1, 'right', rightFlip);

        if(left) addPath(left.cells, left.headDir);
        if(right) addPath(right.cells, right.headDir);

        r += bandH;
        firstBand = false;
    }

    // If an unusual custom board has fewer than 3 rows, use a two-row
    // serpentine only as the final tiny-board safety case. Production Hard
    // boards are much taller, so this branch is never used for Level 25.
    if(paths.length === 0 && ROWS > 0 && COLS > 0){
        const cells = [];
        for(let c=0;c<COLS;c++) cells.push([0,c]);
        if(ROWS > 1){
            cells.push([1,COLS-1]);
            for(let c=COLS-2;c>=0;c--) cells.push([1,c]);
        }
        addPath(cells, 'left');
    }

    return {grid, paths, clearId};
}

// fast=true trims the search budget down - used for mid-game checkpoint
// reshuffles, which (unlike a fresh level) run synchronously on the main
// thread in the middle of a tap, on top of an already-large Hard board.
// The full budget could take ~1.5-2s there, freezing input long enough
// that a player's next tap lands on the wrong (post-shuffle) arrow.
// Trimmed too aggressively, though, this budget runs out before finding
// ANY solvable candidate far too often, silently falling back to the emergency serpentine layout (buildFallbackLayout) instead -
// these numbers are tuned to keep that fallback rare while still roughly
// halving worst-case time versus the non-fast path.
function buildLayout(fast, timeBudgetOverrideMs){

    let attempts = 0;
    // Bounded so a bad board can never hang the game. Low-end devices get
    // a smaller budget - the search still finds a valid board (or falls
    // back to buildFallbackLayout(), which is instant either way), just
    // with less CPU time spent chasing a marginally tidier layout.
    // NOTE: TIME_BUDGET_MS below is the real safety net against hanging -
    // this attempt cap is just a secondary guard and should stay high
    // enough to rarely (ideally never) be the thing that actually ends
    // the search. It used to be far lower (150 for fast=true, 250
    // otherwise) and could get hit well before TIME_BUDGET_MS was used
    // up - each attempt only costs low single-digit ms even on an 18x12
    // Hard board, so 250 attempts could burn out in well under a second,
    // long before the ~2.5s time budget. When that happened the search
    // gave up and fell back to buildFallbackLayout(), whose serpentine
    // bands only ever produce left/right-facing arrows - that's what
    // showed up as "all arrows left & right". Verified empirically
    // against every Hard level from 1-200 that this higher ceiling lets
    // the real generator find a valid layout every time, with
    // TIME_BUDGET_MS (not this cap) as the actual bound reached on the
    // rare harder seeds.
    const MAX_ATTEMPTS = isLowEndDevice() ? 500 : 2000;

    // Hard wall-clock cap alongside the attempt cap. A slow CPU can take
    // far longer *per attempt* than a fast one, so an attempt-count cap
    // alone doesn't actually bound how long this blocks the main thread -
    // and a long synchronous block is exactly what triggers Android's
    // "App Not Responding" dialog, which the OS can then force-close on
    // some devices (looking to the player like the game just exits with
    // no warning). Bounding by elapsed time instead caps worst-case block
    // time the same way on every device, however slow.
    // Callers that run synchronously mid-gameplay (no loading overlay to
    // mask the block - e.g. reshuffleRemainingArrows) pass a much tighter
    // override here instead of relying on the default budget. The default
    // 2500ms is only acceptable behind startNewGameNow's loading overlay;
    // mid-tap it's long enough to read as a hang, cause queued taps to be
    // dropped, and on some devices trip Android's ANR watchdog (which can
    // force-close the app - see the mid-tap call site for details).
    const TIME_BUDGET_MS = timeBudgetOverrideMs != null ? timeBudgetOverrideMs : (isLowEndDevice() ? 1200 : 2500);
    const _genStart = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();

    // The random-walk generator can't guarantee every cell lands in a path
    // >= MIN_ARROW_LENGTH - some short "stub" arrows are inherent to filling
    // a grid this way, and simply raising MIN_ARROW_LENGTH further only
    // makes full-board tiling harder (producing MORE stubs, not fewer).
    // Goal here is "as few sub-floor stubs as achievable", not a hard zero
    // guarantee: instead of taking the first solvable layout found, keep
    // searching (bounded by MAX_VALID_CANDIDATES/MAX_ATTEMPTS/TIME_BUDGET_MS
    // below, so this can never hang) and remember whichever solvable layout
    // has the fewest sub-floor stubs, stopping the instant a fully clean
    // (zero sub-floor stubs) layout is found. If the budget runs out first,
    // the least-bad layout found so far is used - occasionally still a
    // small arrow, but as rare as the search budget allows, and never at
    // the cost of leaving empty, untiled space on the board or blocking
    // the main thread indefinitely.
    let best = null;
    let bestTinyCount = Infinity;
    let validCandidates = 0;
    // Raised from 3/8 - more valid candidates get compared before settling,
    // so tiny arrows show up less often. Still fully bounded by the same
    // MAX_ATTEMPTS/TIME_BUDGET_MS wall-clock cap either way, so this can't
    // introduce the freeze/ANR-on-back-press class of bug fixed earlier.
    const MAX_VALID_CANDIDATES = fast ? 5 : 12;

    while(true){

        attempts++;

        if(attempts > MAX_ATTEMPTS){
            return best || buildFallbackLayout();
        }

        // Checked every few attempts rather than every single one, so the
        // clock read itself stays negligible overhead.
        if(attempts % 5 === 0){
            const now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
            if(now - _genStart > TIME_BUDGET_MS){
                return best || buildFallbackLayout();
            }
        }

        const {grid, paths: rawPaths} = rawGenerate();
        const paths = mergeStubs(grid, rawPaths);

        // "Tiny" = shorter than the configured minimum (ARROW_MIN_LENGTH_FLOOR),
        // not a fixed literal - so this always matches whatever the min-length
        // constants near the top of the file are currently set to.
        const tinyCount = paths.filter(p => p.cells.length < ARROW_MIN_LENGTH_FLOOR).length;

        // Cheap pre-filter: once we already have a confirmed solvable
        // candidate, skip the expensive validation pipeline (conflict
        // resolution + full solvability simulation) for boards that are
        // already no better than it on tiny-stub count.
        if(best && tinyCount >= bestTinyCount) continue;

        const clearId = findClearCandidate(paths);
        if(clearId===null) continue;

        const resolved = resolveConflicts(paths, clearId);
        if(!resolved.ok) continue;

        // simulate the whole puzzle
        const simGrid = grid.map(r=>r.slice());
        const remaining = new Map();

        for(const p of resolved.paths)
            remaining.set(p.id, structuredClone(p));

        let removed = 0;

        while(true){

            let found = false;
