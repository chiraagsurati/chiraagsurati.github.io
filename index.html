<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script>
// Deliberately the very first thing on the page, before anything else
// loads, and deliberately written in the oldest, plainest JS possible
// (var, function expressions, string concatenation - no const/let, arrow
// functions, template literals, etc) so it has the best possible chance
// of running even on a device where the MAIN game script fails entirely
// (a syntax error in a later <script> tag still fires this handler,
// since parse errors propagate to the global error handler same as
// runtime errors).
//
// Without this, a device where the game fails to start just shows a
// silent blank/white screen - impossible to diagnose remotely. With it,
// the actual error message and where it happened get shown directly on
// screen, so a screenshot from an affected device tells us exactly what
// broke instead of just "it doesn't open".
(function(){
    var shown = false;
    function showFatalError(title, detail){
        if(shown) return; // only show the first error, don't spam
        shown = true;
        try{
            var box = document.createElement('div');
            box.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;' +
                'background:#1a1a2e;color:#fff;z-index:2147483647;' +
                'font-family:sans-serif;font-size:14px;line-height:1.5;' +
                'padding:20px;overflow:auto;box-sizing:border-box;';
            var html = '<div style="font-size:18px;font-weight:bold;margin-bottom:12px;">' +
                'Arrow Puzzle ran into a problem starting up</div>' +
                '<div style="margin-bottom:14px;">Please take a screenshot of this ' +
                'screen and share it - it tells us exactly what went wrong.</div>' +
                '<div style="background:#000;padding:10px;border-radius:6px;' +
                'font-family:monospace;font-size:12px;white-space:pre-wrap;' +
                'word-break:break-word;">' + title + '\n\n' + detail + '</div>';
            box.innerHTML = html;
            if(document.body){
                document.body.appendChild(box);
            } else {
                document.addEventListener('DOMContentLoaded', function(){
                    document.body.appendChild(box);
                });
            }
        }catch(e){
            // last resort if even building the overlay fails
            try{ document.title = 'Error: ' + title; }catch(e2){}
        }
    }
    window.addEventListener('error', function(evt){
        var detail = '';
        if(evt && evt.message) detail += 'Message: ' + evt.message + '\n';
        if(evt && evt.filename) detail += 'File: ' + evt.filename + ':' + evt.lineno + ':' + evt.colno + '\n';
        if(evt && evt.error && evt.error.stack) detail += 'Stack: ' + evt.error.stack;
        showFatalError('Script error', detail || 'No details available');
    });
    window.addEventListener('unhandledrejection', function(evt){
        var reason = evt && evt.reason;
        var detail = 'Reason: ' + (reason && reason.stack ? reason.stack : String(reason));
        showFatalError('Unhandled promise rejection', detail);
    });
})();
</script>

<script>
(function(){
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const boardViewport = document.getElementById('boardViewport');
  const boardFrame = document.getElementById('boardFrame');

  // ---- Sound effects ----
  const ARROW_VOLUME = 0.2;      // 0.0 (silent) - 1.0 (full volume)
  const LEVEL_PASS_VOLUME = 0.5;
  const arrowSound = new Audio('Arrow.mp3');
  const levelPassSound = new Audio('LevelPass.mp3');

  const errorSound = new Audio('Error.mp3');
  const gameOverSound = new Audio('GameOver.mp3');
  errorSound.volume = 0.3;
  gameOverSound.volume = 0.5;

  arrowSound.volume = ARROW_VOLUME;
  levelPassSound.volume = LEVEL_PASS_VOLUME;

    arrowSound.preload = 'auto';
    levelPassSound.preload = 'auto';
    errorSound.preload = 'auto';
    gameOverSound.preload = 'auto';

  // Log load failures early (bad path/missing file/unsupported format) -
  // these show up in chrome://inspect when debugging the Cordova WebView.
  [arrowSound, levelPassSound, errorSound, gameOverSound].forEach(s => {
    s.addEventListener('error', () => {
      console.warn('Failed to load sound:', s.src, s.error);
    });
  });

  // Mobile WebViews (Cordova/Capacitor included) commonly refuse the very
  // first programmatic .play() call unless it happens inside a "real" user
  // gesture - and even then some WebView versions are stricter than desktop
  // browsers about what counts. The standard fix is to "unlock" each
  // <audio> element with a silent play+pause during the first touch the
  // user makes anywhere on the page; every .play() call after that unlock
  // is then allowed to go through normally.
  let audioUnlocked = false;
  function unlockAudio(){
    if(audioUnlocked) return;
    audioUnlocked = true;
    [arrowSound, levelPassSound, errorSound, gameOverSound].forEach(s => {
      const p = s.play();
      if(p && p.catch){
        p.then(() => { s.pause(); s.currentTime = 0; })
         .catch(err => console.warn('Audio unlock failed:', s.src, err));
      }
    });
    document.removeEventListener('touchstart', unlockAudio);
    document.removeEventListener('pointerdown', unlockAudio);
  }
  document.addEventListener('touchstart', unlockAudio, {once:true});
  document.addEventListener('pointerdown', unlockAudio, {once:true});

  const SOUND_MODES = {
    sound: { label: '🔊 Sound', playSound: true, vibrate: false },
    vibration: { label: '📳 Vibration', playSound: false, vibrate: true },
    mute: { label: '🔇 Mute', playSound: false, vibrate: false }
  };
  let soundMode = 'sound';

  function setSoundMode(mode){
    if(!SOUND_MODES[mode]) return;
    soundMode = mode;
    const shouldPlaySound = SOUND_MODES[mode].playSound;
    arrowSound.muted = !shouldPlaySound;
    levelPassSound.muted = !shouldPlaySound;
    errorSound.muted = !shouldPlaySound;
    gameOverSound.muted = !shouldPlaySound;
    updateMuteButton();
  }

  function updateMuteButton(){
    const muteBtn = document.getElementById('muteBtn');
    if(muteBtn) muteBtn.textContent = SOUND_MODES[soundMode].label;
  }

  function triggerHapticFeedback(){
    if(!SOUND_MODES[soundMode].vibrate) return;
    if(navigator.vibrate){
      const ok = navigator.vibrate(120);
      if(!ok) console.warn('[vibrate] navigator.vibrate(120) returned false - call was rejected (likely missing android.permission.VIBRATE, or not called directly inside the gesture handler)');
    } else {
      console.warn('[vibrate] navigator.vibrate is undefined on this device/WebView');
    }
  }

  function playSound(sound){
    if(!SOUND_MODES[soundMode].playSound) return;
    // rewind so rapid repeats (e.g. clearing several arrows quickly) don't
    // get cut off by a still-playing previous instance
    try{
      sound.currentTime = 0;
      sound.play().catch(err => console.warn('Sound blocked/failed:', sound.src, err));
    }catch(e){ console.warn('Sound error:', sound.src, e); }
  }

      // ---- Config (tweak freely later) ----
    let COLS = 10;
    let ROWS = 15;
    let gameMode = "medium";
    const MODES = {
        easy: {
            rows: 8,
            cols: 6
        },
        medium: {
            rows: 12,
            cols: 8
        },
        hard: {
            rows: 16,
            cols: 12
        }
    };
  const PIPE_COLOR = '#2c2f4a';
  let MAX_STEPS = 13;            // hard cap on how many cells one path can cover (scales with level)
  let MIN_ARROW_LENGTH = 15;      // min cells per path (scales with level)
  let lives = 3;
  // While a mode checkpoint reshuffle is computing (can take a noticeable moment
  // on a big board) the main thread is blocked, so the OS/browser queues
  // up any taps that happen during that freeze and delivers them the
  // instant it's free again - by which point the board has changed under
  // the player's finger. handleTap() ignores anything that arrives before
  // this timestamp so those stray queued taps can't land on the wrong,
  // just-reshuffled arrow and cost a life.
  let inputBlockedUntil = 0;
  let gameStarted = false;
  let progressMade = false; // true once at least one arrow has actually been cleared this level
  let currentLevel = 1;
  // Timestamp (performance.now()) the current level actually became
  // playable - set in startNewGameNow(). Used to compute elapsed time on
  // level clear for the personal-best tracker below. Not persisted across
  // an app restart mid-level, so resuming after fully closing the app
  // simply skips the time comparison for that one clear (levelStartTime
  // stays null) rather than showing a bogus/inflated time.
  let levelStartTime = null;
  // Tracks whether we've pushed an extra 'game' entry onto the browser history
  // stack on top of the base 'menu' entry, so the device/browser back button
  // returns to the menu instead of exiting the page while playing.
  let inGameHistoryState = false;
  // Zoom/pan state for the board (lets players zoom in to see crowded
  // arrows clearly and avoid mis-tapping the wrong pipe).
  let boardZoom = 1, boardPanX = 0, boardPanY = 0;
  const MIN_ZOOM = 1, MAX_ZOOM = 2.6;
  let maxUnlockedLevel = { easy: 1, medium: 1, hard: 1 };
  // Arrow texture pattern selection. 'auto' follows the level-based tier
  // (existing behaviour); any other value pins the board to that specific
  // pattern regardless of level, until the player switches back to Auto
  // Select. unlockedPatternTiers is how many ARROW_PATTERN_TYPES entries
  // (from the start) are available to pick in the Pattern menu - tracked
  // PER MODE, so clearing levels in Easy only unlocks patterns for Easy;
  // Medium and Hard each build up their own tier count independently.
  let selectedPatternType = 'auto';
  let unlockedPatternTiers = { easy: 1, medium: 1, hard: 1 };
  // Whether the arrow-path grid overlay is on (toggled via the Grid button
  // beside the zoom controls); remembered across sessions like the mute
  // preference.
  let showGrid = false;
  // Total number of level-clear events (all modes, replays included) since
  // this counter was introduced - drives the review-prompt timing below.
  let totalLevelsCleared = 0;

  // ---- Daily Challenge / Gold Coins / Board Themes ----
  // dailyChallengeActive/dailyChallengeDate mark that the player is
  // currently inside a Daily Challenge run rather than a normal
  // Easy/Medium/Hard level - applyLevelConfig(), updateLevelLabel() and
  // checkLevelComplete() all branch on this instead of touching the
  // normal per-mode level ladder (maxUnlockedLevel etc), so Daily runs
  // never interfere with normal progression.
  let dailyChallengeActive = false;
  let dailyChallengeDate = null; // 'YYYY-MM-DD' (UTC) of the day being played
  let goldCoins = 0;
  let ownedThemes = ['classic'];
  let equippedTheme = 'classic';

  // ---- persistence ----
  const PROGRESS_KEY = 'arrowPuzzleProgress';
  const DAILY_KEY = 'arrowPuzzleDaily';       // {'YYYY-MM-DD': true, ...} completed days
  const COINS_KEY = 'arrowPuzzleCoins';       // integer, stored as string
  const THEME_KEY = 'arrowPuzzleTheme';       // {owned:[ids], equipped:id}
  const SAVE_KEY = 'arrowPuzzleSave';
  const GRID_PREF_KEY = 'arrowPuzzleShowGrid';
  const REVIEW_KEY = 'arrowPuzzleReviewPrompt';

  // ---- Daily play streak ----
  const STREAK_KEY = 'arrowPuzzleStreak';

  function getLocalDateString(d){
    // Local calendar date (not UTC), so the streak lines up with whatever
    // day it actually is for the player, not wherever the server clock is.
    const yr = d.getFullYear();
    const mo = String(d.getMonth() + 1).padStart(2, '0');
    const dy = String(d.getDate()).padStart(2, '0');
    return `${yr}-${mo}-${dy}`;
  }

  // Called once per app boot. Bumps the streak if the player was last here
  // yesterday, resets to 1 if they skipped a day (or this is day one),
  // and leaves it alone if they've already been counted today. Shows a
  // small toast on 2+ day streaks - a fresh streak of 1 isn't worth
  // celebrating yet.
  function updateStreakAndMaybeToast(){
    let state = { count: 0, lastPlayedDate: null };
    try{
        const raw = localStorage.getItem(STREAK_KEY);
        if(raw) state = JSON.parse(raw);
    }catch(e){}

    const today = getLocalDateString(new Date());
    if(state.lastPlayedDate === today){
        updateStreakBadge(state.count);
        return; // already counted today
    }

    const yesterday = getLocalDateString(new Date(Date.now() - 86400000));
    state.count = (state.lastPlayedDate === yesterday) ? (state.count || 0) + 1 : 1;
    state.lastPlayedDate = today;

    try{ localStorage.setItem(STREAK_KEY, JSON.stringify(state)); }catch(e){}

    updateStreakBadge(state.count);
    if(state.count >= 2) showStreakToast(state.count);
  }

  // Persistent top-left badge (mirrors the coin badge on the top-right) so
  // the streak stays visible at a glance instead of only flashing by in

  function updateStreakBadge(count){
    const el = document.getElementById('streakBadge');
    if(!el) return;
    el.textContent = '\uD83D\uDD25 ' + (count || 0);
    el.style.display = 'block';

  // Plays the drop-hold-slide entrance once for both top badges together,
  // called a single time at boot after both have their content/display
  // already set (see call site near the end of the boot sequence).
  // Re-triggering this is safe (class removal + reflow restarts the
  // animation cleanly) but it's only ever called once per app launch.
  function playBadgeBootEntrance(){
    for(const id of ['streakBadge', 'coinBadge']){
        const el = document.getElementById(id);
        if(!el || el.style.display === 'none') continue;
        el.classList.remove('badge-enter');
        void el.offsetWidth; // force reflow so the removed class re-triggers
        el.classList.add('badge-enter');
        el.addEventListener('animationend', function onEnd(){
            el.classList.remove('badge-enter');
            el.removeEventListener('animationend', onEnd);
        });
    }
  }

  function showStreakToast(count){
    const old = document.getElementById("streakToast");
    if(old) old.remove();

    toast.id = "streakToast";
    toast.style.cssText = `

  // ---- Personal-best level times ----
  const BEST_TIMES_KEY = 'arrowPuzzleBestTimes';
  // { "easy:1": 12345, "hard:7": 98765, ... } - elapsed ms from when a
  // level became playable to when its last arrow cleared.
  let bestTimes = {};

  function loadBestTimes(){
    try{
      const raw = localStorage.getItem(BEST_TIMES_KEY);
      if(raw) bestTimes = JSON.parse(raw) || {};
    }catch(e){ bestTimes = {}; }

  // ---- Daily Challenge ----
  // First playable day. Dates before this never appear in the calendar.
  const DAILY_CHALLENGE_START = '2026-08-01';

  function toDateStr(d){
    return d.getUTCFullYear() + '-' + String(d.getUTCMonth()+1).padStart(2,'0') + '-' + String(d.getUTCDate()).padStart(2,'0');
  }
  function getTodayDateStr(){
    const now = new Date();
    return toDateStr(new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate())));
  }
  // Sat/Sun -> Very Hard, weekdays -> Hard. Based on the UTC calendar date
  // so every player sees the same difficulty for the same date regardless
  // of local timezone (the board itself is date-seeded the same way).
  function getDailyDifficultyTier(dateStr){
    const dow = new Date(dateStr + 'T00:00:00Z').getUTCDay();
    return (dow === 0 || dow === 6) ? 'veryhard' : 'hard';
  }
  function formatDailyDateLabel(dateStr){
    return new Date(dateStr + 'T00:00:00Z').toLocaleDateString(undefined, {month:'short', day:'numeric', timeZone:'UTC'});
  }
  // ---- Low-end device detection ----
  // Cordova WebViews are Chromium-based, so navigator.deviceMemory is
  // usually available and reports RAM in GB (rounded down to a power-of-2
  // bucket: 0.25/0.5/1/2/4/8...). hardwareConcurrency is a weaker signal on
  // its own (a Snapdragon 439, e.g., is octa-core but still low-end), so
  // it's only used as a fallback when deviceMemory isn't reported at all.
  // Used to skip optional/background work (like pre-warming extra Daily
  // Challenge boards) that isn't needed for the game to run, just nice
  // to have on capable devices.
  let _isLowEndDeviceCached = null;
  function isLowEndDevice(){
    if(_isLowEndDeviceCached !== null) return _isLowEndDeviceCached;
    // Default to "assume low-end" when neither detection API is available,
    // rather than "assume high-end". Older/fragmented Android WebViews
    // (exactly the devices most likely to actually be low-end) are also
    // the ones most likely to lack navigator.deviceMemory support, so
    // defaulting to the permissive/high-end assumption when detection
    // fails was silently giving the least-capable, undetectable devices
    // the LARGEST generation time budgets - the opposite of what's safe.
    let result = true;
    try{
      if(typeof navigator.deviceMemory === 'number'){
        result = navigator.deviceMemory <= 3;
      } else if(typeof navigator.hardwareConcurrency === 'number'){
        result = navigator.hardwareConcurrency <= 2;
      }
    }catch(e){}
    _isLowEndDeviceCached = result;
    return result;
  }

  // Last 7 playable days (today first), clamped so nothing before
  // DAILY_CHALLENGE_START is ever included.
  function getDailyChallengeDates(){
    const dates = [];
    const now = new Date();
    const todayUTC = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
    const startUTC = new Date(DAILY_CHALLENGE_START + 'T00:00:00Z');
    if(todayUTC < startUTC) return dates;
    for(let i = 0; i < 7; i++){
      const d = new Date(todayUTC);
      d.setUTCDate(d.getUTCDate() - i);
      if(d < startUTC) break;
      dates.push(toDateStr(d));
    }
    return dates;
  }
  function seedDailyRng(dateStr){
    rng = mulberry32(hashSeed('daily:' + dateStr));
  }
  // Board sizing for a given day - reuses the EXISTING, already-tested
  // Hard-mode scaling curve (getLevelConfig) rather than inventing new
  // row/col/maxSteps numbers. Deliberately mapped to modest virtual levels
  // (not Hard's max-growth level) - the biggest Hard boards are the
  // slowest for buildLayout to generate, and a Daily board has to be ready
  // fast since the player is waiting on it, not grinding through a ladder.
  function getDailyLevelConfig(dateStr){
    const tier = getDailyDifficultyTier(dateStr);
    const virtualLevel = tier === 'veryhard' ? 13 : 9; // growth 3 vs growth 2 - noticeably bigger than base Hard, well short of the slow max-growth boards
    seedDailyRng(dateStr); // must run before getLevelConfig's internal rng() jitter call
    const cfg = getLevelConfig('hard', virtualLevel);
    return {rows: cfg.rows, cols: cfg.cols, minArrowLength: cfg.minArrowLength, maxSteps: cfg.maxSteps, tier};
  }

  // ---- Daily board pre-generation cache ----
  // Building a board (especially Hard/Very Hard sized) can take a
  // noticeable moment - rather than making the player wait after they tap
  // a date, generate it ahead of time while the app is just sitting on the
  // menu (see the boot-time call to precomputeDailyBoard below) and hand
  // over the ready-made result instantly. ROWS/COLS/etc are the same
  // globals buildLayout() reads everywhere else, so they're saved and
  // restored around the call - since this all runs synchronously in one
  // JS turn, nothing else can render or read them in between.
  let dailyBoardCache = {}; // dateStr -> {rows, cols, grid, paths}

  function precomputeDailyBoard(dateStr){
    if(!dateStr || dailyBoardCache[dateStr]) return;
    const savedRows = ROWS, savedCols = COLS, savedMinLen = MIN_ARROW_LENGTH, savedMaxSteps = MAX_STEPS;
    try{
      const cfg = getDailyLevelConfig(dateStr); // seeds rng() itself
      ROWS = cfg.rows; COLS = cfg.cols; MIN_ARROW_LENGTH = cfg.minArrowLength; MAX_STEPS = cfg.maxSteps;
      const layout = buildLayout(true);
      dailyBoardCache[dateStr] = {rows: ROWS, cols: COLS, grid: layout.grid, paths: layout.paths};
    }catch(e){
      // Background/opportunistic work only - if it fails for any reason
      // (low memory, unexpected board size, etc) just skip the cache.
      // startNewGameNow() falls back to generating the board itself
      // on-demand when nothing's cached, so play is never blocked by this.
      console.error('[daily] background precompute failed for', dateStr, e);
    }finally{
      ROWS = savedRows; COLS = savedCols; MIN_ARROW_LENGTH = savedMinLen; MAX_STEPS = savedMaxSteps;
    }
  }
  function loadDailyCompletions(){
    try{
      const raw = localStorage.getItem(DAILY_KEY);
      return raw ? (JSON.parse(raw) || {}) : {};
    }catch(e){ return {}; }
  }
  function isDailyCompleted(dateStr){
    return !!loadDailyCompletions()[dateStr];
  }
  function markDailyCompleted(dateStr){
    try{
      const data = loadDailyCompletions();
      data[dateStr] = true;
      localStorage.setItem(DAILY_KEY, JSON.stringify(data));
    }catch(e){}
  }
  function startDailyChallenge(dateStr){
    dailyChallengeActive = true;
    dailyChallengeDate = dateStr;
    gameMode = 'hard'; // base family for sizing; actual size comes from getDailyLevelConfig
    gameStarted = true;
    startNewGame();
  }

  // ---- Gold Coins ----

  // ---- Board Themes ----
  function loadThemeState(){
    try{
      const raw = localStorage.getItem(THEME_KEY);
      if(raw){
        const data = JSON.parse(raw);
        if(Array.isArray(data.owned) && data.owned.length) ownedThemes = data.owned;
        if(typeof data.equipped === 'string') equippedTheme = data.equipped;
      }
    }catch(e){}
    if(!ownedThemes.includes('classic')) ownedThemes.push('classic');
    if(TESTING_UNLOCK_ALL_THEMES) ownedThemes = BOARD_THEMES.map(t => t.id);
    if(!BOARD_THEME_MAP[equippedTheme]) equippedTheme = 'classic';
    applyBoardTheme(equippedTheme);
  }
  function saveThemeState(){
    try{ localStorage.setItem(THEME_KEY, JSON.stringify({owned: ownedThemes, equipped: equippedTheme})); }catch(e){}
  }
  function applyBoardTheme(id){
    const theme = BOARD_THEME_MAP[id] || BOARD_THEME_MAP.classic;
    document.documentElement.style.setProperty('--board-bg', theme.bg);
    document.documentElement.style.setProperty('--dot', theme.dot);
    // Cache the raw values here too - draw()/drawDotGrid() read these every
    // animation frame, and calling getComputedStyle() that often forces a
    // style recalc for no reason since applyBoardTheme() is the only place
    // these ever change. Updated in the one spot that already knows the
    // new values, so there's no extra work at startup - just skips redoing
    // it 60x/sec in the render loop.
    cachedBoardBg = theme.bg;
    cachedDotColor = theme.dot;
    if(typeof invalidateDotGrid === 'function') invalidateDotGrid();
  }
  function buyTheme(id){
    const theme = BOARD_THEME_MAP[id];
    if(!theme || ownedThemes.includes(id) || goldCoins < theme.cost) return false;
    goldCoins -= theme.cost;
    saveCoins();
    ownedThemes.push(id);
    equippedTheme = id;
    saveThemeState();
    applyBoardTheme(id);
    updateCoinBadge();
    return true;
  }
  function equipTheme(id){
    if(!ownedThemes.includes(id)) return false;
    equippedTheme = id;
    saveThemeState();
    applyBoardTheme(id);
    return true;
  }

  // ms -> "12.4s" under a minute, "1:05" for a minute or more.
  function formatElapsedTime(ms){
    const totalSeconds = ms / 1000;
    if(totalSeconds < 60) return totalSeconds.toFixed(1) + 's';
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = Math.round(totalSeconds % 60);
    return minutes + ':' + String(seconds).padStart(2, '0');
  }

  // Records the just-finished level's time if levelStartTime is available,
  // updates the best if it's an improvement, and returns a small HTML
  // snippet to show under "Starting next level..." - or '' if there's
  // nothing to show (e.g. app was restarted mid-level so there's no
  // reliable start timestamp for this particular clear).
  function recordLevelTimeAndGetHtml(mode, level){
    if(levelStartTime == null) return '';

    const elapsed = performance.now() - levelStartTime;
    levelStartTime = null;
    if(elapsed <= 0 || !isFinite(elapsed)) return '';

    const key = getBestTimeKey(mode, level);
    const prevBest = bestTimes[key];
    const isNewBest = prevBest == null || elapsed < prevBest;
    if(isNewBest){
        bestTimes[key] = elapsed;
        saveBestTimes();
    }

    const timeStr = formatElapsedTime(elapsed);
    const bestStr = formatElapsedTime(isNewBest ? elapsed : prevBest);

    return `<div style="font-size:12px; font-weight:normal; opacity:0.85; margin-top:6px;">
        ⏱ ${timeStr}${isNewBest
            ? ' <span style="color:#ffb020; font-weight:700;">New Best!</span>'
            : ` (Best: ${bestStr})`}
    </div>`;
  }

  // Closes the app. Tries every native wrapper bridge we might be running
  // under, falling back to a plain-browser-tab close attempt. Shared by the
  // Exit button and the "auto-exit after rating" flow below.
  function exitApp(){
      // Cordova / PhoneGap wrapped app.
      if (window.cordova && navigator.app) {
          navigator.app.exitApp();
          return;
      }

      // Capacitor wrapped app.
      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
          window.Capacitor.Plugins.App.exitApp();
          return;
      }

      // Common WebView "app builder" tools (Median/GoNative/Appilix/
      // WebIntoApp and similar) each expose their own global bridge.
      // Try the well-known ones in case this page was packaged with
      // one of them.
      if (window.median && typeof window.median.exitApp === 'function') {
          window.median.exitApp();
          return;
      }
      if (typeof window.gonative_exit_app === 'function') {
          window.gonative_exit_app();
          return;
      }
      if (window.Appilix && typeof window.Appilix.exitApp === 'function') {
          window.Appilix.exitApp();
          return;
      }
      if (window.Android && typeof window.Android.exitApp === 'function') {
          window.Android.exitApp();
          return;
      }
      if (window.Android && typeof window.Android.close === 'function') {
          window.Android.close();
          return;
      }

      // Custom Android WebView JS bridge, e.g.
      // webView.addJavascriptInterface(new Object(){ @JavascriptInterface public void exitApp(){...} }, "AndroidApp");
      if (window.AndroidApp && typeof window.AndroidApp.exitApp === 'function') {
          window.AndroidApp.exitApp();
          return;
      }

      // Custom iOS WKWebView message handler, e.g.
      // window.webkit.messageHandlers.exitApp.postMessage(null)
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.exitApp) {
          window.webkit.messageHandlers.exitApp.postMessage(null);
          return;
      }

      // No native wrapper detected: we're running as a plain web page
      // (desktop or mobile browser tab). Modern browsers deliberately
      // block scripts from closing a tab the user opened themselves -
      // this is a security restriction, not a bug, and no website can
      // override it. window.close() only succeeds on a tab/window
      // that was itself opened by a script (window.open).
      //
      // The reassign-opener trick below (window.open('', '_self') then
      // window.close()) makes the browser treat this tab as
      // script-opened, which does let some mobile browsers close it.
      // It still won't work everywhere, so we always follow up with a
      // visible message rather than silently doing nothing.
      try {
          window.open('', '_self');
          window.close();
      } catch (err) {
          // ignore - handled by the fallback message below
      }

      setTimeout(() => {
          if (!document.hidden) {
              showPopup(
                  "Exit",
                  "Your browser doesn't allow this page to close its own tab. Please close the tab manually to exit.",
                  null
              );
          }
      }, 150);
  }

  const PLAY_STORE_URL = 'https://play.google.com/store/apps/details?id=com.chiraagsurati.arrowpuzzle';

  // How many levels after the trigger point before asking again if the

  const REVIEW_SNOOZE_LEVELS = 10;

  // { nextPromptAtLevel, dismissedForever } - persisted so the target level

  // initReviewPromptState() once totalLevelsCleared is known at boot.
  let reviewPromptState = null;

  function loadReviewPromptState(){
    try{
      const raw = localStorage.getItem(REVIEW_KEY);

    }catch(e){}
    return null;
  }

  // Decides WHEN to first ask for a rating: after 20-30 levels cleared, for
  // everyone (new installs and existing players alike), so the prompt never
  // shows up before someone has had a real chance to get into the game.
  // Runs at most once per install: after the first run it just loads the
  // previously-decided state back from storage.
  function initReviewPromptState(){
    const existing = loadReviewPromptState();
    if(existing){
      reviewPromptState = existing;
      return;
    }

    const randomBetween = (min, max) => min + Math.floor(Math.random() * (max - min + 1));
    const levelsFromNow = randomBetween(20, 30);

    reviewPromptState = {
        nextPromptAtLevel: totalLevelsCleared + levelsFromNow,
        dismissedForever: false
    };
    saveReviewPromptState();
  }

  // Opens an external https:// URL (Play Store, etc) via Android's native
  // Intent system rather than the game's own WebView. Plain
  // `window.location.href` to an external URL has been found to still
  // break the WebView on some real devices even with the <allow-intent>
  // whitelist in config.xml covering it (that whitelist governs whether
  // Cordova *permits* the navigation, not how reliably every WebView
  // build actually hands it off externally) - cordova.InAppBrowser with
  // the '_system' target is the field-tested reliable path. Falls back to
  // a plain new-tab open when running outside Cordova (e.g. testing this
  // file directly in a desktop browser), where InAppBrowser doesn't exist.
  function openExternalUrl(url){
    try{
      if(window.cordova && window.cordova.InAppBrowser && typeof window.cordova.InAppBrowser.open === 'function'){
        window.cordova.InAppBrowser.open(url, '_system');
        return;
      }
    }catch(e){
      console.warn('[openExternalUrl] InAppBrowser open failed, falling back:', e);
    }
    try{
      window.open(url, '_blank');
    }catch(e){
      console.warn('[openExternalUrl] window.open failed, falling back to location.href:', e);
      window.location.href = url;
    }
  }

  // Opens the Play Store listing. https:// links are already covered by
  // this app's <allow-intent> whitelist in config.xml, so this hands off
  // to the Play Store app (or browser) externally rather than navigating

  function openPlayStoreForReview(){

  // ---- "New version available" checker ----
  // Cordova apps have no built-in way to learn a new version was published
  // - unlike a native app using Play's In-App Update API, there's no
  // signal from the OS. This works around that with a tiny version.json
  // file hosted externally (e.g. on GitHub Pages/raw.githubusercontent.com)
  // that gets bumped by hand alongside each Play Store release. The app
  // just polls it and compares against its own baked-in version.
  //
  // IMPORTANT: bump APP_VERSION here to match config.xml's version="..."
  // on every release, and update the hosted JSON's "latestVersion" to the
  // same value AFTER the new build is live on Play Store (not before -
  // otherwise players get nagged to update before the update even exists
  // on the Store yet).
  const APP_VERSION = '2.2.1';

  // Replace with wherever you actually host this file - e.g. a raw GitHub
  // URL to a version.json committed in your own repo:
  //   https://raw.githubusercontent.com/<you>/<repo>/main/version.json
  // File contents should look like:
  //   { "latestVersion": "2.0.5", "message": "New patterns and fixes!" }
  const VERSION_CHECK_URL = 'https://raw.githubusercontent.com/chiraagsurati/arrow-puzzle-meta/main/version.json';

  const UPDATE_NOTIFIED_KEY = 'arrowPuzzleUpdateNotifiedVersion';
  const UPDATE_CHECK_COOLDOWN_KEY = 'arrowPuzzleUpdateCheckLast';
  const UPDATE_CHECK_COOLDOWN_MS = 6 * 60 * 60 * 1000; // don't hit the JSON more than once per 6h

  // Simple numeric "x.y.z" comparison - returns true if `a` is newer than `b`.
  function isVersionNewer(a, b){
    const pa = String(a).split('.').map(n => parseInt(n, 10) || 0);
    const pb = String(b).split('.').map(n => parseInt(n, 10) || 0);
    const len = Math.max(pa.length, pb.length);
    for(let i = 0; i < len; i++){
      const va = pa[i] || 0, vb = pb[i] || 0;
      if(va > vb) return true;
      if(va < vb) return false;
    }
    return false;
  }

  function openPlayStoreForUpdate(){
    openExternalUrl(PLAY_STORE_URL);
  }

  // Fires a real system-tray notification (so players see it even if

  // (no trigger) scheduling - foreground:true makes it show even while
  // the app itself is open, not just when backgrounded.
  function fireUpdateSystemNotification(latestVersion, message){
    // Was completely unguarded by NOTIFICATIONS_ENABLED above - the daily
    // reminder path got fully disabled and defensively try/catch-wrapped,
    // but this separate "new version available" notification still called
    // straight into the same native plugin, with no try/catch at all,
    // every single time checkForUpdate() found a newer version. Since
    // that runs on every launch AND every resume, and testers' installed
    // builds routinely lag behind whatever's newest on GitHub during
    // active development, this was firing far more often in practice than
    // the daily reminders ever did - making it the more likely of the two
    // to actually be behind "auto exit / won't open" if the plugin itself
    // is the real culprit. Gated behind the same flag, and wrapped the
    // same way, for consistency and safety.
    if(!NOTIFICATIONS_ENABLED) return;
    try{
        const hasLocalNotification = window.cordova && window.cordova.plugins &&
            window.cordova.plugins.notification && window.cordova.plugins.notification.local;
        if(!hasLocalNotification) return;

        const local = window.cordova.plugins.notification.local;
        local.schedule({
            id: 99,
            title: 'Arrow Puzzle update available',
            text: message || 'A new version is ready - tap to update!',
            foreground: true
        });
    }catch(e){
        console.warn('[update notification] failed, skipping:', e);
    }
  }

  // Handles the "announcement" half of the hosted JSON. Kept separate from
  // an update-available popup showing at the same time - if both would
  // fire in the same check, the update popup wins for this cycle and the
  // announcement just waits for the next check (still shown exactly once
  // per id, never skipped, just possibly delayed a few hours).
  function maybeShowAnnouncement(data, updatePopupShown){
    if(updatePopupShown) return;
    if(!data || !data.announcement || typeof data.announcement.id !== 'string') return;
    if(!data.announcement.text) return;

    const seenId = localStorage.getItem(ANNOUNCEMENT_SEEN_KEY);
    if(seenId === data.announcement.id) return;

    localStorage.setItem(ANNOUNCEMENT_SEEN_KEY, data.announcement.id);

  function checkForUpdate(){
    const now = Date.now();
    const lastCheck = parseInt(localStorage.getItem(UPDATE_CHECK_COOLDOWN_KEY) || '0', 10);
    if(now - lastCheck < UPDATE_CHECK_COOLDOWN_MS) return;

    fetch(VERSION_CHECK_URL, { cache: 'no-store' })
        .then(res => res.json())
        .then(data => {
            localStorage.setItem(UPDATE_CHECK_COOLDOWN_KEY, String(now));
            if(!data) return;

            let updatePopupShown = false;
            if(typeof data.latestVersion === 'string' && isVersionNewer(data.latestVersion, APP_VERSION)){
                showUpdateAvailablePopup(data.message);
                updatePopupShown = true;

                // Only fire the tray notification once per newly-seen version,
                // not every single time the popup happens to show again.
                const alreadyNotified = localStorage.getItem(UPDATE_NOTIFIED_KEY);
                if(alreadyNotified !== data.latestVersion){
                    fireUpdateSystemNotification(data.latestVersion, data.message);
                    localStorage.setItem(UPDATE_NOTIFIED_KEY, data.latestVersion);
                }
            }

            maybeShowAnnouncement(data, updatePopupShown);
        })
        .catch(err => {
            console.warn('[update check] failed:', err);
        });
  }

  function saveGameState(){
    try{
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        mode: gameMode,
        level: currentLevel,
        lives,
        rows: ROWS,
        cols: COLS,
        grid,
        paths: Array.from(pathsMap.values()),
        progressMade,
        levelArrowTotal,
        shuffleCheckpointIndex,

        dailyDate: dailyChallengeDate
      }));
    }catch(e){}

  // saveGameState() does a full JSON.stringify of the grid + all paths and
  // a synchronous localStorage write - cheap on its own, but the two
  // hottest call sites (every successful arrow clear, every wrong tap)
  // fire on literally every single tap, adding that cost on top of
  // everything else already happening in the same handler. scheduleSave()
  // coalesces bursts of rapid taps into one write instead of one per tap.
  // flushPendingSave() forces it through immediately and is called from
  // the pause/visibilitychange handlers below, so a debounced save can
  // never actually lose progress if the app gets backgrounded or killed
  // before the debounce timer would otherwise have fired.
  let _pendingSaveTimer = null;
  function scheduleSave(){
    if(_pendingSaveTimer) clearTimeout(_pendingSaveTimer);
    _pendingSaveTimer = setTimeout(() => {
        _pendingSaveTimer = null;
        saveGameState();
    }, 400);
  }
  function flushPendingSave(){
    if(_pendingSaveTimer){
        clearTimeout(_pendingSaveTimer);
        _pendingSaveTimer = null;
    }
    saveGameState();
  }

  function loadGameState(){
    try{
      const raw = localStorage.getItem(SAVE_KEY);
      if(!raw) return false;
      const data = JSON.parse(raw);
      if(!data || !data.grid || !data.paths) return false;
      gameMode = data.mode || gameMode;
      currentLevel = data.level || 1;
      // NOT `data.lives || 3` - 0 is a legitimate, meaningful value here
      // (the player was out of lives) and `||` treats 0 as falsy, silently
      // reviving a saved game-over state back to full lives on reload.
      lives = (typeof data.lives === 'number') ? data.lives : 3;
      dailyChallengeActive = !!data.dailyActive;
      dailyChallengeDate = data.dailyDate || null;
      ROWS = data.rows;
      COLS = data.cols;
      grid = data.grid;
      pathsMap = new Map(data.paths.map(p => [p.id, p]));
      progressMade = !!data.progressMade;
      // Older saves won't have these two fields. Falling back to the
      // current remaining count (with all checkpoints already marked
      // "done") means a resumed legacy save just skips reshuffling for
      // the rest of that level, rather than risking a checkpoint firing
      // on a total it was never measured against.
      if(typeof data.levelArrowTotal === 'number' && typeof data.shuffleCheckpointIndex === 'number'){
          levelArrowTotal = data.levelArrowTotal;
          shuffleCheckpointIndex = data.shuffleCheckpointIndex;
      } else if(typeof data.levelArrowTotal === 'number' && data.hardShuffleFlags && gameMode === 'hard') {
          // Compatibility for older Hard-mode saves that stored two boolean
          // flags instead of the next checkpoint index.
          levelArrowTotal = data.levelArrowTotal;
          shuffleCheckpointIndex = data.hardShuffleFlags.at60 ? 2 : (data.hardShuffleFlags.at20 ? 1 : 0);
      } else {
          levelArrowTotal = pathsMap.size;
          shuffleCheckpointIndex = getShuffleCheckpointsForMode(gameMode).length;
      }
      return true;
    }catch(e){ return false; }
  }

  const DIRS = {
    right: {dx:1, dy:0},
    down:  {dx:0, dy:1},
    left:  {dx:-1,dy:0},
    up:    {dx:0, dy:-1},
  };
  const DIR_NAMES = Object.keys(DIRS);
  const OPPOSITE = {right:'left', left:'right', up:'down', down:'up'};

  // ---- Deterministic per-level randomness ----
  // Every level (identified by mode+level number) must always generate the
  // exact same board, every single time it's played - whether that's
  // replaying it back-to-back or coming back to it after 10 other levels.
  // So instead of the raw Math.random(), all generation code below draws
  // from `rng()`, a seeded PRNG that gets reseeded from (mode, level)
  // right before a layout is built. Same seed in -> same board out, always.

  // simple string hash -> 32-bit seed (cyrb53-lite)
  function hashSeed(str){
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for(let i=0;i<str.length;i++){
      const ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1>>>16), 2246822507) ^ Math.imul(h2 ^ (h2>>>13), 3266489909);
    return (h1 >>> 0);
  }

  // mulberry32: small, fast, deterministic PRNG
  function mulberry32(seed){
    let a = seed >>> 0;
    return function(){
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  let rng = Math.random; // replaced by seedLevelRng() before every generation

  function seedLevelRng(mode, level){
    rng = mulberry32(hashSeed(mode + ':' + level));
  }

    // ---- Level difficulty scaling ----
    function getLevelConfig(mode, level){
      const base = MODES[mode];
      // Board size (rows/cols) only grows with level in Hard mode. Easy and
      // Medium keep the same fixed grid forever - Easy in particular is for
      // children, so it should never quietly get harder by growing the board.
      // Growth cap raised from 4 to 6 (was capping out at level 17; now
      // keeps growing to level 25) - safe to push further now that
      // buildLayout() has a wall-clock time budget (not just an attempt
      // count), so a bigger board can never block the main thread longer
      // than that budget regardless of how much slower it is to generate.
      const growth = mode === 'hard' ? Math.min(Math.floor((level - 1) / 4), 6) : 0;
      // Raised from the original (baseline 7/cap 12, floor 4/random-base 7)
      // so the smallest arrows the generator aims for are meaningfully
      // longer - tested empirically (see buildLayout's best-of-N search
      // below) to keep generation fast and stub arrows rare at this level.
      // Pushing this further starts fighting the generator: boards can't
      // always be perfectly tiled by long paths, so being too aggressive
      // here actually produces MORE small leftover arrows, not fewer (this
      // was tested directly: tripling this value not only made generation
      // ~5x slower on Hard, it *still* left several 1-cell stub arrows on
      // the board, because those come from isolated leftover cells during
      // generation - a separate problem from this target, fixed instead in
      // growCandidate's isolation-avoidance weighting and buildLayout's
      // best-of-N search below). This bump (18->22 cap, 10-12->11-14
      // target range) is deliberately modest for the same reason - it
      // makes the deep end of Hard mode noticeably tougher and more
      // winding without repeating that mistake.
      const maxSteps = Math.min(22, 10 + Math.floor((level - 1) / 4));
      const minArrowLength = Math.max(9, Math.min(maxSteps - 2, Math.floor(rng() * 4) + 11));
      return {
        rows: base.rows + growth,
        cols: base.cols + Math.floor(growth * 0.5),
        minArrowLength,
        maxSteps
      };
    }

    function applyLevelConfig(){
      if(dailyChallengeActive && dailyChallengeDate){
        const cfg = getDailyLevelConfig(dailyChallengeDate); // seeds rng() itself
        ROWS = cfg.rows;
        COLS = cfg.cols;
        MIN_ARROW_LENGTH = cfg.minArrowLength;
        MAX_STEPS = cfg.maxSteps;
        return;
      }
      seedLevelRng(gameMode, currentLevel);
      const cfg = getLevelConfig(gameMode, currentLevel);
      ROWS = cfg.rows;
      COLS = cfg.cols;
      MIN_ARROW_LENGTH = cfg.minArrowLength;
      MAX_STEPS = cfg.maxSteps;
    }

    function setMode(mode){
      gameMode = mode;
      applyLevelConfig();
      // A pinned pattern (selectedPatternType) is tracked per-mode via
      // unlockedPatternTiers[mode] - picking a pattern unlocked in Easy
      // shouldn't silently carry over into Medium/Hard before it's been
      // earned there too. getActiveArrowPatternType() already falls back
      // to Auto's tier for gameplay in that case, but selectedPatternType
      // itself stayed pinned to the now-invalid choice, which left the
      // Pattern button/menu showing a pattern that wasn't actually the
      // one in play - reset it to Auto right here, at the moment the mode
      // actually changes, so the selection and the menu match what's on
      // the board.
      if(selectedPatternType !== 'auto' && ARROW_PATTERN_TYPES.includes(selectedPatternType)){
        const pinnedIndex = ARROW_PATTERN_TYPES.indexOf(selectedPatternType);
        const pinnedUnlocked = TESTING_UNLOCK_ALL_PATTERNS || pinnedIndex < unlockedPatternTiers[mode];
        if(!pinnedUnlocked){
          selectedPatternType = 'auto';
          saveProgress();
        }
      }
  }

       function startNewGame(skipStartOverlay = false) {
              if(skipStartOverlay){
                  // Used right after dismissing the Level Pass popup, where
                  // an instant transition feels seamless - so don't show
                  // the overlay immediately. But if generation ends up
                  // taking a moment anyway (a big Hard board), show it

                  const GRACE_MS = 200;

                  const graceTimer = setTimeout(() => {

                  startNewGameNow(() => {

              const shownAt = performance.now();
              const MIN_LEVEL_START_MS = 320;
              requestAnimationFrame(() => {
                  setTimeout(() => {
                      startNewGameNow(() => {
                          const remaining = MIN_LEVEL_START_MS - (performance.now() - shownAt);
                          setTimeout(hideLoadingOverlay, Math.max(0, remaining));
                      });
                  }, 0);
              });
          }

       function startNewGameNow(onComplete) {

              applyLevelConfig();
              lives = 3;
              updateLives();
              inputBlockedUntil = 0;
              updateLevelLabel();
              leaving = [];
              bumping = [];
              flashing = new Set();
              progressMade = false;
              const cached = dailyChallengeActive ? dailyBoardCache[dailyChallengeDate] : null;
              if(cached){
                  // Board was already built ahead of time (see
                  // precomputeDailyBoard) - use it directly instead of
                  // generating again, so this is instant. ROWS/COLS were
                  // just set by applyLevelConfig() above from the same
                  // date-seeded config the cache was built with, but
                  // re-assert them defensively from the cached copy.
                  ROWS = cached.rows;
                  COLS = cached.cols;
                  // Consumed - a later retry of the same day (after a
                  // game-over) falls through to the generation branch
                  // below and regenerates the identical board from its
                  // seed, since gameplay mutates grid/paths in place and
                  // would otherwise corrupt the cached copy on replay.
                  delete dailyBoardCache[dailyChallengeDate];
                  finishNewGameSetup({grid: cached.grid, paths: cached.paths}, onComplete);
                  return;
              }

              // Runs asynchronously in short non-blocking bursts (see
              // buildLayoutAsync) rather than one long synchronous call.
              // Quality tradeoff (a few more short arrows before settling)
              // is well worth it for the common case - the caller's
              // loading indicator covers the wait either way, and
              // tap-forgiveness (see handleTap) already makes short arrows
              // easy to hit regardless. buildLayoutAsync always calls back
              // with something usable (never throws), so no try/catch is
              // needed here anymore.
              buildLayoutAsync(ROWS, COLS, (layout) => {
                  finishNewGameSetup(layout, onComplete);
              });
          }

          function finishNewGameSetup(layout, onComplete){
              grid = layout.grid;
              pathsMap = new Map(
                  layout.paths.map(p => [p.id, p])
              );
              levelArrowTotal = pathsMap.size;
              shuffleCheckpointIndex = 0;
              updateShuffleWarning();
              // Grid line overlay is per-game only - start every new game
              // with it off, regardless of whether it was left on before.
              showGrid = false;
              if(typeof updateGridToggleBtn === 'function') updateGridToggleBtn();
              try{ localStorage.setItem(GRID_PREF_KEY, '0'); }catch(e){}
              resetZoomPan();
              layoutCanvas();
              saveGameState();
              hideMenu();
              levelStartTime = performance.now();
              if(onComplete) onComplete();
          }

        function updateLives(){
           // Defensive clamp: lives must never be negative when rendered.
           // "❤ ".repeat() throws a RangeError for any negative count,
           // which is an uncaught exception straight out of the tap
           // handler - this guards against that regardless of how lives
           // got out of range (rapid taps, a corrupted save, etc.).
           document.getElementById("lives").textContent =
             "❤ ".repeat(Math.max(0, lives)).trim();
        }

        function updateLevelLabel(){
            document.getElementById("levelLabel").textContent = dailyChallengeActive
                ? "DAILY \u00B7 " + formatDailyDateLabel(dailyChallengeDate)
                : "LEVEL " + currentLevel;
        }

        // Shuffle warning countdown. The actual mode-specific checkpoints
        // are set in SHUFFLE_CHECKPOINTS_BY_MODE below. Once the next
        // checkpoint is close (SHUFFLE_WARNING_THRESHOLD arrows or fewer
        // left to clear), a big translucent number pops up centered over
        // the board and fades out on its own - a quick heads-up rather
        // than a constant on-screen distraction. The clear that actually
        // triggers the reshuffle is handled separately by the "Arrows
        // Shuffled!" popup at the reshuffle call site, so this function is
        // never asked to show "1" on that final triggering clear - see the
        // call site comment where updateShuffleWarning() is invoked.
        const SHUFFLE_WARNING_THRESHOLD = 3;
        function updateShuffleWarning(){
            const el = document.getElementById("shuffleCountPopup");
            if(dailyChallengeActive){
                el.classList.remove('show');
                return;
            }
            const nextThreshold = getNextShuffleThreshold();
            if(nextThreshold == null || levelArrowTotal <= 0){
                el.classList.remove('show');
                return;
            }
            const neededCleared = Math.ceil(nextThreshold * levelArrowTotal);
            const clearedSoFar = levelArrowTotal - pathsMap.size;
            const remaining = Math.max(0, neededCleared - clearedSoFar);
            if(remaining > SHUFFLE_WARNING_THRESHOLD || remaining <= 0){
                el.classList.remove('show');
                return;
            }
            el.textContent = remaining;
            // Restart the pop/fade animation every call (even for a repeat
            // number) by removing the class, forcing a reflow, then adding
            // it back - otherwise the browser would just no-op on an
            // already-applied animation class and the popup wouldn't
            // re-appear for the next countdown tick.
            el.classList.remove('show');
            void el.offsetWidth;
            el.classList.add('show');
        }

    }
    return arr;
  }

  function directionBetween(r0,c0,r1,c1){
    const dr = r1-r0, dc = c1-c0;
    for(const name of DIR_NAMES){
      const d = DIRS[name];
      if(d.dx===dc && d.dy===dr) return name;
    }
    return null;
  }

      const [r1,c1] = cells[cells.length-1];
      headDir = directionBetween(r0,c0,r1,c1);

      headDir = OPPOSITE[path.headDir];
    }

  // absorbed into a real, visible path while there's still room to grow,
  // instead of being left over at the end as tiny near-invisible 1-cell stubs.
  //
  // SOLVABILITY IS BUILT IN, NOT CHECKED AFTERWARDS:
  // a path's own body never blocks its own exit (see hasClearExit, which
  // ignores the path's own cells), so whether a given end of a path has a
  // clear line off the board depends ONLY on paths already committed to the
  // grid before it - never on anything placed later. So as each new path is
  // grown, we require that at least one of its two ends (head or tail)
  // already has a clear exit through everything placed so far, and commit
  // it using that end as the head. That guarantees the whole board is fully
  // clearable, in the reverse of build order, no matter what gets placed
  // around it afterwards - by construction, not by luck. On large/tight
  // boards (e.g. late Hard levels) this is what keeps generation from

  function rawGenerate(){
    const grid = Array.from({length: ROWS}, () => Array(COLS).fill(-1));
    const paths = [];

    function freeNeighborCount(r,c){
      let cnt = 0;
      for(const name of DIR_NAMES){
        const d = DIRS[name];
        const nr = r+d.dy, nc = c+d.dx;
        if(nr<0||nr>=ROWS||nc<0||nc>=COLS) continue;
        if(grid[nr][nc] === -1) cnt++;

          else if(cnt === bestCount){ bestCandidates.push([r,c]); }

          // Hard mode (and Daily Challenge, which is built on Hard's
          // sizing) gets extra turn bias for noticeably more winding,
          // harder-to-trace paths - Easy/Medium keep their original,
          // already-tuned straightness untouched. This only shapes path

          // creating them.

          // and reverting right after, instead of cloning the whole Set for

          // grows with path length) - same result, since the set's content
          // during the check is identical either way, just without the
          // O(path length) copy.
          const key = nr*COLS+nc;
          occupied.add(key);

          // Don't allow the generator to stop until the minimum length is reached.
          if (cells.length >= MIN_ARROW_LENGTH) {

              // don't all bunch up right at MIN_ARROW_LENGTH - most paths
              // now grow noticeably past the minimum before stopping, which
              // keeps a single board from being dominated by short arrows.
              const stopChance = 0.05 + (cells.length - MIN_ARROW_LENGTH) * 0.03;

        for(const cand of candidates){ if(r2 < cand.w){ pick = cand; break; } r2 -= cand.w; }

        cells.push([pick.nr, pick.nc]);

        lastDir = pick.name;

      return {cells, lastDir};

    // true if a straight line off the board from this end is clear of every
    // path already committed to the grid (a path's own cells never count)
    function hasClearExit(cells, dir){

          const [fr0,fc0] = flippedCells[flippedCells.length-2];

          const headEndDir = directionBetween(fr0,fc0,fr1,fc1);

      // mergeStubs / the outer solvability check will catch anything left over

  function isValidChain(cells){

    if(seen.size !== cells.length) return false;
    for(let i=0;i<cells.length;i++){
      const [r,c] = cells[i];
      for(const name of DIR_NAMES){
        const d = DIRS[name];
        const ar = r+d.dy, ac = c+d.dx;

        if(idx === -1) continue;
        if(idx !== i-1 && idx !== i+1) return false;
      }
    }
    return true;

    for(const p of paths){
      const [r,c] = p.cells[p.cells.length-1];
      if(p.headDir === 'left' || p.headDir === 'right'){
        if(!byRow.has(r)) byRow.set(r, []);
        byRow.get(r).push({p, c});
      }
      if(p.headDir === 'up' || p.headDir === 'down'){
        if(!byCol.has(c)) byCol.set(c, []);
        byCol.get(c).push({p, r});
      }
    }
    for(const [, arr] of byRow){
      for(let i=0;i<arr.length;i++) for(let j=i+1;j<arr.length;j++){
        const A = arr[i], B = arr[j];
        let leftOne=null, rightOne=null;
        if(A.p.headDir==='right' && B.p.headDir==='left'){ rightOne=A; leftOne=B; }
        else if(A.p.headDir==='left' && B.p.headDir==='right'){ rightOne=B; leftOne=A; }
        else continue;
        if(rightOne.c < leftOne.c) conflicts.push([rightOne.p.id, leftOne.p.id]);
      }
    }
    for(const [, arr] of byCol){
      for(let i=0;i<arr.length;i++) for(let j=i+1;j<arr.length;j++){
        const A = arr[i], B = arr[j];
        let topOne=null, bottomOne=null;
        if(A.p.headDir==='down' && B.p.headDir==='up'){ topOne=A; bottomOne=B; }
        else if(A.p.headDir==='up' && B.p.headDir==='down'){ topOne=B; bottomOne=A; }
        else continue;
        if(topOne.r < bottomOne.r) conflicts.push([topOne.p.id, bottomOne.p.id]);
      }
    }
    return conflicts;
  }

  // resolve "face to face" conflicts by flipping one arrow of each pair, one at a time
  function resolveConflicts(paths, protectedId){
    const byId = new Map(paths.map(p => [p.id, p]));
    const flipCounts = new Map();
    for(let iter=0; iter<2000; iter++){
      const conflicts = findConflicts([...byId.values()]);
      if(conflicts.length === 0) return {paths: [...byId.values()], ok: true};
      const [a,b] = conflicts[0];
      const pa = byId.get(a), pb = byId.get(b);
      let flipId;
      if(a === protectedId) flipId = b;
      else if(b === protectedId) flipId = a;
      else {
        const ca = flipCounts.get(a) || 0, cb = flipCounts.get(b) || 0;
        if(ca !== cb) flipId = ca < cb ? a : b;
        else flipId = pa.cells.length <= pb.cells.length ? a : b; // flip the shorter one: less likely to cascade
      }
      byId.set(flipId, flipPath(byId.get(flipId)));
      flipCounts.set(flipId, (flipCounts.get(flipId)||0) + 1);
    }
    return {paths: [...byId.values()], ok: false};
  }

  // ensure at least one arrow already has a clear, unobstructed path off the board
  function findClearCandidate(paths){
    for(const p of paths){
      const [r,c] = p.cells[p.cells.length-1];
      if(edgeMatches(r,c,p.headDir)) return p.id;
    }
    for(let i=0;i<paths.length;i++){
      const flipped = flipPath(paths[i]);
      const [r,c] = flipped.cells[flipped.cells.length-1];
      if(edgeMatches(r,c,flipped.headDir)){
        paths[i] = flipped;
        return flipped.id;
      }
    }
    return null;
  }

// Splits a single row's COLS cells into 1-3 same-direction arrow segments
// separated by gaps, instead of one arrow spanning the whole row. Segments
// stay solvable by construction: every segment in a row points the same
// way, laid out in that direction's order, so whichever segment sits
// nearest the exit edge is always already clear, and clears cascade
// inward one at a time as each outer segment is removed - no verification
// pass needed, same guarantee as the single-segment version had.
function splitRowIntoSegments(cols, rngFn){
    const MIN_SEG = Math.min(3, cols);
    const MIN_GAP = 1;
    const maxPossible = Math.floor((cols + MIN_GAP) / (MIN_SEG + MIN_GAP));
    if(maxPossible <= 1) return [[0, cols - 1]];

    const segCount = Math.max(1, Math.min(1 + Math.floor(rngFn() * 3), maxPossible));
    if(segCount === 1) return [[0, cols - 1]];

    const segLens = Array(segCount).fill(MIN_SEG);
    const gapLens = Array(segCount - 1).fill(MIN_GAP);
    let extra = cols - (segCount * MIN_SEG + (segCount - 1) * MIN_GAP);

    // Distribute leftover width randomly across segments (mostly) and gaps
    // (occasionally), so segments come out varied lengths rather than all
    // identical MIN_SEG chunks.
    while(extra > 0){
        if(gapLens.length && rngFn() < 0.3){
            gapLens[Math.floor(rngFn() * gapLens.length)]++;
        } else {
            segLens[Math.floor(rngFn() * segCount)]++;
        }
        extra--;
    }

    const segments = [];
    let cursor = 0;
    for(let i = 0; i < segCount; i++){
        const start = cursor;
        const end = start + segLens[i] - 1;
        segments.push([start, end]);
        cursor = end + 1;
        if(i < gapLens.length) cursor += gapLens[i];
    }
    return segments;
}

// guaranteed-instant, always-solvable layout used only as a last resort if
// random generation can't find a valid board quickly (can happen on very
// large, highly-constrained boards at high levels)
function buildFallbackLayout(){
    const grid = Array.from({length: ROWS}, () => Array(COLS).fill(-1));
    const paths = [];
    let pathId = 0;
    let clearId = 0;
    for(let r=0; r<ROWS; r++){
        // each row is only ever occupied by its own paths, so nothing
        // outside the row can block them regardless of direction -
        // alternate so the board doesn't degenerate into every single
        // arrow pointing the same way
        const headDir = (r % 2 === 0) ? 'right' : 'left';
        const segments = splitRowIntoSegments(COLS, rng);
        for(const [start, end] of segments){
            const cells = [];
            if(headDir === 'right'){
                for(let c = start; c <= end; c++){ cells.push([r,c]); grid[r][c] = pathId; }
                if(end === COLS - 1) clearId = pathId; // touches the exit edge already
            } else {
                for(let c = end; c >= start; c--){ cells.push([r,c]); grid[r][c] = pathId; }
                if(start === 0) clearId = pathId;
            }
            paths.push({id: pathId, cells, headDir});
            pathId++;
        }
    }
    return {grid, paths, clearId};
}

// The bounded search itself, factored out of buildLayout() so it can be
// resumed across multiple short calls (see buildLayoutAsync below) instead
// of only ever running to completion in one long synchronous call. Doesn't
// fall back to buildFallbackLayout() itself - callers decide what "still
// nothing after however much searching we're willing to do" means. `prior`
// (optional) carries over {best, bestTinyCount, validCandidates} from an
// earlier call, so a chunked caller's later bursts keep improving on
// earlier ones instead of starting over from scratch each time.
function searchForLayout(fast, timeBudgetMs, maxAttempts, prior, satisfice){
    let attempts = 0;
    const _start = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();

    let best = prior ? prior.best : null;
    let bestTinyCount = prior ? prior.bestTinyCount : Infinity;
    let validCandidates = prior ? prior.validCandidates : 0;
    const MAX_VALID_CANDIDATES = satisfice ? satisfice.maxValidCandidates : (fast ? 3 : 8);
    const GOOD_ENOUGH_TINY = satisfice ? satisfice.goodEnoughTiny : 2;

    while(true){
        attempts++;
        if(attempts > maxAttempts) return {best, bestTinyCount, validCandidates, done:false};
        const now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
        if(now - _start > timeBudgetMs) return {best, bestTinyCount, validCandidates, done:false};

        const {grid, paths: rawPaths} = rawGenerate();
        const paths = mergeStubs(grid, rawPaths);
        const tinyCount = paths.filter(p => p.cells.length <= 3).length;
        if(best && tinyCount >= bestTinyCount) continue;

        const clearId = findClearCandidate(paths);
        if(clearId===null) continue;

        const resolved = resolveConflicts(paths, clearId);
        if(!resolved.ok) continue;

        const simGrid = grid.map(r=>r.slice());
        const remaining = new Map();
        // No clone needed: the simulate loop below only reads p.cells/
        // p.headDir and mutates simGrid + this Map's membership - it never
        // touches the path objects themselves.
        for(const p of resolved.paths) remaining.set(p.id, p);
        let removed = 0;

        while(true){
            let found = false;
            for(const [id,p] of remaining){
                const [r,c] = p.cells[p.cells.length-1];
                const d = DIRS[p.headDir];
                let rr=r+d.dy, cc=c+d.dx;
                let clear=true;
                while(rr>=0 && rr<ROWS && cc>=0 && cc<COLS){
                    if(simGrid[rr][cc]!=-1){ clear=false; break; }
                    rr+=d.dy; cc+=d.dx;
                }
                if(clear){
                    found=true;
                    for(const [cr,ccc] of p.cells) simGrid[cr][ccc]=-1;
                    remaining.delete(id);
                    removed++;
                    break;
                }
            }
            if(!found) break;
        }

        if(removed===resolved.paths.length){
            validCandidates++;
            if(tinyCount < bestTinyCount){
                bestTinyCount = tinyCount;
                best = { grid, paths: resolved.paths, clearId };
            }
            const goodEnough = Math.max(GOOD_ENOUGH_TINY, Math.ceil(resolved.paths.length * 0.1));
            if(bestTinyCount <= goodEnough || validCandidates >= MAX_VALID_CANDIDATES){
                return {best, bestTinyCount, validCandidates, done:true};
            }
        }
    }
}

// fast=true trims the search budget down - used for a fresh level's
// initial generation (shown behind a loading overlay, see startNewGame).
// Trimmed too aggressively, this budget runs out before finding ANY
// solvable candidate far too often, silently falling back to the
// segmented-rows layout (buildFallbackLayout) instead - these numbers are
// tuned to keep that fallback reasonably rare while still bounding
// worst-case time well below what could read as a hang.
//
// NOTE: mid-game checkpoint reshuffles do NOT use this function anymore -
// see buildLayoutAsync below. That path runs synchronously on the main
// thread in the middle of a tap with no loading indicator at all, so it
// needs to never block for longer than a frame or two; buildLayoutAsync
// achieves that (and gets a much larger *cumulative* budget, so board
// quality doesn't suffer) by running this same search in short bursts
// spread across multiple ticks instead of one long call.
function buildLayout(fast){

    // Bounded so a bad board can never hang the game. Low-end devices get
    // a smaller budget - the search still finds a valid board (or falls
    // back to buildFallbackLayout(), which is instant either way), just
    // with less CPU time spent chasing a marginally tidier layout.
    const MAX_ATTEMPTS = isLowEndDevice() ? 60 : (fast ? 150 : 250);

    // Hard wall-clock cap alongside the attempt cap. A slow CPU can take
    // far longer *per attempt* than a fast one, so an attempt-count cap
    // alone doesn't actually bound how long this blocks the main thread -
    // and a long synchronous block is exactly what triggers Android's
    // "App Not Responding" dialog, which the OS can then force-close on
    // some devices (looking to the player like the game just exits with
    // no warning). Bounding by elapsed time instead caps worst-case block
    // time the same way on every device, however slow. This path runs
    // behind a loading overlay (see startNewGame), so this more generous
    // budget is fine - the pause is expected and visible, not a freeze.
    const TIME_BUDGET_MS = isLowEndDevice() ? 1200 : 2500;

    const {best} = searchForLayout(fast, TIME_BUDGET_MS, MAX_ATTEMPTS);
    return best || buildFallbackLayout();
}

// Non-blocking equivalent of buildLayout(), used only by the mid-game
// checkpoint reshuffle (reshuffleRemainingArrows). That path has no
// loading indicator at all - it's triggered by, and needs to resolve
// quickly after, a tap mid-game - so unlike level-start it can't afford
// buildLayout's multi-second worst case. But simply giving it a much
// smaller budget (an earlier attempt at fixing this) traded that away for
// frequently falling back to the plain segmented-rows layout instead,
// which looked broken/wrong to players. This runs the same search as
// buildLayout, but in short bursts (BURST_MS each) yielded across
// multiple event-loop ticks via setTimeout, so no single burst can block
// long enough to matter - while still allowing a generous CUMULATIVE
// budget across all the bursts together, keeping board quality close to
// the full synchronous path's.
//
// ROWS/COLS must be their normal (full board) values when this is called;
// it temporarily swaps them to subRows/subCols for the duration of each
// burst only, always restoring the real values before yielding control
// back or invoking onDone - so nothing else running on the main thread
// between bursts (rendering, input, saves) ever observes the wrong board
// size.
function buildLayoutAsync(subRows, subCols, onDone){
    const restoreRows = ROWS, restoreCols = COLS;
    // Runs behind a dedicated "Shuffling the arrows..." / loading overlay
    // the whole time (see reshuffleRemainingArrows and startNewGame), which
    // already blocks input - so unlike a burst running loose during normal
    // interactive play, 80ms here isn't at risk of feeling like a stutter.
    // Larger bursts mean fewer setTimeout round-trips, which cuts real
    // wall-clock time to completion since each round-trip has its own
    // scheduling overhead that doesn't otherwise contribute to search
    // progress.
    const BURST_MS = 80;
    // Generous cumulative CPU-time budget - safe regardless of size since
    // no single burst can hang, only the wall-clock time before the
    // reshuffle finishes goes up. Measured as actual time spent inside
    // searchForLayout, not wall-clock time since this function started:
    // wall-clock time can include other work (the draw loop, in-flight
    // animations, etc) that runs in the gaps between our own bursts, which
    // would otherwise eat into the search budget without any actual search
    // progress happening.
    //
    // Falling back to the plain straight-line layout (buildFallbackLayout)
    // only happens if this entire budget runs out without finding even a
    // single valid solvable candidate - a longer wait here directly trades
    // against ever hitting that fallback, which is worth it: testing
    // showed the straight-line board reads as visibly broken to players,
    // while a couple of extra seconds mid-level does not.
    const CPU_BUDGET_MS = isLowEndDevice() ? 4000 : 7000;
    const MAX_ATTEMPTS = isLowEndDevice() ? 60 : 150;
    // A middle ground between "accept the first decent candidate" and
    // buildLayout's own strictest defaults: loose enough that the common
    // case still finishes in a couple of seconds rather than always
    // burning the full budget above, strict enough for good board
    // quality. The large CPU_BUDGET_MS above is the actual reliability
    // guarantee (worth waiting out on the rare hard board rather than
    // ever falling back to straight lines) - this just keeps the typical
    // case from paying that full cost unnecessarily.
    const SATISFICE = { goodEnoughTiny: 3, maxValidCandidates: 2 };

    let state = null;
    let cpuTimeSpent = 0;

    function runBurst(){
        ROWS = subRows; COLS = subCols;
        let finalLayout = null;
        try{
            try{
                const burstStart = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
                state = searchForLayout(true, BURST_MS, MAX_ATTEMPTS, state, SATISFICE);
                const burstEnd = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
                cpuTimeSpent += (burstEnd - burstStart);

                if(state.done || cpuTimeSpent > CPU_BUDGET_MS){
                    finalLayout = state.best || buildFallbackLayout(); // built here, while ROWS/COLS still equal subRows/subCols
                }
            }catch(e){
                // Should be unreachable, but a later burst runs inside its
                // own setTimeout callback, outside whatever try/catch the
                // original caller had - an uncaught throw here would leave
                // onDone() never called, hanging the game indefinitely
                // rather than failing visibly or falling back.
                console.error('[board] async generation burst failed, using fallback layout', e);
                finalLayout = buildFallbackLayout();
            }
        } finally {
            ROWS = restoreRows; COLS = restoreCols;
        }

        if(finalLayout){
            onDone(finalLayout);
        } else {
            setTimeout(runBurst, 0);
        }
    }

    runBurst();
}

  // ---- Runtime state ----
    let grid = [];
    let pathsMap = new Map();
    let cellSize = 0, boardW = 0, boardH = 0;

    let leaving = [];
    let bumping = []; // arrows currently animating a "wrong move" bump: nudge forward until they touch whatever's blocking them, then spring back
    // Checkpoint reshuffle transition: the old arrows spin/shrink/fade out,
    // then the new layout spins/grows/fades in, instead of an instant cut.
    // null when no reshuffle animation is in progress.
    let shuffleAnim = null;
    let flashing = new Set();//ids of arrows mistouched this game - stay red until cleared
   let animFrameQueued = false;

   
    const SHUFFLE_CHECKPOINTS_BY_MODE = {
        easy: [],
        medium: [],
        hard: [0.60] // shuffle mode once after 60% of starting arrows clear
    };

    // levelArrowTotal is the arrow count the level started with. Fractions
    // are measured against this fixed total, not the ever-shrinking current
    // count. shuffleCheckpointIndex points to the next checkpoint to fire.
    let levelArrowTotal = 0;
    let shuffleCheckpointIndex = 0;

    function getShuffleCheckpointsForMode(mode){
        return SHUFFLE_CHECKPOINTS_BY_MODE[mode] || [];
    }

    function getNextShuffleThreshold(){
        const checkpoints = getShuffleCheckpointsForMode(gameMode);
        const val = checkpoints[shuffleCheckpointIndex];
        return val === undefined ? null : val;
    }

    // Fisher-Yates using the level's seeded rng() (not Math.random()) so a
    // reshuffle is deterministic given the level's seed, same as the rest
    // of the generator.
    function seededShuffle(arr){
        for(let i = arr.length - 1; i > 0; i--){
            const j = Math.floor(rng() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // Mode checkpoint reshuffle: builds a brand new fully-solvable
    // layout for the current level's grid/step settings, then keeps only
    // as many of its arrows as are currently remaining on the board - no
    // arrows are added. A subset of a solvable layout (cleared in the same
    // relative order as the full layout) is always itself solvable, since
    // removing pieces only removes obstacles, so trimming down to the
    // remaining count can never turn a solvable board unsolvable.
    function reshuffleRemainingArrows(showNotice = true){
        const remainingCount = pathsMap.size;
        if(remainingCount === 0) return;
        const previousLengths = [...pathsMap.values()]
            .map(p => p.cells.length)
            .sort((a, b) => b - a);

        // Regenerating a layout across the WHOLE board (300+ cells on a big
        // Hard board) just to keep a random handful of its arrows afterward
        // is far more work than necessary once most of the level is
        // noticeably long. Instead, scope generation to a much smaller
        // sub-region sized for roughly `remainingCount` arrows: cells
        // outside that sub-region are simply left empty in the new grid,
        // exactly like already-cleared cells already are, so this is
        // visually indistinguishable from the old full-board approach.
        //
        // Note this cap ends up equal to the full board on levels/
        // checkpoints where remainingCount is still a large fraction of
        // the total (e.g. Hard's single 50% checkpoint on a big board) -
        // the "smaller sub-region" saving mainly helps later checkpoints
        // on modes with more of them. buildLayoutAsync below is what
        // actually keeps that full-board case fast and non-blocking.
        const origRows = ROWS, origCols = COLS;

        const avgLen = (MIN_ARROW_LENGTH + MAX_STEPS) / 2;
        const neededCells = Math.min(origRows * origCols, Math.ceil(remainingCount * avgLen * 1.4));
        // keep it roughly square-ish and matched to the board's own
        // proportions, so it tiles about as easily as the real board does
        const aspect = origCols / origRows;
        let subRows = Math.max(MIN_ARROW_LENGTH + 2, Math.round(Math.sqrt(neededCells / aspect)));
        let subCols = Math.max(MIN_ARROW_LENGTH + 2, Math.round(Math.sqrt(neededCells * aspect)));
        subRows = Math.min(subRows, origRows);
        subCols = Math.min(subCols, origCols);

        if(showNotice) showLoadingOverlay("Shuffling the arrows...");

        // Block input for a generous upper-bound covering the async
        // generation (which, unlike the old synchronous call, no longer
        // blocks the event loop - so without this a rapid second tap
        // could land mid-generation) plus the shuffle animation itself.
        // Padded well above buildLayoutAsync's own CPU-time budget since
        // wall-clock time to finish can run longer than that budget when
        // other work (draw loop, animations) competes for event-loop time
        // between bursts. finishReshuffle() below tightens this to the
        // animation's actual duration once generation is done.
        inputBlockedUntil = performance.now() + (isLowEndDevice() ? 5500 : 9500) + 550 + 400;

        buildLayoutAsync(subRows, subCols, (layout) => {
            finishReshuffle(layout, subRows, subCols, origRows, origCols, remainingCount, previousLengths);
        });
    }

    // Runs once buildLayoutAsync's generation finishes - takes the
    // generated sub-region layout and applies it to the real board,
    // exactly like the tail end of the old fully-synchronous
    // reshuffleRemainingArrows used to, just now decoupled from generation
