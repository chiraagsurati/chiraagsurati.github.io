    // itself so generation can run without blocking the main thread.
    function finishReshuffle(layout, subRows, subCols, origRows, origCols, remainingCount, previousLengths){
        // Place the sub-region's paths at a random offset within the real
        // board instead of always anchoring them to the top-left corner.
        const rowOffset = Math.floor(rng() * (origRows - subRows + 1));
        const colOffset = Math.floor(rng() * (origCols - subCols + 1));
        for(const p of layout.paths){
            p.cells = p.cells.map(([r,c]) => [r + rowOffset, c + colOffset]);
        }

        const shuffled = seededShuffle(layout.paths.slice());
        // Best-effort fallback for the rare case the fresh layout has fewer
        // total arrows than we need to keep - just keep them all rather
        // than fail; this only ever gives the player fewer arrows to clear,
        // never more.
        const kept = shuffled
            .slice(0, Math.min(remainingCount, shuffled.length))
            .sort((a, b) => b.cells.length - a.cells.length)
            .map((p, i) => {
                const maxLen = previousLengths[i] || p.cells.length;
                if(p.cells.length <= maxLen) return p;
                // Trim from the tail so the arrow keeps the same head and
                // exit direction; this only removes blockers, preserving
                // the solvability guarantee from the generated layout.
                return {...p, cells: p.cells.slice(p.cells.length - maxLen)};
            });

        const newGrid = Array.from({length: ROWS}, () => Array(COLS).fill(-1));
        const newPathsMap = new Map();
        for(const p of kept){
            newPathsMap.set(p.id, p);
            for(const [r,c] of p.cells) newGrid[r][c] = p.id;
        }

        // Old ids no longer necessarily correspond to anything on the new
        // board - drop any stale "wrong move" state tied to them. Arrows
        // already mid-flight in `leaving` are self-contained (they carry
        // their own points/timing) so they're left alone to finish.
        const oldPaths = [...pathsMap.values()];
        flashing = new Set();
        bumping = [];

        // Animate the transition (old arrows spin/shrink away, new ones
        // spin/grow in) instead of an instant cut - grid/pathsMap only
        // actually get swapped once the animation finishes, in
        // drawShuffleAnim(). The board keeps showing (and, gameplay-wise,
        // still IS) the old layout for the animation's duration.
        shuffleAnim = {
            oldPaths,
            newGrid,
            newPathsMap,
            startTime: performance.now(),
            duration: 550
        };

        // Generation just finished asynchronously (see buildLayoutAsync) -
        // inputBlockedUntil was already set to a generous upper-bound
        // estimate before it started, covering exactly this risk (a tap
        // landing mid-generation, before this new layout exists). Now that
        // the real animation duration is known, tighten it down to that.
        // Only a small trailing margin now (not the old 400ms) - that
        // buffer was sized for when generation was a synchronous freeze
        // that could leave a real backlog of queued input; async
        // generation doesn't block the event loop, so there's little
        // backlog risk left to guard against, and keeping this in sync
        // with when the shuffling overlay hides (below) avoids a gap
        // where the board looks ready but taps still don't register.
        inputBlockedUntil = performance.now() + shuffleAnim.duration + 50;

        // The shuffling overlay (shown when generation started, see
        // reshuffleRemainingArrows above) stays up through the visual
        // transition too, and is only hidden once drawShuffleAnim() below
        // actually finishes swapping in the new layout - so there's never
        // a gap where the overlay is gone but the board is still
        // mid-transition with input still blocked.

        requestDraw();
        // saveGameState() intentionally NOT called here - grid/pathsMap
        // still hold the OLD layout until the animation finishes and
        // drawShuffleAnim() finalizes the swap, so saving now would
        // persist a layout that's about to disappear. See drawShuffleAnim.
    }

    // Checked once after every successful arrow clear.
    // Fractions are measured against levelArrowTotal (the level's starting
    // count), not the shrinking current count, so checkpoint percentages
    // always refer to the same fixed target. If a single clear jumps past
    // multiple checkpoints on a very short level, mark all passed
    // checkpoints but only reshuffle once.
    function maybeReshuffleForMode(showNotice = true){
        if(dailyChallengeActive) return; // Daily Challenge boards never reshuffle
        if(pathsMap.size === 0) return; // level just completed
        if(levelArrowTotal <= 0) return;

        const checkpoints = getShuffleCheckpointsForMode(gameMode);
        if(shuffleCheckpointIndex >= checkpoints.length) return;

        const clearedFraction = (levelArrowTotal - pathsMap.size) / levelArrowTotal;
        if(clearedFraction < checkpoints[shuffleCheckpointIndex]) return;

        while(shuffleCheckpointIndex < checkpoints.length &&
              clearedFraction >= checkpoints[shuffleCheckpointIndex]){
            shuffleCheckpointIndex++;
        }
        reshuffleRemainingArrows(showNotice);
    }

  const SPEED = 1.7; // arrow speed , px per ms travelled along the path while exiting (2x speed), tuned against Easy mode's cell size (see getReferenceCellSize)
  const RED = '#e0435a';
  const BLUE = '#4d63ff';         // color for an arrow while it's sliding off after a correct clear

  // SPEED is a raw px/ms constant, but cellSize itself shrinks as a board
  // gets more rows/cols packed into the same screen space (see
  // layoutCanvas). Left alone, that means denser boards (a big Hard-mode
  // board, or the Daily Challenge board, which is sized larger than Easy)
  // cover the same pixel distance faster in real time - the exit
  // animation visually "speeds up" purely because the cells got smaller,
  // not because anything actually got faster. referenceCellSize (computed
  // by getReferenceCellSize(), cached below) is what cellSize would be for
  // Easy mode's board on this same screen (the size SPEED was originally
  // tuned to feel right for), so the duration calc below can scale against
  // it and keep perceived speed - cells crossed per second - constant
  // across every board size.
  //
  // IMPORTANT: this is cached in layoutCanvas() (see referenceCellSize
  // below) rather than recomputed fresh on every arrow clear. cellSize
  // itself is also only updated in layoutCanvas() - if referenceCellSize
  // were instead read live from the current window size at animation
  // time, any layout reflow mid-level (banner load, popup toggling,
  // rotation jitter) would leave it out of sync with the now-stale
  // cellSize, breaking the cancellation this normalization depends on and
  // causing speed to visibly drift over the course of a level.
  let referenceCellSize = 0;
  function getReferenceCellSize(){
    const adBannerSpace = 2 * 50;
    const availW = window.innerWidth * 0.90;
    const availH = window.innerHeight * 0.72 - adBannerSpace;
    return Math.floor(Math.min(availW / MODES.easy.cols, availH / MODES.easy.rows)) || cellSize;
  }

  function cellCenter(r,c){
    const TOP_BAR = cellSize * 0.9;

    return [
        c*cellSize + cellSize/2,
        TOP_BAR + r*cellSize + cellSize/2
    ];
}

  // Cached off-screen render of the dot grid. The dots never move or
  // change during gameplay - only when the board is resized (cellSize
  // changes) or the theme's dot color changes - so instead of reissuing
  // ROWS*COLS individual arc()+fill() calls every animation frame (up to
  // 60x/sec while arrows are clearing/bumping/reshuffling), draw it once
  // into an offscreen canvas and just blit that each frame. Built lazily
  // on first use, not at startup - dotGridDirty starts true so the very
  // first draw() call builds it then, same as before this change, just
  // never rebuilt again until something actually invalidates it.
  let dotGridCanvas = null, dotGridCtx = null, dotGridDirty = true;
  function invalidateDotGrid(){ dotGridDirty = true; }

  function drawDotGrid(){
  const dpr = 1;
    if(dotGridDirty || !dotGridCanvas || dotGridCanvas.width !== Math.round(boardW*dpr)){
      if(!dotGridCanvas) dotGridCanvas = document.createElement('canvas');
      dotGridCanvas.width = Math.max(1, Math.round(boardW*dpr));
      dotGridCanvas.height = Math.max(1, Math.round(boardH*dpr));
      dotGridCtx = dotGridCanvas.getContext('2d');
      dotGridCtx.setTransform(dpr,0,0,dpr,0,0);

      const rDot = Math.max(1, cellSize*0.045);
      dotGridCtx.fillStyle = cachedDotColor;
      // Dots sit at cell centers (same coordinates cellCenter() uses for
      // drawing arrows) so the background texture lines up with the paths
      // the arrows actually travel along. Drawn across every cell, not
      // just ones that currently hold an arrow - so once an arrow is
      // cleared, the dots reappear along the line it used to occupy
      // instead of leaving a blank gap.
      for(let r=0; r<ROWS; r++){
        for(let c=0; c<COLS; c++){
          const [cx, cy] = cellCenter(r,c);
          dotGridCtx.beginPath();
          dotGridCtx.arc(cx, cy, rDot, 0, Math.PI*2);
          dotGridCtx.fill();
        }
      }
      dotGridDirty = false;
    }
    ctx.drawImage(dotGridCanvas, 0, 0, boardW, boardH);
  }

  // cumulative arc-length along a path's cell centers, for continuous "slide along the path" motion
  function buildArcLength(pts){
    const cum = [0];
    for(let i=1;i<pts.length;i++){
      const [x0,y0] = pts[i-1], [x1,y1] = pts[i];
      cum.push(cum[i-1] + Math.hypot(x1-x0, y1-y0));
    }
    return cum;
  }

  // position at arc-length s along the polyline; beyond the last point it keeps
  // going straight in headDir, exactly like a snake that has left the pipe
  function pointAtArclength(pts, cum, s, headVec){
    const total = cum[cum.length-1];
    if(s <= 0) return pts[0];
    if(s > total){
      const [hx,hy] = pts[pts.length-1];
      const extra = s - total;
      return [hx + headVec.dx*extra, hy + headVec.dy*extra];
    }
    for(let i=1;i<cum.length;i++){
      if(s <= cum[i] || i === cum.length-1){
        const segLen = (cum[i]-cum[i-1]) || 1e-6;
        const t = (s - cum[i-1]) / segLen;
        const [x0,y0] = pts[i-1], [x1,y1] = pts[i];
        return [x0+(x1-x0)*t, y0+(y1-y0)*t];
      }
    }
    return pts[pts.length-1];
  }

  function lerpColor(hexA, hexB, t){
    const a = parseInt(hexA.slice(1),16), b = parseInt(hexB.slice(1),16);
    const ar=(a>>16)&255, ag=(a>>8)&255, ab=a&255;
    const br=(b>>16)&255, bg=(b>>8)&255, bb=b&255;
    const r = Math.round(ar+(br-ar)*t), g = Math.round(ag+(bg-ag)*t), bl = Math.round(ab+(bb-ab)*t);
    return '#' + ((1<<24)+(r<<16)+(g<<8)+bl).toString(16).slice(1);
  }

  // ---- Level-based arrow fill patterns ----
  // Normal arrows are drawn with a repeating
  // canvas pattern instead of a flat color, and which pattern is used
  // depends on currentLevel. Red wrong-move arrows always stay flat red.
  // Clearing arrows stay patterned when a pattern is active, and only use
  // blue for the default solid-arrow look.
  //
  // Each texture below has its own hardcoded palette (rather than just a
  // lightened PIPE_COLOR) so the board's whole color mood shifts with the
  // pattern, not just the pattern's shape.
  // ===== PATTERN UNLOCK CONFIG =====
  // How many levels (per mode) the player must clear before the next arrow
  // pattern unlocks. Change this ONE number to retune unlock pacing -
  // everything else (cycling display, unlock popup, unlockedPatternTiers
  // math) derives from it automatically. e.g. 5 = fast (a new pattern every
  // 5 levels), 15 = a new pattern every 15 levels, etc.
  // Levels per pattern before cycling to the next, per mode. Different
  // per mode since modes progress through levels at very different paces
  // (Easy levels clear much faster than Hard's larger boards), so a single
  // shared interval made patterns unlock at very different real-world
  // paces depending on mode.
  const PATTERN_CHANGE_INTERVAL_BY_MODE = { easy: 25, medium: 20, hard: 15 };
  function getPatternChangeInterval(mode){
    return PATTERN_CHANGE_INTERVAL_BY_MODE[mode] || PATTERN_CHANGE_INTERVAL_BY_MODE.medium;
  }

  // TESTING ONLY: when true, every pattern is treated as already unlocked
  // regardless of level progress, so all of them show up (unlocked) in the
  // Pattern menu immediately. Set back to false before shipping/release -
  // this bypasses real unlock progress entirely and is only meant for
  // trying out how each pattern looks without grinding levels.
  const TESTING_UNLOCK_ALL_PATTERNS = false;   //arrow pattern on off

  // ===== HOW TO ADD A NEW ARROW PATTERN (checklist for future changes) =====
  // Adding a pattern takes 4 edits, all in this file:
  //   1. Add its type key (short camelCase string) to ARROW_PATTERN_TYPES
  //      below. Position in the array = unlock order (earlier = unlocks
  //      sooner), so insert it wherever you want it to unlock relative to
  //      the others.
  //   2. Add a `type: 'Display Name'` entry to PATTERN_DISPLAY_NAMES -
  //      shown in the Pattern menu and unlock popup.
  //   3. Add a `case 'type':` block inside buildPatternTile() (search for
  //      "case 'coralReef'" below to jump to the end of the switch) that
  //      draws the tile texture using the local `tctx`/`s` canvas context.
  //      Keep it self-contained (fillRect background + a few strokes/fills)
  //      like the existing cases - no external images/assets.
  //   4. Add a matching entry to PATTERN_TILE_SCALE (how large one repeat
  //      tile is relative to a cell - bigger scale = fewer repeats visible,
  //      good for detailed/organic patterns) AND to getPatternBaseColor()
  //      (the flat representative color used for the solid arrow-head cap -
  //      see the "How to add a new arrow pattern" note above that function
  //      for its own darkness-contrast requirement).
  // That's it - unlock progression, the cycling-by-level system, the
  // Pattern menu list, and swatch previews all read from these same
  // structures automatically, so nothing else needs to change.
  const ARROW_PATTERN_TYPES = ['solid','plainRed','plainBlue','plainGreen','plainOrange','plainPurple','contourLines','marbleSwirl','sunsetWave','crimsonBlob','goldenTopo','denimWeave','lavaCrack','mintDots','royalChevron','iceCrystal','copperRust','jungleLeaf','cosmicStar','candyStripe','graphitePlaid','coralReef','emeraldScale','sunflowerField','stormCloud','autumnLeaf','neonGrid','desertSand','wineBerry','arcticAurora','terracottaTile'];
  const PATTERN_DISPLAY_NAMES = {
    solid: 'Solid',
    plainRed: 'Red',
    plainBlue: 'Blue',
    plainGreen: 'Green',
    plainOrange: 'Orange',
    plainPurple: 'Purple',
    contourLines: 'Forest',
    marbleSwirl: 'Ocean',
    sunsetWave: 'Sunset',
    crimsonBlob: 'Berry',
    goldenTopo: 'Gold',
    denimWeave: 'Denim',
    lavaCrack: 'Lava',
    mintDots: 'Mint',
    royalChevron: 'Royal',
    iceCrystal: 'Ice',
    copperRust: 'Copper',
    jungleLeaf: 'Jungle',
    cosmicStar: 'Cosmic',
    candyStripe: 'Candy',
    graphitePlaid: 'Plaid',
    coralReef: 'Coral',
    emeraldScale: 'Emerald',
    sunflowerField: 'Sunflower',
    stormCloud: 'Storm',
    autumnLeaf: 'Autumn',
    neonGrid: 'Neon',
    desertSand: 'Desert',
    wineBerry: 'Wine',
    arcticAurora: 'Aurora',
    terracottaTile: 'Terracotta'
  };
  const patternCache = new Map(); // key: `${type}_${tileSizeRounded}` -> CanvasPattern

  // Raw --board-bg / --dot values, kept in sync by applyBoardTheme() (the
  // only place that ever changes them). draw()/drawDotGrid() run up to
  // 60x/sec during animations and used to call getComputedStyle() for
  // these every single frame, which forces a style recalc each time -
  // reading these plain JS vars instead is free. Defaults match the
  // classic theme's CSS values so the very first frame (before
  // applyBoardTheme() has run) still looks right.
  let cachedBoardBg = '#dedde6';
  let cachedDotColor = 'rgba(44,47,74,0.28)';

  // ===== Board Themes (Theme Store) =====
  // Separate from arrow patterns - these recolor the board background/dot
  // grid (via the --board-bg and --dot CSS vars) rather than the arrows
  // themselves, so a pattern and a theme can be mixed freely. 'classic' is
  // always owned/free and matches the original default look and MUST stay
  // first in this array (loadThemeState()/applyBoardTheme() fall back to
  // it). More themes get added here later - just append entries with a
  // unique id, display name, coin cost, and bg/dot colors; the store
  // screen, buy/equip flow, and persistence all read from this array
  // automatically, nothing else needs to change.
  const BOARD_THEMES = [
    {id:'classic', name:'Classic',    cost:0,  bg:'#dedde6', dot:'rgba(44,47,74,0.28)'},
    {id:'slate',   name:'Dark Slate', cost:3,  bg:'#3a3d4a', dot:'rgba(255,255,255,0.20)'},
    {id:'ocean',   name:'Ocean',      cost:5,  bg:'#cfe8ec', dot:'rgba(12,74,90,0.30)'},
    {id:'sunset',  name:'Sunset',     cost:8,  bg:'#f7dcc4', dot:'rgba(140,60,20,0.30)'},
    {id:'neon',    name:'Neon',       cost:12, bg:'#1a1a2e', dot:'rgba(0,255,200,0.35)'}
  ];
  const BOARD_THEME_MAP = Object.fromEntries(BOARD_THEMES.map(t => [t.id, t]));

  // TESTING ONLY: keeps every theme unlocked regardless of coin count, so
  // they can all be tried out before real costs/gating are finalized.
  // Flip this to false (or just delete the block that uses it below) once
  // ready to gate themes behind coins for real.
  const TESTING_UNLOCK_ALL_THEMES = true;

  function lightenColor(hex, amt){ return lerpColor(hex, '#ffffff', amt); }
  function darkenColor(hex, amt){ return lerpColor(hex, '#000000', amt); }

  // Perceived brightness (0=black..255=white) of a hex color, used to decide
  // how hard a color needs to be darkened to stay clearly visible against
  // the light board background.
  function relativeLuminance(hex){
    const n = parseInt(hex.slice(1), 16);
    const r = (n>>16)&255, g = (n>>8)&255, b = n&255;
    return 0.2126*r + 0.7152*g + 0.0722*b;
  }

  function buildPatternTile(type, tileSize){
    const tile = document.createElement('canvas');
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    tile.width = Math.max(2, Math.round(tileSize*dpr));
    tile.height = Math.max(2, Math.round(tileSize*dpr));
    const tctx = tile.getContext('2d');
    tctx.scale(dpr, dpr);
    const s = tileSize;

    switch(type){

      // Deep forest green nested wavy contour bands (topographic-map look).
      case 'contourLines': {
        tctx.fillStyle = '#0d3b2e';
        tctx.fillRect(0,0,s,s);
        const bands = [
          { c: '#1f5c46', w: 0.22 },
          { c: '#3f8a5f', w: 0.14 },
          { c: '#8fc98a', w: 0.07 },
        ];
        for(const band of bands){
          tctx.strokeStyle = band.c;
          tctx.lineWidth = s*band.w;
          tctx.lineCap = 'round';
          tctx.beginPath();
          tctx.moveTo(-s*0.2, s*0.15);
          tctx.bezierCurveTo(s*0.15, s*0.35, s*0.15, -s*0.05, s*0.5, s*0.15);
          tctx.bezierCurveTo(s*0.85, s*0.35, s*0.85, s*0.65, s*1.2, s*0.55);
          tctx.stroke();
          tctx.beginPath();
          tctx.moveTo(-s*0.2, s*0.75);
          tctx.bezierCurveTo(s*0.15, s*0.95, s*0.15, s*0.55, s*0.5, s*0.75);
          tctx.bezierCurveTo(s*0.85, s*0.95, s*0.85, s*1.25, s*1.2, s*1.15);
          tctx.stroke();
        }
        break;
      }

      // Deep blue base with pale swirling marble-like bands.
      case 'marbleSwirl': {
        tctx.fillStyle = '#123c63';
        tctx.fillRect(0,0,s,s);
        const swirls = [
          { c: 'rgba(255,255,255,0.55)', w: 0.16, off: 0 },
          { c: 'rgba(173,214,255,0.65)', w: 0.10, off: s*0.18 },
          { c: 'rgba(9,38,66,0.6)',      w: 0.08, off: -s*0.16 },
        ];
        for(const sw of swirls){
          tctx.strokeStyle = sw.c;
          tctx.lineWidth = s*sw.w;
          tctx.lineCap = 'round';
          tctx.beginPath();
          tctx.moveTo(-s*0.1, s*0.5+sw.off);
          tctx.bezierCurveTo(s*0.3, s*0.1+sw.off, s*0.4, s*0.9+sw.off, s*0.7, s*0.45+sw.off);
          tctx.bezierCurveTo(s*0.9, s*0.15+sw.off, s*1.1, s*0.6+sw.off, s*1.2, s*0.3+sw.off);
          tctx.stroke();
        }
        break;
      }

      // Warm diagonal bands: navy -> cream -> orange -> red, sunset style.
      case 'sunsetWave': {
        tctx.fillStyle = '#1c2b3a';
        tctx.fillRect(0,0,s,s);
        const stripes = [
          { c: '#f3e3c3', off: 0.18 },
          { c: '#e8933a', off: 0.42 },
          { c: '#c8432e', off: 0.66 },
        ];
        for(const st of stripes){
          tctx.strokeStyle = st.c;
          tctx.lineWidth = s*0.26;
          tctx.lineCap = 'round';
          const o = s*st.off;
          tctx.beginPath();
          tctx.moveTo(-s*0.3+o, s*1.3);
          tctx.lineTo(s*1.3+o, -s*0.3);
          tctx.moveTo(-s*1.3+o, s*1.3);
          tctx.lineTo(s*0.3+o, -s*0.3);
          tctx.stroke();
        }
        break;
      }

      // Deep crimson base with soft cream blob shapes.
      case 'crimsonBlob': {
        tctx.fillStyle = '#8f1330';
        tctx.fillRect(0,0,s,s);
        tctx.fillStyle = '#f7e9d8';
        const blob = (cx,cy,r) => {
          tctx.beginPath();
          tctx.ellipse(cx, cy, r, r*0.8, 0.4, 0, Math.PI*2);
          tctx.fill();
        };
        blob(s*0.28, s*0.3, s*0.22);
        blob(s*0.82, s*0.72, s*0.24);
        blob(-s*0.05, s*0.85, s*0.16);
        break;
      }

      // Golden yellow nested wavy topographic rings (paler two-tone yellow).
      case 'goldenTopo': {
        tctx.fillStyle = '#f2b93d';
        tctx.fillRect(0,0,s,s);
        tctx.strokeStyle = '#fbdd8a';
        tctx.lineCap = 'round';
        const rings = [0.4, 0.28, 0.16];
        for(const r of rings){
          tctx.lineWidth = s*0.08;
          tctx.beginPath();
          tctx.ellipse(s*0.5, s*0.5, s*r, s*r*0.75, 0.3, 0, Math.PI*2);
          tctx.stroke();
        }
        break;
      }

      // Steel-blue/grey diamond weave with fine crosshatch fabric texture.
      case 'denimWeave': {
        tctx.fillStyle = '#3a5f7d';
        tctx.fillRect(0,0,s,s);
        tctx.strokeStyle = 'rgba(214,224,232,0.85)';
        tctx.lineWidth = Math.max(1, s*0.05);
        tctx.beginPath();
        tctx.moveTo(s*0.5, -s*0.1); tctx.lineTo(s*1.1, s*0.5);
        tctx.moveTo(s*1.1, s*0.5); tctx.lineTo(s*0.5, s*1.1);
        tctx.moveTo(s*0.5, s*1.1); tctx.lineTo(-s*0.1, s*0.5);
        tctx.moveTo(-s*0.1, s*0.5); tctx.lineTo(s*0.5, -s*0.1);
        tctx.stroke();
        // fine woven texture lines inside each diamond half
        tctx.strokeStyle = 'rgba(255,255,255,0.18)';
        tctx.lineWidth = Math.max(1, s*0.015);
        for(let i=-2;i<=2;i++){
          tctx.beginPath();
          tctx.moveTo(0, s*0.5+i*s*0.12);
          tctx.lineTo(s, s*0.5+i*s*0.12);
          tctx.stroke();
        }
        break;
      }

      // Volcanic near-black base with jagged glowing orange/red lava cracks.
      case 'lavaCrack': {
        tctx.fillStyle = '#181410';
        tctx.fillRect(0,0,s,s);
        const cracks = [
          { c: '#ff6a1f', w: 0.10, pts: [[-0.1,0.15],[0.25,0.35],[0.15,0.6],[0.5,0.55],[0.4,0.85],[1.2,0.75]] },
          { c: '#ffb23f', w: 0.05, pts: [[-0.15,0.7],[0.3,0.5],[0.2,0.2],[0.6,0.25],[0.55,-0.1]] },
        ];
        for(const crack of cracks){
          tctx.strokeStyle = crack.c;
          tctx.lineWidth = s*crack.w;
          tctx.lineCap = 'round';
          tctx.lineJoin = 'round';
          tctx.beginPath();
          crack.pts.forEach(([x,y],i) => {
            const px = x*s, py = y*s;
            if(i===0) tctx.moveTo(px,py); else tctx.lineTo(px,py);
          });
          tctx.stroke();
        }
        break;
      }

      // Deep mint-green base with a scattered grid of pale mint polka dots.
      case 'mintDots': {
        tctx.fillStyle = '#276b57';
        tctx.fillRect(0,0,s,s);
        tctx.fillStyle = '#bdf5e0';
        const dotPositions = [[0.22,0.22],[0.78,0.22],[0.5,0.5],[0.22,0.78],[0.78,0.78]];
        for(const [dx,dy] of dotPositions){
          tctx.beginPath();
          tctx.arc(dx*s, dy*s, s*0.13, 0, Math.PI*2);
          tctx.fill();
        }
        break;
      }

      // Deep royal-purple base with gold zigzag chevron stripes.
      case 'royalChevron': {
        tctx.fillStyle = '#33205c';
        tctx.fillRect(0,0,s,s);
        tctx.strokeStyle = '#e2bd52';
        tctx.lineWidth = s*0.12;
        tctx.lineCap = 'round';
        tctx.lineJoin = 'round';
        const rows = [0.15, 0.5, 0.85];
        for(const ry of rows){
          tctx.beginPath();
          tctx.moveTo(-s*0.1, ry*s - s*0.12);
          tctx.lineTo(s*0.5, ry*s + s*0.12);
          tctx.lineTo(s*1.1, ry*s - s*0.12);
          tctx.stroke();
        }
        break;
      }

      // Pale icy-blue base with faceted crystalline outline shapes.
      case 'iceCrystal': {
        tctx.fillStyle = '#cdeffb';
        tctx.fillRect(0,0,s,s);
        tctx.strokeStyle = '#79c9e6';
        tctx.lineWidth = Math.max(1, s*0.045);
        const facets = [
          [[0.1,0.1],[0.5,0.35],[0.15,0.55]],
          [[0.5,0.35],[0.9,0.15],[0.85,0.55]],
          [[0.15,0.55],[0.5,0.35],[0.85,0.55],[0.5,0.9]],
        ];
        for(const facet of facets){
          tctx.beginPath();
          facet.forEach(([x,y],i)=>{
            const px=x*s, py=y*s;
            if(i===0) tctx.moveTo(px,py); else tctx.lineTo(px,py);
          });
          tctx.closePath();
          tctx.stroke();
        }
        break;
      }

      // Copper-brown base flecked with darker rust and lighter highlight speckles.
      case 'copperRust': {
        tctx.fillStyle = '#7d4a2a';
        tctx.fillRect(0,0,s,s);
        const speckles = [
          [0.2,0.25,0.09,'#4a2712'], [0.65,0.2,0.07,'#c98a54'],
          [0.4,0.55,0.1,'#c98a54'], [0.8,0.6,0.08,'#4a2712'],
          [0.15,0.8,0.07,'#4a2712'], [0.55,0.85,0.09,'#c98a54'],
        ];
        for(const [dx,dy,r,c] of speckles){
          tctx.fillStyle = c;
          tctx.beginPath();
          tctx.arc(dx*s, dy*s, r*s, 0, Math.PI*2);
          tctx.fill();
        }
        break;
      }

      // Deep jungle-green base with a central leaf vein and branching side veins.
      case 'jungleLeaf': {
        tctx.fillStyle = '#1f4d2b';
        tctx.fillRect(0,0,s,s);
        tctx.strokeStyle = '#7fce7a';
        tctx.lineCap = 'round';
        tctx.lineWidth = s*0.06;
        tctx.beginPath();
        tctx.moveTo(s*0.5, -s*0.1);
        tctx.lineTo(s*0.5, s*1.1);
        tctx.stroke();
        tctx.lineWidth = s*0.035;
        const sides = [0.15, 0.4, 0.65, 0.9];
        for(const sy of sides){
          tctx.beginPath();
          tctx.moveTo(s*0.5, s*sy);
          tctx.lineTo(s*0.15, s*sy - s*0.12);
          tctx.stroke();
          tctx.beginPath();
          tctx.moveTo(s*0.5, s*sy);
          tctx.lineTo(s*0.85, s*sy - s*0.12);
          tctx.stroke();
        }
        break;
      }

      // Deep navy/black base scattered with small pale-blue stars.
      case 'cosmicStar': {
        tctx.fillStyle = '#0c1030';
        tctx.fillRect(0,0,s,s);
        tctx.fillStyle = '#dfe6ff';
        const stars = [[0.2,0.25,0.05],[0.7,0.15,0.035],[0.85,0.6,0.05],[0.35,0.7,0.04],[0.55,0.45,0.06],[0.1,0.85,0.035]];
        for(const [dx,dy,r] of stars){
          tctx.beginPath();
          tctx.arc(dx*s, dy*s, r*s, 0, Math.PI*2);
          tctx.fill();
        }
        break;
      }

      // Pale pink base with diagonal candy-cane stripes.
      case 'candyStripe': {
        tctx.fillStyle = '#fef1f5';
        tctx.fillRect(0,0,s,s);
        const stripes = [
          { c: '#ff6fa5', off: 0.1 },
          { c: '#ffb6d0', off: 0.4 },
          { c: '#ff6fa5', off: 0.7 },
        ];
        for(const st of stripes){
          tctx.strokeStyle = st.c;
          tctx.lineWidth = s*0.22;
          tctx.lineCap = 'round';
          const o = s*st.off;
          tctx.beginPath();
          tctx.moveTo(-s*0.3+o, s*1.3);
          tctx.lineTo(s*1.3+o, -s*0.3);
          tctx.stroke();
        }
        break;
      }

      // Charcoal-grey base with a lighter-grey crosshatch plaid overlay.
      case 'graphitePlaid': {
        tctx.fillStyle = '#494952';
        tctx.fillRect(0,0,s,s);
        tctx.strokeStyle = 'rgba(200,200,210,0.5)';
        tctx.lineWidth = s*0.08;
        const lines = [0.25, 0.75];
        for(const l of lines){
          tctx.beginPath();
          tctx.moveTo(l*s, 0);
          tctx.lineTo(l*s, s);
          tctx.stroke();
          tctx.beginPath();
          tctx.moveTo(0, l*s);
          tctx.lineTo(s, l*s);
          tctx.stroke();
        }
        tctx.strokeStyle = 'rgba(255,255,255,0.25)';
        tctx.lineWidth = Math.max(1,s*0.02);
        tctx.beginPath();
        tctx.moveTo(0, s*0.5); tctx.lineTo(s, s*0.5);
        tctx.moveTo(s*0.5, 0); tctx.lineTo(s*0.5, s);
        tctx.stroke();
        break;
      }

      // Teal reef base with branching coral-orange growths.
      case 'coralReef': {
        tctx.fillStyle = '#0d5c66';
        tctx.fillRect(0,0,s,s);
        tctx.strokeStyle = '#ff8a65';
        tctx.lineCap = 'round';
        const branch = (x,y,angle,len,depth) => {
          if(depth<=0) return;
          const x2 = x + Math.cos(angle)*len;
          const y2 = y + Math.sin(angle)*len;
          tctx.beginPath();
          tctx.moveTo(x,y);
          tctx.lineTo(x2,y2);
          tctx.stroke();
          branch(x2,y2, angle-0.5, len*0.7, depth-1);
          branch(x2,y2, angle+0.5, len*0.7, depth-1);
        };
        tctx.lineWidth = s*0.09;
        branch(s*0.2, s*1.05, -Math.PI/2.2, s*0.35, 3);
        tctx.lineWidth = s*0.07;
        branch(s*0.75, s*1.1, -Math.PI/1.8, s*0.3, 3);
        break;
      }

      // Deep emerald base with lighter scalloped dragon-scale arcs.
      case 'emeraldScale': {
        tctx.fillStyle = '#0b3d2e';
        tctx.fillRect(0,0,s,s);
        tctx.strokeStyle = '#2f8a6b';
        tctx.lineWidth = Math.max(1, s*0.05);
        const rows = [0.15, 0.5, 0.85];
        const cols = [0.15, 0.5, 0.85];
        for(const ry of rows){
          for(const cx of cols){
            tctx.beginPath();
            tctx.arc(cx*s, ry*s, s*0.18, Math.PI, 0);
            tctx.stroke();
          }
        }
        break;
      }

      // Bright sunflower-gold base with a dark center and radiating petal lines.
      case 'sunflowerField': {
        tctx.fillStyle = '#e8b400';
        tctx.fillRect(0,0,s,s);
        tctx.fillStyle = '#5c3a12';
        tctx.beginPath();
        tctx.arc(s*0.5, s*0.5, s*0.14, 0, Math.PI*2);
        tctx.fill();
        tctx.strokeStyle = '#b9790a';
        tctx.lineWidth = s*0.05;
        tctx.lineCap = 'round';
        const petals = 8;
        for(let i=0;i<petals;i++){
          const a = (i/petals)*Math.PI*2;
          tctx.beginPath();
          tctx.moveTo(s*0.5 + Math.cos(a)*s*0.18, s*0.5 + Math.sin(a)*s*0.18);
          tctx.lineTo(s*0.5 + Math.cos(a)*s*0.42, s*0.5 + Math.sin(a)*s*0.42);
          tctx.stroke();
        }
        break;
      }

      // Storm-grey base with a single bright yellow lightning bolt.
      case 'stormCloud': {
        tctx.fillStyle = '#3c4657';
        tctx.fillRect(0,0,s,s);
        tctx.fillStyle = '#ffe066';
        tctx.beginPath();
        tctx.moveTo(s*0.55, -s*0.05);
        tctx.lineTo(s*0.3, s*0.5);
        tctx.lineTo(s*0.5, s*0.5);
        tctx.lineTo(s*0.35, s*1.05);
        tctx.lineTo(s*0.75, s*0.42);
        tctx.lineTo(s*0.52, s*0.42);
        tctx.closePath();
        tctx.fill();
        break;
      }

      // Warm brown base scattered with tilted autumn-orange leaf blobs.
      case 'autumnLeaf': {
        tctx.fillStyle = '#7a3b1e';
        tctx.fillRect(0,0,s,s);
        tctx.fillStyle = '#d97a3d';
        const leaves = [[0.25,0.3,0.5],[0.7,0.25,0.4],[0.5,0.65,0.55],[0.8,0.75,0.35]];
        for(const [dx,dy,rot] of leaves){
          tctx.save();
          tctx.translate(dx*s, dy*s);
          tctx.rotate(rot);
          tctx.beginPath();
          tctx.ellipse(0,0, s*0.14, s*0.08, 0, 0, Math.PI*2);
          tctx.fill();
          tctx.restore();
        }
        break;
      }

      // Near-black base with cyberpunk cyan/magenta neon grid lines.
      case 'neonGrid': {
        tctx.fillStyle = '#0a0a12';
        tctx.fillRect(0,0,s,s);
        tctx.strokeStyle = '#22e6ff';
        tctx.lineWidth = s*0.035;
        const gridLines = [0.33, 0.66];
        for(const l of gridLines){
          tctx.beginPath();
          tctx.moveTo(l*s, 0); tctx.lineTo(l*s, s);
          tctx.stroke();
        }
        tctx.strokeStyle = '#ff2fd0';
        for(const l of gridLines){
          tctx.beginPath();
          tctx.moveTo(0, l*s); tctx.lineTo(s, l*s);
          tctx.stroke();
        }
        break;
      }

      // Sandy-tan base with darker rolling dune-wave curves.
      case 'desertSand': {
        tctx.fillStyle = '#d8b579';
        tctx.fillRect(0,0,s,s);
        tctx.strokeStyle = '#b8905a';
        tctx.lineWidth = s*0.06;
        tctx.lineCap = 'round';
        const waves = [0.35, 0.65, 0.9];
        for(const wy of waves){
          tctx.beginPath();
          tctx.moveTo(-s*0.1, wy*s);
          tctx.quadraticCurveTo(s*0.5, wy*s - s*0.15, s*1.1, wy*s);
          tctx.stroke();
        }
        break;
      }

      // Deep wine-maroon base with a cluster of grape-like dots.
      case 'wineBerry': {
        tctx.fillStyle = '#4a1030';
        tctx.fillRect(0,0,s,s);
        tctx.fillStyle = '#8a2f5c';
        const grapes = [[0.35,0.3,0.11],[0.55,0.3,0.11],[0.45,0.48,0.11],[0.65,0.48,0.11],[0.35,0.65,0.11],[0.55,0.65,0.11],[0.45,0.82,0.1]];
        for(const [dx,dy,r] of grapes){
          tctx.beginPath();
          tctx.arc(dx*s, dy*s, r*s, 0, Math.PI*2);
          tctx.fill();
        }
        break;
      }

      // Dark navy base with wavy green/purple aurora-borealis bands.
      case 'arcticAurora': {
        tctx.fillStyle = '#081c2e';
        tctx.fillRect(0,0,s,s);
        const bands = [
          { c: 'rgba(70,230,160,0.65)', y: 0.3 },
          { c: 'rgba(160,90,230,0.55)', y: 0.55 },
          { c: 'rgba(70,230,160,0.4)', y: 0.78 },
        ];
        for(const b of bands){
          tctx.strokeStyle = b.c;
          tctx.lineWidth = s*0.12;
          tctx.lineCap = 'round';
          tctx.beginPath();
          tctx.moveTo(-s*0.1, b.y*s);
          tctx.quadraticCurveTo(s*0.5, b.y*s - s*0.2, s*1.1, b.y*s + s*0.05);
          tctx.stroke();
        }
        break;
      }

      // Burnt-orange terracotta base with a darker grid of tile lines.
      case 'terracottaTile': {
        tctx.fillStyle = '#b5502a';
        tctx.fillRect(0,0,s,s);
        tctx.strokeStyle = '#7a331a';
        tctx.lineWidth = s*0.06;
        const lines = [0.33, 0.66];
        for(const l of lines){
          tctx.beginPath();
          tctx.moveTo(l*s, 0); tctx.lineTo(l*s, s);
          tctx.stroke();
          tctx.beginPath();
          tctx.moveTo(0, l*s); tctx.lineTo(s, l*s);
          tctx.stroke();
        }
        break;
      }

      // Five plain flat colors, same simple fill as 'solid' just with
      // different hues - sit right after Solid/black in the unlock order,
      // before the multicolour/textured patterns begin.
      case 'plainRed':
        tctx.fillStyle = '#d9463f';
        tctx.fillRect(0,0,s,s);
        break;

      case 'plainBlue':
        tctx.fillStyle = '#3971e0';
        tctx.fillRect(0,0,s,s);
        break;

      case 'plainGreen':
        tctx.fillStyle = '#2e9e5b';
        tctx.fillRect(0,0,s,s);
        break;

      case 'plainOrange':
        tctx.fillStyle = '#e08a2e';
        tctx.fillRect(0,0,s,s);
        break;

      case 'plainPurple':
        tctx.fillStyle = '#7c4fc4';
        tctx.fillRect(0,0,s,s);
        break;

      case 'solid':
      default:
        tctx.fillStyle = PIPE_COLOR;
        tctx.fillRect(0,0,s,s);
        break;
    }
    return tile;
  }

  // Index into ARROW_PATTERN_TYPES for a given level number. Shared by the
  // drawing code and by the "new pattern unlocked" popup check below, so
  // both always agree on exactly which level a pattern change lands on.
  // This WRAPS once the cycle completes (there are only 7 pattern types),
  // so it's only for picking which pattern to *display* - never use it to
  // count how many patterns have been unlocked (see getRawPatternTierCount
  // below for that).
  function getPatternTierIndex(level, mode){
    mode = mode || gameMode;
    return Math.floor((level - 1) / getPatternChangeInterval(mode)) % ARROW_PATTERN_TYPES.length;
  }

  // Uncapped, 1-indexed count of tiers reached by a given level - e.g.
  // level 1-5 -> 1, level 6-10 -> 2, ... level 36+ -> 8, 9, etc. Unlike
  // getPatternTierIndex this deliberately does NOT wrap, so it can be
  // safely clamped to ARROW_PATTERN_TYPES.length to get "how many patterns
  // are unlocked" without that count resetting back down every time the
  // display cycle wraps around to Solid again.
  function getRawPatternTierCount(level, mode){
    mode = mode || gameMode;
    return Math.floor((level - 1) / getPatternChangeInterval(mode)) + 1;
  }

  // Shared "how close to the next pattern" calculation, used both by the
  // Level Select progress chip and the evening reminder notification.
  // Returns null once every pattern is unlocked for that mode (nothing
  // left to show). mode defaults to whichever mode is currently active.
  function getPatternProgressInfo(level, mode){
    mode = mode || gameMode;
    if(unlockedPatternTiers[mode] >= ARROW_PATTERN_TYPES.length) return null;

    const interval = getPatternChangeInterval(mode);
    const tierCount = getRawPatternTierCount(level, mode);
    const nextTierStartLevel = tierCount * interval + 1;
    const remaining = Math.max(1, nextTierStartLevel - level);
    const nextType = ARROW_PATTERN_TYPES[Math.min(tierCount, ARROW_PATTERN_TYPES.length - 1)];
    const nextName = PATTERN_DISPLAY_NAMES[nextType] || 'a new pattern';
    const progressInBlock = interval - remaining;
    const percent = Math.max(0, Math.min(100, Math.round((progressInBlock / interval) * 100)));

    return { remaining, nextName, percent };
  }

  // Small progress bar + "N levels to unlock X" line for the Level Select
  // popup - shown for whichever mode the player currently has open, so it
  // reflects that mode's own progress rather than their best mode overall.
  function getPatternProgressChipHtml(level){
    const info = getPatternProgressInfo(level);
    if(!info){
        return `<div style="
            font-size:12px; font-weight:bold; color:#2e9e5b;
            margin-bottom:14px; text-align:center;
        ">🎉 All patterns unlocked!</div>`;
    }

    const label = info.remaining === 1
        ? `1 level to unlock <b>${info.nextName}</b>!`
        : `${info.remaining} levels to unlock <b>${info.nextName}</b>`;

    return `<div style="margin-bottom:14px; text-align:left;">
        <div style="font-size:12px; color:#666; margin-bottom:5px;">${label}</div>
        <div style="background:#eef0fb; border-radius:6px; height:8px; overflow:hidden;">
            <div style="background:#4d63ff; height:100%; width:${info.percent}%; border-radius:6px;"></div>
        </div>
    </div>`;
  }

  // Brings unlockedPatternTiers up to date with maxUnlockedLevel, mode by
  // mode independently - Easy's tier count is derived only from Easy's
  // progress, Medium only from Medium's, etc. Only ever raises a given
  // mode's count, never lowers it - so a save file from before this
  // feature existed (or someone who's already cleared plenty of levels)
  // immediately gets the patterns they've effectively already earned in
  // that mode, rather than needing to "re-pass" levels they've already
  // beaten.
  function syncUnlockedPatternTiers(){
    for(const m of ['easy','medium','hard']){
      const lvl = (maxUnlockedLevel && maxUnlockedLevel[m]) || 1;
      const count = Math.min(ARROW_PATTERN_TYPES.length, getRawPatternTierCount(lvl, m));
      if(count > unlockedPatternTiers[m]) unlockedPatternTiers[m] = count;
    }
  }

  // Organic textures (swirls, contour lines, blobs) read better at a
  // larger tile size than simple geometric ones - each type picks its own
  // fraction of cellSize.
  const PATTERN_TILE_SCALE = {
    solid: 0.16,
    plainRed: 0.16,
    plainBlue: 0.16,
    plainGreen: 0.16,
    plainOrange: 0.16,
    plainPurple: 0.16,
    contourLines: 0.6,
    marbleSwirl: 0.6,
    sunsetWave: 0.34,
    crimsonBlob: 0.5,
    goldenTopo: 0.45,
    denimWeave: 0.32,
    lavaCrack: 0.5,
    mintDots: 0.35,
    royalChevron: 0.34,
    iceCrystal: 0.4,
    copperRust: 0.4,
    jungleLeaf: 0.55,
    cosmicStar: 0.4,
    candyStripe: 0.3,
    graphitePlaid: 0.32,
    coralReef: 0.55,
    emeraldScale: 0.45,
    sunflowerField: 0.55,
    stormCloud: 0.4,
    autumnLeaf: 0.5,
    neonGrid: 0.33,
    desertSand: 0.4,
    wineBerry: 0.45,
    arcticAurora: 0.5,
    terracottaTile: 0.32,
  };

  // Returns a fillStyle/strokeStyle-compatible value (flat color string or
  // CanvasPattern) representing the arrow's "at rest" look for the current
  // level. Cached per (pattern type, tile size) pair so it's cheap to call
  // every frame.
  function getArrowFillStyle(){
    const type = getActiveArrowPatternType();
    if(type === 'solid') return PIPE_COLOR;

    const scale = PATTERN_TILE_SCALE[type] || 0.3;
    const tileSize = Math.max(6, Math.round(cellSize * scale));
    const key = type + '_' + tileSize;
    let pattern = patternCache.get(key);
    if(!pattern){
      const tile = buildPatternTile(type, tileSize);
      pattern = ctx.createPattern(tile, 'repeat');
      patternCache.set(key, pattern);
    }
    return pattern;
  }

  function getActiveArrowPatternType(){
    if(selectedPatternType !== 'auto' && ARROW_PATTERN_TYPES.includes(selectedPatternType)){
      // A pinned pattern only applies in modes where it's actually been
      // unlocked - e.g. picking a pattern unlocked in Easy shouldn't carry
      // it over to Medium/Hard before it's been earned there too. Falls
      // back to Auto Select's normal level-based tier for this mode.
      const pinnedIndex = ARROW_PATTERN_TYPES.indexOf(selectedPatternType);
      const pinnedUnlocked = TESTING_UNLOCK_ALL_PATTERNS || pinnedIndex < unlockedPatternTiers[gameMode];
      if(pinnedUnlocked) return selectedPatternType;
    }
    return ARROW_PATTERN_TYPES[getPatternTierIndex(currentLevel, gameMode)];
  }

  // Representative flat/base color for each pattern type. Used to produce
  // a solid, darker arrow-head color that contrasts with the patterned shaft.
  // NOTE for future patterns: this color can be light or dark - it does NOT
  // need to be pre-darkened by hand. getArrowHeadSolidColorForType() below
  // automatically darkens it by an amount that scales with how light it is
  // (see its own comment), guaranteeing the final head color is always
  // clearly visible against the light board background. Just pick whatever
  // base color best represents the pattern's dominant/background shade.
  function getPatternBaseColor(type){
    switch(type){
      case 'plainRed':     return '#d9463f';
      case 'plainBlue':    return '#3971e0';
      case 'plainGreen':   return '#2e9e5b';
      case 'plainOrange':  return '#e08a2e';
      case 'plainPurple':  return '#7c4fc4';
      case 'contourLines': return '#0d3b2e';
      case 'marbleSwirl':  return '#123c63';
      case 'sunsetWave':   return '#1c2b3a';
      case 'crimsonBlob':  return '#8f1330';
      case 'goldenTopo':   return '#f2b93d';
      case 'denimWeave':   return '#3a5f7d';
      case 'lavaCrack':    return '#181410';
      case 'mintDots':     return '#276b57';
      case 'royalChevron': return '#33205c';
      case 'iceCrystal':   return '#cdeffb';
      case 'copperRust':   return '#7d4a2a';
      case 'jungleLeaf':   return '#1f4d2b';
      case 'cosmicStar':   return '#0c1030';
      case 'candyStripe':  return '#fef1f5';
      case 'graphitePlaid':return '#494952';
      case 'coralReef':    return '#0d5c66';
      case 'emeraldScale': return '#0b3d2e';
      case 'sunflowerField': return '#e8b400';
      case 'stormCloud':   return '#3c4657';
      case 'autumnLeaf':   return '#7a3b1e';
      case 'neonGrid':     return '#0a0a12';
      case 'desertSand':   return '#d8b579';
      case 'wineBerry':    return '#4a1030';
      case 'arcticAurora': return '#081c2e';
      case 'terracottaTile': return '#b5502a';
      case 'solid':
      default: return PIPE_COLOR;
    }
  }

  // The result only ever changes when the active pattern type changes
  // (i.e. between levels), but drawStrip() calls this once per arrow on
  // every animation frame - without a cache that's the same luminance +
  // darken computation redone for every arrow, every frame, for a result
  // that's already sitting there unchanged from the last frame. Cache is
  // built lazily, one entry per pattern type the first time it's actually
  // drawn - nothing precomputed upfront.
  const arrowHeadColorCache = new Map();
  function getArrowHeadSolidColorForType(type){
    const cached = arrowHeadColorCache.get(type);
    if(cached) return cached;
    // Darken the base so the head reads as a solid, clearly-visible dark
    // cap against the board (--board-bg is a light grey, #dedde6) - not
    // just relative to the patterned shaft. A flat, small darken amount
    // works fine for already-dark bases (e.g. Lava, Cosmic) but leaves
    // pale bases (e.g. Ice, Candy, Gold) still too light to read clearly
    // against a light board, so the darken amount scales up the lighter
    // the base color is, guaranteeing every pattern's head color ends up
    // a clearly dark, clearly visible shade.
    const base = getPatternBaseColor(type);
    const lum = relativeLuminance(base);
    let amt;
    if(lum > 200) amt = 0.62;      // very light bases (Ice, Candy) - darken hard
    else if(lum > 150) amt = 0.45; // light/medium bases (Gold)
    else if(lum > 90)  amt = 0.28; // mid-tone bases
    else amt = 0.16;               // already-dark bases - just a touch darker
    const result = darkenColor(base, amt);
    arrowHeadColorCache.set(type, result);
    return result;
  }

  function getLeavingArrowFillStyle(){
    return getActiveArrowPatternType() === 'solid' ? BLUE : getArrowFillStyle();
  }

  // Draws a small sample arrow (shaft + head, same proportions/style as the
  // real in-game drawStrip) onto a standalone <canvas>, filled with the
  // given pattern type. Used by the Pattern menu so each option shows what
  // it actually looks like rather than just its name. Independent of
  // cellSize/patternCache - it works off the preview canvas's own pixel
  // size, since menu previews are a fixed small size regardless of board
  // zoom or cell size.
  function drawPatternPreviewIcon(type, canvas){
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    // Use data-base-w / data-base-h to ensure nominal dimensions are preserved
    // and never exponentially multiplied on re-renders.
    if(!canvas.dataset.baseW){
      canvas.dataset.baseW = canvas.getAttribute('width') || canvas.width || 120;
      canvas.dataset.baseH = canvas.getAttribute('height') || canvas.height || 46;
    }
    const cw = parseFloat(canvas.dataset.baseW) || 120;
    const ch = parseFloat(canvas.dataset.baseH) || 46;
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    canvas.width = Math.round(cw * dpr);
    canvas.height = Math.round(ch * dpr);
    const pctx = canvas.getContext('2d');
    pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    pctx.clearRect(0, 0, cw, ch);

    let fillStyle;
    if(type === 'solid'){
      fillStyle = PIPE_COLOR;
    } else {
      const scale = PATTERN_TILE_SCALE[type] || 0.3;
      const tileSize = Math.max(6, Math.round(40 * scale)); // nominal ~40px "cellSize" for preview purposes
      const tile = buildPatternTile(type, tileSize);
      fillStyle = pctx.createPattern(tile, 'repeat');
    }

    const midY = ch/2;
    const thickness = ch*0.4;
    const headLen = ch*0.85;
    const headW = ch*0.75;
    const tipX = cw - 6;
    const baseX = tipX - headLen;

    pctx.lineJoin = 'round';
    pctx.lineCap = 'round';
    pctx.strokeStyle = fillStyle;
    pctx.lineWidth = thickness;
    pctx.beginPath();
    pctx.moveTo(6, midY);
    pctx.lineTo(baseX, midY);
    pctx.stroke();

    // Fill the head with a solid, slightly darker color derived from
    // the pattern type so the tip reads clearly against the patterned shaft.
    const headSolid = getArrowHeadSolidColorForType(type);
    pctx.fillStyle = headSolid;
    pctx.beginPath();
    pctx.moveTo(tipX, midY);
    pctx.lineTo(baseX, midY - headW/2);
    pctx.lineTo(baseX, midY + headW/2);
    pctx.closePath();
    pctx.fill();
  }

  // draws a pipe strip through an arbitrary list of points, with the arrowhead
  // built from the direction of travel at the very front point
  function drawStrip(pts, headVec, color){
    const thickness = cellSize * 0.15;  // width of arrow (thickened so patterns/textures actually read)

    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.strokeStyle = color;
    ctx.lineWidth = thickness;

    const [ex,ey] = pts[pts.length-1];
    const tipX = ex;
    const tipY = ey;

    // Distance from the tip back to the arrowhead's base - kept the same
    // for every arrow so head size doesn't depend on path length.
    const headLen = cellSize*0.38;
    const baseX = ex - headVec.dx*headLen;
    const baseY = ey - headVec.dy*headLen;

    // Body/tail of the arrow: for multi-cell paths this runs through
    // every earlier cell up to the head. Single-cell paths have no
    // earlier cell to start from, so the tail instead starts at the back
    // edge of that one cell - either way there's always a visible line
    // leading into the arrowhead, never just a bare triangle floating on
    // its own.
    const bodyPts = pts.length >= 2
      ? pts.slice(0, pts.length-1)
      : [[ex - headVec.dx*cellSize*0.5, ey - headVec.dy*cellSize*0.5]];
    const shaftPts = bodyPts.concat([[baseX, baseY]]);
    ctx.beginPath();
    shaftPts.forEach(([x,y], i) => { if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); });
    ctx.stroke();

    const headW = cellSize*0.34;   // narrower relative to length -> sharper point
    const angle = Math.atan2(headVec.dy, headVec.dx);
    const perpX = -Math.sin(angle)*headW/2;
    const perpY =  Math.cos(angle)*headW/2;

    ctx.beginPath();
    ctx.moveTo(tipX, tipY);
    ctx.lineTo(baseX+perpX, baseY+perpY);
    ctx.lineTo(baseX-perpX, baseY-perpY);
    ctx.closePath();
    // Use a solid, slightly darker head color derived from the current
    // arrow pattern so the tip appears as a solid cap regardless of the
    // patterned shaft used for the body. Exception: a wrong-move/flashing
    // arrow passes RED as its shaft color, and the head must match it
    // exactly (fully red arrow) rather than falling back to the
    // pattern-derived tint, regardless of which pattern is selected.
    const headFill = (color === RED) ? RED : getArrowHeadSolidColorForType(getActiveArrowPatternType());
    ctx.fillStyle = headFill;
    ctx.fill();
  }

  // Bumped whenever cellSize changes (layoutCanvas), so cached per-path
  // points below know to recompute rather than draw at a stale size.
  let cellSizeVersion = 0;

  function drawPathShape(path, color){
    // draw() calls this for every static arrow on the board on every
    // animation frame (while any arrow is leaving/bumping, or during a
    // reshuffle) - previously that meant re-mapping path.cells into fresh
    // point arrays every frame for every arrow, even ones not moving.
    // Cache the computed points on the path object itself and only
    // recompute when the path is new (no cache yet) or cellSize actually
    // changed (resize/zoom-fit) - level start and reshuffle already hand
    // out fresh path objects, so no separate invalidation is needed there.
    let pts = path._pts;
    if(!pts || path._ptsVersion !== cellSizeVersion){
      pts = path.cells.map(([r,c]) => cellCenter(r,c));
      path._pts = pts;
      path._ptsVersion = cellSizeVersion;
    }
    drawStrip(pts, DIRS[path.headDir], color || PIPE_COLOR);
  }

  // Full-board grid overlay (toggled by the Grid button). Lines run through
  // the center of each row/column - the exact rows/columns arrows travel
  // along - rather than around the boxy outline of the board cells, so the
  // grid reads as "this is the lane an arrow moves through" rather than
  // "this is a box drawn around it".
  function drawFullGrid(){
    ctx.save();
    ctx.strokeStyle = 'rgba(77,99,255,0.35)';
    ctx.lineWidth = Math.max(1, cellSize*0.02);
    const TOP_BAR = cellSize * 0.9;

    // One full-length line per arrow, drawn only along the axis the arrow
    // actually exits on: a left/right-facing head gets a horizontal line
    // through its row, an up/down-facing head gets a vertical line through
    // its column. This shows at a glance which way each arrow will travel,
    // instead of a full crosshair on every occupied row and column.
    pathsMap.forEach(path => {
      const [r, c] = path.cells[path.cells.length - 1]; // head cell
      if(path.headDir === 'left' || path.headDir === 'right'){
        const y = TOP_BAR + r*cellSize + cellSize/2;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(COLS*cellSize, y);
        ctx.stroke();
      } else {
        const x = c*cellSize + cellSize/2;
        ctx.beginPath();
        ctx.moveTo(x, TOP_BAR);
        ctx.lineTo(x, TOP_BAR + ROWS*cellSize);
        ctx.stroke();
      }
    });
    ctx.restore();
  }

  function easeInCubic(t){ return t*t*t; }
  function easeOutCubic(t){ return 1 - Math.pow(1 - t, 3); }

  // true if nothing else currently occupies the cells straight ahead of this
  // arrow's head, all the way to the edge of the board
  function isClear(path){
    const [r,c] = path.cells[path.cells.length-1];
    const d = DIRS[path.headDir];
    let rr = r+d.dy, cc = c+d.dx;
    while(rr>=0 && rr<ROWS && cc>=0 && cc<COLS){
      const occ = grid[rr][cc];
      if(occ !== -1 && occ !== path.id) return false;
      rr += d.dy; cc += d.dx;
    }
    return true;
  }

  // for a blocked arrow: how far (in px) it can nudge forward, straight out
  // of its head, before its tip touches whatever cell is in the way. Used
  // for the "wrong move" bump animation - counts clear cells ahead, then
  // adds half a cell so the tip lands right on the blocker's near edge
  // rather than stopping short or overlapping into it.
  function computeBumpDistance(path){
    const [r,c] = path.cells[path.cells.length-1];
    const d = DIRS[path.headDir];
    let rr = r+d.dy, cc = c+d.dx;
    let clearCells = 0;
    while(rr>=0 && rr<ROWS && cc>=0 && cc<COLS){
      const occ = grid[rr][cc];
      if(occ !== -1 && occ !== path.id) break; // found the blocker
      clearCells++;
      rr += d.dy; cc += d.dx;
    }
    return (clearCells + 0.5) * cellSize;
  }

  function draw(now){
    ctx.clearRect(0,0,boardW,boardH);
    ctx.fillStyle = cachedBoardBg;
    ctx.fillRect(0,0,boardW,boardH);
    drawDotGrid();
    if(showGrid) drawFullGrid();

    if(shuffleAnim){
      drawShuffleAnim(now);
    } else {
      const bumpingIds = new Set(bumping.map(item => item.id));
      const restFillStyle = getArrowFillStyle();
      pathsMap.forEach(p => {
        if(bumpingIds.has(p.id)) return; // drawn by the bump animation below instead
        const color = flashing.has(p.id) ? RED : restFillStyle;
        drawPathShape(p, color);
      });
    }

    leaving = leaving.filter(item => {
      const elapsed = now - item.startTime;
      const t = Math.min(1, elapsed / item.duration);
      const shiftProgress = item.fastStart ? easeOutCubic(t) : easeInCubic(t);
      const shift = item.total_extra_travel * shiftProgress;
      const headVec = DIRS[item.path.headDir];
      const newPts = item.cum.map(s => pointAtArclength(item.pts, item.cum, s + shift, headVec));
      drawStrip(newPts, headVec, item.fillStyle || BLUE);
      return t < 1;
    });

    // Wrong-move feedback: the tapped arrow nudges forward along its own
    // path until its tip touches whatever's blocking it, then springs back
    // to its original slot - staying red the whole time (and after).
    bumping = bumping.filter(item => {
      const elapsed = now - item.startTime;
      const t = Math.min(1, elapsed / item.duration);
      const shift = item.maxDist * Math.sin(Math.PI * t); // 0 -> maxDist -> 0
      const headVec = DIRS[item.path.headDir];
      const newPts = item.cum.map(s => pointAtArclength(item.pts, item.cum, s + shift, headVec));
      drawStrip(newPts, headVec, RED);
      return t < 1;
    });

    if(leaving.length > 0 || bumping.length > 0 || shuffleAnim){
      requestAnimationFrame(draw);
    } else {
      animFrameQueued = false;
    }

  }

  // Checkpoint reshuffle transition: the old layout spins/shrinks/fades out
  // around the board's center, then the new layout spins/grows/fades in
  // the same way - a visible "shuffle" instead of an instant cut. Purely
  // cosmetic: grid/pathsMap still hold the OLD layout for gameplay purposes
  // until this finishes and performs the actual swap (input stays blocked
  // the whole time via inputBlockedUntil, set when the animation started).
  function drawShuffleAnim(now){
    const anim = shuffleAnim;
    const elapsed = now - anim.startTime;
    const progress = Math.min(1, elapsed / anim.duration);
    const restFillStyle = getArrowFillStyle();
    const cx = boardW/2, cy = boardH/2;

    ctx.save();
    if(progress < 0.5){
      // phase 1: old arrows spin/shrink/fade out
      const p = easeInCubic(progress / 0.5);
      const scale = 1 - 0.45*p;
      ctx.globalAlpha = Math.max(0, 1 - p);
      ctx.translate(cx, cy);
      ctx.rotate(0.5 * p);
      ctx.scale(scale, scale);
      ctx.translate(-cx, -cy);
      for(const p2 of anim.oldPaths) drawPathShape(p2, restFillStyle);
    } else {
      // phase 2: new arrows spin/grow/fade in
      const p = easeInCubic((progress - 0.5) / 0.5);
      const scale = 0.55 + 0.45*p;
      ctx.globalAlpha = Math.max(0, p);
      ctx.translate(cx, cy);
      ctx.rotate(-0.5 * (1 - p));
      ctx.scale(scale, scale);
      ctx.translate(-cx, -cy);
      for(const p2 of anim.newPathsMap.values()) drawPathShape(p2, restFillStyle);
    }
    ctx.restore();
    ctx.globalAlpha = 1;

    if(progress >= 1){
      grid = anim.newGrid;
      pathsMap = anim.newPathsMap;
      shuffleAnim = null;
      hideLoadingOverlay();
      saveGameState();
    }
  }

  function requestDraw(){
    if(!animFrameQueued){
      animFrameQueued = true;
      requestAnimationFrame(draw);
    }
  }

  // Confetti celebration: two cannons fire from the bottom-left and
  // bottom-right corners of the screen, arcing pieces up and inward. Used
  // on the level-complete popup. Runs on its own full-screen canvas so it
  // sits above everything (including the popup) without disturbing the
  // board/canvas rendering underneath.
  function launchConfetti(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2.0);
    const W = window.innerWidth, H = window.innerHeight;

    const canvas = document.createElement('canvas');
    canvas.style.cssText = `
        position:fixed;
        top:0;
        right:0;
        bottom:0;
        left:0;
        pointer-events:none;
        z-index:10000;
    `;
    const targetW = Math.min(4096, Math.max(1, Math.round(W * dpr)));
    const targetH = Math.min(4096, Math.max(1, Math.round(H * dpr)));
    canvas.width = targetW;
    canvas.height = targetH;
    canvas.style.width = W+'px';
    canvas.style.height = H+'px';
    document.body.appendChild(canvas);

    const cctx = canvas.getContext('2d');
    const scaleX = targetW / W;
    const scaleY = targetH / H;
    cctx.setTransform(scaleX, 0, 0, scaleY, 0, 0);

    const COLORS = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#c77dff','#ff9f1c','#ff5da2'];
    const particles = [];

    // side: -1 = cannon on the left edge firing rightward/up,
    //        1 = cannon on the right edge firing leftward/up
    function spawnBurst(side){
      const x = side < 0 ? -10 : W+10;
      const count = 34;
      for(let i=0;i<count;i++){
        const spread = (Math.random()*0.55 + 0.12); // 0.12..0.67 rad off straight-up
        const angle = -Math.PI/2 + side*-1*spread; // tilt inward, toward center
        const speed = 9 + Math.random()*8;
        particles.push({
          x, y: H*0.85,
          vx: Math.cos(angle)*speed,
          vy: Math.sin(angle)*speed,
          size: 5 + Math.random()*6,
          color: COLORS[Math.floor(Math.random()*COLORS.length)],
          rot: Math.random()*Math.PI*2,
          vr: (Math.random()-0.5)*0.35,
          shape: Math.random() < 0.5 ? 'rect' : 'circle',
          life: 0,
          maxLife: 85 + Math.random()*45
        });
      }
    }

    spawnBurst(-1);
    spawnBurst(1);
    const secondBurstTimer = setTimeout(() => { spawnBurst(-1); spawnBurst(1); }, 260);

    const gravity = 0.22;
    const drag = 0.995;
    let raf;

    function frame(){
      cctx.clearRect(0,0,W,H);
      for(let i=particles.length-1;i>=0;i--){
        const p = particles[i];
        p.vy += gravity;
        p.vx *= drag;
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vr;
        p.life++;
        const alpha = Math.max(0, 1 - p.life/p.maxLife);
        cctx.save();
        cctx.translate(p.x,p.y);
        cctx.rotate(p.rot);
        cctx.globalAlpha = alpha;
        cctx.fillStyle = p.color;
        if(p.shape === 'rect'){
          cctx.fillRect(-p.size/2, -p.size/3, p.size, p.size*0.6);
        } else {
          cctx.beginPath();
          cctx.arc(0,0,p.size/2,0,Math.PI*2);
          cctx.fill();
        }
        cctx.restore();
        if(p.life > p.maxLife || p.y > H+60) particles.splice(i,1);
      }
      if(particles.length > 0){
        raf = requestAnimationFrame(frame);
      } else {
        canvas.remove();
      }
    }
    raf = requestAnimationFrame(frame);

    return function stopConfetti(){
      clearTimeout(secondBurstTimer);
      cancelAnimationFrame(raf);
      canvas.remove();
    };
  }

  // autoCloseMs is optional - when set, the popup dismisses itself (and
  // fires callback) after that many ms even if the player never taps it.
  // Tapping still dismisses it early, either way callback only ever runs
  // once thanks to the dismissed flag.
  function showPopup(title, message, callback, celebrate, autoCloseMs){

    const old = document.getElementById("gamePopup");
    if(old) old.remove();

    const popup = document.createElement("div");

    popup.id = "gamePopup";

    popup.style.cssText = `
        position:fixed;
        top:0;
        right:0;
        bottom:0;
        left:0;
        background:rgba(0,0,0,.45);
        display:flex;
        justify-content:center;
        align-items:center;
        z-index:10001;
        cursor:pointer;
    `;

    popup.innerHTML = `
        <div style="
            background:white;
            border-radius:16px;
            padding:20px 26px;
            text-align:center;
            box-shadow:0 15px 40px rgba(0,0,0,.25);
            min-width:200px;
            max-width:80vw;
        ">
            <div style="
                font-size:22px;
                font-weight:bold;
                color:#2c2f4a;
                ${message ? 'margin-bottom:10px;' : ''}
            ">
                ${title}
            </div>

            ${message ? `
            <div style="
                font-size:15px;
                color:#666;
            ">
                ${message}
            </div>
            ` : ''}
        </div>
    `;

    let stopConfetti = null;
    if(celebrate){
        try {
            stopConfetti = launchConfetti();
        } catch(err){
            // Never let a confetti failure (e.g. a device-specific canvas
            // quirk) prevent the popup itself from showing.
            console.error('launchConfetti failed:', err);
            stopConfetti = null;
        }
    }

    let dismissed = false;
    function dismiss(){
        if(dismissed) return;
        dismissed = true;

        if(stopConfetti) stopConfetti();

        popup.remove();

        if(callback)
            callback();
    }

    // Guard against the browser's own trailing synthetic "click" for the
    // SAME touch gesture that triggered whatever created this popup. On
    // touch devices, pointerdown/pointerup fire immediately, but the
    // browser then dispatches a compatibility "click" event shortly after
    // for anything that doesn't call preventDefault() on the pointer
    // events (this board doesn't, to keep multi-touch pan/pinch working).
    // A popup created synchronously inside that same tap's handler (e.g.
    // the shuffle notice, unlike Level Pass which waits out the leaving-
    // arrow animation first) is now the topmost element at the tap
    // location, so that trailing click lands on it and would immediately
    // fire dismiss() before it's ever actually seen. A short guard window
    // absorbs that stray click while staying well under the reaction time
    // of an actual deliberate second tap to dismiss.
    const createdAt = performance.now();
    const CLICK_DISMISS_GUARD_MS = 300;
    popup.addEventListener("click", () => {
        if(performance.now() - createdAt < CLICK_DISMISS_GUARD_MS) return;
        dismiss();
    });

    if(autoCloseMs){
        setTimeout(() => {
            // Skip if already dismissed by a tap, or removed some other way
            // (e.g. the hardware back button handler clears #gamePopup
            // directly) - isConnected covers both without double-firing.
            if(!dismissed && popup.isConnected) dismiss();
        }, autoCloseMs);
    }

    document.body.appendChild(popup);

}

    // Called right before a level starts (after currentLevel has already
    // been updated to the level about to be played). Shows a "new pattern
    // unlocked" popup - and only calls onDone() once it's dismissed, so
    // the pattern change is announced before the player ever sees it on
    // the board - but only while there are still genuinely new patterns
    // left to unlock. Once every pattern is unlocked, the display still
    // cycles through them (via getPatternTierIndex, which wraps), but this
    // stops announcing anything since nothing new is being earned anymore.
    function maybeAnnouncePatternUnlock(previousLevel, onDone){
        const prevCount = Math.min(ARROW_PATTERN_TYPES.length, getRawPatternTierCount(previousLevel, gameMode));
        const newCount = Math.min(ARROW_PATTERN_TYPES.length, getRawPatternTierCount(currentLevel, gameMode));
        if(newCount <= prevCount || previousLevel < 1){
            onDone();
            return;
        }
        unlockedPatternTiers[gameMode] = Math.max(unlockedPatternTiers[gameMode], newCount);
        saveProgress();
        showPopup(
            "New Arrow Pattern Unlock!",
            "Select a new arrow pattern in the Menu > Pattern",
            onDone,
            true, // celebrate: fire confetti, matches the Level Pass popup
            3000  // auto-dismiss after 2.5s so it doesn't block starting the level
        );
    }

    // Game Over gets its own popup (rather than reusing showPopup) because
    // it needs an extra tappable button - "Watch Ad for +1 Life" - alongside
    // the existing "tap anywhere to retry" behavior. Tapping the button
    // itself must NOT also trigger the backdrop's retry handler, hence the
    // stopPropagation() below.
    function showGameOverPopup(retryCallback){

    const old = document.getElementById("gamePopup");
    if(old) old.remove();

    const popup = document.createElement("div");
    popup.id = "gamePopup";

    popup.style.cssText = `
        position:fixed;
        top:0;
        right:0;
        bottom:0;
        left:0;
        background:rgba(0,0,0,.45);
        display:flex;
        justify-content:center;
        align-items:center;
        z-index:9999;
        cursor:pointer;
    `;

    popup.innerHTML = `
        <div style="
            background:white;
            border-radius:18px;
            padding:28px 36px;
            text-align:center;
            box-shadow:0 15px 40px rgba(0,0,0,.25);
            min-width:260px;
        ">
            <div style="
                font-size:30px;
                font-weight:bold;
                color:#2c2f4a;
                margin-bottom:14px;
            ">
                Game Over
            </div>

            <div style="
                font-size:17px;
                color:#666;
                margin-bottom:18px;
            ">
                Touch anywhere to retry this level
            </div>

            <!-- "Watch Ad for +1 Life" temporarily disabled until the real
                 ad SDK is wired in (see loadBannerAds/showRewardedAd below).
                 Re-enable this button once ads are added. -->
            <!--
            <button id="watchAdLifeBtn" style="
                background:#4d63ff;
                border:none;
                border-radius:12px;
                color:#fff;
                font-size:15px;
                font-weight:700;
                padding:12px 20px;
                width:100%;
                cursor:pointer;
                box-shadow:0 4px 10px rgba(77,99,255,.35);
            ">🎬 Watch Ad for +1 Life</button>
            -->
        </div>
    `;

    popup.addEventListener("click", () => {
        popup.remove();
        if(retryCallback) retryCallback();
    });

    document.body.appendChild(popup);

    // Watch-ad-for-extra-life flow disabled for now (no ad SDK yet).
    // Re-enable alongside the button markup above once ads are added.
    /*
    const watchAdBtn = popup.querySelector("#watchAdLifeBtn");
    watchAdBtn.addEventListener("click", (e) => {
        e.stopPropagation(); // don't also fire the backdrop's retry handler

        watchAdBtn.disabled = true;
        watchAdBtn.textContent = "Loading ad...";

        showRewardedAd(
            () => {
                // Reward granted: resume play on the same board with 1
                // life instead of restarting the level.
                popup.remove();
                lives = 1;
                updateLives();
                gameStarted = true;
                requestDraw();
                saveGameState();
            },
            () => {
                // No ad available - let the player retry the normal way
                // instead of leaving them stuck on a dead button.
                watchAdBtn.disabled = false;
                watchAdBtn.textContent = "No ad available - tap to retry";
            }
        );
    });
    */

}

    function checkLevelComplete(){

        if(pathsMap.size > 0) return;

        // Fire immediately, still inside the tap's call stack, so the
        // browser still counts this as triggered by a user gesture -
        // waiting until the requestAnimationFrame loop below resolves can
        // be too late and gets the play() call silently blocked.
        playSound(levelPassSound);

        const wait = () => {

            if(leaving.length > 0){

                requestAnimationFrame(wait);
                return;

            }

            if(dailyChallengeActive){
                completeDailyChallenge();
                return;
            }

            const timeHtml = recordLevelTimeAndGetHtml(gameMode, currentLevel);

            showPopup(
                "Level Pass",
                getStartingLevelAnimationHtml("Starting next level..." + timeHtml),
                () => {
                          const previousLevel = currentLevel;
                          currentLevel++;
                          if(currentLevel > maxUnlockedLevel[gameMode]){
                              maxUnlockedLevel[gameMode] = currentLevel;
                              saveProgress();
                          }
                          gameStarted = true;
                          clearGameState();
                          maybeAnnouncePatternUnlock(previousLevel, () => maybeShowReviewPrompt(() => startNewGame(true)));
                      },
                true, // celebrate: fire confetti from left & right
                700   // auto-dismiss quickly so the next level starts faster
            );

        };

        requestAnimationFrame(wait);

    }

    // Daily Challenge clear: no next-level progression - award a gold coin
    // (only once per date), mark the date complete for the calendar, then
    // return to the main menu. Retrying the SAME day after a game-over
    // regenerates the identical seeded board, so a completed date can still
    // be replayed for fun without earning a second coin.
    function completeDailyChallenge(){
        const dateStr = dailyChallengeDate;
        const alreadyDone = isDailyCompleted(dateStr);
        if(!alreadyDone){
            markDailyCompleted(dateStr);
            addGoldCoins(1);
        }
        const coinHtml = alreadyDone
            ? '<div style="margin-top:10px;font-size:13px;opacity:0.75;">Already completed \u2014 no extra coin</div>'
            : '<div style="margin-top:10px;font-size:15px;font-weight:bold;color:#c9971c;">\uD83E\uDE99 +1 Gold Coin!</div>';
        showPopup(
            "Daily Challenge Complete!",
            getStartingLevelAnimationHtml("Nice work!" + coinHtml),
            () => {
                dailyChallengeActive = false;
                dailyChallengeDate = null;
                clearGameState();
                showMenu();
            },
            true,
            1400
        );
    }
  // tapping an arrow: if the way ahead is clear it slides out head-first, tail
  // following the same bent path (like a snake, drawn in blue while leaving);
  // if blocked, it turns red and stays red until it's eventually cleared
  function handleTap(clientX, clientY){

    if(performance.now() < inputBlockedUntil) return;

    const rect = canvas.getBoundingClientRect();
    // rect reflects the current CSS zoom transform (its width/height are
    // boardW/boardH scaled by boardZoom), so convert back to the canvas's
    // own unscaled coordinate space before dividing by cellSize.
    const x = (clientX - rect.left) * (boardW / rect.width);
    const y = (clientY - rect.top) * (boardH / rect.height);

    // lands on one of its own cells (head, body, or tail all count,
    // since every cell an arrow occupies is tagged with its id on the
    // grid already). Previously a tap on an *empty* cell right next to a
    // short arrow was still forgiven as a hit on that arrow - that
    // near-miss fallback is removed here, so an empty-cell tap is simply
    // ignored no matter how close it lands to an arrow.
    if(id0 === -1 || id0 == null) return;

    if(!path) return;

    // able to flush a save with lives:0 and arrows still on the board to
    // disk. Doing this first shrinks that window to effectively nothing,

    // whatever's blocking it, then spring it back to its original slot.
    // Replace any in-flight bump for this same arrow rather than stacking.
    bumping = bumping.filter(item => item.id !== id);
    const bumpPts = path.cells.map(([r,c]) => cellCenter(r,c));
    bumping.push({
      id,
      path,
      pts: bumpPts,
      cum: buildArcLength(bumpPts),
      maxDist: computeBumpDistance(path),
      duration: 260,

}

  function applyBoardTransform(){
    boardFrame.style.transform = `translate(${boardPanX}px, ${boardPanY}px) scale(${boardZoom})`;
    const pct = Math.round(boardZoom*100);
    const resetBtn = document.getElementById('zoomResetBtn');
    if(resetBtn) resetBtn.textContent = pct + '%';
    const outBtn = document.getElementById('zoomOutBtn');
    const inBtn = document.getElementById('zoomInBtn');
    if(outBtn) outBtn.style.opacity = boardZoom <= MIN_ZOOM ? '.4' : '.88';
    if(inBtn) inBtn.style.opacity = boardZoom >= MAX_ZOOM ? '.4' : '.88';

  function clampPan(){
    const vw = boardViewport.clientWidth, vh = boardViewport.clientHeight;
    const fw = vw * boardZoom, fh = vh * boardZoom;
    const minX = Math.min(0, vw - fw);
    const minY = Math.min(0, vh - fh);
    boardPanX = Math.max(minX, Math.min(0, boardPanX));
    boardPanY = Math.max(minY, Math.min(0, boardPanY));
  }

  // back to the viewport center when no anchor is given (button taps).
  function setZoom(newZoom, anchorX, anchorY){
    newZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, newZoom));
    if(anchorX == null || anchorY == null){
      anchorX = boardViewport.clientWidth/2;
      anchorY = boardViewport.clientHeight/2;
    }
    const ux = (anchorX - boardPanX)/boardZoom;
    const uy = (anchorY - boardPanY)/boardZoom;
    boardZoom = newZoom;
    boardPanX = anchorX - boardZoom*ux;
    boardPanY = anchorY - boardZoom*uy;
    clampPan();
    applyBoardTransform();
  }

    boardZoom = 1;
    boardPanX = 0;
    boardPanY = 0;
    applyBoardTransform();

      if(pinchStartDist > 0){

      function handleHardwareBack(){
