          tctx.moveTo(-s*0.3+o, s*1.3);
          tctx.lineTo(s*1.3+o, -s*0.3);
          tctx.moveTo(-s*1.3+o, s*1.3);
          tctx.lineTo(s*0.3+o, -s*0.3);
          tctx.stroke();
        }
        break;
      }

      // Deep crimson base with soft cream blob shapes.
      case 'crimsonBlob': {
        tctx.fillStyle = '#8f1330';
        tctx.fillRect(0,0,s,s);
        tctx.fillStyle = '#f7e9d8';
        const blob = (cx,cy,r) => {
          tctx.beginPath();
          tctx.ellipse(cx, cy, r, r*0.8, 0.4, 0, Math.PI*2);
          tctx.fill();
        };
        blob(s*0.28, s*0.3, s*0.22);
        blob(s*0.82, s*0.72, s*0.24);
        blob(-s*0.05, s*0.85, s*0.16);
        break;
      }

      // Golden yellow nested wavy topographic rings (paler two-tone yellow).
      case 'goldenTopo': {
        tctx.fillStyle = '#f2b93d';
        tctx.fillRect(0,0,s,s);
        tctx.strokeStyle = '#fbdd8a';
        tctx.lineCap = 'round';
        const rings = [0.4, 0.28, 0.16];
        for(const r of rings){
          tctx.lineWidth = s*0.08;
          tctx.beginPath();
          tctx.ellipse(s*0.5, s*0.5, s*r, s*r*0.75, 0.3, 0, Math.PI*2);
          tctx.stroke();
        }
        break;
      }

      // Steel-blue/grey diamond weave with fine crosshatch fabric texture.
      case 'denimWeave': {
        tctx.fillStyle = '#3a5f7d';
        tctx.fillRect(0,0,s,s);
        tctx.strokeStyle = 'rgba(214,224,232,0.85)';
        tctx.lineWidth = Math.max(1, s*0.05);
        tctx.beginPath();
        tctx.moveTo(s*0.5, -s*0.1); tctx.lineTo(s*1.1, s*0.5);
        tctx.moveTo(s*1.1, s*0.5); tctx.lineTo(s*0.5, s*1.1);
        tctx.moveTo(s*0.5, s*1.1); tctx.lineTo(-s*0.1, s*0.5);
        tctx.moveTo(-s*0.1, s*0.5); tctx.lineTo(s*0.5, -s*0.1);
        tctx.stroke();
        // fine woven texture lines inside each diamond half
        tctx.strokeStyle = 'rgba(255,255,255,0.18)';
        tctx.lineWidth = Math.max(1, s*0.015);
        for(let i=-2;i<=2;i++){
          tctx.beginPath();
          tctx.moveTo(0, s*0.5+i*s*0.12);
          tctx.lineTo(s, s*0.5+i*s*0.12);
          tctx.stroke();
        }
        break;
      }

      // Volcanic near-black base with jagged glowing orange/red lava cracks.
      case 'lavaCrack': {
        tctx.fillStyle = '#181410';
        tctx.fillRect(0,0,s,s);
        const cracks = [
          { c: '#ff6a1f', w: 0.10, pts: [[-0.1,0.15],[0.25,0.35],[0.15,0.6],[0.5,0.55],[0.4,0.85],[1.2,0.75]] },
          { c: '#ffb23f', w: 0.05, pts: [[-0.15,0.7],[0.3,0.5],[0.2,0.2],[0.6,0.25],[0.55,-0.1]] },
        ];
        for(const crack of cracks){
          tctx.strokeStyle = crack.c;
          tctx.lineWidth = s*crack.w;
          tctx.lineCap = 'round';
          tctx.lineJoin = 'round';
          tctx.beginPath();
          crack.pts.forEach(([x,y],i) => {
            const px = x*s, py = y*s;
            if(i===0) tctx.moveTo(px,py); else tctx.lineTo(px,py);
          });
          tctx.stroke();
        }
        break;
      }

      // Deep mint-green base with a scattered grid of pale mint polka dots.
      case 'mintDots': {
        tctx.fillStyle = '#276b57';
        tctx.fillRect(0,0,s,s);
        tctx.fillStyle = '#bdf5e0';
        const dotPositions = [[0.22,0.22],[0.78,0.22],[0.5,0.5],[0.22,0.78],[0.78,0.78]];
        for(const [dx,dy] of dotPositions){
          tctx.beginPath();
          tctx.arc(dx*s, dy*s, s*0.13, 0, Math.PI*2);
          tctx.fill();
        }
        break;
      }

      // Deep royal-purple base with gold zigzag chevron stripes.
      case 'royalChevron': {
        tctx.fillStyle = '#33205c';
        tctx.fillRect(0,0,s,s);
        tctx.strokeStyle = '#e2bd52';
        tctx.lineWidth = s*0.12;
        tctx.lineCap = 'round';
        tctx.lineJoin = 'round';
        const rows = [0.15, 0.5, 0.85];
        for(const ry of rows){
          tctx.beginPath();
          tctx.moveTo(-s*0.1, ry*s - s*0.12);
          tctx.lineTo(s*0.5, ry*s + s*0.12);
          tctx.lineTo(s*1.1, ry*s - s*0.12);
          tctx.stroke();
        }
        break;
      }

      // Pale icy-blue base with faceted crystalline outline shapes.
      case 'iceCrystal': {
        tctx.fillStyle = '#cdeffb';
        tctx.fillRect(0,0,s,s);
        tctx.strokeStyle = '#79c9e6';
        tctx.lineWidth = Math.max(1, s*0.045);
        const facets = [
          [[0.1,0.1],[0.5,0.35],[0.15,0.55]],
          [[0.5,0.35],[0.9,0.15],[0.85,0.55]],
          [[0.15,0.55],[0.5,0.35],[0.85,0.55],[0.5,0.9]],
        ];
        for(const facet of facets){
          tctx.beginPath();
          facet.forEach(([x,y],i)=>{
            const px=x*s, py=y*s;
            if(i===0) tctx.moveTo(px,py); else tctx.lineTo(px,py);
          });
          tctx.closePath();
          tctx.stroke();
        }
        break;
      }

      // Copper-brown base flecked with darker rust and lighter highlight speckles.
      case 'copperRust': {
        tctx.fillStyle = '#7d4a2a';
        tctx.fillRect(0,0,s,s);
        const speckles = [
          [0.2,0.25,0.09,'#4a2712'], [0.65,0.2,0.07,'#c98a54'],
          [0.4,0.55,0.1,'#c98a54'], [0.8,0.6,0.08,'#4a2712'],
          [0.15,0.8,0.07,'#4a2712'], [0.55,0.85,0.09,'#c98a54'],
        ];
        for(const [dx,dy,r,c] of speckles){
          tctx.fillStyle = c;
          tctx.beginPath();
          tctx.arc(dx*s, dy*s, r*s, 0, Math.PI*2);
          tctx.fill();
        }
        break;
      }

      // Deep jungle-green base with a central leaf vein and branching side veins.
      case 'jungleLeaf': {
        tctx.fillStyle = '#1f4d2b';
        tctx.fillRect(0,0,s,s);
        tctx.strokeStyle = '#7fce7a';
        tctx.lineCap = 'round';
        tctx.lineWidth = s*0.06;
        tctx.beginPath();
        tctx.moveTo(s*0.5, -s*0.1);
        tctx.lineTo(s*0.5, s*1.1);
        tctx.stroke();
        tctx.lineWidth = s*0.035;
        const sides = [0.15, 0.4, 0.65, 0.9];
        for(const sy of sides){
          tctx.beginPath();
          tctx.moveTo(s*0.5, s*sy);
          tctx.lineTo(s*0.15, s*sy - s*0.12);
          tctx.stroke();
          tctx.beginPath();
          tctx.moveTo(s*0.5, s*sy);
          tctx.lineTo(s*0.85, s*sy - s*0.12);
          tctx.stroke();
        }
        break;
      }

      // Deep navy/black base scattered with small pale-blue stars.
      case 'cosmicStar': {
        tctx.fillStyle = '#0c1030';
        tctx.fillRect(0,0,s,s);
        tctx.fillStyle = '#dfe6ff';
        const stars = [[0.2,0.25,0.05],[0.7,0.15,0.035],[0.85,0.6,0.05],[0.35,0.7,0.04],[0.55,0.45,0.06],[0.1,0.85,0.035]];
        for(const [dx,dy,r] of stars){
          tctx.beginPath();
          tctx.arc(dx*s, dy*s, r*s, 0, Math.PI*2);
          tctx.fill();
        }
        break;
      }

      // Pale pink base with diagonal candy-cane stripes.
      case 'candyStripe': {
        tctx.fillStyle = '#fef1f5';
        tctx.fillRect(0,0,s,s);
        const stripes = [
          { c: '#ff6fa5', off: 0.1 },
          { c: '#ffb6d0', off: 0.4 },
          { c: '#ff6fa5', off: 0.7 },
        ];
        for(const st of stripes){
          tctx.strokeStyle = st.c;
          tctx.lineWidth = s*0.22;
          tctx.lineCap = 'round';
          const o = s*st.off;
          tctx.beginPath();
          tctx.moveTo(-s*0.3+o, s*1.3);
          tctx.lineTo(s*1.3+o, -s*0.3);
          tctx.stroke();
        }
        break;
      }

      // Charcoal-grey base with a lighter-grey crosshatch plaid overlay.
      case 'graphitePlaid': {
        tctx.fillStyle = '#494952';
        tctx.fillRect(0,0,s,s);
        tctx.strokeStyle = 'rgba(200,200,210,0.5)';
        tctx.lineWidth = s*0.08;
        const lines = [0.25, 0.75];
        for(const l of lines){
          tctx.beginPath();
          tctx.moveTo(l*s, 0);
          tctx.lineTo(l*s, s);
          tctx.stroke();
          tctx.beginPath();
          tctx.moveTo(0, l*s);
          tctx.lineTo(s, l*s);
          tctx.stroke();
        }
        tctx.strokeStyle = 'rgba(255,255,255,0.25)';
        tctx.lineWidth = Math.max(1,s*0.02);
        tctx.beginPath();
        tctx.moveTo(0, s*0.5); tctx.lineTo(s, s*0.5);
        tctx.moveTo(s*0.5, 0); tctx.lineTo(s*0.5, s);
        tctx.stroke();
        break;
      }

      // Teal reef base with branching coral-orange growths.
      case 'coralReef': {
        tctx.fillStyle = '#0d5c66';
        tctx.fillRect(0,0,s,s);
        tctx.strokeStyle = '#ff8a65';
        tctx.lineCap = 'round';
        const branch = (x,y,angle,len,depth) => {
          if(depth<=0) return;
          const x2 = x + Math.cos(angle)*len;
          const y2 = y + Math.sin(angle)*len;
          tctx.beginPath();
          tctx.moveTo(x,y);
          tctx.lineTo(x2,y2);
          tctx.stroke();
          branch(x2,y2, angle-0.5, len*0.7, depth-1);
          branch(x2,y2, angle+0.5, len*0.7, depth-1);
        };
        tctx.lineWidth = s*0.09;
        branch(s*0.2, s*1.05, -Math.PI/2.2, s*0.35, 3);
        tctx.lineWidth = s*0.07;
        branch(s*0.75, s*1.1, -Math.PI/1.8, s*0.3, 3);
        break;
      }

      // Deep emerald base with lighter scalloped dragon-scale arcs.
      case 'emeraldScale': {
        tctx.fillStyle = '#0b3d2e';
        tctx.fillRect(0,0,s,s);
        tctx.strokeStyle = '#2f8a6b';
        tctx.lineWidth = Math.max(1, s*0.05);
        const rows = [0.15, 0.5, 0.85];
        const cols = [0.15, 0.5, 0.85];
        for(const ry of rows){
          for(const cx of cols){
            tctx.beginPath();
            tctx.arc(cx*s, ry*s, s*0.18, Math.PI, 0);
            tctx.stroke();
          }
        }
        break;
      }

      // Bright sunflower-gold base with a dark center and radiating petal lines.
      case 'sunflowerField': {
        tctx.fillStyle = '#e8b400';
        tctx.fillRect(0,0,s,s);
        tctx.fillStyle = '#5c3a12';
        tctx.beginPath();
        tctx.arc(s*0.5, s*0.5, s*0.14, 0, Math.PI*2);
        tctx.fill();
        tctx.strokeStyle = '#b9790a';
        tctx.lineWidth = s*0.05;
        tctx.lineCap = 'round';
        const petals = 8;
        for(let i=0;i<petals;i++){
          const a = (i/petals)*Math.PI*2;
          tctx.beginPath();
          tctx.moveTo(s*0.5 + Math.cos(a)*s*0.18, s*0.5 + Math.sin(a)*s*0.18);
          tctx.lineTo(s*0.5 + Math.cos(a)*s*0.42, s*0.5 + Math.sin(a)*s*0.42);
          tctx.stroke();
        }
        break;
      }

      // Storm-grey base with a single bright yellow lightning bolt.
      case 'stormCloud': {
        tctx.fillStyle = '#3c4657';
        tctx.fillRect(0,0,s,s);
        tctx.fillStyle = '#ffe066';
        tctx.beginPath();
        tctx.moveTo(s*0.55, -s*0.05);
        tctx.lineTo(s*0.3, s*0.5);
        tctx.lineTo(s*0.5, s*0.5);
        tctx.lineTo(s*0.35, s*1.05);
        tctx.lineTo(s*0.75, s*0.42);
        tctx.lineTo(s*0.52, s*0.42);
        tctx.closePath();
        tctx.fill();
        break;
      }

      // Warm brown base scattered with tilted autumn-orange leaf blobs.
      case 'autumnLeaf': {
        tctx.fillStyle = '#7a3b1e';
        tctx.fillRect(0,0,s,s);
        tctx.fillStyle = '#d97a3d';
        const leaves = [[0.25,0.3,0.5],[0.7,0.25,0.4],[0.5,0.65,0.55],[0.8,0.75,0.35]];
        for(const [dx,dy,rot] of leaves){
          tctx.save();
          tctx.translate(dx*s, dy*s);
          tctx.rotate(rot);
          tctx.beginPath();
          tctx.ellipse(0,0, s*0.14, s*0.08, 0, 0, Math.PI*2);
          tctx.fill();
          tctx.restore();
        }
        break;
      }

      // Near-black base with cyberpunk cyan/magenta neon grid lines.
      case 'neonGrid': {
        tctx.fillStyle = '#0a0a12';
        tctx.fillRect(0,0,s,s);
        tctx.strokeStyle = '#22e6ff';
        tctx.lineWidth = s*0.035;
        const gridLines = [0.33, 0.66];
        for(const l of gridLines){
          tctx.beginPath();
          tctx.moveTo(l*s, 0); tctx.lineTo(l*s, s);
          tctx.stroke();
        }
        tctx.strokeStyle = '#ff2fd0';
        for(const l of gridLines){
          tctx.beginPath();
          tctx.moveTo(0, l*s); tctx.lineTo(s, l*s);
          tctx.stroke();
        }
        break;
      }

      // Sandy-tan base with darker rolling dune-wave curves.
      case 'desertSand': {
        tctx.fillStyle = '#d8b579';
        tctx.fillRect(0,0,s,s);
        tctx.strokeStyle = '#b8905a';
        tctx.lineWidth = s*0.06;
        tctx.lineCap = 'round';
        const waves = [0.35, 0.65, 0.9];
        for(const wy of waves){
          tctx.beginPath();
          tctx.moveTo(-s*0.1, wy*s);
          tctx.quadraticCurveTo(s*0.5, wy*s - s*0.15, s*1.1, wy*s);
          tctx.stroke();
        }
        break;
      }

      // Deep wine-maroon base with a cluster of grape-like dots.
      case 'wineBerry': {
        tctx.fillStyle = '#4a1030';
        tctx.fillRect(0,0,s,s);
        tctx.fillStyle = '#8a2f5c';
        const grapes = [[0.35,0.3,0.11],[0.55,0.3,0.11],[0.45,0.48,0.11],[0.65,0.48,0.11],[0.35,0.65,0.11],[0.55,0.65,0.11],[0.45,0.82,0.1]];
        for(const [dx,dy,r] of grapes){
          tctx.beginPath();
          tctx.arc(dx*s, dy*s, r*s, 0, Math.PI*2);
          tctx.fill();
        }
        break;
      }

      // Dark navy base with wavy green/purple aurora-borealis bands.
      case 'arcticAurora': {
        tctx.fillStyle = '#081c2e';
        tctx.fillRect(0,0,s,s);
        const bands = [
          { c: 'rgba(70,230,160,0.65)', y: 0.3 },
          { c: 'rgba(160,90,230,0.55)', y: 0.55 },
          { c: 'rgba(70,230,160,0.4)', y: 0.78 },
        ];
        for(const b of bands){
          tctx.strokeStyle = b.c;
          tctx.lineWidth = s*0.12;
          tctx.lineCap = 'round';
          tctx.beginPath();
          tctx.moveTo(-s*0.1, b.y*s);
          tctx.quadraticCurveTo(s*0.5, b.y*s - s*0.2, s*1.1, b.y*s + s*0.05);
          tctx.stroke();
        }
        break;
      }

      // Burnt-orange terracotta base with a darker grid of tile lines.
      case 'terracottaTile': {
        tctx.fillStyle = '#b5502a';
        tctx.fillRect(0,0,s,s);
        tctx.strokeStyle = '#7a331a';
        tctx.lineWidth = s*0.06;
        const lines = [0.33, 0.66];
        for(const l of lines){
          tctx.beginPath();
          tctx.moveTo(l*s, 0); tctx.lineTo(l*s, s);
          tctx.stroke();
          tctx.beginPath();
          tctx.moveTo(0, l*s); tctx.lineTo(s, l*s);
          tctx.stroke();
        }
        break;
      }

      // Five plain flat colors, same simple fill as 'solid' just with
      // different hues - sit right after Solid/black in the unlock order,
      // before the multicolour/textured patterns begin.
      case 'plainRed':
        tctx.fillStyle = '#d9463f';
        tctx.fillRect(0,0,s,s);
        break;

      case 'plainBlue':
        tctx.fillStyle = '#3971e0';
        tctx.fillRect(0,0,s,s);
        break;

      case 'plainGreen':
        tctx.fillStyle = '#2e9e5b';
        tctx.fillRect(0,0,s,s);
        break;

      case 'plainOrange':
        tctx.fillStyle = '#e08a2e';
        tctx.fillRect(0,0,s,s);
        break;

      case 'plainPurple':
        tctx.fillStyle = '#7c4fc4';
        tctx.fillRect(0,0,s,s);
        break;

      case 'solid':
      default:
        tctx.fillStyle = PIPE_COLOR;
        tctx.fillRect(0,0,s,s);
        break;
    }
    return tile;
  }

  // Index into ARROW_PATTERN_TYPES for a given level number. Shared by the
  // drawing code and by the "new pattern unlocked" popup check below, so
  // both always agree on exactly which level a pattern change lands on.
  // This WRAPS once the cycle completes (there are only 7 pattern types),
  // so it's only for picking which pattern to *display* - never use it to
  // count how many patterns have been unlocked (see getRawPatternTierCount
  // below for that).
  function getPatternTierIndex(level, mode){
    mode = mode || gameMode;
    const interval = getPatternUnlockInterval(mode);
    return Math.floor((level - 1) / interval) % ARROW_PATTERN_TYPES.length;
  }

  // Uncapped, 1-indexed count of tiers reached by a given level - e.g.
  // Easy 1-20 -> 1, 21-40 -> 2, ... for Easy; Medium 1-15 -> 1, 16-30 -> 2,
  // etc. Unlike getPatternTierIndex this deliberately does NOT wrap, so it
  // can be safely clamped to ARROW_PATTERN_TYPES.length to get "how many
  // patterns are unlocked" without that count resetting back down every time
  // the display cycle wraps around to Solid again.
  function getRawPatternTierCount(level, mode){
    mode = mode || gameMode;
    const interval = getPatternUnlockInterval(mode);
    return Math.floor((level - 1) / interval) + 1;
  }

  // Shared "how close to the next pattern" calculation, used both by the
  // Level Select progress chip and the evening reminder notification.
  // Returns null once every pattern is unlocked for that mode (nothing
  // left to show). mode defaults to whichever mode is currently active.
  function getPatternProgressInfo(level, mode){
    mode = mode || gameMode;
    if(unlockedPatternTiers[mode] >= ARROW_PATTERN_TYPES.length) return null;

    const interval = getPatternUnlockInterval(mode);
    const tierCount = getRawPatternTierCount(level, mode);
    const nextTierStartLevel = tierCount * interval + 1;
    const remaining = Math.max(1, nextTierStartLevel - level);
    const nextType = ARROW_PATTERN_TYPES[Math.min(tierCount, ARROW_PATTERN_TYPES.length - 1)];
    const nextName = PATTERN_DISPLAY_NAMES[nextType] || 'a new pattern';
    const progressInBlock = interval - remaining;
    const percent = Math.max(0, Math.min(100, Math.round((progressInBlock / interval) * 100)));

    return { remaining, nextName, percent };
  }

  // Small progress bar + "N levels to unlock X" line for the Level Select
  // popup - shown for whichever mode the player currently has open, so it
  // reflects that mode's own progress rather than their best mode overall.
  function getPatternProgressChipHtml(level){
    const info = getPatternProgressInfo(level);
    if(!info){
        return `<div style="
            font-size:12px; font-weight:bold; color:#2e9e5b;
            margin-bottom:14px; text-align:center;
        ">🎉 All patterns unlocked!</div>`;
    }

    const label = info.remaining === 1
        ? `1 level to unlock <b>${info.nextName}</b>!`
        : `${info.remaining} levels to unlock <b>${info.nextName}</b>`;

    return `<div style="margin-bottom:14px; text-align:left;">
        <div style="font-size:12px; color:#666; margin-bottom:5px;">${label}</div>
        <div style="background:#eef0fb; border-radius:6px; height:8px; overflow:hidden;">
            <div style="background:#4d63ff; height:100%; width:${info.percent}%; border-radius:6px;"></div>
        </div>
    </div>`;
  }

  // Brings unlockedPatternTiers up to date with maxUnlockedLevel, mode by
  // mode independently - Easy's tier count is derived only from Easy's
  // progress, Medium only from Medium's, etc. Only ever raises a given
  // mode's count, never lowers it - so a save file from before this
  // feature existed (or someone who's already cleared plenty of levels)
  // immediately gets the patterns they've effectively already earned in
  // that mode, rather than needing to "re-pass" levels they've already
  // beaten.
  function syncUnlockedPatternTiers(){
    for(const m of ['easy','medium','hard']){
      const lvl = (maxUnlockedLevel && maxUnlockedLevel[m]) || 1;
      const count = Math.min(ARROW_PATTERN_TYPES.length, getRawPatternTierCount(lvl, m));
      if(count > unlockedPatternTiers[m]) unlockedPatternTiers[m] = count;
    }
  }

  // Organic textures (swirls, contour lines, blobs) read better at a
  // larger tile size than simple geometric ones - each type picks its own
  // fraction of cellSize.
  const PATTERN_TILE_SCALE = {
    solid: 0.16,
    plainRed: 0.16,
    plainBlue: 0.16,
    plainGreen: 0.16,
    plainOrange: 0.16,
    plainPurple: 0.16,
    contourLines: 0.6,
    marbleSwirl: 0.6,
    sunsetWave: 0.34,
    crimsonBlob: 0.5,
    goldenTopo: 0.45,
    denimWeave: 0.32,
    lavaCrack: 0.5,
    mintDots: 0.35,
    royalChevron: 0.34,
    iceCrystal: 0.4,
    copperRust: 0.4,
    jungleLeaf: 0.55,
    cosmicStar: 0.4,
    candyStripe: 0.3,
    graphitePlaid: 0.32,
    coralReef: 0.55,
    emeraldScale: 0.45,
    sunflowerField: 0.55,
    stormCloud: 0.4,
    autumnLeaf: 0.5,
    neonGrid: 0.33,
    desertSand: 0.4,
    wineBerry: 0.45,
    arcticAurora: 0.5,
    terracottaTile: 0.32,
  };

  // Returns a fillStyle/strokeStyle-compatible value (flat color string or
  // CanvasPattern) representing the arrow's "at rest" look for the current
  // level. Cached per (pattern type, tile size) pair so it's cheap to call
  // every frame.
  function getArrowFillStyle(){
    const type = getActiveArrowPatternType();
    if(type === 'solid') return PIPE_COLOR;

    const scale = PATTERN_TILE_SCALE[type] || 0.3;
    const tileSize = Math.max(6, Math.round(cellSize * scale));
    const key = type + '_' + tileSize;
    let pattern = patternCache.get(key);
    if(!pattern){
      const tile = buildPatternTile(type, tileSize);
      pattern = ctx.createPattern(tile, 'repeat');
      patternCache.set(key, pattern);
    }
    return pattern;
  }

  function getActiveArrowPatternType(){
    // Each mode now has its own independently-pinned pattern (or 'auto'),
    // so look up whatever the CURRENT mode has selected - not a shared
    // global value.
    const pinned = selectedPatternType[gameMode];
    if(pinned !== 'auto' && ARROW_PATTERN_TYPES.includes(pinned)){
      // A pinned pattern only applies once it's actually been unlocked in
      // this mode. Falls back to Auto Select's normal level-based tier
      // otherwise (e.g. right after a fresh unlock-tier reset).
      const pinnedIndex = ARROW_PATTERN_TYPES.indexOf(pinned);
      const pinnedUnlocked = TESTING_UNLOCK_ALL_PATTERNS || pinnedIndex < unlockedPatternTiers[gameMode];
      if(pinnedUnlocked) return pinned;
    }
    return ARROW_PATTERN_TYPES[getPatternTierIndex(currentLevel)];
  }

  // Representative flat/base color for each pattern type. Used to produce
  // a solid, darker arrow-head color that contrasts with the patterned shaft.
  // NOTE for future patterns: this color can be light or dark - it does NOT
  // need to be pre-darkened by hand. getArrowHeadSolidColorForType() below
  // automatically darkens it by an amount that scales with how light it is
  // (see its own comment), guaranteeing the final head color is always
  // clearly visible against the light board background. Just pick whatever
  // base color best represents the pattern's dominant/background shade.
  function getPatternBaseColor(type){
    switch(type){
      case 'plainRed':     return '#d9463f';
      case 'plainBlue':    return '#3971e0';
      case 'plainGreen':   return '#2e9e5b';
      case 'plainOrange':  return '#e08a2e';
      case 'plainPurple':  return '#7c4fc4';
      case 'contourLines': return '#0d3b2e';
      case 'marbleSwirl':  return '#123c63';
      case 'sunsetWave':   return '#1c2b3a';
      case 'crimsonBlob':  return '#8f1330';
      case 'goldenTopo':   return '#f2b93d';
      case 'denimWeave':   return '#3a5f7d';
      case 'lavaCrack':    return '#181410';
      case 'mintDots':     return '#276b57';
      case 'royalChevron': return '#33205c';
      case 'iceCrystal':   return '#cdeffb';
      case 'copperRust':   return '#7d4a2a';
      case 'jungleLeaf':   return '#1f4d2b';
      case 'cosmicStar':   return '#0c1030';
      case 'candyStripe':  return '#fef1f5';
      case 'graphitePlaid':return '#494952';
      case 'coralReef':    return '#0d5c66';
      case 'emeraldScale': return '#0b3d2e';
      case 'sunflowerField': return '#e8b400';
      case 'stormCloud':   return '#3c4657';
      case 'autumnLeaf':   return '#7a3b1e';
      case 'neonGrid':     return '#0a0a12';
      case 'desertSand':   return '#d8b579';
      case 'wineBerry':    return '#4a1030';
      case 'arcticAurora': return '#081c2e';
      case 'terracottaTile': return '#b5502a';
      case 'solid':
      default: return PIPE_COLOR;
    }
  }

  function getArrowHeadSolidColorForType(type){
    // Darken the base so the head reads as a solid, clearly-visible dark
    // cap against the board (--board-bg is a light grey, #dedde6) - not
    // just relative to the patterned shaft. A flat, small darken amount
    // works fine for already-dark bases (e.g. Lava, Cosmic) but leaves
    // pale bases (e.g. Ice, Candy, Gold) still too light to read clearly
    // against a light board, so the darken amount scales up the lighter
    // the base color is, guaranteeing every pattern's head color ends up
    // a clearly dark, clearly visible shade.
    const base = getPatternBaseColor(type);
    const lum = relativeLuminance(base);
    let amt;
    if(lum > 200) amt = 0.62;      // very light bases (Ice, Candy) - darken hard
    else if(lum > 150) amt = 0.45; // light/medium bases (Gold)
    else if(lum > 90)  amt = 0.28; // mid-tone bases
    else amt = 0.16;               // already-dark bases - just a touch darker
    return darkenColor(base, amt);
  }

  function getLeavingArrowFillStyle(){
    return getActiveArrowPatternType() === 'solid' ? BLUE : getArrowFillStyle();
  }

  // Draws a small sample arrow (shaft + head, same proportions/style as the
  // real in-game drawStrip) onto a standalone <canvas>, filled with the
  // given pattern type. Used by the Pattern menu so each option shows what
  // it actually looks like rather than just its name. Independent of
  // cellSize/patternCache - it works off the preview canvas's own pixel
  // size, since menu previews are a fixed small size regardless of board
  // zoom or cell size.
  function drawPatternPreviewIcon(type, canvas){
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    // canvas.width/height at this point are the plain nominal size from the
    // HTML (e.g. 120x46) - treat that as the intended CSS display size, then
    // size the real backing store up for a crisp result on high-DPI screens.
    const cw = canvas.width, ch = canvas.height;
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    canvas.width = Math.round(cw * dpr);
    canvas.height = Math.round(ch * dpr);
    const pctx = canvas.getContext('2d');
    pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    pctx.clearRect(0, 0, cw, ch);

    let fillStyle;
    if(type === 'solid'){
      fillStyle = PIPE_COLOR;
    } else {
      const scale = PATTERN_TILE_SCALE[type] || 0.3;
      const tileSize = Math.max(6, Math.round(40 * scale)); // nominal ~40px "cellSize" for preview purposes
      const tile = buildPatternTile(type, tileSize);
      fillStyle = pctx.createPattern(tile, 'repeat');
    }

    const midY = ch/2;
    const thickness = ch*0.5;
    const headLen = ch*0.85;
    const headW = ch*0.85;
    const tipX = cw - 6;
    const baseX = tipX - headLen;

    pctx.lineJoin = 'round';
    pctx.lineCap = 'round';
    pctx.strokeStyle = fillStyle;
    pctx.lineWidth = thickness;
    pctx.beginPath();
    pctx.moveTo(6, midY);
    pctx.lineTo(baseX, midY);
    pctx.stroke();

    // Fill the head with a solid, slightly darker color derived from
    // the pattern type so the tip reads clearly against the patterned shaft.
    const headSolid = getArrowHeadSolidColorForType(type);
    pctx.fillStyle = headSolid;
    pctx.beginPath();
    pctx.moveTo(tipX, midY);
    pctx.lineTo(baseX, midY - headW/2);
    pctx.lineTo(baseX, midY + headW/2);
    pctx.closePath();
    pctx.fill();
  }

  // draws a pipe strip through an arbitrary list of points, with the arrowhead
  // built from the direction of travel at the very front point
  function drawStrip(pts, headVec, color){
    const thickness = cellSize * 0.20;  // width of arrow (thickened so patterns/textures actually read)

    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.strokeStyle = color;
    ctx.lineWidth = thickness;

    const [ex,ey] = pts[pts.length-1];
    const tipX = ex;
    const tipY = ey;

    // Distance from the tip back to the arrowhead's base - kept the same
    // for every arrow so head size doesn't depend on path length.
    const headLen = cellSize*0.38;
    const baseX = ex - headVec.dx*headLen;
    const baseY = ey - headVec.dy*headLen;

    // Body/tail of the arrow: for multi-cell paths this runs through
    // every earlier cell up to the head. Single-cell paths have no
    // earlier cell to start from, so the tail instead starts at the back
    // edge of that one cell - either way there's always a visible line
    // leading into the arrowhead, never just a bare triangle floating on
    // its own.
    const bodyPts = pts.length >= 2
      ? pts.slice(0, pts.length-1)
      : [[ex - headVec.dx*cellSize*0.5, ey - headVec.dy*cellSize*0.5]];
    const shaftPts = bodyPts.concat([[baseX, baseY]]);
    ctx.beginPath();
    shaftPts.forEach(([x,y], i) => { if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); });
    ctx.stroke();

    const headW = cellSize*0.34;   // narrower relative to length -> sharper point
    const angle = Math.atan2(headVec.dy, headVec.dx);
    const perpX = -Math.sin(angle)*headW/2;
    const perpY =  Math.cos(angle)*headW/2;

    ctx.beginPath();
    ctx.moveTo(tipX, tipY);
    ctx.lineTo(baseX+perpX, baseY+perpY);
    ctx.lineTo(baseX-perpX, baseY-perpY);
    ctx.closePath();
    // Use a solid, slightly darker head color derived from the current
    // arrow pattern so the tip appears as a solid cap regardless of the
    // patterned shaft used for the body. Exception: a wrong-move/flashing
    // arrow passes RED as its shaft color, and the head must match it
    // exactly (fully red arrow) rather than falling back to the
    // pattern-derived tint, regardless of which pattern is selected.
    const headFill = (color === RED) ? RED : getArrowHeadSolidColorForType(getActiveArrowPatternType());
    ctx.fillStyle = headFill;
    ctx.fill();
  }

  function drawPathShape(path, color){
    const pts = path.cells.map(([r,c]) => cellCenter(r,c));
    drawStrip(pts, DIRS[path.headDir], color || PIPE_COLOR);
  }

  // Full-board grid overlay (toggled by the Grid button). Lines run through
  // the center of each row/column - the exact rows/columns arrows travel
  // along - rather than around the boxy outline of the board cells, so the
  // grid reads as "this is the lane an arrow moves through" rather than
  // "this is a box drawn around it".
  function drawFullGrid(){
    ctx.save();
    ctx.strokeStyle = 'rgba(77,99,255,0.35)';
    ctx.lineWidth = Math.max(1, cellSize*0.02);
    const TOP_BAR = cellSize * 0.9;

    // One full-length line per arrow, drawn only along the axis the arrow
    // actually exits on: a left/right-facing head gets a horizontal line
    // through its row, an up/down-facing head gets a vertical line through
    // its column. This shows at a glance which way each arrow will travel,
    // instead of a full crosshair on every occupied row and column.
    pathsMap.forEach(path => {
      const [r, c] = path.cells[path.cells.length - 1]; // head cell
      if(path.headDir === 'left' || path.headDir === 'right'){
        const y = TOP_BAR + r*cellSize + cellSize/2;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(COLS*cellSize, y);
        ctx.stroke();
      } else {
        const x = c*cellSize + cellSize/2;
        ctx.beginPath();
        ctx.moveTo(x, TOP_BAR);
        ctx.lineTo(x, TOP_BAR + ROWS*cellSize);
        ctx.stroke();
      }
    });
    ctx.restore();
  }

  function easeInCubic(t){ return t*t*t; }
  function easeOutCubic(t){ return 1 - Math.pow(1 - t, 3); }

  // true if nothing else currently occupies the cells straight ahead of this
  // arrow's head, all the way to the edge of the board
  function isClear(path){
    const [r,c] = path.cells[path.cells.length-1];
    const d = DIRS[path.headDir];
    let rr = r+d.dy, cc = c+d.dx;
    while(rr>=0 && rr<ROWS && cc>=0 && cc<COLS){
      const occ = grid[rr][cc];
      if(occ !== -1 && occ !== path.id) return false;
      rr += d.dy; cc += d.dx;
    }
    return true;
  }

  // for a blocked arrow: how far (in px) it can nudge forward, straight out
  // of its head, before its tip touches whatever cell is in the way. Used
  // for the "wrong move" bump animation - counts clear cells ahead, then
  // adds half a cell so the tip lands right on the blocker's near edge
  // rather than stopping short or overlapping into it.
  function computeBumpDistance(path){
    const [r,c] = path.cells[path.cells.length-1];
    const d = DIRS[path.headDir];
    let rr = r+d.dy, cc = c+d.dx;
    let clearCells = 0;
    while(rr>=0 && rr<ROWS && cc>=0 && cc<COLS){
      const occ = grid[rr][cc];
      if(occ !== -1 && occ !== path.id) break; // found the blocker
      clearCells++;
      rr += d.dy; cc += d.dx;
    }
    return (clearCells + 0.5) * cellSize;
  }

  function draw(now){
    ctx.clearRect(0,0,boardW,boardH);
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--board-bg').trim();
    ctx.fillRect(0,0,boardW,boardH);
    drawDotGrid();
    if(showGrid) drawFullGrid();

    if(shuffleAnim){
      drawShuffleAnim(now);
    } else {
      const bumpingIds = new Set(bumping.map(item => item.id));
      const restFillStyle = getArrowFillStyle();
      pathsMap.forEach(p => {
        if(bumpingIds.has(p.id)) return; // drawn by the bump animation below instead
        const color = flashing.has(p.id) ? RED : restFillStyle;
        drawPathShape(p, color);
      });
    }

    leaving = leaving.filter(item => {
      const elapsed = now - item.startTime;
      const t = Math.min(1, elapsed / item.duration);
      const shiftProgress = item.fastStart ? easeOutCubic(t) : easeInCubic(t);
      const shift = item.total_extra_travel * shiftProgress;
      const headVec = DIRS[item.path.headDir];
      const newPts = item.cum.map(s => pointAtArclength(item.pts, item.cum, s + shift, headVec));
      drawStrip(newPts, headVec, item.fillStyle || BLUE);
      return t < 1;
    });

    // Wrong-move feedback: the tapped arrow nudges forward along its own
    // path until its tip touches whatever's blocking it, then springs back
    // to its original slot - staying red the whole time (and after).
    bumping = bumping.filter(item => {
      const elapsed = now - item.startTime;
      const t = Math.min(1, elapsed / item.duration);
      const shift = item.maxDist * Math.sin(Math.PI * t); // 0 -> maxDist -> 0
      const headVec = DIRS[item.path.headDir];
      const newPts = item.cum.map(s => pointAtArclength(item.pts, item.cum, s + shift, headVec));
      drawStrip(newPts, headVec, RED);
      return t < 1;
    });

    if(leaving.length > 0 || bumping.length > 0 || shuffleAnim){
      requestAnimationFrame(draw);
    } else {
      animFrameQueued = false;
    }

  }

  // Checkpoint reshuffle transition: the old layout spins/shrinks/fades out
  // around the board's center, then the new layout spins/grows/fades in
  // the same way - a visible "shuffle" instead of an instant cut. Purely
  // cosmetic: grid/pathsMap still hold the OLD layout for gameplay purposes
  // until this finishes and performs the actual swap (input stays blocked
  // the whole time via inputBlockedUntil, set when the animation started).
  function drawShuffleAnim(now){
    const anim = shuffleAnim;
    const elapsed = now - anim.startTime;
    const progress = Math.min(1, elapsed / anim.duration);
    const restFillStyle = getArrowFillStyle();
    const cx = boardW/2, cy = boardH/2;

    ctx.save();
    if(progress < 0.5){
      // phase 1: old arrows spin/shrink/fade out
      const p = easeInCubic(progress / 0.5);
      const scale = 1 - 0.45*p;
      ctx.globalAlpha = Math.max(0, 1 - p);
      ctx.translate(cx, cy);
      ctx.rotate(0.5 * p);
      ctx.scale(scale, scale);
      ctx.translate(-cx, -cy);
      for(const p2 of anim.oldPaths) drawPathShape(p2, restFillStyle);
    } else {
      // phase 2: new arrows spin/grow/fade in
      const p = easeInCubic((progress - 0.5) / 0.5);
      const scale = 0.55 + 0.45*p;
      ctx.globalAlpha = Math.max(0, p);
      ctx.translate(cx, cy);
      ctx.rotate(-0.5 * (1 - p));
      ctx.scale(scale, scale);
      ctx.translate(-cx, -cy);
      for(const p2 of anim.newPathsMap.values()) drawPathShape(p2, restFillStyle);
    }
    ctx.restore();
    ctx.globalAlpha = 1;

    if(progress >= 1){
      grid = anim.newGrid;
      pathsMap = anim.newPathsMap;
      shuffleAnim = null;
      saveGameState();
    }
  }

  function requestDraw(){
    if(!animFrameQueued){
      animFrameQueued = true;
      requestAnimationFrame(draw);
    }
  }

  // Confetti celebration: two cannons fire from the bottom-left and
  // bottom-right corners of the screen, arcing pieces up and inward. Used
  // on the level-complete popup. Runs on its own full-screen canvas so it
  // sits above everything (including the popup) without disturbing the
  // board/canvas rendering underneath.
  function launchConfetti(){
   const dpr = Math.min(2, window.devicePixelRatio || 1);
    const W = window.innerWidth, H = window.innerHeight;

    const canvas = document.createElement('canvas');
    canvas.style.cssText = `
        position:fixed;
        top:0;
        right:0;
        bottom:0;
        left:0;
        pointer-events:none;
        z-index:10000;
    `;
    canvas.width = W*dpr;
    canvas.height = H*dpr;
    canvas.style.width = W+'px';
    canvas.style.height = H+'px';
    document.body.appendChild(canvas);

    const cctx = canvas.getContext('2d');
    cctx.setTransform(dpr,0,0,dpr,0,0);

    const COLORS = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#c77dff','#ff9f1c','#ff5da2'];
    const particles = [];

    // side: -1 = cannon on the left edge firing rightward/up,
    //        1 = cannon on the right edge firing leftward/up
    function spawnBurst(side){
      const x = side < 0 ? -10 : W+10;
      const count = 34;
      for(let i=0;i<count;i++){
        const spread = (Math.random()*0.55 + 0.12); // 0.12..0.67 rad off straight-up
        const angle = -Math.PI/2 + side*-1*spread; // tilt inward, toward center
        const speed = 9 + Math.random()*8;
        particles.push({
          x, y: H*0.85,
          vx: Math.cos(angle)*speed,
          vy: Math.sin(angle)*speed,
          size: 5 + Math.random()*6,
          color: COLORS[Math.floor(Math.random()*COLORS.length)],
          rot: Math.random()*Math.PI*2,
          vr: (Math.random()-0.5)*0.35,
          shape: Math.random() < 0.5 ? 'rect' : 'circle',
          life: 0,
          maxLife: 85 + Math.random()*45
        });
      }
    }

    spawnBurst(-1);
    spawnBurst(1);
    const secondBurstTimer = setTimeout(() => { spawnBurst(-1); spawnBurst(1); }, 260);

    const gravity = 0.22;
    const drag = 0.995;
    let raf;

    function frame(){
      cctx.clearRect(0,0,W,H);
      for(let i=particles.length-1;i>=0;i--){
        const p = particles[i];
        p.vy += gravity;
        p.vx *= drag;
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vr;
        p.life++;
        const alpha = Math.max(0, 1 - p.life/p.maxLife);
        cctx.save();
        cctx.translate(p.x,p.y);
        cctx.rotate(p.rot);
        cctx.globalAlpha = alpha;
        cctx.fillStyle = p.color;
        if(p.shape === 'rect'){
          cctx.fillRect(-p.size/2, -p.size/3, p.size, p.size*0.6);
        } else {
          cctx.beginPath();
          cctx.arc(0,0,p.size/2,0,Math.PI*2);
          cctx.fill();
        }
        cctx.restore();
        if(p.life > p.maxLife || p.y > H+60) particles.splice(i,1);
      }
      if(particles.length > 0){
        raf = requestAnimationFrame(frame);
      } else {
        canvas.remove();
      }
    }
    raf = requestAnimationFrame(frame);

    return function stopConfetti(){
      clearTimeout(secondBurstTimer);
      cancelAnimationFrame(raf);
      canvas.remove();
    };
  }

  // autoCloseMs is optional - when set, the popup dismisses itself (and
  // fires callback) after that many ms even if the player never taps it.
  // Tapping still dismisses it early, either way callback only ever runs
  // once thanks to the dismissed flag.
  function showPopup(title, message, callback, celebrate, autoCloseMs){

    const old = document.getElementById("gamePopup");
    if(old) old.remove();

    const popup = document.createElement("div");

    popup.id = "gamePopup";

    popup.style.cssText = `
        position:fixed;
        top:0;
        right:0;
        bottom:0;
        left:0;
        background:rgba(0,0,0,.45);
        display:flex;
        justify-content:center;
        align-items:center;
        z-index:10001;
        cursor:pointer;
    `;

    popup.innerHTML = `
        <div style="
            background:white;
            border-radius:16px;
            padding:20px 26px;
            text-align:center;
            box-shadow:0 15px 40px rgba(0,0,0,.25);
            min-width:200px;
            max-width:80vw;
        ">
            <div style="
                font-size:22px;
                font-weight:bold;
                color:#2c2f4a;
                ${message ? 'margin-bottom:10px;' : ''}
            ">
                ${title}
            </div>

            ${message ? `
            <div style="
                font-size:15px;
                color:#666;
            ">
                ${message}
            </div>
            ` : ''}
        </div>
    `;

    let stopConfetti = null;
    if(celebrate){
        try {
            stopConfetti = launchConfetti();
        } catch(err){
            // Never let a confetti failure (e.g. a device-specific canvas
            // quirk) prevent the popup itself from showing.
            console.error('launchConfetti failed:', err);
            stopConfetti = null;
        }
    }

    let dismissed = false;
    function dismiss(){
        if(dismissed) return;
        dismissed = true;

        if(stopConfetti) stopConfetti();

        popup.remove();

        if(callback)
            callback();
    }

    // Grace period before tap-to-dismiss becomes active. Popups like
    // "Arrows Shuffled!" are shown as a direct result of the same tap
    // that triggered them - on some Android WebViews a single physical
    // tap can fire a duplicate/ghost pointer or click event a few ms
    // later (see the WebView quirk noted in handleTap()), which lands
    // on this fresh full-screen overlay and would otherwise dismiss it
    // before the player ever sees it. Desktop mouse clicks don't have
    // this problem since there's only ever one real click. 250ms is
    // well under any legitimate double-tap-to-dismiss timing.
    const openedAt = performance.now();
    const DISMISS_GRACE_MS = 250;
    popup.addEventListener("click", () => {
        if(performance.now() - openedAt < DISMISS_GRACE_MS) return;
        dismiss();
    });

    if(autoCloseMs){
        setTimeout(() => {
            // Skip if already dismissed by a tap, or removed some other way
            // (e.g. the hardware back button handler clears #gamePopup
            // directly) - isConnected covers both without double-firing.
            if(!dismissed && popup.isConnected) dismiss();
        }, autoCloseMs);
    }

    document.body.appendChild(popup);

}

    // Called right before a level starts (after currentLevel has already
    // been updated to the level about to be played). Shows a "new pattern
    // unlocked" popup - and only calls onDone() once it's dismissed, so
    // the pattern change is announced before the player ever sees it on
    // the board - but only while there are still genuinely new patterns
    // left to unlock. Once every pattern is unlocked, the display still
    // cycles through them (via getPatternTierIndex, which wraps), but this
    // stops announcing anything since nothing new is being earned anymore.
    function maybeAnnouncePatternUnlock(previousLevel, onDone){
        const prevCount = Math.min(ARROW_PATTERN_TYPES.length, getRawPatternTierCount(previousLevel));
        const newCount = Math.min(ARROW_PATTERN_TYPES.length, getRawPatternTierCount(currentLevel));
        if(newCount <= prevCount || previousLevel < 1){
            onDone();
            return;
        }

              layoutCanvas();
          } else {
              inGameHistoryState = false;
              showMenu();
          }
      });

      // ---------------------------------------------------------------
      // Hardware back button inside a native WebView wrapper (Cordova /
      // Capacitor / a custom Android or iOS bridge).
      //
      // IMPORTANT: none of this is reachable from a plain desktop/mobile
      // browser tab - that case is already fully handled above via
      // history.pushState/popstate. This section only matters once the
      // page is packaged inside a native app shell, because those shells
      // do NOT translate the hardware/software back button into normal
      // browser history navigation. Cordova fires its own 'backbutton'
      // DOM event, and Capacitor fires its own 'backButton' plugin event -
      // and critically, if nothing listens for either, their default
      // unhandled behavior is to close/exit the app immediately, which is
      // exactly the "back exits the game" symptom being reported here.
      // Simply registering a listener is what suppresses that default
      // exit-on-back behavior and lets us decide what happens instead.
      // ---------------------------------------------------------------
      function handleHardwareBack(){
          // Debug aid: connect the device via USB, open chrome://inspect on
          // a desktop Chrome, and inspect this WebView while the APK is
          // running. If you never see this log line when pressing back, the
          // event isn't reaching the page at all - that's a native/manifest
          // issue (see the predictive-back-gesture note), not something in
          // this file.
          console.log('[backbutton] handleHardwareBack fired, menuVisible=' +
              (document.getElementById('menuScreen').style.display !== 'none') +
              ' gameStarted=' + gameStarted);

          // Any dismissible popup on top (level select, mode select, bug
          // report, the life-lost/level-complete popup) should close first.
          const gamePopup = document.getElementById('gamePopup');
          const levelPopup = document.getElementById('levelPopup');
          const modePopup = document.getElementById('modePopup');
          const reportPopup = document.getElementById('reportPopup');
          if(gamePopup){ gamePopup.remove(); return; }
          if(levelPopup){ levelPopup.remove(); return; }
          if(modePopup){ modePopup.remove(); return; }
          if(reportPopup){ reportPopup.remove(); return; }

          const menuVisible = document.getElementById('menuScreen').style.display !== 'none';
          if(!menuVisible){
              // currently playing -> first back press opens the menu (same
              // screen the in-game ☰ button opens)
              showMenu();
          } else {
              // the menu is already showing - whether it's the true
              // top-level menu, or a pause overlay back-pressed into from
              // an in-progress game - a second consecutive back press here
              // is a genuine "exit" request, so defer to the same exit
              // logic the Exit button already uses (Cordova/Capacitor/
              // native bridge aware).
              document.getElementById('exitBtn').click();
          }
      }

      // Cordova: registering a 'backbutton' listener overrides its default
      // exit-the-app behavior. The official guidance is to attach it only
      // AFTER 'deviceready' fires - but 'deviceready' is a plain one-shot
      // DOM event, not a replayable channel: if this script happens to run
      // (or resume, e.g. after a slow plugin init on a lower-end/heavily
      // customized device) even slightly after deviceready has already
      // fired, document.addEventListener('deviceready', ...) will NEVER
      // call its callback, backButtonBound stays false for the entire
      // session, and every back press/gesture falls through to Cordova's
      // native default of instantly closing the app - exactly the
      // "auto exit" symptom reported on some devices.
      //
      // Fix: bind the 'backbutton' listener eagerly too, right away rather
      // than only inside the deviceready callback. Attaching a DOM listener
      // is always safe even before the native bridge is fully ready - it
      // simply sits there until Cordova starts forwarding real back-key
      // events to it. lastBackHandledAt debounces so that on the normal
      // path (both the eager bind AND the deviceready bind end up
      // attached) a single physical back press still only triggers
      // handleHardwareBack() once, not twice.
      let backButtonBound = false;
      let lastBackHandledAt = 0;
      function bindBackButtonListener(source){
          if(backButtonBound) return;
          console.log('[backbutton] binding backbutton listener (' + source + ')');
          document.addEventListener('backbutton', (e) => {
              if(e && e.preventDefault) e.preventDefault();
              const now = Date.now();
              if(now - lastBackHandledAt < 300) return; // debounce duplicate dispatch
              lastBackHandledAt = now;
              handleHardwareBack();
          }, false);
          backButtonBound = true;
      }
      bindBackButtonListener('eager, on script load');
      document.addEventListener('deviceready', () => {
          console.log('[backbutton] deviceready fired');
          bindBackButtonListener('deviceready fallback');
      }, false);

      // Diagnostic only: if deviceready hasn't fired within 5s of load, the
      // native Cordova bridge either isn't present or is failing to
      // initialize (e.g. cordova.js 404'd in this particular build), which
      // means the 'backbutton' listener above never gets attached and the
      // OS's default/legacy back handling takes over instead of this page's
      // JS. Check chrome://inspect for this warning.
      setTimeout(() => {
          if(!backButtonBound){
              console.warn('[backbutton] deviceready never fired - the Cordova ' +
                  'backbutton listener was never attached. This is a native ' +
                  'project issue (missing/broken cordova.js bridge), not something ' +
                  'fixable in index.html.');
          }
      }, 5000);

      // Capacitor: same idea via the App plugin's backButton event.
      if(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App &&
         typeof window.Capacitor.Plugins.App.addListener === 'function'){
          window.Capacitor.Plugins.App.addListener('backButton', () => handleHardwareBack());
      }

      // Fallback for WebView wrappers/plugins that deliver the hardware back
      // key as a plain keydown (legacy Android back keyCode 4) instead of -
      // or in addition to - Cordova's custom 'backbutton' event. Harmless to
      // have both: handleHardwareBack() itself is idempotent per press since
      // each press only ever fires one of these events.
      document.addEventListener('keydown', (e) => {
          if(e.keyCode === 4){
              e.preventDefault();
              handleHardwareBack();
          }
      }, false);

      // Fun, varied reminder copy instead of one fixed line per slot -
      // several options per time-of-day, rotated by day-of-year so it
      // doesn't say the exact same thing every single day. A players sees
      // notifications reflecting today's actual date, not a static string.
      const REMINDER_MESSAGE_POOL = {
          morning: [
              'Good morning! A few arrows are waiting to be untangled.',
              'Rise and shine - your puzzle streak needs you!',
              'Morning brain warm-up: 1 Arrow Puzzle level, GO!',
              'Coffee in one hand, arrows in the other. Let\'s go!'
          ],
          evening: [
              'Evening break time! One quick level never hurt anyone.',
              'Untangle a few arrows before dinner - you\'ve got this.',
              'Your board is exactly how you left it. Come finish it!',
              'Evening puzzle o\'clock! Can you beat your last score?'
          ],
          night: [
              'One more level before bed... we won\'t tell anyone.',
              'Wind down with some arrows before you sleep.',
              'Night owl mode: your puzzle grid is calling.',
              'Last call for today - keep that streak alive!'
          ]
      };

      function pickDailyMessage(pool){
          const dayOfYear = Math.floor((Date.now() - new Date(new Date().getFullYear(),0,0).getTime()) / 86400000);
          return pool[dayOfYear % pool.length];
      }

      // If the player is close to unlocking a new arrow pattern, that's a
      // far more compelling hook than a generic "come play" line - so it
      // takes priority over the rotating pool whenever it applies. Uses
      // whichever mode the player has pushed furthest in, since that's the
      // progress they're most likely to care about finishing.
      function getPatternProgressMessage(){
          let bestLevel = 1;
          let bestMode = 'easy';
          for(const m of ['easy','medium','hard']){
              const lvl = (maxUnlockedLevel && maxUnlockedLevel[m]) || 1;
              if(lvl > bestLevel){ bestLevel = lvl; bestMode = m; }
          }

          const info = getPatternProgressInfo(bestLevel, bestMode);
          if(!info || info.remaining > 3) return null;

          return info.remaining === 1
              ? 'Just 1 level to your next arrow pattern - so close!'
              : `Only ${info.remaining} levels to your next arrow pattern!`;
      }

      // time for notifications: morning, evening, night. Text is rebuilt
      // fresh every time scheduleReminderNotifications() runs (see the
      // 'pause'/'resume' hooks below), so it always reflects today's date
      // and the player's latest progress rather than staying static.
      function getStreakMorningMessage(){
          try{
              const raw = localStorage.getItem(STREAK_KEY);
              if(!raw) return null;
              const state = JSON.parse(raw);
              if(!state || !(state.count >= 3)) return null;
              return `🔥 ${state.count} day streak! Keep it alive with a level today.`;
          }catch(e){ return null; }
      }

      function buildReminderNotifications(){
          const progressMsg = getPatternProgressMessage();
          const streakMsg = getStreakMorningMessage();
          return [
              // Streak takes priority for the morning slot when there's one
              // worth bragging about (3+ days) - otherwise falls back to
              // the regular rotating pool.
              { id: 1, title: 'Arrow Puzzle', text: streakMsg || pickDailyMessage(REMINDER_MESSAGE_POOL.morning), hour: 9, minute: 0 },
              // Evening slot is the "progress" slot when there's something
              // worth teasing - otherwise it just falls back to the pool.
              { id: 2, title: 'Arrow Puzzle', text: progressMsg || pickDailyMessage(REMINDER_MESSAGE_POOL.evening), hour: 18, minute: 0 },
              { id: 3, title: 'Arrow Puzzle', text: pickDailyMessage(REMINDER_MESSAGE_POOL.night), hour: 22, minute: 0 }
          ];
      }

      function getNextReminderTime(hour, minute) {
          const now = new Date();
          const next = new Date(now);
          next.setHours(hour, minute, 0, 0);
          if (next <= now) {
              next.setDate(next.getDate() + 1);
          }
          return next;
      }

      let browserReminderTimeouts = [];

      function scheduleBrowserReminder(reminder) {
          const next = getNextReminderTime(reminder.hour, reminder.minute);
          const delay = next.getTime() - Date.now();
          const timeoutId = setTimeout(() => {
              try {
                  new Notification(reminder.title, { body: reminder.text, tag: 'arrow-reminder-' + reminder.id, renotify: true });
              } catch (err) {
                  console.warn('Browser reminder failed:', err);
              }
              scheduleReminderNotifications(); // rebuild all 3 with fresh text/progress before re-arming
          }, delay);
          browserReminderTimeouts.push(timeoutId);
      }

      // ---------------------------------------------------------------
      // Launch countdown notifications - TEMPORARY, pre-launch only.
      // One creative notification per remaining day, counting down to the
      // Play Store launch date below. This is a short, self-expiring
      // campaign (not part of the regular REMINDER_MESSAGE_POOL rotation)
      // meant to keep testers opening the app daily in the run-up to
      // launch. Safe to delete this whole block (and its call site below)
      // once the game is actually live - it naturally stops firing on its
      // own once LAUNCH_COUNTDOWN_TARGET_DATE has passed, since
      // buildLaunchCountdownNotifications() only ever returns entries for
      // today-through-launch-day.
      // ---------------------------------------------------------------
      const LAUNCH_COUNTDOWN_TARGET_DATE = '2026-08-24'; // 8 days from 2026-08-16
      const LAUNCH_COUNTDOWN_HOUR = 12;   // fires at 12:30pm local - clear of the 9am/6pm/10pm reminder slots
      const LAUNCH_COUNTDOWN_MINUTE = 30;
      // ids offset well clear of the reminder ids (1/2/3) and the update-
      // notification id, so scheduling one set never clobbers the other.
      const LAUNCH_COUNTDOWN_ID_BASE = 500;

      const LAUNCH_COUNTDOWN_COPY = {
          8: '🚀 8 days to launch! Every level you play now helps get Arrow Puzzle ready for the world.',
          7: '⏳ 7 days to go — squeeze in a quick puzzle today?',
          6: '🎯 6 days left. You\'re part of the crew getting this game launch-ready!',
          5: '🔥 5 days to launch — halfway through the countdown, don\'t stop now!',
          4: '🧩 4 days left. One more level keeps the countdown moving.',
          3: '📣 3 days to go! Almost there — thanks for playing.',
          2: '⚡ 2 days left! The finish line is in sight.',
          1: '🎉 1 day to launch! Last stretch - play a level to celebrate!',
          0: '🚀 Launch day is here! Thank you for helping Arrow Puzzle make it to the Play Store.'
      };

      // Builds one notification per day from today through the target
      // launch date (inclusive), using the local device calendar day - so
      // this always reflects "days left" from whenever the player actually
      // opens the app, not a value baked in at build time. Returns an
      // empty array once the target date is in the past.
      function buildLaunchCountdownNotifications(){
          const target = new Date(LAUNCH_COUNTDOWN_TARGET_DATE + 'T00:00:00');
          const today = new Date();
          today.setHours(0,0,0,0);
          target.setHours(0,0,0,0);

          const notifications = [];
          const msPerDay = 86400000;
          let dayCursor = new Date(today);
          let index = 0;

          while(dayCursor <= target){
              const daysLeft = Math.round((target.getTime() - dayCursor.getTime()) / msPerDay);
              const text = LAUNCH_COUNTDOWN_COPY[daysLeft] ||
                  (daysLeft + ' days to launch! Keep the streak going.');
              const fireAt = new Date(dayCursor);
              fireAt.setHours(LAUNCH_COUNTDOWN_HOUR, LAUNCH_COUNTDOWN_MINUTE, 0, 0);

              // If today's slot time has already passed, skip straight to
              // tomorrow's entry instead of firing an "8 days left" message
              // at 11pm tonight for a day that's basically already over.
              if(fireAt.getTime() > Date.now()){
                  notifications.push({
                      id: LAUNCH_COUNTDOWN_ID_BASE + index,
                      title: 'Arrow Puzzle',
                      text,
                      at: fireAt
                  });
              }

              dayCursor = new Date(dayCursor.getTime() + msPerDay);
              index++;
          }
          return notifications;
      }

      function scheduleLaunchCountdownNotifications(){
          const notifications = buildLaunchCountdownNotifications();
          if(notifications.length === 0) return; // target date passed, or nothing left today

          const hasLocalNotification = window.cordova && window.cordova.plugins &&
              window.cordova.plugins.notification && window.cordova.plugins.notification.local;
          if(!hasLocalNotification) return;

          const local = window.cordova.plugins.notification.local;
          const doSchedule = () => {
              const ids = notifications.map(item => item.id);
              local.cancel(ids, () => {
                  local.schedule(notifications.map((item) => ({
                      id: item.id,
                      title: item.title,
                      text: item.text,
                      trigger: { at: item.at },
                      foreground: true
                  })));
                  console.log('Scheduled ' + notifications.length + ' launch countdown notification(s).');
              });
          };

          // Same Android 13+ POST_NOTIFICATIONS permission dance as the
          // regular reminders - scheduleReminderNotifications() has likely
          // already requested this by the time this runs, so in practice
          // this just confirms it's still granted.
          local.hasPermission((granted) => {
              if(granted) doSchedule();
              else local.requestPermission((accepted) => { if(accepted) doSchedule(); });
          });
      }

      function scheduleReminderNotifications() {
          const reminderNotifications = buildReminderNotifications();
          const hasLocalNotification = window.cordova && window.cordova.plugins &&
              window.cordova.plugins.notification && window.cordova.plugins.notification.local;

          if (hasLocalNotification) {
              const local = window.cordova.plugins.notification.local;

              const doSchedule = () => {
                  const ids = reminderNotifications.map(item => item.id);
                  local.cancel(ids, () => {
                      local.schedule(reminderNotifications.map((item) => ({
                          id: item.id,
                          title: item.title,
                          text: item.text,
                          trigger: { every: { hour: item.hour, minute: item.minute } },
                          foreground: true
                      })));
                      console.log('Scheduled Cordova reminder notifications for morning, evening, and night.');
                  });
              };

              // Android 13+ (API 33+) requires the app to hold the runtime
              // POST_NOTIFICATIONS permission or scheduled notifications are
              // silently swallowed by the OS - they schedule without error
              // but never actually appear. hasPermission/requestPermission
              // are provided by cordova-plugin-local-notification itself;
              // on older Android versions (no runtime prompt needed) they
              // just report granted immediately, so this is safe everywhere.
              local.hasPermission((granted) => {
                  if (granted) {
                      doSchedule();
                  } else {
                      local.requestPermission((accepted) => {
                          if (accepted) {
                              doSchedule();
                          } else {
                              console.warn('Notification permission denied by user; reminders will not appear.');
                          }
                      });
                  }
              });
              return;
          }

          if (window.Notification && typeof window.Notification.requestPermission === 'function') {
              browserReminderTimeouts.forEach(id => clearTimeout(id));
              browserReminderTimeouts = [];
              if (Notification.permission === 'granted') {
                  reminderNotifications.forEach(scheduleBrowserReminder);
              } else if (Notification.permission !== 'denied') {
                  Notification.requestPermission().then((permission) => {
                      if (permission === 'granted') {
                          reminderNotifications.forEach(scheduleBrowserReminder);
                      } else {
                          console.warn('Notification permission denied; reminders will not appear in browser.');
                      }
                  });
              } else {
                  console.warn('Notification permission denied; reminders will not appear in browser.');
              }
              return;
          }

          console.warn('Reminder notifications are not available in this environment.');
      }

      // NOTE: the 'backbutton' listener itself is already registered in the
      // earlier deviceready block above. Registering it a second time here
      // caused every hardware back press to fire handleHardwareBack() twice
      // in a row - the first call opened the menu, and the second call (run
      // immediately after, seeing the menu now visible) treated it as a
      // repeat press and exited the app. This block now only schedules
      // reminder notifications on deviceready.
      document.addEventListener('deviceready', () => {
          scheduleReminderNotifications();
          scheduleLaunchCountdownNotifications();

          // Re-arm with fresh copy every time the player leaves or returns
          // to the app, not just once at launch - this is what lets the
          // "X levels to your next pattern" message reflect their actual
          // current progress instead of going stale after install day. It
          // also keeps the launch countdown's "days left" honest if the
          // app is left open/backgrounded across midnight.
          document.addEventListener('pause', scheduleReminderNotifications, false);
          document.addEventListener('resume', scheduleReminderNotifications, false);
          document.addEventListener('resume', scheduleLaunchCountdownNotifications, false);

          // Check for a newer published version - once at launch, and again
          // whenever the player returns to the app (throttled internally
          // so it only actually hits the hosted JSON once per local
          // calendar day, i.e. the first time the player opens the game
          // that day - not every single resume).
          checkForUpdate();
          document.addEventListener('resume', checkForUpdate, false);
      }, false);

      if (!window.cordova) {
          scheduleReminderNotifications();
          checkForUpdate();
      }

      // Always show the menu on launch, but showMenu() itself decides
      // whether the Resume button appears (only when gameStarted is true
      // AND progressMade is true, i.e. there's an actual saved game with
      // at least one arrow already cleared - a fresh, untouched board
      // just shows New Game instead).
      updateStreakAndMaybeToast();
      showMenu();

      // Slight delay so the menu is fully up first, and so this loses
      // the race to any popup that was already about to show (update
      // check, hosted announcement) rather than flashing in first only
      // to get immediately covered.
      setTimeout(() => maybeShowWhatsNew(), 400);
})();
</script>
</body>
</html>
